        run: |
          set -euo pipefail
          if [ -n "$GREP" ]; then
            npx playwright test --project=prod-audit --workers=1 --reporter=list,./e2e/reporters/skipReporter.ts --pass-with-no-tests -g "$GREP" e2e/prod-audit/rail-inset.spec.ts e2e/prod-audit/page-settle.spec.ts e2e/prod-audit/profile-title-alignment.spec.ts e2e/prod-audit/search-x-off-center-press.spec.ts e2e/prod-audit/deep-links.spec.ts e2e/prod-audit/search-keeps-title.spec.ts e2e/prod-audit/interruptions.spec.ts e2e/prod-audit/account-reads-per-document.spec.ts e2e/prod-audit/admin-tabs-and-rows.spec.ts e2e/prod-audit/notification-panel-corners.spec.ts e2e/prod-audit/saved-helper-row.spec.ts e2e/prod-audit/search-close-one-press.spec.ts
          else
            npx playwright test --project=prod-audit --workers=1 --reporter=list,./e2e/reporters/skipReporter.ts e2e/prod-audit/rail-inset.spec.ts e2e/prod-audit/page-settle.spec.ts e2e/prod-audit/profile-title-alignment.spec.ts e2e/prod-audit/search-x-off-center-press.spec.ts e2e/prod-audit/deep-links.spec.ts e2e/prod-audit/search-keeps-title.spec.ts e2e/prod-audit/interruptions.spec.ts e2e/prod-audit/account-reads-per-document.spec.ts e2e/prod-audit/admin-tabs-and-rows.spec.ts e2e/prod-audit/notification-panel-corners.spec.ts e2e/prod-audit/saved-helper-row.spec.ts e2e/prod-audit/search-close-one-press.spec.ts
          fi

      # Core Web Vitals of every first screen in the lab (docs/OPEN.md Q1157,
      # Q1158): FCP/LCP/CLS per first screen under the Lighthouse mobile and
      # desktop profiles, and a walk of the dock/rail for taps that lead to a
      # jump. It serves the dist/ the step above built itself, over HTTP/2
      # (e2e/web-vitals/first-screens.spec.ts). Its own project and request
      # budget label, so prod-audit's measured per-test number is untouched.
      # Runs even when the audit suites above failed: an independent signal.
      # A `grep` dispatch that names only one of the two projects finds no
      # test in the other, hence --pass-with-no-tests on both grep branches.
      - name: Run the first-screen Web Vitals lab budget
        timeout-minutes: 14 # leg 4: 28 + 14 = 42 of its 55
        if: ${{ !cancelled() && inputs.vacuity_only == '' }}
        env:
          GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          if [ -n "$GREP" ]; then
            npx playwright test --project=web-vitals --workers=1 --reporter=list,./e2e/reporters/skipReporter.ts --pass-with-no-tests -g "$GREP"
          else
            npx playwright test --project=web-vitals --workers=1 --reporter=list,./e2e/reporters/skipReporter.ts
          fi

      - name: Keep failure screenshots, samples and traces (leg 4)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prod-audit-leg-4
          # .env lives at the repo root, not under these paths, and is deleted
          # in the next step regardless.
          path: |
            test-results/
            playwright-report/
            request-budget/
          retention-days: 14
          if-no-files-found: warn
      # Last check before the key is removed (it reads SUPABASE_SERVICE_ROLE_KEY
      # from .env). The suites above sign in as the shared test accounts and can
      # leave user_strikes / user_violations behind; one more harness-made
      # violation suspends the account every prod workflow uses (2026-09-13).
      # always(): a red suite is exactly when a strike is most likely.
      # Exit 1 = a strike on a shared account; exit 2 = could not check. BOTH
      # fail the job (Q52, 2026-09-23): "could not read prod" used to be a
      # ::warning:: and the job stayed green having checked nothing. Failing this
      # step does not mask the suite result — that step's outcome is its own.
      - name: Shared test accounts carry no strikes
        if: always()
        run: |
          set +e
          node scripts/check-test-account-strikes.mjs
          code=$?
          set -e
          case "$code" in
            0) ;;
            1) echo "::error title=Strike on a shared test account::A harness left a strike/violation on a shared test account. Delete the test-owned rows and fix that harness's cleanup."; exit 1 ;;
            2) echo "::error title=Test-account strike check did not run::scripts/check-test-account-strikes.mjs could not read prod (missing key or REST error); see the log above. Not checked is not clean."; exit 2 ;; # leg 4
            *) echo "::error::check-test-account-strikes.mjs exited $code"; exit "$code" ;;
          esac

      # Also last-before-key-removed: interruptions.spec.ts's "post a job"
      # double-tap test mints a real Stripe checkout session, which permanently
      # blocks the poster's own DELETE policy (20260903055308 requires
      # stripe_session_id IS NULL) — the test's own teardown can only cancel it,
      # not remove it (see the comment in that spec). scripts/e2e/prod-lifecycle-
      # sweeper.mjs does not cover this: it matches a different suite's marker
      # and deliberately runs as the poster, which is exactly the account this
      # residue defeats. scripts/e2e/prod-audit-sweeper.mjs is the service-role
      # equivalent for this suite's marker, needing the key this step still has.
      # always(): a run that fails partway through is exactly when a leftover
      # is most likely. Exit 1 = a real problem (cap exceeded or a delete
      # failed); exit 2 = could not run (missing key or a REST error reading
      # prod). Both fail the job (Q52) — a sweep that never ran is not clean.
      - name: Remove leftover prod-audit jobs this run could not clean up itself
        if: always()
        run: |
          set +e
          node scripts/e2e/prod-audit-sweeper.mjs
          code=$?
          set -e
          case "$code" in
            0) ;;
            1) echo "::error title=prod-audit leftover cleanup failed::scripts/e2e/prod-audit-sweeper.mjs found a real problem (more than its 50-match cap, or a delete failed) — see the log above."; exit 1 ;;
            2) echo "::error title=prod-audit leftover cleanup did not run::scripts/e2e/prod-audit-sweeper.mjs could not read prod (missing key or REST error); see the log above."; exit 2 ;;
            *) echo "::error::prod-audit-sweeper.mjs exited $code"; exit "$code" ;;
          esac

      - name: Remove the service-role key from the runner
        if: always()
        run: rm -f .env

  budget:
    # Q889: the request budget judges the WHOLE run, every leg's samples summed
    # (as press-every-control's summary does): per test over all four legs, and
    # the busiest wall-clock minute (the legs run one after another, so their
    # minutes never overlap).
    name: Prod audit (whole-run request budget)
    needs: [prod-audit, prod-audit-2, prod-audit-3, prod-audit-4]
    if: ${{ !cancelled() && inputs.vacuity_only == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Fetch every leg's samples
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prod-audit-leg-*
          merge-multiple: true
      - name: Backend request budget (Q104)
        # Sums this job's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        # Not on a vacuity-only dispatch: the suites it budgets did not run.
        # A `grep` dispatch runs a subset: its per-test number is not the
        # suite's, so only the load ceiling is judged (--ceiling-only). It may
        # also match only the web-vitals project's tests (run 37153835455:
        # `every first screen|a tap never` ran 0 prod-audit tests, and this
        # step failed on "no sample for this label"), hence --allow-empty.
        if: ${{ !cancelled() && inputs.vacuity_only == '' }}
        env:
          GREP: ${{ inputs.grep }}
        run: node scripts/e2e/request-budget.mjs --label prod-audit --dir request-budget/leg-1 --dir request-budget/leg-2 --dir request-budget/leg-3 --dir request-budget/leg-4 ${GREP:+--ceiling-only --allow-empty}
      - name: Backend request budget, Web Vitals lab (Q104)
        # The web-vitals project meters under its own label. A `grep` dispatch
        # judges the ceiling only (as the prod-audit budget above does) and,
        # since it may run none of this project's tests, allows an empty label.
        if: ${{ !cancelled() && inputs.vacuity_only == '' }}
        env:
          GREP: ${{ inputs.grep }}
        run: node scripts/e2e/request-budget.mjs --label web-vitals --dir request-budget/leg-4 ${GREP:+--ceiling-only --allow-empty}

  notify:
    name: Report nightly result
    needs: [preflight, prod-audit, prod-audit-2, prod-audit-3, prod-audit-4, budget]
    # A FULL run reports, whoever started it (2026-09-21; see
    # src/test/nightlyIssueSyncReachable.test.ts and e2e-journeys.yml, which
    # carried the same bug against issue #1595). Gating on `schedule` alone
    # made the red unclearable by the one action that clears reds: fix it,
    # dispatch it to prove it, watch it go green — and the issue stays open,
    # because a dispatch was not allowed to say so. #1618 has been open since
    # 2026-09-17 partly for that reason.
    #
    # `grep` narrows this workflow to the tests matching it (Playwright -g), so
    # a dispatch reports only when it is empty: a whole-suite run, exactly what
    # the schedule fires. A pinned run has not earned the right to close a
    # suite's issue and stays silent instead.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.grep == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: prod-audit
          status: ${{ (needs.prod-audit.result == 'success' && (inputs.vacuity_only != '' || (needs.prod-audit-2.result == 'success' && needs.prod-audit-3.result == 'success' && needs.prod-audit-4.result == 'success' && needs.budget.result == 'success'))) && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
