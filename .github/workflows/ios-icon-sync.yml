name: iOS Icon Sync

# Manual-only — regenerates every iOS AppIcon size from the single source
# of truth at branding/app-icon-1024.png and lands the result through the
# shared .github/actions/refresh-pr composite (Q285: this used to `git push`
# with github.token straight to the dispatched branch, which main's branch
# protection rejects — it never pushes directly now; it rebuilds ONE bot
# branch from LATEST main and merges it through a PR instead).
#
# Run from the Actions tab → "iOS Icon Sync" → "Run workflow" any time
# the marketing icon changes. Cheap (Linux runner, no Xcode, no signing).
on:
  workflow_dispatch: {}

concurrency:
  group: ios-icon-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-icons:
    name: Land the regenerated AppIcon set (Q57/Q285 refresh PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY write grant in this workflow (Q285): push the bot branch, open
    # or update its PR, and dispatch its checks (a github.token PR triggers
    # none).
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Setup Ruby + Bundler (cached)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: .

      - uses: ./.github/actions/refresh-pr
        with:
          id: ios-icons
          title: "chore(ios): sync AppIcon set from branding/app-icon-1024.png"
          paths: ios/App/App/Assets.xcassets/AppIcon.appiconset/
          regenerate: bundle exec fastlane ios sync_app_icon
          github-token: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          check-workflows: ${{ vars.REFRESH_PR_CHECK_WORKFLOWS }}
