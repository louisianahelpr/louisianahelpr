name: Migration Timestamp Guard

permissions:
  contents: read

# Fails the PR if two migration files share the same numeric timestamp
# prefix. Direct response to PR #253, where two migrations both started
# with the same prefix — the second silently shadowed the first in
# Supabase's lexicographic migration order, so it never applied to prod.
#
# The Supabase CLI does NOT reject duplicate prefixes; it sorts by full
# filename and applies whichever sorts second, then records both rows in
# schema_migrations as "applied" (the version column is just the prefix,
# so the second one looks like a re-run of the first). Result: silent
# data loss — the SQL of the shadowed file never executes on prod.
#
# This guard is the cheapest possible check: a sort + uniq -d on the
# timestamp prefixes of every migration in the tree.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-guard.yml"
  workflow_dispatch:

concurrency:
  group: migration-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-timestamps:
    name: Check for duplicate migration timestamps
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan for duplicate timestamp prefixes
        run: |
          set -euo pipefail

          # Extract the numeric prefix (everything before the first _) from
          # every migration filename. Filenames are conventionally
          # <timestamp>_<description>.sql — e.g.
          #   20260518181500_reject_other_applications_on_accept.sql
          # The prefix alone is what Supabase uses as the version key in
          # schema_migrations, so collisions there are the actual bug.
          PREFIXES=$(ls supabase/migrations/*.sql 2>/dev/null \
            | sed -E 's|.*/([0-9]+)_.*|\1|' \
            | sort)

          if [ -z "$PREFIXES" ]; then
            echo "No migration files found — nothing to check."
            exit 0
          fi

          DUPLICATES=$(echo "$PREFIXES" | uniq -d)

          if [ -n "$DUPLICATES" ]; then
            echo "❌ Duplicate migration timestamps: $(echo "$DUPLICATES" | tr '\n' ' '). Each migration must have a unique timestamp prefix."
            echo ""
            echo "Files involved:"
            for D in $DUPLICATES; do
              ls supabase/migrations/${D}_*.sql 2>/dev/null || true
            done
            echo ""
            echo "Fix: rename the newer file with a later timestamp (UTC, e.g. \$(date -u +%Y%m%d%H%M%S))."
            exit 1
          fi

          echo "✅ No duplicate migration timestamps."
