name: Test

# Dedicated quality-gate workflow.
# Runs on every push to main and on every pull request.
# Fails the workflow if lint, type-check, build, or tests fail —
# so regressions are caught before they hit main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Production build
        # Public Vite vars are committed in .env (publishable keys only — safe to expose).
        # Runtime secrets (Stripe, Resend, Slack, HubSpot, etc.) live on Supabase Edge
        # Functions and are NOT needed at build time.
        run: npm run build

      - name: Vitest
        run: npm test
