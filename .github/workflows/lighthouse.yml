name: Lighthouse CI

permissions:
  contents: read

# Runs Lighthouse against THIS COMMIT, built and served locally with
# `vite preview` (.github/actions/local-preview, gzip on, prod Supabase env), to
# catch performance regressions before they ship. Fails the run if mobile
# performance drops below threshold.
#
# NOT the published site (2026-09-14): Vercel paused the project on Hobby
# limits with test traffic as the main load, and every suite now builds locally
# (src/test/noTestTrafficOnVercel.test.ts). Throttling is SIMULATED
# (.lighthouserc.json), so the score models a slow phone rather than the
# runner's loopback. `canonical` is skipped: the page's canonical URL names the
# production host, which Lighthouse scores 0 on any other origin.
#
# Runs:
# - On every PR to main (catches regressions before merge)
# - Weekly on Sundays (tracks long-term trends)
# - Manually via workflow_dispatch
#
# THAT FIRST CLAIM IS NOW TRUE. It was not, from 2026-05-18 to 2026-08-31.
# ------------------------------------------------------------------------
# Two independent faults stacked into a check that audited nothing and said
# it passed:
#
#   1. .lighthouserc.json set `"preset": "mobile"`. Lighthouse has no such
#      preset (only perf / experimental / desktop), so the collector threw at
#      startup and died in ~2 seconds without loading a single URL.
#   2. This step carried `continue-on-error: true`, which converted that
#      crash into a green check.
#
# Every scheduled run since June finished in 13-23 seconds and reported
# success. Nobody looked at a report because there were no reports. This is
# the same shape as the other three prod incidents this repo has shipped: a
# detector whose result never reaches the job's exit code.
#
# `continue-on-error` is gone and must not come back. The old rationale was
# that collector runtime errors (NO_FCP on a slow/sleeping site) are
# independent of the PR's diff — true, and irrelevant: a collector that
# cannot measure has produced NO evidence, and "no evidence" must never
# render as "passed". That is the entire bug class. The mitigation for
# genuine flake is `numberOfRuns: 2` in .lighthouserc.json (Lighthouse takes
# the representative run), not a blanket pass.
#
# Assertion levels live in .lighthouserc.json, with the measured 2026-08-31
# prod baseline recorded there next to each threshold.

on:
  # Re-enabled 2026-05-09 — cost-tuned path filters keep this off random
  # docs-only PRs but fire on anything that could regress perf (bundle,
  # entrypoint, build config, deps).
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 6 * * 0"   # Sunday 06:00 UTC — long-term trend tracking
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Mobile performance audit
    # Skip Dependabot PRs — perf changes from dep bumps are evaluated separately.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 20, not 10: this job used to "finish" in ~15s because the collector was
    # dying on startup. A real audit is 4 URLs x numberOfRuns 2 = 8 throttled
    # Lighthouse runs, roughly 6-10 minutes on a shared runner.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview

      - name: Audit this commit (mobile, public routes only)
        uses: treosh/lighthouse-ci-action@v12
        # BLOCKING. No `continue-on-error` — see the header for what its
        # presence cost. This step fails the run on either:
        #   1. an `error`-level assertion in .lighthouserc.json
        #      (mobile performance < 0.50, SEO < 0.90), or
        #   2. a collector runtime error — because a run that measured
        #      nothing has proven nothing and must not read as a pass.
        # Reports still upload via temporaryPublicStorage for trend review.
        with:
          # Public routes only — anything behind auth (/home, /post-job,
          # /jobs, /messages, etc.) needs a test session and isn't worth
          # the Lighthouse-CI complexity. Landing + browse + signup cover
          # the highest-traffic first-paint surfaces.
          urls: |
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/browse
            http://127.0.0.1:4173/login
            http://127.0.0.1:4173/signup
          # Mobile emulation is set EXPLICITLY in .lighthouserc.json
          # (formFactor + screenEmulation), not by a preset name — the bogus
          # `"preset": "mobile"` is what killed the collector for three months.
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json

  # A RED RUN HAS TO LAND SOMEWHERE. Added 2026-09-23 after lighthouse — along
  # with 13 other scheduled workflows — was found failing with nobody told.
  # The drift detector had been red for THREE CONSECUTIVE DAYS (09-20, 09-21,
  # 09-22) and the nightly DB backup had not succeeded since 09-21; both are
  # invisible unless somebody opens the Actions tab, which is exactly the
  # thing the owner said nobody does.
  #
  # `nightly-issue-sync` opens/updates ONE `nightly-red` issue for this
  # workflow and closes it on the next green run, which is what makes the
  # "Nightly reds nobody read" gate able to see it at all.
  #
  # SCHEDULE AND MANUAL RUNS ONLY. A push/PR failure is already visible on the
  # commit and the PR; filing an issue for it would make the label noisy and
  # teach people to ignore it.
  notify:
    name: Report nightly result
    needs: [lighthouse]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: lighthouse
          status: ${{ needs.lighthouse.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
