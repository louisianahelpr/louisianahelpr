name: Auto-tick items verified live

# Owner, 2026-10-04: the open count lagged the work, because a fix that landed
# stayed `[~]` until someone re-ran its done-when check by hand after the
# deploy. This runs every done-when marker right after a deploy to prod
# finishes, ticks each item whose markers ALL read as expected on prod
# (`node scripts/open-done-when.mjs --tick`, which writes the evidence onto the
# line), refreshes the generated inventories (the ticked lines move to the
# archive), and lands that through a refresh PR (auto-merge through the
# required checks; it never pushes to main). `test` markers are skipped here
# (--no-test): an item with one is ticked by a person or by the nightly run.

on:
  workflow_run:
    workflows: ["Supabase DB Deploy", "Supabase Edge Functions Deploy", "Prod deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One tick at a time; a newer deploy's run waits rather than racing the bot branch.
  group: open-auto-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Tick the items prod now proves done
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The ONLY write grant in this workflow (Q57 refresh-PR contract): push the
    # bot branch, open or update its PR, and dispatch its checks.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - uses: ./.github/actions/refresh-pr
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: open-auto-tick
          title: "chore(open): tick the items verified live after the latest deploy"
          paths: |
            docs/OPEN.md
            docs/archive
            docs/SCOREBOARD.md
            docs/GUARD-BURNDOWN.md
            docs/audit
          # Re-measure the feeds snapshot (docs/audit/open-feeds.json) BEFORE
          # ticking: the tick reads sources live, openFeedsMirrored reads the
          # snapshot, and a stale snapshot turned PR #2301 red (2026-10-05).
          regenerate: node scripts/open-sync-trackers.mjs && node scripts/open-done-when.mjs --tick --no-test && npm run -s inventories:refresh
          body: "Each ticked line carries what its done-when markers read on prod. Nothing is ticked on a skipped or failed marker."
          github-token: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          check-workflows: ${{ vars.REFRESH_PR_CHECK_WORKFLOWS }}
