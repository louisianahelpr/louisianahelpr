<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Helpr — Louisiana's Local Job Partner | Hire or Find Work</title>
    <meta name="description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond.">

    <link rel="canonical" href="https://www.louisianahelpr.com">
    <meta name="author" content="Helpr" />
    <!-- === CANVAS === Must equal --parchment in src/index.css so the native
         status-bar / browser chrome band blends into the top of the page with
         no seam (LH-18). Currently hsl(220 14% 95%) = #F1F2F4.
         The SAME value must appear in capacitor.config.ts (splash +
         StatusBar), manifest.webmanifest (theme_color + background_color),
         the #root/#boot-loader inline styles BELOW, and — the one that keeps
         getting missed — ios/App/App/Base.lproj/LaunchScreen.storyboard, which
         holds it as sRGB floats (0.9451/0.9490/0.9569) and so never matches a
         hex grep. FIVE places, one colour; if the palette flips, change all five.
         (This previously claimed to match "#FAF9F5" while the manifest was
         teal and Capacitor was warm #ECE9E4; three comments each asserted
         agreement that did not exist.) -->
    <meta name="theme-color" content="#F1F2F4" />
    <meta name="application-name" content="Helpr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Helpr" />

    <!--
      Smart App Banner — Mobile Safari shows a top banner on this domain
      that deep-links into the installed Helpr iOS app (or to the App
      Store if not installed) with the path passed as app-argument. This
      meta is read only by Mobile Safari; every other surface ignores it.

      The value is the numeric App Store ID (Apple ID) for Helpr —
      id6754470134 in the store URL; only the digits go in the meta tag.
      The bundle id (com.Helpr) does not work here — Apple requires the
      numeric "Apple ID" / "App Store ID".
    -->
    <meta name="apple-itunes-app" content="app-id=6754470134, app-argument=helpr://" />

    <!-- Capacitor-only CSP. file:// loads can't receive HTTP headers, so
         the iOS/Android bundle relies on this meta tag. The web build
         strips this entire tag at build time (see `html-strip-meta-csp`
         plugin in vite.config.ts) because Vercel injects a separate,
         less-restrictive CSP header from vercel.json — and when both are
         present the browser INTERSECTS them per W3C CSP spec, silently
         blocking PostHog, OpenAI, Stripe checkout iframes, etc. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor: ionic:; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.stripe.com https://us-assets.i.posthog.com https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: capacitor: ionic:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com https://*.ingest.us.sentry.io https://*.sentry.io https://us.i.posthog.com https://us-assets.i.posthog.com https://va.vercel-scripts.com; frame-src https://js.stripe.com https://*.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=helpr2" />

    <!-- Performance: preconnect + font load tuned for LCP.
         The H1 hero headline uses Bodoni Moda (display font) and is the LCP
         element on desktop. The previous media="print"+onload="this.media='all'"
         swap delayed the font CSS request until AFTER the JS bundle parsed,
         causing the LCP H1 to repaint late and tanking the desktop Real
         Experience Score (74 / "Needs Improvement"). Fix: load the font CSS
         as a normal blocking stylesheet. `display=swap` (in the URL) keeps
         fallback text visible immediately so FCP isn't blocked, while letting
         the LCP text settle into Bodoni Moda as soon as the woff2 lands —
         which now starts in parallel with the preload below instead of
         waiting on the JS parse.

         This fix was originally landed in PR #222 then accidentally reverted
         by PR #223 (which carried a stale index.html block on its branch).
         Do NOT reintroduce the print/onload pattern — see guardrail below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to Supabase to shorten the longest network dependency chain (LCP/data fetches) -->
    <link rel="preconnect" href="https://fncmgoasalhdgfwzhsqa.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://fncmgoasalhdgfwzhsqa.supabase.co" />
    <!-- Preload + stylesheet for the editorial font stack. The preload kicks
         off the CSS fetch at highest priority; the stylesheet link below
         consumes that response without re-fetching. `display=swap` in the URL
         paints fallback text immediately AND swaps in Bodoni Moda whenever the
         woff2 lands, however late that is.

         This was `display=optional` until 2026-08-10. `optional` sounds
         permissive but is the strictest value there is: ~100ms block, then if
         the font hasn't arrived the browser commits to the fallback for the
         WHOLE page view and never swaps. On a cold cache over mobile a web
         font essentially never wins that race, so first-time visitors saw the
         hero H1 — the largest brand asset the product has — render in Georgia,
         permanently. It bought a Lighthouse CLS score with the brand's first
         impression. Do NOT put `optional` back; if CLS regresses, self-host the
         single Bodoni 900 weight the hero needs as a preloaded woff2 instead.
         Do NOT reintroduce media="print"+onload swap here — it delays the
         font request behind JS-parse and regresses LCP. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,700;0,900;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,700;0,900;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap"
    />
    <!-- Beth Ellen is the handwritten signature accent (dashboard greeting
         name). It MUST actually render — `display=optional` would let the
         browser permanently fall back to the generic `cursive` (system Snell
         Roundhand/Apple Chancery) whenever the font isn't already cached on
         first paint. `display=swap` guarantees it swaps in once downloaded. It is not the LCP element, so the swap costs
         nothing visually. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Beth+Ellen&display=swap"
    />

    <!-- Hero image preloads intentionally removed 2026-05-19.
         The hero used to render a photographic <img> (hero-courtyard-*.webp),
         but the editorial brand polish (4ba790a0) replaced it with the
         CSS-only PhoneCluster mockup + the Bodoni Moda H1, which is now the
         LCP element. The preload + srcset still pointed at the retired image,
         which made the browser fetch 100–430 KB of never-rendered bytes at
         `fetchpriority="high"` on every desktop visit, starving the Bodoni
         Moda webfont and the main JS bundle of bandwidth and connection slots.
         Same story for the `/src/assets/helpr-icon-96.png` preload — that
         filename isn't imported anywhere in src/, so Vite couldn't rewrite it
         to a hashed asset; the Navbar's actual logo (HelprMark → helpr-logo-96.webp)
         renders fine via its module import.
         Net effect of removal: one fewer high-priority fetch on the critical
         path and the LCP text element (Fraunces/Bodoni H1) gets the bandwidth
         it actually needs. If a photographic hero returns, restore a single
         preload that matches the rendered <img>'s exact src/srcset/sizes. -->
    <!-- Sentry + PostHog both initialize inside requestIdleCallback (after
         first paint), which means a preconnect handshake completes seconds
         before the connection is actually used and gets flagged by
         Lighthouse as "unused preconnect" (wastes ~50ms of main-thread + a
         TLS slot). dns-prefetch keeps DNS resolution warm without paying
         the TCP/TLS cost up front. -->
    <link rel="dns-prefetch" href="https://o4511265714601984.ingest.us.sentry.io" />
    <link rel="dns-prefetch" href="https://us.i.posthog.com" />
    <link rel="dns-prefetch" href="https://us-assets.i.posthog.com" />

    <!-- Twitter / X card spec — also used by iMessage, Slack, Discord, LinkedIn
         rich previews. No Twitter account required; these tags just control how
         the link renders. summary_large_image yields a full-bleed hero card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.louisianahelpr.com" />
    <meta name="twitter:title" content="Helpr — Louisiana's Local Job Partner" />
    <meta name="twitter:description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond." />
    <meta name="twitter:image" content="https://www.louisianahelpr.com/og-image.png" />
    <meta name="twitter:image:alt" content="Helpr — Louisiana's Local Job Partner" />

         (Bing, social/link-preview bots, LLM crawlers) see Helpr's
         LocalBusiness + Organization entities without executing the SPA.
         Page-specific schema (WebApplication / FAQ / Breadcrumb) is still
         injected client-side by the landing page. -->
    <script type="application/ld+json">
    {

      "url": "https://www.louisianahelpr.com",
      "logo": "https://www.louisianahelpr.com/pwa-512x512-v2.png",
      "image": "https://www.louisianahelpr.com/pwa-512x512-v2.png",
      "priceRange": "$$",
      "areaServed": [
        { "@type": "State", "name": "Louisiana", "sameAs": "https://en.wikipedia.org/wiki/Louisiana" },
        { "@type": "City", "name": "New Orleans", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Baton Rouge", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Shreveport", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Lafayette", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Lake Charles", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Kenner", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Bossier City", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Monroe", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Alexandria", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Houma", "containedInPlace": { "@type": "State", "name": "Louisiana" } }
      ],
      "geo": { "@type": "GeoCoordinates", "latitude": 30.9843, "longitude": -91.9623 },
      "address": { "@type": "PostalAddress", "addressRegion": "LA", "addressCountry": "US" },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.louisianahelpr.com/#organization",
      "name": "Helpr",
      "legalName": "Helpr LLC",
      "url": "https://www.louisianahelpr.com",
      "logo": "https://www.louisianahelpr.com/pwa-512x512-v2.png",
      "description": "Louisiana's trusted marketplace connecting neighbors for cleaning, yard work, moving, errands, handyman services, and more.",
      "email": "admin@louisianahelpr.com",
      "foundingDate": "2026",
      "areaServed": { "@type": "State", "name": "Louisiana" },

    <!--
      Pre-paint theme resolution. useDarkMode.ts only sets data-theme once the
      JS bundle parses — after the inline boot loader below has already painted,
      so dark-mode users saw a light flash on every cold start. This tiny inline
      script mirrors useDarkMode's resolution (localStorage 'helpr-theme' →
      system) and stamps data-theme on <html> before <body> renders. The bundle
      reconciles to the same value later; this just removes the flash.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("helpr-theme") || "system";
          var resolved =
            t === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : t;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!--
      Boot-shell dark overrides. The #root / #boot-loader inline styles below
      are light-tuned defaults; these !important rules repaint them for dark so
      there's no light gutter (desktop) or flash (cold start) before React
      mounts. Light path is left entirely on the inline styles.
    -->
    <style id="boot-theme">
      [data-theme="dark"] #root,
      [data-theme="dark"] #boot-loader {
        background: hsl(20 15% 9%) !important;
      }
      [data-theme="dark"] #boot-loader .boot-name {
        color: hsl(36 15% 85%) !important;
      }
      [data-theme="dark"] #boot-loader .boot-la {
        color: hsl(19 65% 52%) !important;
      }
      /* The crest tile is deliberately NOT themed. It is the app icon, and
         the app icon on the user's home screen does not change with the
         system theme either — keeping it identical is what makes the tap
         feel like the icon opening into the app. */
    </style>
  </head>
  <body>
    <!--
      Inline FCP shell — solid brand-color background + the Helpr crest and
      wordmark (LH-50). Previously this rendered a 580x580 splash <img> which
      became Lighthouse's LCP element (the LCP timer doesn't reset when React
      replaces the splash, so the score waited on the splash to paint). It was
      then stripped back to a bare background, which left a blank cream screen
      for ~2-3s on slow connections while the JS bundle parsed. Then it was a
      generic 34px ring spinner + a muted italic word, which painted fast but
      read as an unbranded loading state rather than as Helpr opening.

      This version is the crest as INLINE SVG. Three properties matter:

        1. Zero network requests. The paths are in this document, so the mark
           paints on the very first frame — no asset fetch, no web-font wait,
           nothing that can arrive late or fail offline.
        2. NOT an LCP candidate. LCP only considers <img>, <image> inside an
           <svg>, <video> poster, background-image, and text blocks. An inline
           <svg> drawn with <rect>/<path> is none of those, so the crest cannot
           take the LCP crown no matter how large it renders. This is why the
           mark could come back at all — an <img> of the same emblem WOULD be a
           candidate. Do NOT swap these paths for an <img>, and do NOT
           reintroduce a large splash <img> here; both regress LCP.
        3. Same identity as the home-screen icon. Geometry is lifted from
           public/app-icon-alt.svg (bark plate, cream H), so tapping the icon
           and seeing this screen is one continuous gesture.

           The sienna fleur-de-lis and keystone star from that file are
           deliberately NOT carried over. Both are authored for a 1024px App
           Store canvas: at 72px the fleur's side petals overrun the H's
           columns and its banded waist paints over the crossbar, so the mark
           stops reading as an H and becomes two posts with an orange smear
           between them. Measured at 64/96px before cutting it. Louisiana is
           carried by the wordmark's "- LA" tail below instead, which is where
           HelprMark puts it anyway.

      The wordmark matches src/components/HelprMark.tsx exactly — EB Garamond
      at weight 500, NOT italic, --ink-deep, with the italic Burnt-Sienna
      "- LA" tail at 0.22em tracking. The previous boot word was italic, grey
      and had no LA tail, so the first wordmark a user saw was the one place in
      the app that did not match the real mark. EB Garamond is the brand SERIF
      (tailwind `font-serif`); Bodoni Moda is the DISPLAY face used for hero
      headlines, and is deliberately not used here.

      React's createRoot().render() clears #root's children on its first commit,
      so this markup is removed the instant the app paints; no JS teardown.
    -->
    <div id="root" style="background:hsl(220 14% 95%);min-height:100vh;">
      <div
        id="boot-loader"
        role="status"
        aria-label="Loading Helpr"
        style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:hsl(220 14% 95%);"
      >
        <svg class="boot-crest" width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">
          <rect width="1024" height="1024" rx="230" fill="hsl(70 20% 33%)"/>
          <g fill="hsl(40 24% 92%)">
            <rect x="240" y="240" width="140" height="544"/>
            <rect x="644" y="240" width="140" height="544"/>
            <rect x="240" y="470" width="544" height="84"/>
          </g>
        </svg>
        <div class="boot-word" style="font-family:'EB Garamond',Georgia,Cambria,serif;display:inline-flex;align-items:baseline;gap:0.05em;line-height:1;">
          <span class="boot-name" style="font-size:20px;font-weight:500;letter-spacing:-0.005em;color:hsl(64 16% 12%);">Helpr</span>
          <span class="boot-la" style="font-size:13px;font-style:italic;font-weight:400;letter-spacing:0.22em;margin-left:0.18em;color:hsl(19 75% 35%);">&#183; LA</span>
        </div>
        <style>
          /* A launch screen is static by Apple HIG — no spinner, no progress.
             The only motion is a single short fade so the first paint reads as
             deliberate rather than as a frozen frame. It never loops. */
          #boot-loader { animation: boot-in 260ms ease-out both; }
          @keyframes boot-in {
            from { opacity: 0; }
            to   { opacity: 1; }
          }
          @media (prefers-reduced-motion: reduce) {
            #boot-loader { animation: none; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
