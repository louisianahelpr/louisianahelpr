<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1" />
    <title>Helpr — Louisiana's #1 Local Help Marketplace</title>
    <meta name="description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond.">
    <meta name="keywords" content="Louisiana helpers, local help marketplace, cleaning services Louisiana, yard work, moving help, errands, handyman, New Orleans, Baton Rouge, Shreveport, Lafayette">
    <meta name="geo.region" content="US-LA">
    <meta name="geo.placename" content="Louisiana">
    <link rel="canonical" href="https://louisianahelpr.com">
    <meta name="author" content="Helpr" />
    <meta name="theme-color" content="#1FA678" />
    <meta name="application-name" content="Helpr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Helpr" />

    <!-- Baseline CSP for the web build. The `_headers` file overrides this with the stricter
         production policy. Capacitor relies on this meta tag since `_headers` doesn't ship native. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor: ionic:; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: capacitor: ionic:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com; frame-src https://js.stripe.com https://*.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';">

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=helpr2" />

    <!-- Performance: preconnect + non-blocking font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap"
      />
    </noscript>

    <!-- Preload LCP hero image so the browser fetches it before React mounts -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/hero-illustration-v5-1000.webp"
      fetchpriority="high"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://louisianahelpr.com" />
    <meta property="og:title" content="Helpr — Louisiana's Trusted Marketplace for Everyday Tasks" />
    <meta property="og:description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond." />
    <meta property="og:image" content="https://louisianahelpr.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
