project_id = "fncmgoasalhdgfwzhsqa"

[functions]
  # Public. It is a PRICING PREVIEW — it creates nothing, holds nothing and
  # charges nobody; create-payment still computes the real tax via
  # automatic_tax. Requiring a JWT would break the quote on the post-a-job flow
  # before a session is established, and the worst a caller can do is learn the
  # sales tax on an amount in a ZIP, which is public information.
  [functions.calculate-tax]
    verify_jwt = false
  # Public on purpose. The token this mints is locked to the requesting origin
  # and lives one hour, so a token obtained without a session only works on
  # this app's own domain — the same thing a visitor gets by loading the page.
  # Requiring a JWT would instead break maps for the guest-visible surfaces and
  # add a failure mode inside the native WebView, where the anon session is not
  # always established before the first map mounts.
  [functions.mapkit-token]
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.create-payment]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = false
  [functions.complete-signup]
    verify_jwt = false
  [functions.send-account-status-email]
    verify_jwt = false
  [functions.stripe-connect]
    verify_jwt = false
  [functions.auto-release-payment]
    verify_jwt = false
  [functions.process-scheduled-payouts]
    verify_jwt = false
  [functions.stripe-webhook]
    verify_jwt = false
  [functions.email-tracking]
    verify_jwt = false
  # admin-update-email deliberately has NO verify_jwt override: it is the only
  # endpoint that can change a user's login identity, and it is called from the
  # admin UI via supabase.functions.invoke (which attaches the caller's JWT), so
  # there is no unauthenticated caller to accommodate. Its in-function
  # getClaims + has_role check is sound on its own; keeping the gateway check as
  # well is defence-in-depth on an account-takeover-grade action.
  [functions.pro-customer-portal]
    verify_jwt = false
  [functions.weekly-helper-report]
    verify_jwt = false
  [functions.stripe-idv-webhook]
    verify_jwt = false
  # Cron-invoked functions: verify_jwt must be false so the gateway accepts
  # `Bearer sb_secret_*` from pg_cron (the new secret keys aren't JWTs and the
  # gateway's verify_jwt=true rejects non-JWT bearers). Each function checks
  # its own Authorization header against CRON_SECRET / SECRET_KEY internally.
  [functions.auto-expire-jobs]
    verify_jwt = false
  [functions.auto-resolve-disputes]
    verify_jwt = false
  [functions.void-cancelled-payments]
    verify_jwt = false
  [functions.review-nag-cron]
    verify_jwt = false
  [functions.cleanup-notifications]
    verify_jwt = false
  [functions.engagement-automations]
    verify_jwt = false
  [functions.expire-subscriptions]
    verify_jwt = false
  [functions.cleanup-abandoned-accounts]
    verify_jwt = false
  [functions.spawn-recurring-jobs]
    verify_jwt = false
  # Cron-authenticated like its siblings (verifyCronSecret), not JWT — no user
  # is present when a recurring visit is charged. That is the point.
  [functions.charge-recurring-visits]
    verify_jwt = false
  [functions.expiring-jobs-push]
    verify_jwt = false
  [functions.payment-confirm-reminder]
    verify_jwt = false
  [functions.send-push-notification]
    verify_jwt = false
  # health-check: same shape as its cron siblings above. The CI smoke test (and
  # any server-to-server prober) calls it with `Bearer $CRON_SECRET`, which is
  # NOT a JWT — so with the gateway default of verify_jwt=true it was rejected
  # with 401 before the function ever ran. This declaration was simply missing;
  # the smoke test has failed every run since 2026-04-26 because of it.
  #
  # Safe: the function does its own auth and is stricter than the gateway would
  # be — it requires CRON_SECRET, the service-role key, or a signed-in user who
  # is an ADMIN. verify_jwt=false hands that decision to the function, it does
  # not remove it.
  [functions.health-check]
    verify_jwt = false
  # Service-role-only: send-notification-email accepts a bearer token equal to
  # SUPABASE_SERVICE_ROLE_KEY and renders an HTML email branded as Helpr. With
  # verify_jwt=true the gateway would accept any signed-in user's JWT and the
  # service-role check inside the handler couldn't run. Keep this false; the
  # handler enforces auth itself.
  [functions.send-notification-email]
    verify_jwt = false
  # Public contact form (/support). Deliberately unauthenticated — a logged-out
  # visitor is exactly who it exists for — so verify_jwt MUST be false (the
  # client sends the publishable key, which is not a JWT). Abuse control is the
  # per-IP rate limit inside the handler, not the gateway.
  [functions.contact-support]
    verify_jwt = false
