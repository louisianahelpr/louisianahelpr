name: DB Smoke

permissions:
  contents: read

# Catches the class of bug that took job posting down for ~2 days:
# trigger functions referencing columns that no longer exist, plus the
# notifications.type CHECK regression that silently 500'd state changes.
#
# Boots a Supabase-flavored Postgres in the runner (image bundles pg_cron,
# pg_net, supabase_vault, pgmq, and the auth/storage schemas), applies
# every migration in repo order, then exercises the previously-broken
# `INSERT INTO public.jobs` trigger fan-out path. If `column p.role does
# not exist` (or anything similar) ever resurfaces, this workflow fails
# the PR before merge.
#
# Cost-conscious:
# - Only runs when supabase/migrations/** changes
# - Uses ubuntu-latest (cheapest)
# - Concurrency-cancels superseded runs
# - ~3-5 min run time

on:
  # THE PUSH PATH NOW RUNS THROUGH db-deploy.yml, WHICH `needs:` THIS JOB.
  # Same change, same reason as migration-lint.yml: a `push:` trigger made
  # this smoke test run BESIDE the production deploy instead of in front of
  # it. db-deploy.yml now calls it via `workflow_call` and gates on the
  # result, so applying every migration to a throwaway Postgres happens
  # before `supabase db push` touches prod, not while it does.
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-smoke.yml"
  workflow_dispatch:

concurrency:
  # See migration-lint.yml — `github.workflow` separates db-deploy's call
  # from a PR's own run so a deploy's gate can never be cancelled by a PR.
  group: db-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Apply migrations + post-job trigger smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Supabase's own Postgres distribution: includes pg_cron, pg_net,
        # supabase_vault, pgmq, plpgsql_check, and the standard
        # auth/storage/realtime/extensions schemas with the expected roles
        # (authenticated, anon, service_role). This eliminates the 100+
        # extension/role/publication-related errors we'd hit on stock
        # postgres:16.
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
        # Use the image's default `postgres` database — the supabase/postgres
        # image bootstraps its custom roles + schemas only on `postgres`,
        # so creating a new DB via POSTGRES_DB ends up with the postgres
        # role lacking CREATE on it.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U postgres > /dev/null 2>&1; then
              echo "✅ Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Postgres failed to become ready"
          exit 1

      - name: Belt-and-suspenders schema/role bootstrap
        # The supabase/postgres image already provides auth/storage/realtime
        # schemas and the standard roles, but column shape and permissions
        # vary by image tag. Each block below is wrapped in a DO with
        # EXCEPTION WHEN OTHERS THEN NULL so that any single shim failing
        # (e.g. realtime schema is owned by a role we can't write to)
        # doesn't block the rest. The migrations themselves do the real
        # heavy lifting.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- 1. supabase_realtime publication
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname='supabase_realtime') THEN
              CREATE PUBLICATION supabase_realtime;
            END IF;
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'realtime publication shim skipped: %', SQLERRM;
          END $$;

          -- 2. Reserved roles (newer images already have them)
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'role shim skipped: %', SQLERRM;
          END $$;

          -- 3. storage.buckets columns (idempotent ADD COLUMN IF NOT EXISTS)
          DO $$ BEGIN
            CREATE SCHEMA IF NOT EXISTS storage;
            CREATE TABLE IF NOT EXISTS storage.buckets (
              id text PRIMARY KEY,
              name text NOT NULL UNIQUE,
              owner uuid,
              created_at timestamptz DEFAULT now(),
              updated_at timestamptz DEFAULT now()
            );
            ALTER TABLE storage.buckets ADD COLUMN IF NOT EXISTS public boolean DEFAULT false;
            ALTER TABLE storage.buckets ADD COLUMN IF NOT EXISTS avif_autodetection boolean DEFAULT false;
            ALTER TABLE storage.buckets ADD COLUMN IF NOT EXISTS file_size_limit bigint;
            ALTER TABLE storage.buckets ADD COLUMN IF NOT EXISTS allowed_mime_types text[];
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'storage shim skipped: %', SQLERRM;
          END $$;

          -- 4. Realtime shims. The supabase/postgres image creates the
          -- realtime schema owned by supabase_admin; postgres can't write
          -- in it without ownership. Reassign + grant first, then create.
          DO $$ BEGIN
            CREATE SCHEMA IF NOT EXISTS realtime;
          EXCEPTION WHEN OTHERS THEN NULL; END $$;
          DO $$ BEGIN
            EXECUTE 'ALTER SCHEMA realtime OWNER TO postgres';
            EXECUTE 'GRANT ALL ON SCHEMA realtime TO postgres';
            EXECUTE 'GRANT ALL ON ALL TABLES IN SCHEMA realtime TO postgres';
            EXECUTE 'GRANT ALL ON ALL FUNCTIONS IN SCHEMA realtime TO postgres';
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'realtime ownership reassign skipped: %', SQLERRM;
          END $$;
          DO $$ BEGIN
            CREATE TABLE IF NOT EXISTS realtime.messages (
              id bigserial PRIMARY KEY,
              topic text,
              extension text,
              payload jsonb,
              event text,
              private boolean,
              updated_at timestamptz DEFAULT now(),
              inserted_at timestamptz DEFAULT now()
            );
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'realtime.messages shim skipped: %', SQLERRM;
          END $$;
          DO $$ BEGIN
            CREATE OR REPLACE FUNCTION realtime.topic() RETURNS text
              LANGUAGE sql STABLE AS $rt$ SELECT current_setting('realtime.topic', true) $rt$;
            CREATE OR REPLACE FUNCTION realtime.send(payload jsonb, event text, topic text, private boolean DEFAULT false)
              RETURNS void LANGUAGE sql AS $rt$ SELECT NULL::void $rt$;
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'realtime function shim skipped: %', SQLERRM;
          END $$;

          -- 4b. auth.jwt() shim.
          --
          -- The CI image ships auth.uid()/auth.role() but NOT auth.jwt(), so
          -- any policy that reads a JWT claim dies with "function auth.jwt()
          -- does not exist" and takes the whole replay down with it. That is a
          -- gap in this harness, not a defect in the migration — on real
          -- Supabase the function exists — so shim it to the same definition
          -- Supabase uses.
          --
          -- Created only when absent: CREATE OR REPLACE would silently
          -- overwrite the real implementation if a future image does ship one,
          -- which would turn a passing smoke run into a meaningless one.
          DO $$ BEGIN
            IF to_regprocedure('auth.jwt()') IS NULL THEN
              CREATE FUNCTION auth.jwt() RETURNS jsonb
                LANGUAGE sql STABLE
                AS $jwt$
                  SELECT coalesce(
                    nullif(current_setting('request.jwt.claim', true), ''),
                    nullif(current_setting('request.jwt.claims', true), '')
                  )::jsonb
                $jwt$;
            END IF;
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'auth.jwt() shim skipped: %', SQLERRM;
          END $$;

          -- 5. auth.users column shims (older image schemas).
          DO $$ BEGIN
            ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS email_confirmed_at timestamptz;
            ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS phone text;
            ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS phone_confirmed_at timestamptz;
            ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS raw_user_meta_data jsonb DEFAULT '{}'::jsonb;
            ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS raw_app_meta_data jsonb DEFAULT '{}'::jsonb;
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'auth.users column shim skipped: %', SQLERRM;
          END $$;
          SQL

      - name: Apply all migrations in order
        # A handful of migrations call into the realtime schema (which the
        # supabase/postgres CI image owns as supabase_admin and refuses to
        # let us write into) or depend on those. They're not in the P0 path.
        # Soft-allow them; everything else must apply cleanly.
        #
        # SOFT-ALLOW IS NOW SCOPED TO THE EXPECTED ERROR. Changed 2026-08-31.
        #
        # WHAT THIS CATCHES: a genuine regression inside one of the nine
        # allowlisted files.
        #
        # `is_flaky` used to test the FILENAME only, and psql's output was not
        # inspected at all. So any failure whatsoever in one of these nine
        # files was soft-allowed and the run stayed green — a syntax error, a
        # dropped table, a broken RLS policy, a function body that no longer
        # compiles, all indistinguishable from the permission error the
        # allowlist was written for. Nine migrations were effectively excluded
        # from the smoke test rather than excused for one known reason. And
        # SOFT_FAILS was computed, printed, and then never compared to
        # anything — the count could climb from 9 to 90 and the step still
        # printed "✅ All migrations applied (or soft-allowed)".
        #
        # Now each entry carries the error text it is allowed to fail with.
        # The file is excused ONLY if psql's output matches that pattern; any
        # other error in the same file is a real failure and reds the run.
        # The soft-fail COUNT is also gated: more soft-fails than allowlist
        # entries is impossible by construction and means the matcher has gone
        # wrong, and FEWER means an entry has healed and should be deleted
        # (warned, not failed — healing is good news, it just must not rot the
        # list into a permanent blanket exemption again).
        run: |
          set -euo pipefail

          # <timestamp-prefix>|<extended regex the error output MUST match>
          # 2026-09-02: four patterns widened, and the reason matters more
          # than the change. The condition did NOT move — the CI Postgres
          # image did. It used to ship a `realtime` schema that was
          # permission-gated, so every one of these failed with "permission
          # denied for schema realtime". It now ships no realtime schema at
          # all, so the same migrations fail with `relation
          # "realtime.messages" does not exist` instead, and the allowlist
          # stopped matching its own known gap. (20260412002759 additionally
          # gained a `public.` prefix in the relation name.) These are the
          # same CI-only absences, reworded by the image — not new failures,
          # and prod is unaffected: prod HAS realtime, and all of these
          # applied there in April.
          #
          # This is still the narrow read of "do not widen the pattern to get
          # green": each addition names a specific missing object, so a real
          # regression in these files would still fail the job.
          #
          # HEALED, left in place deliberately — 20260505220000, 20260505224500
          # and 20260506030000 (storage.objects policies) and 20260506162229
          # applied cleanly on 2026-09-02 and no longer soft-fail. They are NOT
          # pruned because the first three say "perms vary by image" and that
          # is exactly what just bit the realtime entries: one green run on one
          # image is not evidence a permission gap is gone for good. Prune them
          # after they stay clean across an image change, not before.
          KNOWN_CI_FLAKY=(
            "20260412002746|permission denied for schema realtime|relation \"realtime\.messages\" does not exist"    # uses realtime.messages
            "20260412002759|permission denied for schema realtime|relation \"(public\.)?jobs_helper_safe\" does not exist"  # depends on jobs_helper_safe (cascades from the above)
            "20260412011520|permission denied for schema realtime|function realtime\.topic\(\) does not exist"    # uses realtime.topic()
            "20260412070714|permission denied for schema realtime|relation \"realtime\.messages\" does not exist"    # uses realtime.messages
            "20260505220000|must be owner of table objects|permission denied for table objects|permission denied for schema storage"   # creates storage.objects policies (perms vary by image)
            "20260505224500|must be owner of table objects|permission denied for table objects|permission denied for schema storage"   # drops storage.objects policies
            "20260506001000|permission denied for schema realtime|must be owner of relation messages|relation \"realtime\.messages\" does not exist"   # ALTER POLICY on realtime.messages
            "20260506030000|must be owner of table objects|permission denied for table objects|permission denied for schema storage"   # message-attachments storage.objects policies
            "20260506162229|function .* does not exist"                                             # REVOKE on auto_escalate_reports/set_broadcast_pending_fan_out/fan_out_broadcast — these exist in prod from earlier history but are first CREATEd in CI by later migrations (175324 / 210000), so the REVOKE runs before the function exists
          )

          # Returns 0 and echoes the allowed pattern if this file is
          # allowlisted; returns 1 otherwise.
          flaky_pattern() {
            local base; base="$(basename "$1")"
            local entry prefix pattern
            for entry in "${KNOWN_CI_FLAKY[@]}"; do
              prefix="${entry%%|*}"
              pattern="${entry#*|}"
              if [[ "$base" == "$prefix"* ]]; then
                printf '%s' "$pattern"
                return 0
              fi
            done
            return 1
          }

          FAIL=0
          FIRST_FAIL=""
          SOFT_FAILS=0
          MATCHED_PREFIXES=""
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$(basename "$f")"
            # Capture stderr as well as stdout so the error text can be
            # matched, and tee it so the run log still shows everything.
            if ! psql -v ON_ERROR_STOP=1 -f "$f" > /tmp/psql-out.txt 2>&1; then
              cat /tmp/psql-out.txt
              if PATTERN="$(flaky_pattern "$f")"; then
                if grep -qiE "$PATTERN" /tmp/psql-out.txt; then
                  echo "::warning file=$f::known CI-only failure (matched: $PATTERN) — soft-allowed"
                  SOFT_FAILS=$((SOFT_FAILS + 1))
                  MATCHED_PREFIXES="$MATCHED_PREFIXES $(basename "$f")"
                else
                  # Allowlisted file, UNEXPECTED error. This is the case the
                  # old filename-only check silently swallowed.
                  echo "::error file=$f::Allowlisted migration failed for an UNEXPECTED reason."
                  echo "::error file=$f::Expected the error to match: $PATTERN"
                  echo "::error file=$f::This is a real regression, not the known CI permission gap. Do not widen the pattern to get green."
                  FAIL=1
                  [ -z "$FIRST_FAIL" ] && FIRST_FAIL="$f"
                fi
              else
                echo "::error file=$f::Migration failed"
                FAIL=1
                [ -z "$FIRST_FAIL" ] && FIRST_FAIL="$f"
              fi
            else
              cat /tmp/psql-out.txt
            fi
            echo "::endgroup::"
          done

          echo ""
          echo "Soft-failed (CI-only): $SOFT_FAILS of ${#KNOWN_CI_FLAKY[@]} allowlisted"
          echo "Soft-failed files:$MATCHED_PREFIXES"

          # Gate the COUNT, not just the individual matches.
          if [ "$SOFT_FAILS" -gt "${#KNOWN_CI_FLAKY[@]}" ]; then
            echo "::error::More soft-fails ($SOFT_FAILS) than allowlist entries (${#KNOWN_CI_FLAKY[@]}) — the prefix matcher is over-matching. Failing rather than trusting it."
            FAIL=1
          elif [ "$SOFT_FAILS" -lt "${#KNOWN_CI_FLAKY[@]}" ]; then
            echo "::warning::Only $SOFT_FAILS of ${#KNOWN_CI_FLAKY[@]} allowlisted migrations failed. Some entries have healed (or the file was renamed/removed) — prune KNOWN_CI_FLAKY so the exemption list does not silently grow back into a blanket pass."
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Real migration failure. First: $FIRST_FAIL"
            exit 1
          fi
          echo "✅ All migrations applied (or soft-allowed for their one expected, matched reason)"

      - name: Smoke — post a job, expect triggers to fire cleanly
        # The actual P0: every INSERT INTO public.jobs invokes
        # notify_helpers_on_job_post() and notify_saved_searches_on_new_job(),
        # both of which used to throw `column p.role does not exist`. This
        # test creates a fake user, then inserts a job, and FAILS LOUDLY if
        # any trigger raises. Wrapped in a transaction + ROLLBACK to leave no
        # state.
        #
        # Note: handle_new_user() trigger auto-creates the profiles row
        # when auth.users is inserted (per migration 20260505230500), so we
        # UPDATE the auto-created row to set approval_status='approved'
        # instead of INSERTing a duplicate.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO auth.users (id, email) VALUES (gen_random_uuid(), 'smoke@helpr.test');
          UPDATE public.profiles
            SET full_name = 'Smoke Tester', approval_status = 'approved'
            WHERE user_id = (SELECT id FROM auth.users WHERE email='smoke@helpr.test');
          INSERT INTO public.jobs (
            title, description, category, budget, location, parish, status,
            customer_id, date_needed
          )
          SELECT
            '[CI smoke] post-job trigger check',
            'Auto-generated by db-smoke.yml — never persists.',
            'cleaning', 50, 'Test Address', 'Orleans', 'open',
            (SELECT id FROM auth.users WHERE email='smoke@helpr.test'),
            CURRENT_DATE + INTERVAL '7 days'
          ;
          ROLLBACK;
          SELECT '✅ post-job triggers ran cleanly — no column-does-not-exist errors';
          SQL

      - name: Smoke — notifications.type CHECK accepts every emitted type
        # The 2026-05-04 hidden P0: a trigger inserted notifications.type='work_status'
        # but the CHECK constraint only knew 7 types. Every accepted→in_progress
        # transition silently 500'd. This test inserts every type the codebase
        # actually emits and fails if any are rejected.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            t text;
            types text[] := ARRAY[
              'info', 'success', 'warning', 'job_update', 'application',
              'review', 'payment',
              'job_match', 'job_updates', 'work_status', 'transit_updates',
              'system_alert', 'new_offers', 'expired', 'financial_alerts',
              'verified'
            ];
            tester_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users (id, email)
              VALUES (tester_id, 'notif-smoke@helpr.test');

            FOREACH t IN ARRAY types LOOP
              BEGIN
                INSERT INTO public.notifications (user_id, type, title, message)
                VALUES (tester_id, t, 'smoke', 'smoke test row');
              EXCEPTION WHEN check_violation THEN
                RAISE EXCEPTION 'notifications.type=% rejected by CHECK constraint — keep notifications_type_check in sync with code', t;
              END;
            END LOOP;

            DELETE FROM public.notifications WHERE user_id = tester_id;
            DELETE FROM auth.users WHERE id = tester_id;
            RAISE NOTICE '✅ All % notification types accepted', array_length(types, 1);
          END $$;
          SQL

      - name: Sanity-check the previously-broken role functions
        # Belt-and-suspenders: directly invoke each function that contained a
        # `p.role` reference. They should all return without error after the
        # fix migration applied.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.get_approved_helpers(1);
          SELECT * FROM public.get_top_helpers_by_parish(NULL, 1);
          SELECT * FROM public.get_hero_parishes();
          SELECT * FROM public.get_helper_tiers(1);
          SELECT * FROM public.get_parish_activity(1);
          SELECT * FROM public.get_safe_profiles(ARRAY[]::uuid[]);
          SELECT '✅ all previously-broken role functions return without error';
          SQL

      - name: Smoke — RLS blocks a non-admin from admin_audit_log and platform_settings
        # Regression lock for the 2026-08-25 admin audit, which verified this
        # by hand against the live DB (has_role() + these two policies) but
        # left nothing automated to catch a future policy edit that loosens
        # them. admin_audit_log holds who-did-what-to-whom for every
        # privileged action; platform_settings holds internal config (webhook
        # URLs, fee knobs) restricted to admins since 20260419032529. Both are
        # gated purely by RLS `has_role(auth.uid(), 'admin')` — there is no
        # app-layer check backing them up — so this runs as the `authenticated`
        # Postgres role with a real non-admin JWT claim, exactly as PostgREST
        # would for a signed-in stranger's request, and fails if either table
        # returns a row.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          -- Setup runs as the postgres superuser (RLS-exempt), so it can seed
          -- a real row in each table — "nobody can see anything because the
          -- table is empty" must not be able to pass this test.
          DO $$
          DECLARE
            non_admin_id uuid := gen_random_uuid();
            admin_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users (id, email) VALUES (non_admin_id, 'rls-nonadmin-smoke@helpr.test');
            INSERT INTO auth.users (id, email) VALUES (admin_id, 'rls-admin-smoke@helpr.test');
            -- prevent_admin_role_self_grant() only allows service_role; SET LOCAL
            -- scopes the role to this transaction so subsequent cleanup sees postgres.
            EXECUTE 'SET LOCAL ROLE service_role';
            INSERT INTO public.user_roles (user_id, role) VALUES (admin_id, 'admin');
            EXECUTE 'RESET ROLE';
            INSERT INTO public.admin_audit_log (admin_id, action, target_id, target_type, details)
              VALUES (admin_id, 'rls_smoke_test', non_admin_id, 'user', '{}'::jsonb);
            IF NOT EXISTS (SELECT 1 FROM public.platform_settings LIMIT 1) THEN
              INSERT INTO public.platform_settings DEFAULT VALUES;
            END IF;
          END $$;

          -- Act as the non-admin, exactly as PostgREST does for their request:
          -- the `authenticated` Postgres role, with a JWT claim naming them.
          -- set_config runs first (still postgres/superuser) because the
          -- `authenticated` role lacks SELECT on auth.users; set_config with
          -- is_local=true is transaction-scoped so the claim survives the
          -- subsequent role switch.
          SELECT set_config(
            'request.jwt.claims',
            (SELECT json_build_object('sub', id, 'role', 'authenticated')::text
               FROM auth.users WHERE email = 'rls-nonadmin-smoke@helpr.test'),
            true
          );
          SET LOCAL ROLE authenticated;

          DO $$
          DECLARE
            leaked_count int;
          BEGIN
            SELECT count(*) INTO leaked_count FROM public.admin_audit_log;
            IF leaked_count > 0 THEN
              RAISE EXCEPTION 'RLS REGRESSION: a non-admin read % row(s) from admin_audit_log', leaked_count;
            END IF;

            SELECT count(*) INTO leaked_count FROM public.platform_settings;
            IF leaked_count > 0 THEN
              RAISE EXCEPTION 'RLS REGRESSION: a non-admin read % row(s) from platform_settings', leaked_count;
            END IF;
          END $$;

          -- Back to postgres to clean up — the non-admin role has no DELETE
          -- policy on either table (correctly), so cleanup must run as owner.
          RESET ROLE;
          DELETE FROM public.admin_audit_log WHERE action = 'rls_smoke_test';
          DELETE FROM public.user_roles WHERE user_id IN (SELECT id FROM auth.users WHERE email LIKE 'rls-%-smoke@helpr.test');
          DELETE FROM auth.users WHERE email LIKE 'rls-%-smoke@helpr.test';

          COMMIT;
          SELECT '✅ non-admin cannot read admin_audit_log or platform_settings';
          SQL

      - name: Static guard — no p.role = 'helper'-style hardcoded role strings
        # Belt-and-suspenders #2: even if the DB tests pass, fail the PR if
        # anyone reintroduces a string-literal role comparison in code that
        # ships at runtime. The fix is always: has_role(uid, 'role'::app_role).
        #
        # Scoped to .ts/.tsx only. Migration history (.sql files) is
        # immutable record — old migrations with the legacy pattern were
        # superseded by 20260504142454_fix_role_checks_via_user_roles.sql;
        # the actual DB state is verified by the post-job smoke test above.
        run: |
          set -e
          PAT="(profiles?|p)\\.role\\s*=\\s*'(helper|customer|admin|client|provider)'"
          MATCHES=$(grep -rEn -i \
            --include='*.ts' --include='*.tsx' \
            "$PAT" \
            src/ supabase/functions/ 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Hardcoded role-string comparison found — use has_role(uid, 'role'::app_role) instead"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No hardcoded role-string comparisons found in runtime code"
