name: Seed payout fire drill

# docs/OPEN.md Q93 / Q92(a): one `process-scheduled-payouts?include_seed=1`
# run, so seed jobs reach the transfer leg on real Stripe TEST mode and any
# seed failure is shown to write no admin notification. Owner approved
# (2026-09-27 night): test mode only, is_seed records only.
#
# Fail-closed before anything is paid:
#   1. the repo variable E2E_STRIPE_MODE must be `test` (stripe-sandbox-off.sh
#      sets it to `live` FIRST, so this can never run after launch);
#   2. no NON-seed job may be payout_pending and due: `include_seed=1` selects
#      real jobs too, and this drill must only ever touch seed rows.
# Manual only: no schedule, no push trigger.
#
# Afterwards (read-only SQL, recorded in docs/OPEN.md Q93):
#   SELECT count(*) FROM notifications WHERE type='admin_alert'
#     AND job_id IN (SELECT id FROM jobs WHERE is_seed) AND created_at > <START>;

on:
  workflow_dispatch:
    inputs:
      blocked_pi_seed_job:
        description: "Optional: an is_seed, due, PI-less job id to give an UNCONFIRMED test PaymentIntent, so the run hits pi_not_succeeded (a seed failure). Restored to null afterwards."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: seed-payout-fire-drill
  cancel-in-progress: false

jobs:
  drill:
    name: include_seed payout run (Stripe test mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse unless Stripe is in test mode and only seed jobs are due
        env:
          STRIPE_MODE: ${{ vars.E2E_STRIPE_MODE }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ "$STRIPE_MODE" != "test" ]; then
            echo "::error::E2E_STRIPE_MODE is '$STRIPE_MODE', not 'test'; refusing to run a payout drill"; exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_PROJECT_REF or SUPABASE_SERVICE_ROLE_KEY secret is empty"; exit 1
          fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REST="https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/jobs"
          Q="select=id&status=eq.completed&payment_status=eq.payout_pending&payout_scheduled_at=lte.${NOW}"
          REAL=$(curl -sS --fail-with-body -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" "${REST}?${Q}&is_seed=eq.false" | jq 'length')
          SEED=$(curl -sS --fail-with-body -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" "${REST}?${Q}&is_seed=eq.true" | jq 'length')
          echo "due payout_pending jobs at ${NOW}: real=${REAL} seed=${SEED}"
          if [ "$REAL" != "0" ]; then
            echo "::error::${REAL} real job(s) are due; an include_seed run would pay them too. Refusing."; exit 1
          fi

      # A forced seed failure (Q93's tick needs one): the named seed job gets
      # an unconfirmed Stripe TEST PaymentIntent (status
      # requires_payment_method), so the run takes the pi_not_succeeded branch,
      # the one that used to message every admin. Only a job that is is_seed
      # AND has no PI is touched; the restore step below puts the null back
      # and cancels the PaymentIntent whatever happens.
      - name: Give one seed job an unconfirmed test PaymentIntent
        if: inputs.blocked_pi_seed_job != ''
        env:
          JOB_ID: ${{ inputs.blocked_pi_seed_job }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$JOB_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::blocked_pi_seed_job must be a uuid"; exit 1
          fi
          case "$STRIPE_TEST_SECRET_KEY" in
            sk_test_*|rk_test_*) ;;
            *) echo "::error::STRIPE_TEST_SECRET_KEY is not a test-mode key"; exit 1 ;;
          esac
          REST="https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/jobs"
          H=(-H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          N=$(curl -sS --fail-with-body "${H[@]}" "${REST}?select=id&id=eq.${JOB_ID}&is_seed=eq.true&stripe_payment_intent_id=is.null" | jq 'length')
          if [ "$N" != "1" ]; then
            echo "::error::${JOB_ID} is not an is_seed job without a PaymentIntent; refusing"; exit 1
          fi
          PI=$(curl -sS --fail-with-body -u "${STRIPE_TEST_SECRET_KEY}:" https://api.stripe.com/v1/payment_intents \
            -d amount=100 -d currency=usd -d "payment_method_types[]=card" -d "metadata[drill]=Q93" -d "metadata[job_id]=${JOB_ID}")
          PI_ID=$(printf '%s' "$PI" | jq -r .id)
          echo "created test PaymentIntent ${PI_ID} status $(printf '%s' "$PI" | jq -r .status) livemode $(printf '%s' "$PI" | jq -r .livemode)"
          echo "PI_ID=${PI_ID}" >> "$GITHUB_ENV"
          SET=$(curl -sS --fail-with-body -X PATCH "${H[@]}" -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"stripe_payment_intent_id\":\"${PI_ID}\"}" "${REST}?id=eq.${JOB_ID}&is_seed=eq.true&select=id" | jq 'length')
          if [ "$SET" != "1" ]; then
            echo "::error::setting the PaymentIntent on ${JOB_ID} changed ${SET} rows"; exit 1
          fi

      - name: Run process-scheduled-payouts?include_seed=1
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is empty"; exit 1
          fi
          echo "START $(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          STATUS=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" -H "Content-Type: application/json" -d '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/process-scheduled-payouts?include_seed=1")
          echo "END $(date -u +%Y-%m-%dT%H:%M:%S.%NZ) http=${STATUS}"
          jq '{success, processed, defects, seedDefects, statuses: ([.results[]?.status] | group_by(.) | map({(.[0]): length}) | add)}' body.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::process-scheduled-payouts answered HTTP ${STATUS}"; exit 1
          fi

      - name: Restore the seed job and cancel the test PaymentIntent
        if: always() && inputs.blocked_pi_seed_job != '' && env.PI_ID != ''
        env:
          JOB_ID: ${{ inputs.blocked_pi_seed_job }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          REST="https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/jobs"
          H=(-H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          SET=$(curl -sS --fail-with-body -X PATCH "${H[@]}" -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d '{"stripe_payment_intent_id":null}' "${REST}?id=eq.${JOB_ID}&is_seed=eq.true&stripe_payment_intent_id=eq.${PI_ID}&select=id" | jq 'length')
          echo "restored stripe_payment_intent_id=null on ${SET} row(s)"
          ST=$(curl -sS --fail-with-body -u "${STRIPE_TEST_SECRET_KEY}:" -X POST "https://api.stripe.com/v1/payment_intents/${PI_ID}/cancel" | jq -r .status)
          echo "PaymentIntent ${PI_ID} now ${ST}"
          if [ "$SET" != "1" ] || [ "$ST" != "canceled" ]; then
            echo "::error::cleanup incomplete (rows=${SET}, pi=${ST})"; exit 1
          fi
