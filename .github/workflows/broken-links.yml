name: Broken Link Check

permissions:
  contents: read

# Crawls the published site for broken links (404s, dead redirects).
# App Store reviewers click through privacy/support/terms URLs — a 404 on
# any of those is grounds for rejection. This catches them before submission.
#
# Runs:
# - Weekly on Tuesdays (App Store reviews happen all week)
# - Manually via workflow_dispatch

on:
  # Runs weekly. "Run it manually before submissions" is exactly the failure
  # mode this check exists to prevent — App Store reviewers click the privacy
  # / support / terms URLs, and a 404 on any of them is grounds for rejection,
  # so it has to catch breakage continuously rather than when someone
  # remembers. Free on a public repo.
  schedule:
    - cron: "0 9 * * 2" # Tuesday 09:00 UTC
  workflow_dispatch:

jobs:
  link-check:
    name: Crawl www.louisianahelpr.com for 404s
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check critical legal/support pages
        # These are the URLs Apple reviewers click. If any 404, we fail loud.
        run: |
          set -e
          URLS=(
            "https://www.louisianahelpr.com/"
            "https://www.louisianahelpr.com/privacy"
            "https://www.louisianahelpr.com/terms"
            "https://www.louisianahelpr.com/rules"
            "https://www.louisianahelpr.com/support"
            "https://www.louisianahelpr.com/login"
            "https://www.louisianahelpr.com/signup"
            "https://www.louisianahelpr.com/data-rights"
          )
          FAIL=0
          for URL in "${URLS[@]}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")
            if [ "$CODE" = "200" ]; then
              echo "✅ $CODE  $URL"
            else
              echo "❌ $CODE  $URL"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "💡 One or more critical pages are broken. Fix before App Store submission."
            exit 1
          fi

      - name: Run lychee link checker on homepage
        # Catches broken outbound links (CDN images, social profiles, etc.)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200,206,429
            --exclude-mail
            --exclude-path node_modules
            https://www.louisianahelpr.com/
          fail: false # don't fail on flaky external links — log only
