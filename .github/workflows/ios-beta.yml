name: iOS Beta (TestFlight)

# Manual-only trigger to save GitHub Actions minutes — macOS runners cost 10x Linux.
# Run from the Actions tab → "iOS Beta (TestFlight)" → "Run workflow".
on:
  workflow_dispatch:

concurrency:
  group: ios-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Force GitHub Actions to use Node 24 for its internal JS-based actions
      # (checkout, setup-node, etc.) so they don't trip on the EOL Node 20 runtime.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ─── App Store Connect API key (already configured as repo secrets) ──────
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}

      # ─── Fastlane match (signing certs + profiles in a private Git repo) ─────
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      # HTTPS auth for fastlane match: base64("username:personal_access_token")
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      # Ephemeral keychain so we don't pollute the runner's default keychain.
      MATCH_KEYCHAIN_NAME: fastlane_tmp_keychain
      MATCH_KEYCHAIN_PASSWORD: ${{ github.run_id }}
      MATCH_READONLY: "true"

      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Ruby (for Fastlane + CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Generate iOS native project (if missing)
        # ios/App/ is gitignored (per ios/README.md) — generated locally on
        # developer Macs. In CI we recreate it from scratch, preserving the
        # repo stubs (PrivacyInfo.xcprivacy, App.entitlements, README) that
        # need to land inside the generated native project.
        run: |
          if [ ! -d ios/App ]; then
            echo "ios/App/ missing — preserving repo stubs and generating native project..."
            mkdir -p /tmp/ios-stubs
            [ -f ios/App.entitlements ] && mv ios/App.entitlements /tmp/ios-stubs/
            [ -f ios/PrivacyInfo.xcprivacy ] && mv ios/PrivacyInfo.xcprivacy /tmp/ios-stubs/
            [ -f ios/README.md ] && mv ios/README.md /tmp/ios-stubs/
            rm -rf ios
            npx cap add ios
            if [ -f /tmp/ios-stubs/PrivacyInfo.xcprivacy ]; then
              cp /tmp/ios-stubs/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
              cp /tmp/ios-stubs/PrivacyInfo.xcprivacy ios/PrivacyInfo.xcprivacy
            fi
            if [ -f /tmp/ios-stubs/App.entitlements ]; then
              cp /tmp/ios-stubs/App.entitlements ios/App/App/App.entitlements
              cp /tmp/ios-stubs/App.entitlements ios/App.entitlements
            fi
            [ -f /tmp/ios-stubs/README.md ] && cp /tmp/ios-stubs/README.md ios/README.md || true
          fi

      - name: Sync Capacitor → iOS
        # Refreshes the web bundle in ios/App/App/public and runs pod install
        # to wire up native plugins.
        run: npx cap sync ios

      - name: Run Fastlane beta lane
        working-directory: ios/App
        run: bundle exec fastlane ios beta

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain fastlane_tmp_keychain 2>/dev/null || true
          rm -f ~/.ssh/id_ed25519 2>/dev/null || true
