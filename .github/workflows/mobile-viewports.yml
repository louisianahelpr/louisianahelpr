name: Mobile viewport spot-check

permissions:
  contents: read

# Replaces the human eyeball pass that previously ran during QA on
# 320 / 375 / 414 / 768 / 1024px viewports. Catches:
#   - horizontal overflow regressions (the #1 mobile layout bug)
#   - JS errors that only fire on small-viewport CSS branches
#   - phone-cluster overflow on the landing page at 320
#
# Spec lives at e2e/mobile-viewports.spec.ts. Tests run against THIS COMMIT,
# built and served locally with `vite preview` (.github/actions/local-preview)
# on the real Supabase backend — never the deployed site, which costs Vercel
# edge requests on every push (the project was paused on Hobby limits,
# 2026-09-14; src/test/noTestTrafficOnVercel.test.ts).
#
# Cost-conscious:
# - Runs on every PR (required branch-protection check — a `paths:`
#   filter would leave the check "Expected" forever on backend-only
#   PRs and deadlock auto-merge), but an in-job paths-filter step
#   skips the Playwright work and goes green in seconds when no
#   UI/layout file changed.
# - Concurrency-locked
# - Uploads screenshots only on failure (test-results/)

on:
  # Also on direct pushes to main. This repo commits straight to main, so a
  # pull_request-only trigger left this check dormant — the same way
  # migration-guard, migration-lint and db-smoke were until 2026-08-26.
  #
  # Free and cheap, deliberately: the repo is public and this runs on
  # ubuntu-latest, where GitHub Actions is unmetered; the in-job paths filter
  # below skips the Playwright work and goes green in seconds when no UI file
  # changed; and cancel-in-progress drops superseded runs. It builds and tests
  # the commit itself, so a layout regression is caught before it deploys.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-viewports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-spot-check:
    name: Playwright mobile viewports (320 / 375 / 414 / 768 / 1024)
    runs-on: ubuntu-latest
    # 20, not 12: the job now builds this commit before measuring it.
    timeout-minutes: 20
    # NOTE: deliberately NOT excluding dependabot[bot]. This job is a REQUIRED
    # status check on main, and GitHub counts a required check that is skipped
    # as unsatisfied — so excluding Dependabot here made every dependency PR
    # permanently unmergeable. Three sat open for weeks looking "green": every
    # check that ran had passed, but the ones gating the merge never ran.
    # A dependency bump is also exactly when an E2E smoke test earns its keep.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect UI-relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ui:
              - "src/**"
              - "public/**"
              - "index.html"
              - "vite.config.ts"
              - "tailwind.config.ts"
              - "package.json"
              - "package-lock.json"
              - "e2e/mobile-viewports.spec.ts"
              - ".github/workflows/mobile-viewports.yml"

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        # Use `install` not `ci` to tolerate minor lockfile drift.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Drop the Google Chrome apt source
        # `playwright install --with-deps` runs `apt-get update`, which fails the
        # whole step (exit 100) whenever dl.google.com serves a bad index — seen
        # 2026-09-09 as "Hash Sum mismatch", red across four workflows on two
        # consecutive runs while the app code was fine. We install Chromium from
        # Playwright, so Google's repo is only ever a source of outages here.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright Chromium browser
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build and serve this commit locally (real backend, local frontend)
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        uses: ./.github/actions/local-preview

      - name: Run mobile-viewport tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test e2e/mobile-viewports.spec.ts --reporter=list,./e2e/reporters/skipReporter.ts

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-viewport-screenshots
          path: test-results/mobile/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
