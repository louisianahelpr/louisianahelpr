name: Staleness watch

# Nothing the monitoring relies on may be out of date (owner, 2026-09-23).
#
# Two checks, two cadences:
#  - generated-current (EVERY push to main + nightly): scripts/
#    check-generated-current.mjs re-runs every CI-runnable generator and fails
#    if a committed inventory differs from what it produces now. On push with
#    no paths filter, because test.yml ignores docs/** and a docs-only commit
#    (a findings.jsonl entry, a hand edit of a generated file) must be caught
#    on the push that makes it.
#  - staleness (nightly): scripts/check-staleness.mjs finds every timestamped
#    evidence file that nothing better proves current and fails on anything
#    past its age limit, checks workflow-bound baselines against their last
#    passing run, and checks the audit ledger's lag.
# A red scheduled run opens a `nightly-red: staleness-watch` issue (session
# start reads it; "Nightly reds nobody read" escalates it) and closes on green.
#  - land (schedule + dispatch, Q57; and on a push that DRIFTED): re-runs every
#    CI generator on LATEST main (`npm run inventories:refresh`) and lands
#    whatever moved through .github/actions/refresh-pr — one bot branch, one
#    PR, auto-merge on green.
#    On push it runs ONLY when check:generated exits 3 (drift: every problem is
#    a stale committed output). That is no pusher's fault: aggregate counts
#    (vacuity guards, burn-down, queue score) merge cleanly to the wrong number
#    when two non-strict PRs each change them (2026-10-01, #2051: committed
#    1285, regenerated 1286), and before this main stayed stale until the
#    nightly while every open PR went red on it. A push that is current, or
#    fails for any other reason (exit 1: a crash, a registry gap), opens no
#    refresh PR and stays red for its pusher. The nightly stays strict.

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 11 * * *"   # 06:20 Central, before the owner's morning
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: staleness-watch-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  generated-current:
    name: Committed inventories are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.gen.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # The vacuity-report and burn-down generators parse tests with the
      # TypeScript compiler, so they need node_modules.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Regenerate every CI-runnable inventory and diff
        id: gen
        # Exit 3 = drift only. On push it passes and hands `drift=true` to the
        # land job, which lands the regeneration now; nightly it stays red.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          npm run -s check:generated
          rc=$?
          set -e
          if [ "$rc" -eq 3 ] && [ "$EVENT" = "push" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Committed inventories drifted on main; the land job regenerates them as bot/refresh/inventories."
            exit 0
          fi
          exit "$rc"
      - name: Every stated count is generated, dated, or baselined (two-way)
        if: always()
        run: npm run check:counts

  staleness:
    name: Nothing stale
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the ledger check counts commits since the last stamp
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Check evidence age, workflow-bound baselines and ledger freshness
        env:
          # `gh run list` for baselines whose currency is a passing scheduled
          # run (overlay-sweep -> ui-sweep.yml's Friday cron). Without it the
          # script refuses to report fresh in CI.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:staleness
      - name: The schedule heartbeat itself is still firing (CJ-009)
        # schedule-heartbeat.yml watches every other cron; nothing watched it.
        # If GitHub disables it (60 days idle) every workflow it guards goes
        # unwatched at once, so this job checks it: active, and a scheduled
        # run within 2 days (it fires daily at 11:23).
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          STATE=$(gh api "repos/${{ github.repository }}/actions/workflows/schedule-heartbeat.yml" --jq '.state')
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/schedule-heartbeat.yml/runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // ""')
          [ "$STATE" = "active" ] || { echo "::error::schedule-heartbeat.yml is $STATE; every cron it watches is unwatched. gh workflow enable schedule-heartbeat.yml"; exit 1; }
          [ -n "$LAST" ] || { echo "::error::schedule-heartbeat.yml has no scheduled run."; exit 1; }
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          [ "$AGE" -le 2 ] || { echo "::error::schedule-heartbeat.yml last ran on schedule ${AGE}d ago (budget 2d)."; exit 1; }  # CJ-009 heartbeat budget
          echo "schedule-heartbeat last scheduled run ${AGE}d ago"

  land:
    name: Land regenerated inventories (Q57 refresh PR)
    needs: [generated-current]
    if: needs.generated-current.result != 'cancelled' && (github.event_name != 'push' || needs.generated-current.outputs.drift == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY write grant in this workflow (Q57): push the bot branch, open or
    # update its PR, and dispatch its checks (a github.token PR triggers none).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: The files this refresh may change (every CI generator's outputs)
        id: outs
        run: |
          set -euo pipefail
          OUTS=$(node scripts/check-generated-current.mjs --outputs)
          test -n "$OUTS"
          { echo 'paths<<EOF_PATHS'; echo "$OUTS"; echo 'EOF_PATHS'; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/refresh-pr
        with:
          id: inventories
          title: "chore(refresh): generated inventories regenerated"
          paths: ${{ steps.outs.outputs.paths }}
          regenerate: npm run inventories:refresh
          github-token: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          check-workflows: ${{ vars.REFRESH_PR_CHECK_WORKFLOWS }}

  notify:
    name: Report nightly result
    needs: [generated-current, staleness, land]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: staleness-watch
          status: ${{ (needs.generated-current.result == 'success' && needs.staleness.result == 'success' && needs.land.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
