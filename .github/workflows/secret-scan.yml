name: Secret Scan

permissions:
  contents: read

# Q75: a secret can never land. Scans every commit a push or PR ADDS (not the
# whole history each time) with two engines, and fails on any finding:
#   1. gitleaks (pinned release, checksum-verified) with .gitleaks.toml: the
#      default rule set + this repo's key shapes + the public-by-design
#      allowlist (Supabase publishable key, anon JWT, MapKit JS token).
#   2. scripts/secret-scan.mjs: the same repo key shapes in node, the scanner
#      the pre-commit hook runs, so the hook and CI can never disagree.
# Both redact: a finding prints rule, file, line, never the value.
# workflow_dispatch scans the FULL history of every branch (triaged historical
# findings are fingerprinted in .gitleaksignore).
#
# A red here means a key reached GitHub: removing it in a new commit does not
# un-leak it. Rotate the credential first, then fix the commit.

on:
  # Every branch, not only main: a key on a feature branch is just as public.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.28.0"
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  scan:
    name: Scan new commits for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history, for the commit range)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          TGZ="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TGZ" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TGZ}"
          echo "${GITLEAKS_SHA256}  ${TGZ}" | sha256sum -c -
          tar xzf "$TGZ" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            RANGE="--all"
          elif [ "$EVENT" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${AFTER}"
          elif [ "$REF" != "main" ]; then
            # New branch, or a force-push whose old head is gone: everything
            # the branch carries that main does not.
            git fetch --no-tags origin main
            RANGE="origin/main..${AFTER}"
          else
            # main with no usable "before": fail CLOSED by scanning all of it.
            RANGE="--all"
          fi
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"
          echo "Scanning: ${RANGE} ($(git rev-list --count ${RANGE}) commits)"
          # Q75 (2026-09-26): on main, gitleaks reads ALL of main's history,
          # not just the pushed range. A range-only scan let a red finding
          # (run 36067442586, 7a7745632) be superseded by the next green push
          # and never triaged. The whole of main takes ~8s; a finding stays
          # red until it is removed or fingerprinted in .gitleaksignore.
          if [ "$EVENT" = "push" ] && [ "$REF" = "main" ]; then
            GL_RANGE="${AFTER}"
          else
            GL_RANGE="${RANGE}"
          fi
          echo "gl_range=${GL_RANGE}" >> "$GITHUB_OUTPUT"

      - name: gitleaks (default rules + repo shapes)
        env:
          RANGE: ${{ steps.range.outputs.gl_range }}
        run: gitleaks git --log-opts="${RANGE}" --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1 .

      - name: Repo key shapes (the pre-commit scanner)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: node scripts/secret-scan.mjs --range "${RANGE}"

      - name: Every .gitleaksignore entry still reproduces (two-way)
        run: node scripts/check-gitleaksignore.mjs
