name: Quota and analytics monitors

# docs/OPEN.md Q63 + Q72 + Q289, daily.
#
# quota     scripts/check-quota-usage.mjs: Supabase database size, connections
#           (against the LIVE max_connections), file storage and edge-function
#           invocations; Vercel deployments in 24h against the free (Hobby)
#           plan's daily cap; Resend sends (month + day) from email_send_log;
#           Sentry accepted errors over 30 days. Every limit, its source and
#           its override live in scripts/lib/quotaMonitor.mjs. >= 80% of a
#           limit -> ops alert ledger warning (>= 100% -> error). A quota that
#           cannot be read -> ledger error AND a red run. Quotas with no API
#           (Supabase egress, Realtime messages) print a ::warning every run.
#
# analytics scripts/check-analytics-freshness.mjs: each key product event
#           (signup, job posted, applied, hired, paid, reviewed) against the
#           rows real users wrote for the same action. BROKEN (real actions,
#           zero events) -> ledger error; QUIET (nobody did it, pre-launch) is
#           reported and never alerts. An unreadable read -> red run.
#
# stripe-balance scripts/check-stripe-balance.mjs (Q3 / Q145): the Stripe TEST
#           platform balance (GET /v1/balance, STRIPE_TEST_SECRET_KEY, the key
#           stripe-webhook-guard.yml uses) against max($100, 1.5 x the payouts
#           due in the next 72h from public.jobs). Below it -> ledger error
#           that says how to top up in TEST mode (the 0077 card), BEFORE the
#           transfers fail as they did on 2026-09-22. An unreadable balance ->
#           ledger error AND a red run. Test mode only: a non-test key is refused.
#
# store-reviews scripts/check-store-reviews.mjs (Q289): App Store Connect
#           customer reviews (the ASC_* key the TestFlight pipeline uses).
#           Every review rated 3 stars or lower, newer than the last one
#           recorded, becomes a `user-report` ledger item (verify manual).
#           Review text goes to the ledger only, never to this public log. An
#           unreadable read (a 403 names the owner step: the key's role needs
#           Customer Reviews access) -> ledger error AND a red run.
#
# Both read prod through the Management API with read_only SQL (one statement
# each) plus one logs.all query; nothing is written except ledger items.
# The alert path is the ops alert ledger (scripts/lib/opsAlertLedger.mjs), the
# same one prod-errors / supabase-usage use; its items carry verify-ref
# quota-monitor.yml, so `ops-alert-ledger.mjs sync` closes each only after a
# green run of THIS workflow that started after the last occurrence.

on:
  schedule:
    # 23:17 UTC daily: 120 min after expiry-monitor (21:17), 120 min before
    # supabase-usage (Sat 01:17), 30 min clear of the hourly :47 monitors
    # (src/test/prodWorkflowSpacing.test.ts).
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  # Scheduled runs share prod-load; a dispatch gets its own group
  # (src/test/prodWorkflowSpacing.test.ts rule 4).
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('quota-monitor-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  quota:
    name: Quotas and limits (Q63)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read every quota
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal read token (org:read, project:read): the org token in
          # SENTRY_AUTH_TOKEN is release-upload only and gets 403 on usage stats.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_READ_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node scripts/check-quota-usage.mjs

  analytics:
    name: Analytics freshness (Q72)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read each key event against real actions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-analytics-freshness.mjs

  stripe_balance:
    name: Stripe TEST balance vs payouts due (Q3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the available balance and the payouts due in 72h
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-stripe-balance.mjs

  store_reviews:
    name: App Store reviews to the ledger (Q289)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record low-rated App Store reviews
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-store-reviews.mjs

  notify:
    name: Report nightly result
    needs: [quota, analytics, stripe_balance, store_reviews]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: quota-monitor
          status: ${{ (needs.quota.result == 'success' && needs.analytics.result == 'success' && needs.stripe_balance.result == 'success' && needs.store_reviews.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
