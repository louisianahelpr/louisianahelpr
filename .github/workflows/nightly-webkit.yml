name: Nightly WebKit happy-path

permissions:
  contents: read

# Working-forwards change 6 (owner, 2026-09-12). The whole happy-path suite in
# real WebKit every night. The app runs in WKWebView on iPhone; every PR-time
# Playwright job is Chromium, which cannot see WebKit-only defects (the 13px
# -apple-system-body text-scale bug survived a full Chromium audit). The
# real-backend half of the change already runs nightly: e2e-real-backend.yml.

on:
  schedule:
    # Sun, Tue, Sat 09:17 UTC (prod load spread, 2026-09-14).
    - cron: "17 9 * * 0,2,6"
  workflow_dispatch:

concurrency:
  # NOT prod-load, and deliberately so (2026-09-21, issue #1626).
  #
  # This workflow does not touch prod at all: it sets PLAYWRIGHT_WEB_SERVER=1
  # and runs `--project=happy-path-webkit`, which serves THIS commit from a
  # local preview against mocked Supabase. It carries none of the prod signals
  # src/test/prodWorkflowSpacing.test.ts derives its prod-hitting set from (no
  # project ref, no E2E_SUPABASE_URL, no PLAYWRIGHT_* credential, no prod
  # Playwright project), so the guard never asked it to sit in prod-load.
  #
  # Sitting there anyway cost three days. `cancel-in-progress: false` does NOT
  # mean "queue forever": GitHub keeps exactly ONE *pending* run per group, so
  # a third run entering the group CANCELS the one already waiting. On
  # 2026-09-21T04:54Z four prod-load workflows were dispatched inside four
  # minutes and cancelled each other in a chain — e2e-journeys at 04:55:00,
  # this one at 04:55:31, a11y-webkit-prod at 04:58:29. A cancelled run has no
  # jobs at all, so the `notify` job below never ran and issue #1626 stayed
  # open on a suite whose two real failures had already been fixed.
  #
  # Per-run group: a dispatch of this workflow can never be cancelled by, and
  # can never cancel, anything else.
  group: nightly-webkit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Drop the Google Chrome apt source
        # Same reason as e2e-happy-path.yml: its bad index fails apt-get update.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - run: npx playwright install --with-deps webkit

      - name: Run happy-path in WebKit
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npx playwright test --project=happy-path-webkit

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-webkit-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Owner-requested (2026-09-12): a red nightly used to land nowhere — nobody
  # watches this Actions tab. This opens/updates ONE `nightly-red` issue per
  # workflow and closes it on the next green run. See
  # .github/actions/nightly-issue-sync for the dedup logic.
  notify:
    name: Report nightly result
    needs: [webkit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: nightly-webkit
          status: ${{ needs.webkit.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
