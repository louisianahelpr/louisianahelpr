name: Sentry Release

# Tags every production deploy with a unique Sentry release (the commit SHA)
# and uploads source maps so stack traces are symbolicated in the Sentry UI.
#
# Without this, every build reports as the same release ("1.0.0" fallback in
# src/lib/sentry.ts), which breaks crash dedup — a regression introduced in
# version N looks identical to a fixed crash from version N-1, and "first
# seen / last seen" timestamps are meaningless across deploys.
#
# Runs on push to main only — preview/PR builds skip this (no production
# users hit those bundles, so there's nothing to dedup against).
#
# Required repo secrets:
#   - SENTRY_AUTH_TOKEN — see PR description for how to mint one.
#   - SENTRY_ORG        — Sentry org slug (Settings → General → "Organization Slug").
#   - SENTRY_PROJECT    — Sentry project slug (Project → Settings → "Name" / slug).
#
# Linux runner only (ubuntu-latest) — GitHub Actions macOS minutes are
# expensive and this job has zero need for native tooling.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/sentry-release.yml"
  workflow_dispatch:

concurrency:
  # One release upload at a time per branch — re-running the same SHA is
  # idempotent (Sentry no-ops duplicate releases) but parallel runs racing
  # on `commits --auto` can produce confusing partial commit lists.
  group: sentry-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sentry-release:
    name: Tag release and upload source maps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No job-level `if` — a job-level skip causes GitHub to report the entire
    # workflow run as failure when all jobs are skipped (0 jobs ran → failure).
    # Instead the "Check Sentry secrets" step below exits early with a warning
    # and all subsequent steps are guarded by its output, so the job always
    # exits successfully whether or not secrets are wired up.

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      # Bake the commit SHA into the bundle so the runtime `release` tag
      # Sentry sees matches the release name we create below.
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      # The Supabase config MUST match what Vercel builds with, or this whole
      # workflow uploads sourcemaps for files production never serves.
      #
      # Sentry matches a map to a frame by FILENAME (`~/assets/<chunk>.js`), and
      # Vite inlines these env vars into the bundle, so their value feeds the
      # content hash of every chunk that transitively imports the Supabase
      # client. Measured 2026-09-02 at a single commit: building with vs.
      # without them yields 394 chunks either way, but only 230 filenames are
      # shared — 164 of 394 (42%) differ. Confirmed the same day that
      # production IS built with them (www.louisianahelpr.com's
      # client-BUsl5h47.js contains the project ref), so this env-less build
      # was uploading 164 maps under names no production stack frame can ever
      # reference. Those frames stayed minified while this workflow reported
      # green — the worst failure mode for crash reporting, since the tool is
      # silently blind in exactly the place you go looking for it.
      VITE_SUPABASE_URL:             ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APPLE_MAPKIT_TOKEN:       ${{ secrets.VITE_APPLE_MAPKIT_TOKEN }}

    steps:
      - name: Check Sentry secrets
        id: check-secrets
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sentry secrets not configured — skipping release tagging. Add SENTRY_AUTH_TOKEN, SENTRY_ORG, and SENTRY_PROJECT to repository Settings → Secrets and variables → Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          # Full history so `sentry-cli releases set-commits --auto` can
          # diff against the previous release and attach commit metadata.
          fetch-depth: 0

      - name: Setup Node
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build production bundle
        if: steps.check-secrets.outputs.configured == 'true'
        # VITE_SENTRY_RELEASE flows through to `import.meta.env` so the
        # client's Sentry.init() reports the same release tag we create
        # below — that's what makes crash dedup work across deploys.
        run: npm run build

      - name: Create Sentry release and upload source maps
        if: steps.check-secrets.outputs.configured == 'true'
        uses: getsentry/action-release@v3.7.0
        with:
          # Use the commit SHA as the release name so it's unique per build
          # and matches what Sentry sees from the running client at runtime.
          version: ${{ github.sha }}
          environment: production
          # `set-commits --auto` attaches the commit list since the previous
          # release — gives "suspect commits" in the Sentry issue view.
          set_commits: auto
          # Source maps live in dist/assets/ alongside their .js files
          # (vite.config.ts sets `sourcemap: "hidden"`). URL prefix matches
          # how the client requests them in production.
          sourcemaps: ./dist/assets
          url_prefix: "~/assets"
          # Finalize the release once sourcemaps are uploaded so it shows up
          # as "deployed" in the Sentry UI rather than staying in draft.
          finalize: true
