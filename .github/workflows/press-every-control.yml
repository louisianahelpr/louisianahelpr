name: Press every control

permissions:
  contents: read

# EVERY control on EVERY route, pressed, with the outcome classified — against
# PRODUCTION (owner, 2026-09-12: "no mock mode ever").
#
# The owner (2026-09-12): "there is no way every button has been clicked to be
# sure not failing." scripts/audit/press-every-control.mjs is the answer: the
# route set is derived from src/App.tsx at run time, every control on every
# route (and inside every dialog a press opens) is pressed by DOM path, and the
# classifier fails on an error toast, error-screen copy (e2e/errorScreens.ts),
# a console error, a 4xx/5xx during the press, or no observable change.
#
# It runs on the real backend as the shared test accounts (poster, helper,
# admin, incomplete-profile) with the app built from this commit and served by
# `vite preview`. Safety is in scripts/audit/pressProdSafety.mjs:
#   - a mutating press (delete / pay / send / ban / cancel / submit …) only on a
#     record the read-only select proves is test-owned; otherwise SKIPPED with
#     the documented reason "not test-owned"
#   - admin actions only against seed test targets
#   - payment presses only while Stripe is in TEST mode (cs_test_ on a real
#     Checkout Session, as e2e/prod-lifecycle.spec.ts detects it)
#   - the run creates its own fixture job and cleans up everything it made;
#     the final job here sweeps again after every shard, even on failure
#
# FAILS on: any failed press, or any control that was neither pressed nor
# skipped for a DOCUMENTED reason (DOCUMENTED_SKIPS in the script). Coverage
# must be 100%. A persona whose account could not be signed in is reported as
# UNCOVERED with a ::warning:: (the admin and incomplete accounts land when
# their secrets do), never as a silent green.
#
# Sessions: the password grant with the PLAYWRIGHT_* secrets, as
# e2e/journeys/fixtures.ts does. An account without a password secret is
# minted through scripts/test-signin-link.mjs, which needs the service-role
# key: fetched at run time through the Supabase CLI (SUPABASE_ACCESS_TOKEN),
# masked, written to .env, never echoed — the same source as
# scripts/e2e/mint-helper-login.sh.
#
# Nightly + workflow_dispatch only. Not on push: it drives the shared prod
# accounts and holds their job-level lock (prod-lifecycle-shared-accounts) with
# the money loop and the journeys, so two runs never press the same rows at once.

on:
  schedule:
    # Mon, Wed, Sat 03:17 UTC (prod load spread, 2026-09-14).
    - cron: "17 3 * * 1,3,6"
  workflow_dispatch:
    inputs:
      routes:
        description: "Comma-separated route list to narrow the run (blank = every route; a base path such as /jobs/:id selects every row derived from it)"
        required: false
        default: ""
      personas:
        description: "Comma-separated personas (anon,customer,helper,admin,incomplete)"
        required: false
        default: "anon,customer,helper,admin,incomplete"

concurrency:
  # WORKFLOW level: prod load only. A SCHEDULED run joins prod-load (spaced
  # against every other prod cron, src/test/prodWorkflowSpacing.test.ts); a
  # workflow_dispatch gets its own group (rule 4: GitHub keeps ONE pending run
  # per group, so a dispatch parked in prod-load was cancelled by the next
  # suite to queue there, e.g. run 36215841191 at 03:46Z on 2026-09-26).
  #
  # The ACCOUNT lock is the press job's job-level
  # `prod-lifecycle-shared-accounts` group below, the one every job that drives
  # the shared test accounts holds (docs/OPEN.md Q326;
  # src/test/sharedAccountJobsHoldOneLock.test.ts). Until 2026-09-26 this
  # workflow held only prod-load, so a DISPATCHED e2e-journeys run (own
  # workflow group, job holding the account lock) pressed the same accounts at
  # the same time as a press run. `cancel-in-progress: false` everywhere: a
  # cancelled prod run leaves its fixture job and test rows behind.
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('press-every-control-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  VITE_SUPABASE_PROJECT_ID: fncmgoasalhdgfwzhsqa
  VITE_SUPABASE_URL: https://fncmgoasalhdgfwzhsqa.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

jobs:
  press:
    name: Press every control (4 shards, 2 at a time, 375, prod)
    runs-on: ubuntu-latest
    # ONE job for the whole run, so it holds the account lock from the
    # snapshot to the restore (Q326) and nothing else can touch the accounts
    # between the two (Q272). The shards run in two WAVES of two
    # (scripts/audit/press-wave.sh): the Q317 load ceiling, which the old
    # matrix held with `max-parallel: 2`. Each shard stops itself at
    # TIME_BUDGET_MIN (Q128), so two waves take at most 2 x 135 min plus
    # set-up, snapshot and restore; 330 leaves ~40 min of slack and stays under
    # GitHub's 360-minute job limit.
    timeout-minutes: 330
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    env:
      BASE: http://127.0.0.1:4173
      WIDTH: "375"
      ROUTES: ${{ github.event.inputs.routes }}
      PERSONAS: ${{ github.event.inputs.personas || 'anon,customer,helper,admin,incomplete' }}
      RUN_BASE: ${{ github.run_id }}
      # The run-level "before" of every shared account (Q272/Q325). Taken once,
      # before the first shard; the only thing any restore reads.
      SNAPSHOT_IN: test-results/press-snapshot.json
      # Q128: each shard stops itself inside the wave and reports the rows it
      # did not reach, instead of being cancelled with no report.
      TIME_BUDGET_MIN: "135"
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      # The restore signs in as every persona the presses used, so the job
      # carries every persona's credentials (src/test/pressCleanupPersonas.test.ts).
      PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }} # swept persona
      PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }} # swept persona

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Drop the Google Chrome apt source
        # See e2e-happy-path.yml — dl.google.com's index breaks apt-get update.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Write .env (service-role key for session minting; never printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            # exit 1, not 0 (Q52): personas that cannot be minted go UNCOVERED,
            # and a run that did not press them is not a green run.
            echo "::error title=No SUPABASE_ACCESS_TOKEN::accounts without a PLAYWRIGHT_*_PASSWORD secret cannot be minted and would be UNCOVERED"
            exit 1
          fi
          KEY=$(supabase projects api-keys --project-ref "$VITE_SUPABASE_PROJECT_ID" -o json 2>/dev/null \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error title=service_role key not returned::the CLI listed no service_role key; magic-link minting is off, so personas would be UNCOVERED"
            exit 1
          fi
          echo "::add-mask::$KEY"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$KEY" >> .env
          echo ".env written ($(wc -l < .env) lines)"

      # Real backend, LOCAL frontend: the shared action every frontend suite
      # uses (src/test/noTestTrafficOnVercel.test.ts), same build as before.
      - name: Build and serve this commit locally (prod VITE_* env)
        uses: ./.github/actions/local-preview
        with:
          supabase-publishable-key: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Snapshot the shared accounts (run-level, before any shard)
        id: snapshot
        # Records the clean-up window's start too: everything created after
        # this moment is the run's own, whichever shard made it.
        run: |
          set -euo pipefail
          mkdir -p test-results
          echo "PRESS_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          SNAPSHOT_OUT="$SNAPSHOT_IN" node scripts/audit/press-every-control.mjs

      - name: Press every control (wave 1, shards 1 and 2)
        id: wave1
        run: bash scripts/audit/press-wave.sh 1 2

      - name: Press every control (wave 2, shards 3 and 4)
        id: wave2
        # A red wave 1 still leaves shards 3-4 unpressed; run them, but only
        # on top of a snapshot (nothing could be restored without one).
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        run: bash scripts/audit/press-wave.sh 3 4

      # Whatever a shard created and could not remove itself (a shard that
      # stopped mid-press) is swept here, on every outcome, and THIS is the one
      # restore of the run (Q272): profiles and the weekly availability grid go
      # back to the run-level snapshot (Q325). Same RLS-scoped clean-up the
      # script runs at each shard's end.
      - name: Restore the shared accounts and sweep what the presses created
        id: restore
        if: always()
        env:
          OUT: test-results/press-every-control-cleanup
        run: |
          set -euo pipefail
          if [ ! -f "$SNAPSHOT_IN" ]; then
            echo "::error title=press restore::no run-level snapshot ($SNAPSHOT_IN); nothing to restore from"
            exit 1
          fi
          # The snapshot step wrote PRESS_STARTED_AT before any shard began.
          # If it never ran there is no snapshot either, and the line above failed.
          echo "CLEANUP_SINCE=$PRESS_STARTED_AT"
          CLEANUP_SINCE="$PRESS_STARTED_AT" node scripts/audit/press-every-control.mjs

      # Each shard meters into its own directory (press-wave.sh sets
      # REQUEST_BUDGET_DIR), so each is judged against the per-run budget on its
      # own, as when every shard was a job. Not on cancel: nothing to judge.
      - name: Backend request budget (Q104), shard 1
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label press-every-control --dir request-budget/shard-1
      - name: Backend request budget (Q104), shard 2
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label press-every-control --dir request-budget/shard-2
      - name: Backend request budget (Q104), shard 3
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label press-every-control --dir request-budget/shard-3
      - name: Backend request budget (Q104), shard 4
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label press-every-control --dir request-budget/shard-4

      # The poster's own teardown CANNOT remove a fixture job it had to cancel:
      # `cancelled` is terminal in enforce_job_status_transition (never a SOURCE
      # in the allowed matrix) and the DELETE policy requires `status = 'open'`.
      # 26 such rows had accumulated by 2026-09-19, one per shard per night.
      # This is the service-role pass that can remove them, scoped to the
      # "PRESS DO NOT ACCEPT" title marker + the shared test accounts +
      # is_seed=true, with a 50-row cap (scripts/e2e/prod-audit-sweeper.mjs).
      - name: Remove the cancelled fixture jobs, then check every proof-photo reference resolves
        id: residue
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            # exit 1, not 0 (Q52): this step also runs the proof-photo reference
            # CHECK; skipping it green meant the check silently never ran.
            echo "::error title=press residue NOT swept::no SUPABASE_ACCESS_TOKEN, so no service-role key; the cancelled fixture jobs stay on prod and the proof-photo check did not run."
            exit 1
          fi
          KEY=$(supabase projects api-keys --project-ref "$VITE_SUPABASE_PROJECT_ID" -o json 2>/dev/null \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error title=press residue NOT swept::the CLI listed no service_role key; the proof-photo check did not run."
            exit 1
          fi
          echo "::add-mask::$KEY"
          # Exit 1 = a real problem (over the cap, or a delete failed): red, loudly.
          SUPABASE_URL="$VITE_SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$KEY" \
            node scripts/e2e/prod-audit-sweeper.mjs
          # CLASS CHECK for the 400 POST /object/sign/proof-photos/… stream this
          # workflow's own run 35768341847 produced: a jobs row naming an object
          # storage does not have. READ-ONLY, and it belongs here because this is
          # the workflow that surfaces it — it presses the screens that sign those
          # paths. Exit 1 = a dangling reference; the nightly-red job below files
          # it. Same $KEY, same masked shell, shredded in the next step.
          # --repair-seed-before (#1582, Q389(a)): clears the residue of the
          # teardown bug a8d75d3b3 fixed, on is_seed jobs made before that fix
          # ONLY; a real job, or a seed job made since, still fails here.
          SUPABASE_URL="$VITE_SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$KEY" \
            node scripts/proof-photo-reference-check.mjs --repair-seed-before 2026-09-25T05:42:00Z
      - name: Shred the key
        if: always()
        run: rm -f .env

      - name: Coverage summary
        if: always()
        run: |
          for n in 1 2 3 4; do
            f="test-results/press-every-control/shard-$n/coverage.md"
            if [ -f "$f" ]; then
              { echo "## Shard $n"; head -80 "$f"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload coverage reports, screenshots, snapshot and clean-up log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: press-every-control
          path: |
            test-results/press-every-control/
            test-results/press-every-control-cleanup/
            test-results/press-snapshot.json
          if-no-files-found: ignore
          retention-days: 14

  # Owner-requested (2026-09-12): a red nightly used to land nowhere — nobody
  # watches this Actions tab. This opens/updates ONE `nightly-red` issue per
  # workflow and closes it on the next green run. The press job fails when a
  # wave, the restore, the budget or the residue/proof-photo CHECK fails (Q52:
  # a red clean-up used to close the issue as long as the presses passed).
  notify:
    name: Report nightly result
    needs: [press]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: press-every-control
          status: ${{ needs.press.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
