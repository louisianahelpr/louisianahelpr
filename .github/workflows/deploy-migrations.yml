name: Deploy Migrations

permissions:
  contents: read

# Auto-deploys Supabase migrations to prod on merge to main.
#
# NOTE: db-deploy.yml is the older, more featureful sibling of this
# workflow (it lists pending/remote migrations, gates on missing secrets,
# fires a Slack alert on failure). Both share the SAME concurrency group
# (`db-deploy-prod`) so they serialize against each other — never two
# concurrent pushes racing the same schema_migrations table.
#
# This file exists as the slim canonical "deploy on merge" entry point;
# either can be retired without losing coverage.
#
# Required repo secrets:
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_PROJECT_REF
#   - SUPABASE_DB_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:

concurrency:
  # Shared with db-deploy.yml to prevent concurrent pushes against the
  # same schema_migrations table. cancel-in-progress is false so an
  # in-flight deploy is allowed to finish before the next one starts.
  group: db-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Push migrations to Supabase prod
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin
          supabase --version

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --linked --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Summary
        if: success()
        run: |
          echo "::notice::Migrations deployed to ${{ secrets.SUPABASE_PROJECT_REF }}"
