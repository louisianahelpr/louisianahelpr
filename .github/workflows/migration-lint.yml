name: Supabase Migration Lint

permissions:
  contents: read

# Static-analyzes Supabase migration SQL for common mistakes:
# - Missing RLS on new tables (= public data leak)
# - Bad CHECK constraints with non-immutable functions (= restore failures)
# - Dangerous DROP statements without IF EXISTS
#
# Runs:
# - On every PR that touches supabase/migrations/
# - Manually via workflow_dispatch

on:
  # Re-enabled on PRs 2026-05-09 after the migration-pipeline post-mortem
  # found 12 unapplied local migrations on prod (chat-push trio + RLS
  # fix among them). The lint catches the upstream class of bug — bad
  # SQL that would have failed silently on the manual deploy path. The
  # paths filter keeps the spend bounded: only fires when migrations
  # actually change.
  # Also on direct pushes to main: this repo commits straight to main (no PR
  # ceremony), so a pull_request-only trigger left this check dormant — it had
  # not run since 2026-08-20 while migrations kept shipping.
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-lint.yml"
  workflow_dispatch:

concurrency:
  group: migration-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-migrations:
    name: Lint new migration SQL
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff against main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Find changed migrations
        id: changed
        run: |
          # Get list of new/modified .sql files in this PR
          FILES=$(git diff --name-only --diff-filter=AM origin/main...HEAD -- 'supabase/migrations/*.sql' || true)
          if [ -z "$FILES" ]; then
            echo "No migration changes — skipping lint"
            echo "files=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Changed migrations:"
          echo "$FILES"
          # Multiline output
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Lint each migration
        if: steps.changed.outputs.files != ''
        run: |
          set -e
          FAIL=0
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo ""
            echo "::group::Linting $FILE"

            # Rule 1: New CREATE TABLE must enable RLS
            if grep -iE "create table" "$FILE" > /dev/null; then
              # Extract table names from CREATE TABLE statements
              TABLES=$(grep -ioE "create table (if not exists )?(public\.)?[a-z_]+" "$FILE" | sed -E 's/create table (if not exists )?(public\.)?//I' | tr -d ' ')
              for T in $TABLES; do
                if ! grep -iE "alter table (public\.)?${T} enable row level security" "$FILE" > /dev/null; then
                  echo "  ❌ Table '$T' created but RLS not enabled in same migration"
                  echo "     Add: ALTER TABLE public.$T ENABLE ROW LEVEL SECURITY;"
                  FAIL=1
                fi
              done
            fi

            # Rule 2: CHECK constraints must not use now() / current_timestamp (non-immutable)
            if grep -iE "check\s*\(.*\b(now\(\)|current_timestamp)\b" "$FILE" > /dev/null; then
              echo "  ❌ CHECK constraint uses now()/current_timestamp — must be immutable"
              echo "     Use a BEFORE INSERT/UPDATE trigger instead"
              FAIL=1
            fi

            # Rule 3: DROP TABLE/COLUMN should use IF EXISTS
            if grep -iE "^\s*drop (table|column)" "$FILE" | grep -ivE "if exists" > /dev/null; then
              echo "  ⚠️  DROP without IF EXISTS — may fail on re-run"
              # Warning only, not a fail
            fi

            # Rule 4: No modifications to reserved schemas
            if grep -iE "(alter|drop|create).*\b(auth|storage|realtime|vault|supabase_functions)\." "$FILE" > /dev/null; then
              echo "  ❌ Modifying a Supabase-reserved schema (auth/storage/realtime/vault/supabase_functions)"
              echo "     This can cause platform outages — use the public schema"
              FAIL=1
            fi

            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "❌ Migration lint failed — see errors above"
            exit 1
          fi
          echo ""
          echo "✅ All migrations passed lint checks"

      - name: Check new functions have an explicit GRANT/REVOKE
        if: steps.changed.outputs.files != ''
        run: |
          # H4 grant-guard: a new public function that ships without an
          # explicit GRANT or REVOKE relies on the default PUBLIC EXECUTE,
          # which the Supabase advisor pass keeps stripping (the
          # #355/#358/#364/#366 grant-regression saga). PR-scoped — only the
          # functions DEFINED in the changed migrations are checked, while the
          # grant/revoke set is read from the whole tree, so a CREATE OR
          # REPLACE of an already-granted function doesn't trip it. Trigger
          # and event-trigger functions are exempt.
          echo "${{ steps.changed.outputs.files }}" | xargs node scripts/check-migration-grants.mjs
