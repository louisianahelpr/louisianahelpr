name: DB Smoke

permissions:
  contents: read

# Catches the class of bug that took job posting down for ~2 days:
# trigger functions referencing columns that no longer exist, plus the
# notifications.type CHECK regression that silently 500'd state changes.
#
# Boots a Supabase-flavored Postgres in the runner (image bundles pg_cron,
# pg_net, supabase_vault, pgmq, and the auth/storage schemas), applies
# every migration in repo order, then exercises the previously-broken
# `INSERT INTO public.jobs` trigger fan-out path. If `column p.role does
# not exist` (or anything similar) ever resurfaces, this workflow fails
# the PR before merge.
#
# Cost-conscious:
# - Only runs when supabase/migrations/** changes
# - Uses ubuntu-latest (cheapest)
# - Concurrency-cancels superseded runs
# - ~3-5 min run time

on:
  # THE PUSH PATH NOW RUNS THROUGH db-deploy.yml, WHICH `needs:` THIS JOB.
  # Same change, same reason as migration-lint.yml: a `push:` trigger made
  # this smoke test run BESIDE the production deploy instead of in front of
  # it. db-deploy.yml now calls it via `workflow_call` and gates on the
  # result, so applying every migration to a throwaway Postgres happens
  # before `supabase db push` touches prod, not while it does.
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-smoke.yml"
      - "scripts/ci/replay-migrations.sh"
  workflow_dispatch:

concurrency:
  # See migration-lint.yml — `github.workflow` separates db-deploy's call
  # from a PR's own run so a deploy's gate can never be cancelled by a PR.
  group: db-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Apply migrations + post-job trigger smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Supabase's own Postgres distribution: includes pg_cron, pg_net,
        # supabase_vault, pgmq, plpgsql_check, and the standard
        # auth/storage/realtime/extensions schemas with the expected roles
        # (authenticated, anon, service_role). This eliminates the 100+
        # extension/role/publication-related errors we'd hit on stock
        # postgres:16.
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
        # Use the image's default `postgres` database — the supabase/postgres
        # image bootstraps its custom roles + schemas only on `postgres`,
        # so creating a new DB via POSTGRES_DB ends up with the postgres
        # role lacking CREATE on it.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U postgres > /dev/null 2>&1; then
              echo "✅ Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Postgres failed to become ready"
          exit 1

      - name: Bootstrap + apply all migrations in order
        # Both steps (the schema/role shims, incl. the auth.jwt() shim, and the
        # scoped soft-allow replay) live in scripts/ci/replay-migrations.sh so
        # race-runner.yml replays exactly what this deploy gate replays. The
        # full history of both — why each shim exists, why each soft-allow is
        # scoped to its expected error — moved with the code into that script.
        run: bash scripts/ci/replay-migrations.sh

      - name: Smoke — post a job, expect triggers to fire cleanly
        # The actual P0: every INSERT INTO public.jobs invokes
        # notify_helpers_on_job_post() and notify_saved_searches_on_new_job(),
        # both of which used to throw `column p.role does not exist`. This
        # test creates a fake user, then inserts a job, and FAILS LOUDLY if
        # any trigger raises. Wrapped in a transaction + ROLLBACK to leave no
        # state.
        #
        # Note: handle_new_user() trigger auto-creates the profiles row
        # when auth.users is inserted (per migration 20260505230500), so we
        # UPDATE the auto-created row to set approval_status='approved'
        # instead of INSERTing a duplicate.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO auth.users (id, email) VALUES (gen_random_uuid(), 'smoke@helpr.test');
          UPDATE public.profiles
            SET full_name = 'Smoke Tester', approval_status = 'approved'
            WHERE user_id = (SELECT id FROM auth.users WHERE email='smoke@helpr.test');
          INSERT INTO public.jobs (
            title, description, category, budget, location, parish, status,
            customer_id, date_needed
          )
          SELECT
            '[CI smoke] post-job trigger check',
            'Auto-generated by db-smoke.yml — never persists.',
            'cleaning', 50, 'Test Address', 'Orleans', 'open',
            (SELECT id FROM auth.users WHERE email='smoke@helpr.test'),
            CURRENT_DATE + INTERVAL '7 days'
          ;
          ROLLBACK;
          SELECT '✅ post-job triggers ran cleanly — no column-does-not-exist errors';
          SQL

      - name: Smoke — notifications.type CHECK accepts every emitted type
        # The 2026-05-04 hidden P0: a trigger inserted notifications.type='work_status'
        # but the CHECK constraint only knew 7 types. Every accepted→in_progress
        # transition silently 500'd. This test inserts every type the codebase
        # actually emits and fails if any are rejected.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            t text;
            types text[] := ARRAY[
              'info', 'success', 'warning', 'job_update', 'application',
              'review', 'payment',
              'job_match', 'job_updates', 'work_status', 'transit_updates',
              'system_alert', 'new_offers', 'expired', 'financial_alerts',
              'verified'
            ];
            tester_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users (id, email)
              VALUES (tester_id, 'notif-smoke@helpr.test');

            FOREACH t IN ARRAY types LOOP
              BEGIN
                INSERT INTO public.notifications (user_id, type, title, message)
                VALUES (tester_id, t, 'smoke', 'smoke test row');
              EXCEPTION WHEN check_violation THEN
                RAISE EXCEPTION 'notifications.type=% rejected by CHECK constraint — keep notifications_type_check in sync with code', t;
              END;
            END LOOP;

            DELETE FROM public.notifications WHERE user_id = tester_id;
            DELETE FROM auth.users WHERE id = tester_id;
            RAISE NOTICE '✅ All % notification types accepted', array_length(types, 1);
          END $$;
          SQL

      - name: Sanity-check the previously-broken role functions
        # Belt-and-suspenders: directly invoke each function that contained a
        # `p.role` reference. They should all return without error after the
        # fix migration applied.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.get_top_helpers_by_parish(NULL, 1);
          SELECT * FROM public.get_helper_tiers(1);
          SELECT * FROM public.get_parish_activity(1);
          SELECT * FROM public.get_safe_profiles(ARRAY[]::uuid[]);
          SELECT '✅ all previously-broken role functions return without error';
          SQL

      - name: Smoke — RLS blocks a non-admin from admin_audit_log and platform_settings
        # Regression lock for the 2026-08-25 admin audit, which verified this
        # by hand against the live DB (has_role() + these two policies) but
        # left nothing automated to catch a future policy edit that loosens
        # them. admin_audit_log holds who-did-what-to-whom for every
        # privileged action; platform_settings holds internal config (webhook
        # URLs, fee knobs) restricted to admins since 20260419032529. Both are
        # gated purely by RLS `has_role(auth.uid(), 'admin')` — there is no
        # app-layer check backing them up — so this runs as the `authenticated`
        # Postgres role with a real non-admin JWT claim, exactly as PostgREST
        # would for a signed-in stranger's request, and fails if either table
        # returns a row.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          -- Setup runs as the postgres superuser (RLS-exempt), so it can seed
          -- a real row in each table — "nobody can see anything because the
          -- table is empty" must not be able to pass this test.
          DO $$
          DECLARE
            non_admin_id uuid := gen_random_uuid();
            admin_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users (id, email) VALUES (non_admin_id, 'rls-nonadmin-smoke@helpr.test');
            INSERT INTO auth.users (id, email) VALUES (admin_id, 'rls-admin-smoke@helpr.test');
            -- prevent_admin_role_self_grant() only allows service_role; SET LOCAL
            -- scopes the role to this transaction so subsequent cleanup sees postgres.
            EXECUTE 'SET LOCAL ROLE service_role';
            INSERT INTO public.user_roles (user_id, role) VALUES (admin_id, 'admin');
            EXECUTE 'RESET ROLE';
            INSERT INTO public.admin_audit_log (admin_id, action, target_id, target_type, details)
              VALUES (admin_id, 'rls_smoke_test', non_admin_id, 'user', '{}'::jsonb);
            IF NOT EXISTS (SELECT 1 FROM public.platform_settings LIMIT 1) THEN
              INSERT INTO public.platform_settings DEFAULT VALUES;
            END IF;
          END $$;

          -- Act as the non-admin, exactly as PostgREST does for their request:
          -- the `authenticated` Postgres role, with a JWT claim naming them.
          -- set_config runs first (still postgres/superuser) because the
          -- `authenticated` role lacks SELECT on auth.users; set_config with
          -- is_local=true is transaction-scoped so the claim survives the
          -- subsequent role switch.
          SELECT set_config(
            'request.jwt.claims',
            (SELECT json_build_object('sub', id, 'role', 'authenticated')::text
               FROM auth.users WHERE email = 'rls-nonadmin-smoke@helpr.test'),
            true
          );
          SET LOCAL ROLE authenticated;

          DO $$
          DECLARE
            leaked_count int;
          BEGIN
            SELECT count(*) INTO leaked_count FROM public.admin_audit_log;
            IF leaked_count > 0 THEN
              RAISE EXCEPTION 'RLS REGRESSION: a non-admin read % row(s) from admin_audit_log', leaked_count;
            END IF;

            SELECT count(*) INTO leaked_count FROM public.platform_settings;
            IF leaked_count > 0 THEN
              RAISE EXCEPTION 'RLS REGRESSION: a non-admin read % row(s) from platform_settings', leaked_count;
            END IF;
          END $$;

          -- Back to postgres to clean up — the non-admin role has no DELETE
          -- policy on either table (correctly), so cleanup must run as owner.
          RESET ROLE;
          DELETE FROM public.admin_audit_log WHERE action = 'rls_smoke_test';
          DELETE FROM public.user_roles WHERE user_id IN (SELECT id FROM auth.users WHERE email LIKE 'rls-%-smoke@helpr.test');
          DELETE FROM auth.users WHERE email LIKE 'rls-%-smoke@helpr.test';

          COMMIT;
          SELECT '✅ non-admin cannot read admin_audit_log or platform_settings';
          SQL

      - name: Static guard — no p.role = 'helper'-style hardcoded role strings
        # Belt-and-suspenders #2: even if the DB tests pass, fail the PR if
        # anyone reintroduces a string-literal role comparison in code that
        # ships at runtime. The fix is always: has_role(uid, 'role'::app_role).
        #
        # Scoped to .ts/.tsx only. Migration history (.sql files) is
        # immutable record — old migrations with the legacy pattern were
        # superseded by 20260504142454_fix_role_checks_via_user_roles.sql;
        # the actual DB state is verified by the post-job smoke test above.
        run: |
          set -e
          PAT="(profiles?|p)\\.role\\s*=\\s*'(helper|customer|admin|client|provider)'"
          MATCHES=$(grep -rEn -i \
            --include='*.ts' --include='*.tsx' \
            "$PAT" \
            src/ supabase/functions/ 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Hardcoded role-string comparison found — use has_role(uid, 'role'::app_role) instead"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No hardcoded role-string comparisons found in runtime code"
