name: Prod audit (messy input, deep links, interruptions)

# The two PROD suites in e2e/prod-audit/, against THIS COMMIT served locally and
# the REAL backend as the seeded test accounts (owner, 2026-09-12: "no mock mode ever"):
#
#   messy-input.spec.ts   every form: the whole value battery on every field,
#                         the targeted format/price/DOB rules, and the
#                         dialog-gated forms explored from real seeded records
#                         behind a write firewall. Ends on a coverage test that
#                         fails when a form in docs/audit/form-inventory.md has
#                         neither a sweep, an explore credit nor a stated gap.
#   deep-links.spec.ts    the URLs people tap from a push, a text or an email,
#                         signed in and out, including a job that is gone.
#   interruptions.spec.ts double-tap, offline mid-submit, a slow network, back
#                         and refresh mid-flow, and session expiry.
#
# Real backend, LOCAL frontend (2026-09-14): the job builds this commit and
# serves it with `vite preview` (.github/actions/local-preview). The explore half
# re-loads between presses on ~45 routes; on the deployed site that was tens of
# thousands of Vercel edge requests a run. Serial, one worker, and in the SAME concurrency
# group as the journeys and prod-lifecycle so nothing else drives these accounts
# at the same time.
#
# SESSIONS. poster and helper come from the password-grant secrets. The
# incomplete-profile and admin seed accounts have no password anywhere, so
# scripts/test-signin-link.mjs mints them from the service-role key, which this
# workflow reads at run time with the Supabase CLI (SUPABASE_ACCESS_TOKEN) and
# writes straight into a gitignored .env. The key is never echoed, never a step
# output and never an artifact: it is masked with ::add-mask:: the moment it
# exists, and .env is removed in the final step.

permissions:
  contents: read

on:
  schedule:
    # Sun, Thu 01:17 UTC; worst case 307 min, so Sun 07:17 vacuity and Thu
    # 07:17 edge-function-smoke start after it. Q318 (2026-09-23): moved so no prod-load run is due while another's worst case (timeout x waves) still holds the group; src/test/prodWorkflowSpacing.test.ts rule 5.
    - cron: "17 1 * * 0,4"
  workflow_dispatch:
    inputs:
      grep:
        description: "Only tests whose title matches this (Playwright -g)"
        type: string
        default: ""
      vacuity_only:
        description: "Instead of the suites: prove these guard files able to fail (npm run vacuity -- --only), with this job's service-role key (Q89)"
        type: string
        default: ""

# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  # PROD LOAD (2026-09-14): prod-hitting crons are spread across 03:00-13:00 UTC,
  # >= 2h apart, and share the prod-load concurrency group; see
  # src/test/prodWorkflowSpacing.test.ts before moving this.
  #
  # A SCHEDULED run joins prod-load; a workflow_dispatch gets its OWN group
  # (2026-09-21, issues #1595/#1626). `cancel-in-progress: false` does NOT mean
  # "queue forever" — GitHub keeps exactly ONE *pending* run per group, so a
  # third run entering it CANCELS the one already waiting. On 2026-09-21T04:54Z
  # four prod-load workflows dispatched inside four minutes cancelled each
  # other in a chain, and a workflow-level cancellation leaves a run with NO
  # jobs, so nothing reports it. See e2e-real-backend.yml, which has made this
  # split since the money loop lost a dispatch the same way.
  group: ${{ format('prod-audit-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  preflight:
    needs: prod-load-turn
    name: What can run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      have_accounts: ${{ steps.check.outputs.have_accounts }}
    steps:
      - id: check
        env:
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$POSTER_EMAIL" ] && [ -n "$POSTER_PASSWORD" ] && [ -n "$HELPER_EMAIL" ] && [ -n "$HELPER_PASSWORD" ] && [ -n "$ACCESS_TOKEN" ]; then
            echo "have_accounts=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_accounts=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Prod audit NOT run::PLAYWRIGHT_POSTER/HELPER_EMAIL+_PASSWORD and SUPABASE_ACCESS_TOKEN are required."
            echo "- **Prod audit: NOT COVERED** — shared-account secrets or SUPABASE_ACCESS_TOKEN are missing." >> "$GITHUB_STEP_SUMMARY"
          fi

  wait-accounts:
    # Q743: the job-level lock below is NOT a queue. GitHub keeps ONE pending job
    # per concurrency group and CANCELS it when a third arrives (press 36297157445,
    # e2e-journeys 36215839785 / 36215921402 / 36217255758). This lock-free job
    # waits its turn first and joins the group only when that bumps nobody
    # (scripts/e2e/wait-shared-accounts.mjs; src/test/sharedAccountLockQueues.test.ts).
    name: Wait for the shared accounts (queue)
    needs: preflight
    if: needs.preflight.outputs.have_accounts == 'true'
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs; a single holder takes at most 60 (sharedAccountLockJobsAreShort.test.ts; prod-audit was the 180-minute one until Q889).
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until joining the shared-accounts lock bumps no waiting job
        run: node scripts/e2e/wait-shared-accounts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  prod-audit:
    name: "Prod audit (leg 1 of 4: messy input, part 1)"
    # Q889 (2026-10-07): ONE locked job used to run the whole project (122 test-
    # minutes on run 37521973791; messy-input alone 58) under a 180-minute
    # timeout, three times the hour any holder of the shared accounts may take
    # (src/test/sharedAccountLockJobsAreShort.test.ts). It now runs as FOUR
    # sequential legs, each its own waiter + lock job at 55 minutes (55, not
    # the 60 cap: four legs plus the budget job keep the run's worst case,
    # 232 min, inside the 240 before open-done-when, prodWorkflowSpacing rule 5):
    #   1  messy-input part 1 (sweep, targeted, post-job, even explores)
    #   2  messy-input part 2 (odd explores + the coverage check, fed leg 1's
    #      credit files through an artifact)
    #   3  every other prod-audit spec, list A (~29 test-minutes)
    #   4  list B (~22) + the Web Vitals lab (~13)
    # Every prod-audit spec is named in exactly one leg
    # (src/test/prodAuditLegs.test.ts); a new spec named in none is also
    # caught by e2eSpecsReachableInCi.test.ts.
    needs: [preflight, wait-accounts]
    if: needs.preflight.outputs.have_accounts == 'true'
    runs-on: ubuntu-latest
    # Workflow-level group is prod-load now; this job-level lock keeps the
    # shared-account serialisation with e2e-real-backend's push-triggered
    # prod-lifecycle job, which holds the same group.
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    timeout-minutes: 55 # prod-audit leg 1 (Q889)
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      REQUEST_BUDGET_DIR: request-budget/leg-1
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      # WebKit too: notification-panel-jump.spec.ts (Q51) measures the panel
      # edge in both engines, as the original fix was measured.
      - run: bash scripts/ci/playwright-install.sh chromium webkit
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

      # The incomplete-profile and admin seed accounts exist only as seeded
      # rows: no password is stored for them anywhere, so a session can only be
      # minted with the service-role key. Read it here, mask it before it can
      # reach a log, and hand it to scripts/test-signin-link.mjs the way a local
      # run gets it — through .env, which is gitignored and deleted below.
      - name: Provide the service-role key to the seeded-account minter
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF || 'fncmgoasalhdgfwzhsqa' }}
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
        run: |
          set -euo pipefail
          KEY=$(npx --yes supabase@2 projects api-keys --project-ref "$PROJECT_REF" --reveal -o json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).find(x=>x.name==="service_role");if(!k){process.exit(3)}process.stdout.write(k.api_key)})')
          # Mask first, write second: after this line the value cannot appear in
          # a log even if a later command echoes it.
          echo "::add-mask::$KEY"
          umask 077
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$KEY"
          } > .env
          test -s .env

      # Specs read seeded fixtures (saved Helprs, pets, credentials...). Other
      # workflows mutate the same accounts (the 03-account journey unsaves the
      # seeded Helpr), so a drifted fixture showed up here as a selector
      # timeout on an empty tab (2026-09-24: favorite_helpers 0 of 2). Repair
      # them first; --apply is idempotent and writes only seed-owned rows.
      # The passwords re-sync the accounts CI signs in as (owner, 2026-10-01):
      # a re-created account otherwise keeps a password no secret matches (#1582).
      - name: Repair seed fixtures before the audit
        env:
          SEED_PASSWORD_INCOMPLETE: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }}
          SEED_PASSWORD_ADMIN: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
        run: node scripts/audit/prod-seed.mjs --apply || { sleep 10; node scripts/audit/prod-seed.mjs --apply; }

      # The playwright line stays literal: src/test/e2eSpecsReachableInCi reads
      # these workflows as text, and a ${{ }} expression on this line is parsed
      # as positional file filters that match nothing — the specs would then
      # report as run by no CI job. The optional -g goes through an env var and
      # a shell branch instead.
      - name: Run the prod audit suites (leg 1 of 4)
        timeout-minutes: 42 # prod-audit leg 1 suites (lockedLongStepsKeepEvidence: steps sum <= cap - 3)
        if: ${{ inputs.vacuity_only == '' }}
        env:
          GREP: ${{ inputs.grep }}
          MESSY_INPUT_LEG: "1"
        run: |
          set -euo pipefail
          if [ -n "$GREP" ]; then
            npx playwright test --project=prod-audit --workers=1 --reporter=list,./e2e/reporters/skipReporter.ts --pass-with-no-tests -g "$GREP" e2e/prod-audit/messy-input.spec.ts
          else
            npx playwright test --project=prod-audit --workers=1 --reporter=list,./e2e/reporters/skipReporter.ts e2e/prod-audit/messy-input.spec.ts
          fi
      - name: Hand leg 2 this leg's messy-input credit files (Q889)
        if: ${{ !cancelled() && inputs.vacuity_only == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: messy-input-credits-leg-1
          path: test-results/messy-input-prod/credits/
          retention-days: 1
          if-no-files-found: warn

      # Q89 (owner pop-up 2026-09-23): five guards (a11y-prod, trailing-icon-
      # fields, activity-tabs-visible, admin-views, messy-input) mint seeded
      # sessions with the service-role key, which vacuity.yml deliberately does
      # not hold. They are proven HERE, where the key already is, rather than
      # giving another workflow the admin key.
      - name: Prove service-role guards able to fail (Q89)
        if: ${{ inputs.vacuity_only != '' }}
        env:
          # Through env, never interpolated into the script (injection-safe).
          ONLY: ${{ inputs.vacuity_only }}
        run: |
          set -euo pipefail
          bash scripts/ci/playwright-install.sh webkit
          npm run vacuity -- --only "${ONLY}"
      - name: Keep failure screenshots, samples and traces (leg 1)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prod-audit-leg-1
          # .env lives at the repo root, not under these paths, and is deleted
          # in the next step regardless.
          path: |
            test-results/
            playwright-report/
            request-budget/
          retention-days: 14
          if-no-files-found: warn
      # Last check before the key is removed (it reads SUPABASE_SERVICE_ROLE_KEY
      # from .env). The suites above sign in as the shared test accounts and can
      # leave user_strikes / user_violations behind; one more harness-made
      # violation suspends the account every prod workflow uses (2026-09-13).
      # always(): a red suite is exactly when a strike is most likely.
      # Exit 1 = a strike on a shared account; exit 2 = could not check. BOTH
      # fail the job (Q52, 2026-09-23): "could not read prod" used to be a
      # ::warning:: and the job stayed green having checked nothing. Failing this
      # step does not mask the suite result — that step's outcome is its own.
      - name: Shared test accounts carry no strikes
        if: always()
        run: |
          set +e
          node scripts/check-test-account-strikes.mjs
          code=$?
          set -e
          case "$code" in
            0) ;;
            1) echo "::error title=Strike on a shared test account::A harness left a strike/violation on a shared test account. Delete the test-owned rows and fix that harness's cleanup."; exit 1 ;;
            2) echo "::error title=Test-account strike check did not run::scripts/check-test-account-strikes.mjs could not read prod (missing key or REST error); see the log above. Not checked is not clean."; exit 2 ;;
            *) echo "::error::check-test-account-strikes.mjs exited $code"; exit "$code" ;;
          esac

      # Also last-before-key-removed: interruptions.spec.ts's "post a job"
      # double-tap test mints a real Stripe checkout session, which permanently
      # blocks the poster's own DELETE policy (20260903055308 requires
      # stripe_session_id IS NULL) — the test's own teardown can only cancel it,
      # not remove it (see the comment in that spec). scripts/e2e/prod-lifecycle-
      # sweeper.mjs does not cover this: it matches a different suite's marker
      # and deliberately runs as the poster, which is exactly the account this
      # residue defeats. scripts/e2e/prod-audit-sweeper.mjs is the service-role
      # equivalent for this suite's marker, needing the key this step still has.
      # always(): a run that fails partway through is exactly when a leftover
      # is most likely. Exit 1 = a real problem (cap exceeded or a delete
      # failed); exit 2 = could not run (missing key or a REST error reading
      # prod). Both fail the job (Q52) — a sweep that never ran is not clean.
      - name: Remove leftover prod-audit jobs this run could not clean up itself
        if: always()
        run: |
          set +e
          node scripts/e2e/prod-audit-sweeper.mjs
          code=$?
          set -e
          case "$code" in
            0) ;;
            1) echo "::error title=prod-audit leftover cleanup failed::scripts/e2e/prod-audit-sweeper.mjs found a real problem (more than its 50-match cap, or a delete failed) — see the log above."; exit 1 ;;
            2) echo "::error title=prod-audit leftover cleanup did not run::scripts/e2e/prod-audit-sweeper.mjs could not read prod (missing key or REST error); see the log above."; exit 2 ;;
            *) echo "::error::prod-audit-sweeper.mjs exited $code"; exit "$code" ;;
          esac

      - name: Remove the service-role key from the runner
        if: always()
        run: rm -f .env

  wait-accounts-2:
    # Q743: the job-level lock below is NOT a queue. GitHub keeps ONE pending job
    # per concurrency group and CANCELS it when a third arrives (press 36297157445,
    # e2e-journeys 36215839785 / 36215921402 / 36217255758). This lock-free job
    # waits its turn first and joins the group only when that bumps nobody
    # (scripts/e2e/wait-shared-accounts.mjs; src/test/sharedAccountLockQueues.test.ts).
    name: Wait for the shared accounts (queue, leg 2 of 4)
    # Q889: waits for leg 1 to let go, then queues like any holder; runs
    # whatever leg 1's result, unless the run was cancelled.
    needs: [preflight, prod-audit]
    if: ${{ !cancelled() && needs.preflight.outputs.have_accounts == 'true' && inputs.vacuity_only == '' }}
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs; a single holder takes at most 60 (sharedAccountLockJobsAreShort.test.ts; prod-audit was the 180-minute one until Q889).
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until joining the shared-accounts lock bumps no waiting job
        run: node scripts/e2e/wait-shared-accounts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  prod-audit-2:
    name: "Prod audit (leg 2 of 4: messy input, part 2)"
    needs: [preflight, wait-accounts-2]
    if: ${{ !cancelled() && needs.wait-accounts-2.result == 'success' && inputs.vacuity_only == '' }}
    runs-on: ubuntu-latest
    # Workflow-level group is prod-load now; this job-level lock keeps the
    # shared-account serialisation with e2e-real-backend's push-triggered
    # prod-lifecycle job, which holds the same group.
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    timeout-minutes: 55 # prod-audit leg 2 (Q889)
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      REQUEST_BUDGET_DIR: request-budget/leg-2
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      # WebKit too: notification-panel-jump.spec.ts (Q51) measures the panel
      # edge in both engines, as the original fix was measured.
      - run: bash scripts/ci/playwright-install.sh chromium webkit
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

      # The incomplete-profile and admin seed accounts exist only as seeded
      # rows: no password is stored for them anywhere, so a session can only be
      # minted with the service-role key. Read it here, mask it before it can
      # reach a log, and hand it to scripts/test-signin-link.mjs the way a local
      # run gets it — through .env, which is gitignored and deleted below.
      - name: Provide the service-role key to the seeded-account minter
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF || 'fncmgoasalhdgfwzhsqa' }}
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
        run: |
          set -euo pipefail
          KEY=$(npx --yes supabase@2 projects api-keys --project-ref "$PROJECT_REF" --reveal -o json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).find(x=>x.name==="service_role");if(!k){process.exit(3)}process.stdout.write(k.api_key)})')
          # Mask first, write second: after this line the value cannot appear in
          # a log even if a later command echoes it.
          echo "::add-mask::$KEY"
          umask 077
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$KEY"
          } > .env
          test -s .env

      # Specs read seeded fixtures (saved Helprs, pets, credentials...). Other
      # workflows mutate the same accounts (the 03-account journey unsaves the
      # seeded Helpr), so a drifted fixture showed up here as a selector
      # timeout on an empty tab (2026-09-24: favorite_helpers 0 of 2). Repair
      # them first; --apply is idempotent and writes only seed-owned rows.
      # The passwords re-sync the accounts CI signs in as (owner, 2026-10-01):
      # a re-created account otherwise keeps a password no secret matches (#1582).
      - name: Repair seed fixtures before the audit
        env:
