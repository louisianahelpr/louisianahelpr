name: CodeQL Security Scan

permissions:
  contents: read

# GitHub's free static analysis for JavaScript/TypeScript.
# Catches XSS, injection vulnerabilities, hardcoded secrets, and other
# security issues that could put user data at risk OR get flagged by
# App Store reviewers.
#
# Runs:
# - On every PR to main
# - Weekly on Wednesdays (catches newly-disclosed query patterns)
# - Manually via workflow_dispatch

on:
  # DISABLED automatic triggers — CodeQL security scanning is valuable but
  # rarely surfaces issues in a small project, and was burning Actions
  # minutes. Dependabot already covers most dependency CVEs. Run manually
  # from the Actions tab before major releases.
  #
  # To re-enable automatic runs, uncomment the pull_request / schedule blocks.
  #
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "supabase/functions/**"
  #     - "package.json"
  #     - "package-lock.json"
  # schedule:
  #   - cron: "0 7 * * 3" # Wednesday 07:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    # Skip Dependabot PRs — CodeQL on dep bumps rarely surfaces real issues.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          # security-and-quality is more thorough than security-extended;
          # tune down to "security-extended" if it gets noisy.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        continue-on-error: true # Code Scanning requires GitHub Advanced Security on private repos
        with:
          category: "/language:javascript-typescript"
          upload: failure-only
