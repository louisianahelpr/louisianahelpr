name: Lighthouse CI

# Runs Lighthouse against the published site to catch performance regressions
# before they ship. Fails the run if mobile performance drops below threshold.
#
# Runs:
# - On every PR to main (catches regressions before merge)
# - Weekly on Sundays (tracks long-term trends)
# - Manually via workflow_dispatch

on:
  # DISABLED automatic triggers — performance audits are nice-to-have, not
  # critical, and were burning Actions minutes on every PR. Run manually
  # from the Actions tab when you want to spot-check mobile performance.
  #
  # To re-enable automatic runs, uncomment the pull_request / schedule blocks.
  #
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "index.html"
  #     - "vite.config.ts"
  #     - "package.json"
  # schedule:
  #   - cron: "0 6 * * 0" # Sunday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Mobile performance audit
    # Skip Dependabot PRs — perf changes from dep bumps are evaluated separately.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Audit published site (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://louisianahelpr.lovable.app
          # Mobile emulation by default. Soft-fail on perf so flaky LH runs
          # don't block PRs, but reports are uploaded for review.
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
