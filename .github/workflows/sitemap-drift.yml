name: Sitemap drift

permissions:
  contents: read

# `public/sitemap.xml` was hand-maintained, and nothing regenerated it from the
# route table — so it drifted in both directions. It advertised `/subscription`
# after that route was deleted (crawlers got the 404 page; the real screen is
# `/profile?tab=subscription`), and TODO.md F-SEO-01 tracked public pages that
# were never added.
#
# `src/lib/sitemap.test.ts` (in the Vitest gate) already asserts the invariants
# from the sitemap's side: absolute https URLs, no duplicates, no redirect-only
# paths, and every listed path still registered in App.tsx. It cannot catch the
# other direction — a NEW public route that nobody added. This job does: it
# derives the list from `src/App.tsx` and fails when the file on disk does not
# advertise exactly the app's public routes.
#
# public/sitemap.xml is a GENERATED file (scripts/check-generated-current.mjs
# "sitemap"): since 2026-10-05 a branch never commits it (owner: branches only
# change real things; scripts/check-branch-generated.mjs refuses it), and
# staleness-watch.yml regenerates it on main after the merge and lands it as
# bot/refresh/inventories. So a PR that adds or removes a public route leaves
# the committed copy stale BY DESIGN, and `--check` against it would be red on
# every such PR. This job now proves the generator itself still runs and
# renders the route table (--stdout, nothing written); the guards in
# src/lib/sitemap.test.ts and the route tests read that generated output, not
# the committed file. Main's currency: staleness-watch.yml (check:generated).
#
# Costs seconds: no npm install, no build — the script uses only Node builtins.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/App.tsx"
      - "public/sitemap.xml"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/sitemap-drift.yml"
  push:
    branches: [main]
    paths:
      - "src/App.tsx"
      - "public/sitemap.xml"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/sitemap-drift.yml"
  workflow_dispatch:

concurrency:
  group: sitemap-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: sitemap.xml matches the route table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # A top-level `paths:` filter is fine here (unlike ui-sweep.yml /
      # a11y-axe.yml): this is a cheap advisory check, not a required status
      # check, so a run that never happens cannot leave a PR stuck on
      # "Expected". If it is ever promoted to required, convert it to the
      # in-job dorny/paths-filter pattern those workflows use.
      - name: The sitemap generator renders the route table
        run: |
          set -euo pipefail
          XML=$(node scripts/generate-sitemap.mjs --stdout)
          N=$(grep -c "<loc>" <<<"$XML" || true)
          echo "generated sitemap: $N URL(s)"
          [ "$N" -gt 3 ] || { echo "::error::generate-sitemap.mjs rendered $N URLs; the route parser has rotted"; exit 1; }
