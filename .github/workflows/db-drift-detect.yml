name: Supabase DB Drift Detector

# Nightly check for migration drift between the repo and prod.
# If a local migration file isn't reflected in prod's schema_migrations
# (or vice versa), opens/updates a GitHub issue with the diff AND FAILS THE
# RUN, so it can't sit silently for weeks like the May-09 backlog did.
#
# Three distinct outcomes, three distinct exit codes — keep them distinct:
#   green   prod and repo agree.
#   red     drift found (final step) OR the check itself is broken (the two
#           `exit 1`s in "Compute drift"). Both are red, and both print an
#           ::error:: that says which one it is.
# There is deliberately no fourth "found drift but passed" state; that WAS
# this file's behaviour for 18 straight nightly runs. See the final step.
#
# Runs nightly at 13:17 UTC (08:17 CDT), well after the daily digest cron
# (5am UTC) so it sees a representative state.
#
# REQUIRED REPO SECRETS (same as db-deploy.yml):
# - SUPABASE_ACCESS_TOKEN
# - SUPABASE_DB_PASSWORD
# - SUPABASE_PROJECT_REF

on:
  schedule:
    # Daily 13:17 UTC. Was 05:17, inside the worst case of the 03:17 suites
    # (press 320 min, prod-audit 307, e2e-journeys 187): it queued behind them
    # and was cancelled when db-backup queued too.
    # Q318 (2026-09-23): moved so no prod-load run is due while another's worst case (timeout x waves) still holds the group; src/test/prodWorkflowSpacing.test.ts rule 5.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read  # Q117: receipts' run ids are looked up

concurrency:
  # PROD LOAD (2026-09-14): prod-hitting crons are spread across 03:00-13:00 UTC,
  # >= 2h apart, and share the prod-load concurrency group; see
  # src/test/prodWorkflowSpacing.test.ts before moving this.
  #
  # A SCHEDULED run joins prod-load; a workflow_dispatch gets its OWN group
  # (2026-09-21, issues #1595/#1626). `cancel-in-progress: false` does NOT mean
  # "queue forever" — GitHub keeps exactly ONE *pending* run per group, so a
  # third run entering it CANCELS the one already waiting. On 2026-09-21T04:54Z
  # four prod-load workflows dispatched inside four minutes cancelled each
  # other in a chain, and a workflow-level cancellation leaves a run with NO
  # jobs, so nothing reports it. See e2e-real-backend.yml, which has made this
  # split since the money loop lost a dispatch the same way.
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('db-drift-detect-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  detect:
    name: Diff local vs prod migration history
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # REQUIRED SECRETS ARE A HARD GATE. Changed 2026-08-31.
      #
      # WHAT THIS CATCHES: the drift detector silently ceasing to detect.
      #
      # This step used to emit ::warning:: and set skip=true, with every later
      # step guarded by `if: skip != 'true'`. A skipped nightly run and a
      # clean nightly run are the same colour — so a rotated or expired
      # SUPABASE_ACCESS_TOKEN would turn this into a permanently-green cron
      # that checks nothing, while CLAUDE.md's "zero migration drift is the
      # standing requirement" keeps pointing at it as the proof. An alarm that
      # reports OK when it is not wired up is worse than no alarm — this file
      # already learned that lesson once with the backtick-parse bug below.
      #
      # Secrets are read through `env:` rather than interpolated into the
      # script body so no secret value can be parsed as shell.
      - name: Require Supabase secrets
        id: precheck
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${SUPABASE_DB_PASSWORD:-}" ]  && MISSING="$MISSING SUPABASE_DB_PASSWORD"
          [ -z "${SUPABASE_PROJECT_REF:-}" ]  && MISSING="$MISSING SUPABASE_PROJECT_REF"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s):$MISSING"
            echo "::error::The drift check CANNOT read prod's migration ledger without these. It is failing rather than skipping, because a skipped drift check reports as a clean drift check — and a green run here is read as proof that prod matches the repo."
            echo "::error::Add them in Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "✓ All required secrets are present."

      - name: Install Supabase CLI
        if: steps.precheck.outputs.skip != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"


      - name: types.ts matches the live schema
        # GD-002. Every other mirrored artifact here has a guard — sitemap
        # (--check), iOS metadata, iOS icons, the migration ledger, the
        # legalVersions parity test, the Stripe shim via typecheck-edge.
        # types.ts, the one file gating type safety for all of src/, had none.
        #
        # This job cannot be the guard by itself: it compares migration VERSION
        # LISTS, so a migration present on both sides reports clean while the
        # generated types drift arbitrarily. That is exactly the SI-012 shape —
        # the migration shipped, the regeneration did not, and when it finally
        # ran it landed 25 type errors across 17 files. It recurred within hours
        # of being fixed (20260902051631 -> legal_acceptances.user_id,
        # reports.reporter_id), which is why this is a gate and not a note.
        #
        # Compares the column -> nullability MAP, never the file text: the
        # committed file carries a graphql_public block and CLI-version
        # parenthesisation worth ~40 lines of spurious diff (GD-005), and a gate
        # that cries wolf on formatting is a gate someone disables.
        #
        # continue-on-error, and the run is failed for it at the very end
        # instead. This step sits BEFORE "Compute drift", so failing here
        # aborted the job and the migration diff never ran — the thing this
        # workflow exists to do. types.ts went stale on 2026-09-03 and the
        # next SIX nightly runs were red for that and only that: no migration
        # comparison, no drift issue, no way to tell from the red square that
        # the actual check had not executed. The file's own header warns
        # against a "found drift but passed" state; this was the mirror of it,
        # a "never looked but failed" state, and it reads identically from
        # outside. Both conditions still turn the run red.
        id: types_fresh
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-types-fresh.mjs

      # A view in an exposed schema that runs as its owner (security_invoker
      # off) and is client-writable bypasses the base table's RLS on write.
      # public.open_jobs_browse was exactly that (anon could DELETE any job);
      # its write grants were revoked once in 2026-07 and silently restored by a
      # later DROP+CREATE, because prod's default privileges re-grant ALL on
      # every postgres-owned relation in public. So this reads the LIVE catalog
      # rather than trusting the migration to have stuck. Same
      # continue-on-error + fail-at-the-end shape as types_fresh.
      - name: No exposed-schema view is client-writable
        id: updatable_views
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-updatable-views.mjs

      # enforce_dispute_markers_server_owned (20260915033734) trusts every
      # statement not running as anon/authenticated — i.e. every SECURITY
      # DEFINER RPC, which runs as its owner postgres. That is only sound while
      # no client-callable definer function writes jobs from a caller-supplied
      # column list or JSON patch. The migrations are checked in vitest
      # (jobsStateColumnGuard.test.ts); this reads LIVE pg_proc, which can hold
      # a function no migration defines (a dashboard edit, an MCP apply, a
      # failed replay). Same continue-on-error + fail-at-the-end shape.
      - name: No client-callable definer function writes jobs from caller input
        id: jobs_dynamic_writers
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-jobs-dynamic-writers.mjs

      # Default privileges that hand clients new relations in public
      # (20260915101101), and functions that trust a bare NULL auth.uid() as the
      # service role (20260915101102) — the two classes behind the 2026-09-15
      # open_jobs_browse anon-write incident. LIVE, because a dashboard edit or
      # an MCP apply can bring either back without a migration.
      - name: No client default privileges and no NULL-uid trust
        id: live_privileges
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-live-privileges.mjs

      # OA-018 (docs/OPEN.md Q424): an existing email account signing in with
      # Apple/Google. Performs GoTrue's own row writes for the four linking
      # cases on PROD inside one transaction that always rolls back, and checks
      # no second profile / no lost signup data / no 500 on an email-less user,
      # plus the auth config linking rests on (mailer_autoconfirm off, both
      # providers on). LIVE, because a trigger added by a dashboard edit or an
      # MCP apply would change it without a migration. Same shape as above.
      - name: Identity linking keeps one account and its data
        id: identity_linking
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-identity-linking.mjs

      # The TABLE half of the excess-anon-grant class (updatable_views is the
      # view half). anon held UPDATE/INSERT/DELETE on public.jobs (H-004) and
      # SELECT on admin/money/trust tables (AUTHZ-02) — RLS the only gate. Prod's
      # default privileges re-grant these on every CREATE TABLE, so the LIVE
      # catalog is the one that counts, not the migration landing. Same
      # continue-on-error + fail-at-the-end shape.
      - name: No exposed-schema table carries an excess anon grant
        id: anon_table_grants
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-anon-table-grants.mjs

      # Q281: a banned account is refused on every client write path (tables,
      # RPCs, storage) or carries a reasoned exemption, and every profile ban is
      # mirrored into auth.users.banned_until so the session cannot refresh.
      # The data half (auth-sync:drift) can only be seen live. Same
      # continue-on-error + fail-at-the-end shape.
      - name: A banned account is refused on every client write path
        id: ban_gate_coverage
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-ban-gate-coverage.mjs

      # The migration ledger above compares VERSIONS, and the repo's parity
      # tests read the newest migration FILE; neither sees the body prod runs.
      # 2026-09-15: prod's report_helper_no_show was 20260914215112's body
      # (older timestamp, applied after 20260915044137), so a poster could
      # strike a Helpr who had arrived while every check was green. This
      # replays every CREATE/DROP FUNCTION in version order and compares each
      # newest body with live pg_proc.prosrc (comments, whitespace and in-place
      # notification-link rewrites ignored; pg_get_functiondef + regexp_replace
      # rewrite tuples REPLAYED, scripts/lib/functionRewrites.mjs, issue #1802).
      # Accepted drift lives in
      # scripts/audit/function-body-drift.baseline.json, pinned to prod's exact
      # body. Same continue-on-error + fail-at-the-end shape.
      - name: Prod runs the newest migration's body for every function
        id: function_body_drift
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/audit/function-body-drift.mjs

      # A constraint left NOT VALID (a migration's VALIDATE fell back to a
      # WARNING) fails the next UPDATE of the violating row with an opaque
      # check_violation. Nothing read pg_constraint.convalidated until
      # 2026-09-23 (Q38). Same continue-on-error + fail-at-the-end shape.
      - name: Every public constraint is validated
        id: unvalidated_constraints
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-unvalidated-constraints.mjs

      # Q117. Versions compare equal no matter WHO applied them. This proves
      # each prod migration newer than the cutoff was applied by a db-deploy.yml
      # run on main (its receipt in public.migration_deploy_ledger). Same
      # continue-on-error + fail-at-the-end shape.
      - name: Every prod migration was applied by db-deploy
        id: migration_provenance
        continue-on-error: true
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-migration-provenance.mjs check

      - name: Compute drift
        id: drift
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -eo pipefail

          # Local — extract the 14-char timestamp prefix from each
          # migration file. Strips the slug + .sql.
          ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -n1 basename \
            | sed -E 's/^([0-9]{14}).*/\1/' \
            | grep -E '^[0-9]{14}$' \
            | sort -u > /tmp/local.txt || touch /tmp/local.txt

          # Remote — `migration list --linked` outputs a table with the
          # remote (prod) version column. Parse the version IDs.
          # This USED to be `... 2>/dev/null | awk ... || touch /tmp/remote.txt`,
          # which made "could not reach prod" and "prod has zero migrations"
          # produce the identical empty file. Every failure therefore rendered
          # as "100% of local migrations are unapplied" and opened a red issue
          # claiming total drift — it fired nightly while prod was in fact
          # perfectly in sync (399/399 verified against the live ledger on
          # 2026-08-14). An alarm that cannot tell "broken" from "on fire" is
          # worse than no alarm.
          LOCAL_COUNT=$(wc -l < /tmp/local.txt | tr -d ' ')
          if ! supabase migration list --linked > /tmp/remote-raw.txt 2>/tmp/remote-err.txt; then
            echo "::error::supabase migration list --linked FAILED - cannot compute drift."
            sed 's/^/  /' /tmp/remote-err.txt || true
            exit 1
          fi

          # Parse the REMOTE column, splitting on the table's "|" separators.
          #
          # Two bugs lived here. The CLI renders versions wrapped in backticks:
          #
          #     Local            | Remote           | Time (UTC)
          #     `20260311000404` | `20260311000404` | `2026-03-11 00:04:04`
          #
          # (1) The old awk matched $1 against /^[0-9]{14}$/, but with backticks
          #     the field is `20260311000404`, which never matches — so it
          #     parsed ZERO remote versions and every local migration looked
          #     unapplied. That is the 399-drift false alarm.
          # (2) $1 is the LOCAL column. Even with the backticks stripped it was
          #     comparing local against local, which is always identical — so a
          #     "working" version of this check could never report drift at all.
          #     It was broken in both directions at once.
          #
          # Field 2 is Remote. An empty Remote cell means the migration is in
          # the repo but NOT applied to prod, which is exactly the drift we want
          # to catch — it simply fails the 14-digit test and is left out of
          # remote.txt, so `comm` reports it.
          awk -F'|' 'NR>2 { gsub(/[` \t]/, "", $2); if ($2 ~ /^[0-9]{14}$/) print $2 }' \
            /tmp/remote-raw.txt | sort -u > /tmp/remote.txt

          REMOTE_COUNT=$(wc -l < /tmp/remote.txt | tr -d ' ')

          # Sanity gate. A live prod that serves the running app always has a
          # populated ledger, so "zero remote versions parsed" means the read
          # or the PARSE broke - most likely the CLI (pinned to `latest`, so it
          # updates underneath us) changed its table format and the awk stopped
          # matching. Either way that is a broken check, not drift.
          if [ "$REMOTE_COUNT" -eq 0 ] && [ "$LOCAL_COUNT" -gt 0 ]; then
            echo "::error::Parsed 0 remote migrations but $LOCAL_COUNT exist locally."
            echo "::error::This is a broken drift check, NOT drift. Raw CLI output:"
            head -20 /tmp/remote-raw.txt | sed 's/^/  /'
            exit 1
          fi

          # Drift sets
          comm -23 /tmp/local.txt /tmp/remote.txt > /tmp/missing-from-prod.txt
          comm -13 /tmp/local.txt /tmp/remote.txt > /tmp/missing-from-repo.txt

          MISSING_PROD_COUNT=$(wc -l < /tmp/missing-from-prod.txt | tr -d ' ')
          MISSING_REPO_COUNT=$(wc -l < /tmp/missing-from-repo.txt | tr -d ' ')

          echo "missing_prod=$MISSING_PROD_COUNT" >> $GITHUB_OUTPUT
          echo "missing_repo=$MISSING_REPO_COUNT" >> $GITHUB_OUTPUT

          {
            echo "## Migration drift report — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "**$MISSING_PROD_COUNT** migration(s) in repo but NOT applied to prod:"
            echo ""
            if [ -s /tmp/missing-from-prod.txt ]; then
              while read -r ts; do
                FILE=$(ls supabase/migrations/${ts}*.sql 2>/dev/null | head -1)
                echo "- \`$ts\` — \`$(basename "$FILE" 2>/dev/null || echo unknown)\`"
              done < /tmp/missing-from-prod.txt
            else
              echo "_(none)_"
            fi
            echo ""
            echo "**$MISSING_REPO_COUNT** migration(s) in prod but NOT in repo:"
            echo ""
            if [ -s /tmp/missing-from-repo.txt ]; then
              while read -r ts; do
                echo "- \`$ts\` — applied directly via Studio? Backfill the SQL into the repo."
              done < /tmp/missing-from-repo.txt
            else
              echo "_(none)_"
            fi
            echo ""
            echo "---"
            echo ""
            echo "**Action items:**"
            echo "- If a repo file is missing from prod and is intentional, push it via the \`db-deploy.yml\` workflow (or merge any new commit touching \`supabase/migrations/\` to retrigger)."
            echo "- If prod has a migration not in the repo, recover the SQL via Studio → SQL Editor history and commit it so future fresh-DB rebuilds match prod."
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > /tmp/issue-body.md

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/issue-body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Open / update drift issue
        if: |
          steps.precheck.outputs.skip != 'true' &&
          (steps.drift.outputs.missing_prod != '0' || steps.drift.outputs.missing_repo != '0')
        uses: actions/github-script@v9
        with:
          script: |
            const body = ${{ toJSON(steps.drift.outputs.body) }};
            const title = `🔴 Migration drift: ${{ steps.drift.outputs.missing_prod }} unapplied / ${{ steps.drift.outputs.missing_repo }} unrecorded`;

            // Find existing open drift issue (label "migration-drift") to update
            // instead of spamming a new one each night.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "migration-drift",
              per_page: 5,
            });

            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                title,
                body,
              });
              console.log(`Updated existing drift issue #${existing[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["migration-drift"],
              });
              console.log(`Opened drift issue #${created.number}`);
            }

      - name: Close drift issue when clean
        if: |
          steps.precheck.outputs.skip != 'true' &&
          steps.drift.outputs.missing_prod == '0' &&
          steps.drift.outputs.missing_repo == '0'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "migration-drift",
              per_page: 5,
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Drift cleared as of ${new Date().toISOString()}. Auto-closing — will reopen if drift returns.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
              console.log(`Closed drift issue #${issue.number}`);
            }

      # ─────────────────────────────────────────────────────────────────────
      # THE EXIT CODE. Added 2026-08-31.
      #
      # WHAT THIS CATCHES: this workflow finding drift and reporting SUCCESS.
      #
      # Until this step existed, the only two `exit 1`s in the whole file were
      # for a BROKEN check (the CLI read failed, or 0 remote versions parsed)
      # — never for drift actually being found. `missing_prod` / `missing_repo`
      # went to $GITHUB_OUTPUT and were consumed by exactly one thing: the
      # issue-opening step above. An issue is a notification, not a gate: it
      # does not colour the run, does not appear on any commit status, and is
      # trivially missed. 18 consecutive nightly runs reported green, and a
      # green run is indistinguishable from "prod matches the repo" — which is
      # the precise claim CLAUDE.md's "zero migration drift is the standing
      # requirement" depends on this workflow to prove.
      #
      # Placed LAST on purpose: both the open-issue and close-issue steps run
      # to completion before this fails the run, so the issue still gets filed
      # with the full diff. `if: always()` is deliberately NOT used — the two
      # `exit 1`s in "Compute drift" mean a BROKEN check, which must stay
      # distinguishable from FOUND drift; a broken check has already failed
      # the job and this step is correctly skipped.
      - name: Fail the run when drift was found
        if: steps.precheck.outputs.skip != 'true'
        env:
          MISSING_PROD: ${{ steps.drift.outputs.missing_prod }}
          MISSING_REPO: ${{ steps.drift.outputs.missing_repo }}
          TYPES_FRESH: ${{ steps.types_fresh.outcome }}
          UPDATABLE_VIEWS: ${{ steps.updatable_views.outcome }}
          JOBS_DYNAMIC_WRITERS: ${{ steps.jobs_dynamic_writers.outcome }}
          LIVE_PRIVILEGES: ${{ steps.live_privileges.outcome }}
          IDENTITY_LINKING: ${{ steps.identity_linking.outcome }}
          ANON_TABLE_GRANTS: ${{ steps.anon_table_grants.outcome }}
          BAN_GATE_COVERAGE: ${{ steps.ban_gate_coverage.outcome }}
          FUNCTION_BODY_DRIFT: ${{ steps.function_body_drift.outcome }}
          UNVALIDATED_CONSTRAINTS: ${{ steps.unvalidated_constraints.outcome }}
          MIGRATION_PROVENANCE: ${{ steps.migration_provenance.outcome }}
        run: |
          set -euo pipefail
          if [ "${TYPES_FRESH:-success}" = "failure" ]; then
            echo "::error::src/integrations/supabase/types.ts is stale against the live schema — see the 'types.ts matches the live schema' step above for the exact list."
            echo "::error::FIX: npm run db:types, then fix the type errors it surfaces. Do not silence it with a cast."
            failed=1
          fi
          if [ "${UPDATABLE_VIEWS:-success}" = "failure" ]; then
            echo "::error::An exposed-schema view is client-writable (a write door on its base table; an owner-run one bypasses RLS). See 'No exposed-schema view is client-writable' above."
            echo "::error::FIX: REVOKE ALL ON <view> FROM PUBLIC, anon, authenticated; then GRANT SELECT back. Note a DROP+CREATE re-opens it via default privileges."
            failed=1
          fi
          if [ "${JOBS_DYNAMIC_WRITERS:-success}" = "failure" ]; then
            echo "::error::A client-callable SECURITY DEFINER function writes public.jobs from caller-supplied columns or a JSON patch (or the live read failed) — see 'No client-callable definer function writes jobs from caller input' above. It bypasses enforce_dispute_markers_server_owned's role trust."
            failed=1
          fi
          if [ "${LIVE_PRIVILEGES:-success}" = "failure" ]; then
            echo "::error::Prod's default privileges grant clients new relations in public, or a function trusts a bare NULL auth.uid() as the service role (or the live read failed) — see 'No client default privileges and no NULL-uid trust' above."
            failed=1
          fi
          if [ "${IDENTITY_LINKING:-success}" = "failure" ]; then
            echo "::error::Signing an existing email account in with Apple/Google would duplicate the account, lose its data or 500 — or the auth config it rests on drifted, or the live run failed. See 'Identity linking keeps one account and its data' above (OA-018)."
            failed=1
          fi
          if [ "${ANON_TABLE_GRANTS:-success}" = "failure" ]; then
            echo "::error::An exposed-schema table carries an excess anon grant — an anon write no policy backs, or an anon SELECT on a sensitive table. See 'No exposed-schema table carries an excess anon grant' above."
            echo "::error::FIX: in the migration that owns the table, REVOKE ALL ON <table> FROM anon, PUBLIC (or REVOKE SELECT for a read-only offender), keeping authenticated's explicit grants. A CREATE TABLE re-opens it via default privileges."
            failed=1
          fi
          if [ "${BAN_GATE_COVERAGE:-success}" = "failure" ]; then
            echo "::error::A client write path lets a banned account through, an exemption is stale, or a profile ban and auth.users.banned_until disagree (or the live read failed). See 'A banned account is refused on every client write path' above."
            echo "::error::FIX: gate it (BEFORE trigger EXECUTE FUNCTION public.enforce_ban_gate(), or is_caller_banned() in the RPC body) or exempt it with a reason in scripts/ci/ban-gate-coverage.sql."
            failed=1
          fi
          if [ "${UNVALIDATED_CONSTRAINTS:-success}" = "failure" ]; then
            echo "::error::A public constraint is NOT VALID (a row violates it; its next UPDATE will fail) — or the live read failed. See 'Every public constraint is validated' above."
            failed=1
          fi
          if [ "${MIGRATION_PROVENANCE:-success}" = "failure" ]; then
            echo "::error::A prod migration was applied outside db-deploy.yml (no receipt in public.migration_deploy_ledger), a receipt is forged, or the read failed. See 'Every prod migration was applied by db-deploy' above."
            failed=1
          fi
          if [ "${FUNCTION_BODY_DRIFT:-success}" = "failure" ]; then
            echo "::error::Prod runs a function body that is not the newest migration's (an out-of-order apply, a later overwrite, a hand edit, or a missing/extra function) — or the live read failed. See 'Prod runs the newest migration's body for every function' above."
            echo "::error::FIX: restate the newest body in a new migration (npm run migration:new), or, for a decided exception, pin prod's body in scripts/audit/function-body-drift.baseline.json with a reason."
            failed=1
          fi
          if [ "${MISSING_PROD:-0}" != "0" ] || [ "${MISSING_REPO:-0}" != "0" ]; then
            echo "::error::Migration drift detected — ${MISSING_PROD} migration(s) in the repo are NOT applied to prod, ${MISSING_REPO} in prod are NOT in the repo."
            echo "::error::See the migration-drift issue this run just opened/updated for the exact version list."
            echo "::error::Repo-not-in-prod: re-run db-deploy.yml. Prod-not-in-repo: recover the SQL from Studio history and commit it."
            failed=1
          fi
          if [ "${failed:-0}" = "1" ]; then
            exit 1
          fi
          echo "✅ Zero drift — every local migration version is present in prod's ledger and vice versa, and types.ts matches it."

  # A RED RUN HAS TO LAND SOMEWHERE. Added 2026-09-23 after db-drift-detect — along
  # with 13 other scheduled workflows — was found failing with nobody told.
  # The drift detector had been red for THREE CONSECUTIVE DAYS (09-20, 09-21,
  # 09-22) and the nightly DB backup had not succeeded since 09-21; both are
  # invisible unless somebody opens the Actions tab, which is exactly the
  # thing the owner said nobody does.
  #
  # `nightly-issue-sync` opens/updates ONE `nightly-red` issue for this
  # workflow and closes it on the next green run, which is what makes the
  # "Nightly reds nobody read" gate able to see it at all.
  #
  # SCHEDULE AND MANUAL RUNS ONLY. A push/PR failure is already visible on the
  # commit and the PR; filing an issue for it would make the label noisy and
  # teach people to ignore it.
  notify:
    name: Report nightly result
    needs: [detect]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: db-drift-detect
          status: ${{ needs.detect.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
