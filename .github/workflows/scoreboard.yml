name: Scoreboard

# docs/SCOREBOARD.md + the "Everything open" block of docs/OPEN.md, re-measured
# (docs/OPEN.md Q58/Q59; owner 2026-09-23: "always keep a current ledger to
# show numbers ... what's passing / failing").
#
# scripts/scoreboard.mjs --write reads every workflow's last result on main,
# the test/spec counts from the suites' logs, the ops alert ledger and DB
# health (read-only SQL through the Management API), the open nightly-red
# issues and the remote branches, and measures each Q66 target (scripts/slo.mjs:
# uptime from uptime.yml runs, API 5xx rate from edge_logs, payment success,
# notification delivery and time to payout from prod tables). A row it cannot
# measure says UNKNOWN.
#
# LANDING (Q57): the `land` job rebuilds the two files on LATEST main with
# `scoreboard.mjs --live-from` (only the measured LIVE sections are carried;
# OPEN.md itself is main's, since lanes edit it all day) and lands them through
# .github/actions/refresh-pr: one bot branch, one PR, auto-merge on green.
# The job summary and artifact stay (the morning page reads the artifact).
#
# Daily at 19:17 UTC: the prod-load spacing rule (src/test/
# prodWorkflowSpacing.test.ts) wants >= 90 min from every other daily
# prod-hitting cron and 30 min from prod-errors' :47. The committed copy's age
# is enforced by scripts/check-staleness.mjs (72h), nightly.

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('scoreboard-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  measure:
    name: Re-measure the scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the remote-branch row runs git cherry against every branch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Measure every signal (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/scoreboard.mjs --write
      - name: Publish as the job summary
        if: always()
        run: |
          if [ -f docs/SCOREBOARD.md ]; then cat docs/SCOREBOARD.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the regenerated files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoreboard
          # test-results/slo/: the dated SLO record (Q66, scripts/slo.mjs).
          path: |
            docs/SCOREBOARD.md
            docs/OPEN.md
            test-results/slo/
          retention-days: 90

  land:
    name: Land the re-measured scoreboard (Q57 refresh PR)
    needs: [measure]
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY write grant in this workflow (Q57): push the bot branch, open or
    # update its PR, and dispatch its checks (a github.token PR triggers none).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: scoreboard
          path: ${{ runner.temp }}/measured
      - uses: ./.github/actions/refresh-pr
        with:
          id: scoreboard
          title: "chore(refresh): scoreboard + Everything-open block re-measured"
          paths: |
            docs/SCOREBOARD.md
            docs/OPEN.md
          measured-dir: ${{ runner.temp }}/measured
          regenerate: node scripts/scoreboard.mjs --live-from "$MEASURED"
          github-token: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          check-workflows: ${{ vars.REFRESH_PR_CHECK_WORKFLOWS }}

  notify:
    name: Report result
    needs: [measure, land]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: scoreboard
          status: ${{ (needs.measure.result == 'success' && needs.land.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
