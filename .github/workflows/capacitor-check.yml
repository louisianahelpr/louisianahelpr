name: Capacitor Sync Check

# Verifies the Capacitor native config is valid and the web build can be
# synced into the iOS shell. Catches misconfigured plugins, missing
# Info.plist entries, and broken capacitor.config.ts BEFORE Fastlane
# wastes 30 minutes spinning up an Xcode build.

on:
  # DISABLED automatic triggers — macOS runners cost 10x Linux and burned
  # $8 in one day. This check is only useful immediately before an App Store
  # submission, which happens rarely. Run it manually from the Actions tab
  # when you're about to ship a native build.
  #
  # To re-enable automatic runs, uncomment the pull_request / push blocks below.
  #
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "capacitor.config.ts"
  #     - "ios/**"
  #     - "package.json"
  #     - "package-lock.json"
  #     - "vite.config.ts"
  #     - ".github/workflows/capacitor-check.yml"
  # push:
  #   branches: [main]
  #   paths:
  #     - "capacitor.config.ts"
  #     - "ios/**"
  workflow_dispatch:

# macOS runners cost 10x ubuntu minutes — cancel superseded runs aggressively.
concurrency:
  group: cap-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cap-sync:
    name: Validate Capacitor + iOS sync
    # Skip Dependabot PRs — Capacitor sync on dep bumps is verified manually before native release.
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Verify Capacitor config parses
        run: npx cap doctor

      - name: Generate iOS native project
        # The ios/App/ Xcode project is gitignored (generated locally on the
        # developer's Mac per ios/README.md). In CI we create it fresh so
        # `cap sync` has a Podfile to install into.
        #
        # The repo's ios/ folder only contains config stubs (App.entitlements,
        # PrivacyInfo.xcprivacy, README). Capacitor refuses to run `cap add ios`
        # if ios/ exists at all, so we move those stubs aside, generate the
        # native project, then restore the stubs into ios/App/App/.
        run: |
          if [ ! -d ios/App ]; then
            echo "ios/App/ missing — preserving repo stubs and generating native project..."
            mkdir -p /tmp/ios-stubs
            # Preserve any non-generated files Capacitor would clobber
            [ -f ios/App.entitlements ] && mv ios/App.entitlements /tmp/ios-stubs/
            [ -f ios/PrivacyInfo.xcprivacy ] && mv ios/PrivacyInfo.xcprivacy /tmp/ios-stubs/
            [ -f ios/README.md ] && mv ios/README.md /tmp/ios-stubs/
            rm -rf ios
            npx cap add ios
            # Restore the privacy manifest into the generated native project
            if [ -f /tmp/ios-stubs/PrivacyInfo.xcprivacy ]; then
              cp /tmp/ios-stubs/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
              cp /tmp/ios-stubs/PrivacyInfo.xcprivacy ios/PrivacyInfo.xcprivacy
            fi
            [ -f /tmp/ios-stubs/App.entitlements ] && cp /tmp/ios-stubs/App.entitlements ios/App.entitlements || true
            [ -f /tmp/ios-stubs/README.md ] && cp /tmp/ios-stubs/README.md ios/README.md || true
          fi

      - name: Sync to iOS (dry-run validation)
        # `cap sync ios` copies the web build + updates native plugins.
        # Failures here mean the iOS build will fail downstream in Fastlane.
        run: npx cap sync ios

      - name: Validate PrivacyInfo.xcprivacy exists
        run: |
          if [ ! -f ios/PrivacyInfo.xcprivacy ]; then
            echo "❌ PrivacyInfo.xcprivacy missing — App Store will reject"
            exit 1
          fi
          echo "✅ Privacy manifest present"
