name: Partly-done items ready to tick

# WHY THIS EXISTS (2026-09-27)
# ----------------------------------------------------------------------------
# Eight `[~]` items in docs/OPEN.md (Q399, Q348, Q298, Q423, Q342, Q343, Q398,
# Q452) each said "tick [x] after db-deploy once `SELECT ...` returns X". All
# eight were already true on prod and stayed `[~]` until someone happened to
# re-run the checks by hand (commit daa403bf7). Nothing re-checked them.
#
# A `[~]` item now carries `done-when:` markers (syntax: top of docs/OPEN.md),
# and scripts/open-done-when.mjs runs them. This workflow runs it on schedule,
# TICKS every READY item (2026-10-12, job `tick` below) and keeps ONE
# `nightly-red: open-done-when` issue open only while a marker cannot be read
# or the run crashed; the issue body lists which.
#
# SQL markers run read-only through the Management API (read_only:true, the
# same transport prod-errors.yml uses for the ops alert ledger); only a single
# SELECT/WITH statement is accepted. The guard that keeps markerless `[~]`
# items from growing is src/test/openPartlyDoneItemsSayDoneWhen.test.ts.

on:
  workflow_dispatch:
  schedule:
    # Twice a week, not nightly: Sun and Thu 05:17 UTC were the only two free
    # :17 slots in the prod-load week on 2026-09-27 (Q322 list in
    # src/test/prodWorkflowSpacing.test.ts). Since 2026-10-12 (Q1721) Tue and
    # Fri 07:17, after e2e-journeys' 05:17 run (worst case cut to 119 min), so
    # the weekly vacuity sweep can start at Sun 05:17 and end before
    # db-drift-detect's Sunday 13:17 fire. Dispatch any time to re-check.
    - cron: "17 7 * * 2,5"

permissions:
  contents: read

# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  # Scheduled runs share prod-load; a dispatch gets its own group
  # (src/test/prodWorkflowSpacing.test.ts rule 4).
  group: ${{ format('open-done-when-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  # Owner, 2026-10-12: "make it an automated ticking mechanism". This job used
  # to only REPORT the READY items (58 sat untouched behind nightly-red #2615,
  # because open-auto-tick.yml skips `test` markers). It now TICKS them, test
  # markers included, and lands the ticks through the same refresh-PR contract
  # open-auto-tick.yml uses (bot branch + PR + auto-merge through the required
  # checks; never a push to main). A READY item is no longer a red: the run is
  # red only when a marker cannot be read or parsed, or something crashed.
  # --status-file lets the PR land the items that DID hold before the next
  # step fails the run on the ones that could not be read (fail closed: a
  # missing status file is a crash, and is red too).
  tick:
    needs: prod-load-turn
    name: Tick every [~] item whose done-when markers all hold (tests included)
    runs-on: ubuntu-latest
    # The test markers run in one vitest call (~60 files) before the refresh.
    timeout-minutes: 60
    # The ONLY write grant in this workflow (Q57 refresh-PR contract).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - uses: ./.github/actions/refresh-pr
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: open-done-when
          title: "chore(open): tick the items whose done-when markers all hold (nightly, tests included)"
          paths: |
            docs/OPEN.md
            docs/archive
            docs/SCOREBOARD.md
            docs/GUARD-BURNDOWN.md
            docs/audit
          # Same chain as open-auto-tick.yml (feeds snapshot first, #2301), but
          # WITHOUT --no-test.
          regenerate: node scripts/open-sync-trackers.mjs && node scripts/open-done-when.mjs --tick --out "$RUNNER_TEMP/done-when.md" --status-file "$RUNNER_TEMP/done-when.status" && npm run -s inventories:refresh
          body: "Each ticked line carries what its done-when markers read (sql on prod, issues, PRs, and the named test files passing on main). Nothing is ticked on a skipped or failed marker."
          github-token: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          check-workflows: ${{ vars.REFRESH_PR_CHECK_WORKFLOWS }}

      - name: Red only on markers that could not be read (or a crash)
        id: result
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/done-when.md"
          STATUS_FILE="$RUNNER_TEMP/done-when.status"
          {
            echo "report<<DONE_WHEN_EOF"
            if [ -f "$REPORT" ]; then cat "$REPORT"; else echo "open-done-when.mjs wrote no report (it crashed or never ran)"; fi
            echo ""
            echo "DONE_WHEN_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ ! -f "$STATUS_FILE" ]; then
            echo "::error::open-done-when.mjs wrote no status file: it crashed or never ran, so nothing can be said about the markers"
            exit 1
          fi
          STATUS=$(cat "$STATUS_FILE")
          if [ "$STATUS" != "0" ]; then
            echo "::error::a done-when marker could not be read or parsed (listed in the report); the items that held were still ticked"
            exit 1
          fi
          echo "every done-when marker read; READY items ticked through the refresh PR"

  notify:
    name: Report nightly result
    needs: [tick]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: open-done-when
          status: ${{ needs.tick.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          body-extra: ${{ needs.tick.outputs.report }}
