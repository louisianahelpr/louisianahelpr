<?xml version="1.0" encoding="UTF-8"?>
<!--
  Helpr — Alternate iOS App Icon (notification-thumbnail friendly).

  Why an alternate: the primary icon (public/app-icon-1024.png) is the
  ornate Garden District ironwork "H" with a detailed fleur-de-lis
  embossed in the crossbar. Beautiful at 60pt App Springboard, but at
  the 20pt (36-40px) notification-thumbnail size every fine ironwork
  curl smudges into the next one and the badge becomes a dark blob.

  This alt is the same identity, simplified for legibility:
    · Solid Bark-green plate (#4F5A3D, derived from the brand olivewood)
    · Bold cream geometric H (no serif ironwork) carved on top
    · Single Burnt-Sienna fleur-de-lis in the crossbar negative space
    · One light keystone star above the crossbar — the only fine element
      that survives at 36px because it sits on solid Bark, not in the
      busy center

  Apple will auto-mask this to a rounded square at runtime. The 1024×
  1024 source is a flat raster (no alpha, no rounded corners) so it
  passes App Store icon validation when rasterized through sharp.

  Brand color sources (exactly matching src/components/ConnectedHIcon
  and src/index.css):
    Bark / olivewood plate:  hsl(70 20% 33%)  ~= #54583E
    Cream / parchment H:     hsl(40 24% 92%)  ~= #F0EBDF
    Burnt Sienna fleur:      hsl(19 75% 35%)  ~= #9C481D
    Sienna keystone star:    hsl(19 75% 45%)  ~= #C75D2A (slightly
                              brighter so it survives downscaling)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Solid plate background (no rounded corners — Apple auto-masks) -->
  <rect width="1024" height="1024" fill="#54583E"/>

  <!-- Subtle inner rim light (a single 1px highlight at the top edge),
       mimics the same depth treatment used elsewhere in the app's
       liquid-glass surfaces. Disappears gracefully at small sizes. -->
  <rect x="0" y="0" width="1024" height="6" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Bold geometric H — cream parchment.
       Stroke geometry chosen so the H reads at 36px (the iOS notification
       thumb size). Each vertical column is 140px wide on the 1024 canvas,
       which scales to ~5px at 36px — comfortably above the 3px legibility
       floor. Crossbar height = 84px, scales to ~3px at 36px — readable
       as a single horizontal connector, not a seam. -->
  <g fill="#F0EBDF">
    <!-- Left vertical column -->
    <rect x="240" y="240" width="140" height="544"/>
    <!-- Right vertical column -->
    <rect x="644" y="240" width="140" height="544"/>
    <!-- Crossbar — connects the two columns horizontally at center -->
    <rect x="240" y="470" width="544" height="84"/>
  </g>

  <!-- Single Burnt-Sienna fleur-de-lis in the crossbar.
       Hand-traced silhouette (not a font glyph) — three lobes + the
       classic banded waist + stem. Sized to fit the crossbar opening
       (width 84px) plus a small overflow above and below the crossbar
       so the silhouette breaks the H's straight horizontal and
       reads as "Louisiana mark inside the H" rather than "smudge". -->
  <g fill="#9C481D">
    <!-- Center lobe (vertical petal) — a blunt teardrop -->
    <path d="
      M 512 396
      C 472 396 462 432 462 458
      L 462 540
      C 462 566 472 590 512 590
      C 552 590 562 566 562 540
      L 562 458
      C 562 432 552 396 512 396 Z
    "/>
    <!-- Left petal — curls outward and back -->
    <path d="
      M 462 478
      C 422 470 380 482 372 510
      C 382 530 410 542 442 538
      C 458 532 462 510 462 494 Z
    "/>
    <!-- Right petal — mirror of left -->
    <path d="
      M 562 478
      C 602 470 644 482 652 510
      C 642 530 614 542 582 538
      C 566 532 562 510 562 494 Z
    "/>
    <!-- Banded waist — the classic horizontal tie across the fleur,
         sits exactly on the crossbar's vertical centerline so it
         visually anchors the fleur to the H bar. -->
    <rect x="430" y="510" width="164" height="20" rx="2"/>
    <!-- Stem foot — small triangular base under the waist -->
    <path d="M 488 590 L 536 590 L 512 622 Z"/>
  </g>

  <!-- Tiny keystone star above the crossbar — civic ornament.
       Single 4-point diamond, ~40px tall. At 36px notification size
       this drops to ~1.4px and disappears, which is fine — it's a
       second-read flourish for the larger icon contexts. -->
  <path d="
    M 512 320
    L 528 360
    L 568 376
    L 528 392
    L 512 432
    L 496 392
    L 456 376
    L 496 360 Z
  " fill="#C75D2A" fill-opacity="0.80"/>
</svg>
