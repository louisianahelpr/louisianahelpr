# App Store Connect in-app purchase management.
#
# WHY A WORKFLOW AND NOT A LOCAL SCRIPT. The .p8 signing key exists only as a
# repository secret. GitHub secrets are write-only — they cannot be read back —
# so this work is not possible from a laptop without the owner exporting the key
# again, which is a worse idea than running it where the key already lives.
#
# `probe` is read-only and safe to run at any time. `create` writes real product
# catalogue entries to App Store Connect, so it is manual-dispatch only, never
# on push, and defaults to probe.
name: ASC in-app purchases

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (read-only), create (writes products), screenshots (uploads the review image)"
        type: choice
        options: [probe, create, screenshots, inspect, fix-availability, fix-review-issues]
        default: probe
        required: true
      apply:
        description: "fix-review-issues only: actually write (unchecked = dry run)"
        type: boolean
        default: false

# Least privilege (CodeQL actions/missing-workflow-permissions): the job only
# checks out the repo and calls App Store Connect with its own secrets.
permissions:
  contents: read

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT || secrets.ASC_KEY_BASE64 }}
          ASC_BUNDLE_ID: com.Helpr
          # fix-review-issues is a DRY RUN unless this is set to 1 — it edits a
          # live App Store listing, so seeing the diff first is the default.
          ASC_APPLY: ${{ inputs.apply && '1' || '0' }}
        run: node scripts/asc/${{ inputs.mode }}.mjs
