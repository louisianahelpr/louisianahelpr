name: Vitest

# Dedicated Vitest workflow whose `Vitest unit tests` job name is the
# distinct status-check ID used in main's branch-protection required-checks
# list. It runs `npx vitest run` on a Linux runner (ubuntu-latest, 1x
# billing) to close the gap noted in memory `vitest-not-in-ci`:
# unit tests were never executing in CI, so a green pipeline did NOT mean
# tests passed.
#
# The combined `test.yml` workflow already runs lint + typecheck + build +
# vitest in a single job, but it's a single status check that covers four
# concerns — splitting Vitest out into its own workflow gives it a
# dedicated, branch-protection-addressable check whose failure points
# cleanly at unit-test regressions instead of being lumped into the more
# general "Lint, type-check, build, test" line item.
#
# Linux runner choice is deliberate — memory `github-actions-macos-billing`
# documents how `macos-15` minutes burned ~$16/mo from a single rogue
# scheduled job. Vitest runs identically on Linux for our pure-JS test
# suite, so there is no reason to spend the 10x multiplier.

permissions:
  contents: read

env:
  # JavaScript-based Actions on Node 24 ahead of the platform default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - ".github/dependabot.yml"
      - "LICENSE"
  # No paths-ignore on pull_request: `Vitest unit tests` is a required
  # branch-protection check, so skipping it on docs-only PRs would leave
  # the check "Expected" forever and deadlock auto-merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fast follow-up commit
# doesn't keep an outdated Vitest run burning minutes.
concurrency:
  # Finish runs on main instead of cancelling them. Direct-to-main pushes land
  # minutes apart, so cancel-in-progress left Test/Vitest/smoke almost always
  # 'cancelled' and a real failure could not show (2026-09-13). GitHub still
  # replaces an older QUEUED run with the newest one, so main never backs up.
  group: vitest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 2026-10-04 (owner: "how can we get stuff to get on main faster"): the suite
  # runs in FOUR parallel shards (~1/4 of the ~11-17 min each), and the
  # `Vitest unit tests` job below, the branch-protection check name, only
  # reports whether every shard passed. A shard that fails, is cancelled or is
  # skipped fails the check: it never reads as green.
  vitest-shard:
    name: Vitest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so CI heals a stale lockfile
        # instead of failing the run if package-lock.json drifts — same
        # pattern as test.yml.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run Vitest
        # `--reporter=default` keeps the GitHub Actions summary readable;
        # `--passWithNoTests` would mask "I deleted every test" bugs, so
        # we deliberately do NOT pass it.
        run: npx vitest run --reporter=default --shard=${{ matrix.shard }}/4

  vitest:
    name: Vitest unit tests
    needs: vitest-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.vitest-shard.result }}
        run: |
          echo "shards: $SHARDS"
          test "$SHARDS" = "success"

  coverage:
    # Q184 (owner, 2026-09-27): a line-coverage floor for src/lib + src/hooks.
    # Its own job, in parallel, because v8 instrumentation slows the suite by
    # ~30% (measured on run 36349571652: 1106s vs 846s) and pushed two 20s
    # tests past their timeout. Test FAILURES are the job above's to report;
    # this job's verdict is the floor, so the run step may fail (continue-on-
    # error) but coverage is still written (reportOnFailure in vitest.config.ts)
    # and the floor step fails closed when the summary is missing.
    name: Coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run Vitest with coverage
        id: vitest_cov
        continue-on-error: true
        run: npx vitest run --reporter=dot --coverage --testTimeout=60000

      - name: Coverage floor (Q184)
        env:
          # Read back so a failed test run shows in this job's log; the tests'
          # pass/fail verdict belongs to the Vitest job above.
          TESTS_OUTCOME: ${{ steps.vitest_cov.outcome }}
        run: node scripts/check-coverage-floor.mjs
