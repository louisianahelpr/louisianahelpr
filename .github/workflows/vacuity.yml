name: Vacuity

# "Completeness is proven, not claimed: inventory from source, minus what was
# checked, must be empty, AND EVERY CHECK MUST BE SHOWN ABLE TO FAIL."
#                                                              — CLAUDE.md
#
# The second half of that rule had no machinery behind it. On 2026-09-19 five
# separate guards turned out to be incapable of failing — a badge test that
# rendered the badge directly and survived deleting the line that mounts it; a
# log-format test that asserted nothing because its gitignored corpus did not
# exist; an edge mock that silently dropped read filters; Playwright browsers
# that were not installed at all; a status-literal scan that passed on the
# original bug. Every one looked like a guard and reported green.
#
# `npm run vacuity` makes the rule mechanical:
#   - every guard in src/test registers a mutation, or is grandfathered in
#     src/test/vacuity.baseline.json (which may only SHRINK);
#   - each registered mutation BREAKS the guarded source, runs ONLY that guard,
#     and fails if the guard stayed green;
#   - static detectors catch the classes a parser can honestly decide
#     (empty inventory, self-referential registry);
#   - a preflight asks whether the harness is real (browsers installed, mock
#     clauses actually recorded).
#
# RUNS ON EVERY PUSH TO MAIN, NOT ON PRs (owner, 2026-10-01). It used to run
# on every pull_request as a required check; PR #2050's run took 112 min (310
# registrations, 22 of them e2e at ~98 s each), so it blocked landing. Now each
# merge to main runs it, scoped to the guards and guarded files that push
# changed (github.event.before..sha, see VACUITY_PUSH_BEFORE below), and runs
# queue rather than drop (concurrency below). The FULL set runs on the
# schedule (Sundays 07:17 UTC, owner cost decision 2026-09-22; see the cron).
# A red push run is filed as nightly-red by main-red-watch.yml; a red
# scheduled run files its own. Guard: src/test/landingPath.test.ts.
#
# Linux runner (memory `github-actions-macos-billing`): macos-15 minutes are a
# 10x multiplier and this is pure Node.

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - "LICENSE"
  schedule:
    # 07:17 UTC on SUNDAYS — the full mutation set, which is too slow for a push.
    # Was 14:17, where its worst case (305 min) ran over 16:17 loading-states
    # and 19:17 scoreboard. Q318 (2026-09-23): moved so no prod-load run is due while another's worst case (timeout x waves) still holds the group; src/test/prodWorkflowSpacing.test.ts rule 5.
    #
    # WEEKLY, NOT DAILY (owner decision 2026-09-22, on cost). The set is 1018
    # registrations, and giving this job credentials means the e2e ones now
    # actually execute instead of dying on a missing .env — the first full run
    # after that change was KILLED at the 30-minute budget having finished
    # almost none of them. A realistic full sweep is hours, and a daily one
    # would run 5,000-9,000 Actions minutes a month against a 2,000-minute free
    # tier. The per-push gate still proves every NEW or CHANGED guard
    # immediately, which is the high-value check; this sweep only catches DRIFT
    # — a guard that quietly went vacuous because the code moved under it — and
    # weekly is a reasonable cadence for drift.
    #
    # WHY :17, AND WHY NOT 06:10 ANY MORE. Giving this job prod credentials
    # (see the env block below) made it a prod-hitting workflow, which
    # src/test/prodWorkflowSpacing.test.ts holds to two rules it was previously
    # outside of: 30 minutes' clearance from the hourly prod-errors monitor at
    # :47 — and :17 is the only minute in the hour that far from :47 — and 90
    # minutes from every other daily prod cron. 06:10 was 53 min from
    # db-drift-detect (05:17) and 67 from db-backup (07:17), so it moved rather
    # than crowd two database jobs with a Playwright sweep.
    - cron: "17 7 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "The weekly set: every unit registration and this ISO week's slice of the e2e set (Q1270), not just what changed"
        type: boolean
        default: false
      only:
        description: "Comma-separated guard files: mutate exactly their registrations (e.g. re-prove e2e inconclusives with this job's credentials)"
        type: string
        default: ""

# The SCHEDULED run joins the shared prod-load lock, because that is the run
# that signs into prod and drives the real test accounts through every
# registered Playwright mutation. On every trigger those Playwright mutations
# also run in `vacuity-e2e`, which holds the job-level account lock (Q551). Every other run gets a group of its OWN
# COMMIT: GitHub keeps just one PENDING run per group and cancels the older
# pending one, so a shared per-ref group would let the third of three quick
# merges drop the second, and that push's guards would never be proven. Each
# push run mutates only what that push changed, which is almost never an e2e
# guard, so they do not need to wait on each other.
#
# cancel-in-progress is false: a cancelled run holding prod-load would release
# the lock mid-suite, and a cancelled push run would leave that push unproven.
# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  group: ${{ format('vacuity-{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: false

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  scope:
    # Q551: the Playwright registrations sign in as the shared prod test
    # accounts and so run in `vacuity-e2e`, under the account lock. A job-level
    # lock is taken before any step runs, so this lock-free job decides whether
    # that job (and its queue) is needed at all: most pushes touch no e2e guard.
    # It selects with the gate's own function (scripts/vacuity/scope.mjs ->
    # run.mjs scopeMutations), and needs no `npm install`.
    name: Do any guards need the shared accounts
    needs: prod-load-turn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      have_e2e: ${{ steps.scope.outputs.have_e2e }}
      # Q1270: this week's slice of the e2e set, decided ONCE here so every leg
      # of a chain that runs past midnight works on the same one.
      slice: ${{ steps.scope.outputs.slice }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the per-push scope is a diff against the commit main
          # was at before the push.
          fetch-depth: 0
      - id: scope
        env:
          ONLY: ${{ inputs.only }}
          VACUITY_PUSH_BEFORE: ${{ github.event.before }}
          E2E_SLICES: "4"
        run: |
          if [ -n "${ONLY}" ]; then
            node scripts/vacuity/scope.mjs --only "${ONLY}"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then
            # Q1270: the e2e set rotates over E2E_SLICES weeks (scripts/vacuity/legs.mjs sliceOf).
            node scripts/vacuity/scope.mjs --all --slice "$(( 10#$(date -u +%V) % E2E_SLICES ))/${E2E_SLICES}"
          else
            node scripts/vacuity/scope.mjs
          fi

  wait-accounts:
    # Q743: the job-level lock `vacuity-e2e` takes is NOT a queue. GitHub keeps
    # ONE pending job per concurrency group and CANCELS it when a third arrives.
    # This lock-free job waits its turn first and joins the group only when that
    # bumps nobody (scripts/e2e/wait-shared-accounts.mjs;
    # src/test/sharedAccountLockQueues.test.ts). Only when `scope` found e2e work.
    name: Wait for the shared accounts (queue)
    needs: scope
    if: needs.scope.outputs.have_e2e == 'true'
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs; the longest single holder is vacuity-e2e (180; prod-audit is two 60-min legs since Q889).
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until joining the shared-accounts lock bumps no waiting job
        run: node scripts/e2e/wait-shared-accounts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  vacuity:
    name: Guards shown able to fail
    runs-on: ubuntu-latest
    needs: prod-load-turn
    # The full set needs hours, not 30 minutes; a push run still finishes in
    # seconds and is unaffected by a higher ceiling. 30 min is what killed the
    # first credentialed full sweep mid-flight, which reports as `cancelled` -
    # and a cancelled run is a hidden red in this repo.
    timeout-minutes: 300

    # NO SHARED-ACCOUNT CREDENTIALS HERE (Q551). Until 2026-10-04 this job held
    # the poster/helper secrets so a registered Playwright guard could sign in,
    # which meant every push drove the shared prod test accounts beside whatever
    # else was running, with no lock. The Playwright registrations now run in
    # `vacuity-e2e` below, under `prod-lifecycle-shared-accounts`; this job runs
    # the rest (--no-e2e).
    #
    # It still writes the service-role key into .env (below) because every job
    # that runs the harness does (vacuityWorkflowsProvideServiceRole.test.ts).

    steps:
      - name: Checkout
        # Full history: the per-push scope is a diff against origin/main, and a
        # shallow clone has no merge base to diff against.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright browsers
        # The harness preflight fails when playwright.config.ts asks for a
        # browser that is not on disk. That check exists precisely because a
        # machine with no browsers reported green nightlies, so CI must install
        # them rather than let the check be "green because nothing ran".
        run: bash scripts/ci/playwright-install.sh chromium webkit

      - name: Give the build the app's public Supabase config
        # The gate rebuilds the bundle itself for Playwright guards, so it does
        # not go through .github/actions/local-preview and needs VITE_* here.
        # Both values are publishable — the same pair prod-audit.yml falls back
        # to in plain text — and no secret is written by this step.
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'VITE_SUPABASE_URL=%s\n' "${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}"
          } > .env
          test -s .env

      - name: Give prod-backed e2e guards the service-role key
        # e2e registrations (prod-audit, a11y-prod, journeys) mint their test
        # sessions through scripts/test-signin-link.mjs, which needs
        # SUPABASE_SERVICE_ROLE_KEY in .env. Without it every such guard is
        # red BEFORE its mutation and reports INCONCLUSIVE: run 35935153284
        # (2026-09-23, nightly-red #1731) had 5 of 11 registrations
        # inconclusive with "ERROR: .env is missing VITE_SUPABASE_URL and/or
        # SUPABASE_SERVICE_ROLE_KEY". Minted the same way prod-audit.yml does.
        # Guard: src/test/vacuityWorkflowsProvideServiceRole.test.ts.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF || 'fncmgoasalhdgfwzhsqa' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            KEY=$(npx --yes supabase@2 projects api-keys --project-ref "$PROJECT_REF" --reveal -o json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).find(x=>x.name==="service_role");if(!k){process.exit(3)}process.stdout.write(k.api_key)})')
            echo "::add-mask::$KEY"
            umask 077
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$KEY" >> .env
          elif [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN missing: prod-backed e2e guards cannot mint sessions."
            exit 1
          else
            # A push run without the secret. Not a false green: an e2e
            # registration in its changed set comes back INCONCLUSIVE, which
            # the gate itself fails on.
            echo "::warning::SUPABASE_ACCESS_TOKEN missing on a $EVENT run: e2e registrations that need the service-role key will be inconclusive."
          fi

      - name: Vacuity gate
        env:
          # Through env, never interpolated into the script (injection-safe).
          ONLY: ${{ inputs.only }}
          # The commit main was at before this push: scope is everything the
          # push brought, not just its last commit (scripts/vacuity/lib.mjs
          # effectiveBase). Empty on schedule/dispatch.
          VACUITY_PUSH_BEFORE: ${{ github.event.before }}
        # Per push: ratchet + static scan + harness preflight + mutations for
        # what changed. Weekly (schedule): every registered mutation. The
        # Playwright registrations are NOT run here (--no-e2e): they sign in as
        # the shared test accounts and run in `vacuity-e2e` under the account
        # lock (Q551).
        run: |
          # The full set on the weekly schedule, or on demand. Waiting until
          # 07:17 to find out whether a change to this job's credentials or
          # scope actually works is how the e2e half stayed unproven for so
          # long - a dispatch that cannot reproduce the weekly sweep is not a
          # reproduction.
          if [ -n "${ONLY}" ]; then
            npm run vacuity -- --no-e2e --only "${ONLY}"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then
            npm run vacuity:all -- --no-e2e
          else
            npm run vacuity -- --no-e2e
          fi

      - name: Vacuity report
        if: always()
        run: npm run vacuity:report

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vacuity-report
          path: docs/audit/vacuity-report.json
          if-no-files-found: warn

      - name: Remove the service-role key from the runner
        if: always()
        run: rm -f .env


  # ── GENERATED by scripts/ci/vacuity-legs.mjs (Q1270): edit the generator, not the lines below ──
  vacuity-e2e:
    # THE PLAYWRIGHT REGISTRATIONS, UNDER THE ACCOUNT LOCK (Q551, found by Q326).
    #
    # WHY THESE JOBS HOLD TEST-ACCOUNT CREDENTIALS.
    #
    # Until 2026-09-22 the job held none, so any push touching a guard that signs
    # in went red for a reason that had nothing to do with the guard. That is
    # what happened to e2e/prod-audit/activity-loading-reserve.spec.ts: its
    # mutation is real and kills locally (placeholder row 150px -> 220px against
    # a 151px real row, both surfaces), but in CI the spec never reached its
    # assertions - e2e/journeys/fixtures.ts found no PLAYWRIGHT_*_EMAIL/_PASSWORD,
    # fell through to its local service-role path, and died on `no .env`. The
    # gate scored that `inconclusive`, which is a hard failure by design, and the
    # red read as "this guard cannot fail" when the guard was fine.
    #
    # PASSWORDS ONLY, DELIBERATELY. prod-audit.yml additionally fetches a
    # service-role key, because the incomplete-profile and admin seed accounts
    # have no password stored anywhere. Nothing registered here needs those, so
    # these jobs take the four poster/helper secrets and stop there rather than
    # widening the blast radius of a job whose whole purpose is to run mutated
    # source. fixtures.ts prefers these over the service-role path, so that
    # path is never taken here.
    #
    # Those secrets are the shared accounts every other prod suite drives, so
    # every leg holds the one lock they all hold (Q326,
    # sharedAccountJobsHoldOneLock.test.ts), entered through its own Q743 waiter.
    # Leg 1 exists only when `scope` found a Playwright registration to run.
    #
    # LEGS (Q1270, 2026-10-07). The full set is 99 registrations over 76 guards;
    # vacuity 37288574126 took 77.6 min for 10 of them, so the weekly set is
    # hours and no single job under the one-hour cap
    # (sharedAccountLockJobsAreShort.test.ts) can hold it. Each leg runs whole
    # guard groups for 34 min, hands its done list to the next leg
    # (scripts/vacuity/legs.mjs), and lets go of the lock in between
    # (wait-shared-accounts.mjs YIELDS_BETWEEN_LEGS). The last leg fails on
    # anything left. A scheduled run waits in the prod-load FIFO and every
    # later cron waits behind it, so it gets 5 legs (the Sunday window
    # before db-drift, prodWorkflowSpacing rule 5) and proves the slice of the
    # e2e set the scope job picked for this ISO week. Generated by
    # scripts/ci/vacuity-legs.mjs.
    name: Playwright guards shown able to fail
    needs: [scope, wait-accounts]
    if: needs.scope.outputs.have_e2e == 'true'
    runs-on: ubuntu-latest
    # actions: read for the deploy wait (it lists this commit's deploy runs).
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60 # e2e leg 1
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    outputs:
      remaining: ${{ steps.gate.outputs.remaining }}
    env:
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}

    steps:
      - name: Checkout
        # Full history: the per-push scope is a diff against origin/main, and a
        # shallow clone has no merge base to diff against.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright browsers
        # Same reason as the vacuity job's install: the harness preflight fails
        # when a browser is missing.
        run: bash scripts/ci/playwright-install.sh chromium webkit # e2e leg 1

      - name: Give the build the app's public Supabase config
        # The gate rebuilds the bundle itself for Playwright guards, so it does
        # not go through .github/actions/local-preview and needs VITE_* here.
        # Both values are publishable — the same pair prod-audit.yml falls back
        # to in plain text — and no secret is written by this step.
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'VITE_SUPABASE_URL=%s\n' "${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}"
          } > .env
          test -s .env

      - name: Give prod-backed e2e guards the service-role key
        # e2e registrations (prod-audit, a11y-prod, journeys) mint their test
        # sessions through scripts/test-signin-link.mjs, which needs
        # SUPABASE_SERVICE_ROLE_KEY in .env. Without it every such guard is
        # red BEFORE its mutation and reports INCONCLUSIVE: run 35935153284
        # (2026-09-23, nightly-red #1731) had 5 of 11 registrations
        # inconclusive with "ERROR: .env is missing VITE_SUPABASE_URL and/or
        # SUPABASE_SERVICE_ROLE_KEY". Minted the same way prod-audit.yml does.
        # Guard: src/test/vacuityWorkflowsProvideServiceRole.test.ts.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF || 'fncmgoasalhdgfwzhsqa' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            SERVICE_KEY=$(npx --yes supabase@2 projects api-keys --project-ref "$PROJECT_REF" --reveal -o json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).find(x=>x.name==="service_role");if(!k){process.exit(3)}process.stdout.write(k.api_key)})')
            echo "::add-mask::$SERVICE_KEY"
            umask 077
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_KEY" >> .env # e2e leg 1
          elif [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN missing: prod-backed e2e guards cannot mint sessions."
            exit 1
          else
            # A push run without the secret. Not a false green: an e2e
            # registration in its changed set comes back INCONCLUSIVE, which
            # the gate itself fails on.
            echo "::warning::SUPABASE_ACCESS_TOKEN missing on a $EVENT run: e2e registrations that need the service-role key will be inconclusive."
          fi

      # Q432: a push that lands a migration or an edge function starts its
      # deploys at the same moment as this job. Until they finish, the
      # prod-backed registrations test the old backend and read RED before any
      # mutation (vacuity 36215687625). Wait for this commit's db-deploy and
      # functions-deploy runs, if it has any (bounded; never fails the job).
      - name: Wait for this commit's prod deploys
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/wait-commit-deploys.mjs # e2e leg 1

      - name: Vacuity gate (Playwright registrations, leg 1 of 5)
        id: gate
        timeout-minutes: 52
        env:
          # Through env, never interpolated into the script (injection-safe).
          ONLY: ${{ inputs.only }}
          VACUITY_PUSH_BEFORE: ${{ github.event.before }} # e2e leg 1
          SLICE: ${{ needs.scope.outputs.slice }}
        # The same scope as the unit job, narrowed to the registrations under
        # e2e/ (--e2e), minus what earlier legs ran (scripts/vacuity/legs.mjs).
        run: |
          mkdir -p vacuity-legs
          if [ -n "${ONLY}" ]; then
            npm run vacuity -- --e2e --only "${ONLY}" --budget-min 34 --done-out vacuity-legs/done-1.json
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then
            npm run vacuity:all -- --e2e --slice "${SLICE}" --budget-min 34 --done-out vacuity-legs/done-1.json
          else
            npm run vacuity -- --e2e --budget-min 34 --done-out vacuity-legs/done-1.json
          fi

      - name: Hand the done list to the next leg
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vacuity-e2e-done-1
          path: vacuity-legs/done-1.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the service-role key from the runner
        if: always()
        run: rm -f .env

