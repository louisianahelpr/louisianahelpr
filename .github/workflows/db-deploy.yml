name: Supabase DB Deploy

permissions:
  contents: read

# Auto-deploys Supabase migrations to prod when changes land on main.
# Closes the manual-handoff gap that caused the May-09 migration-pipeline
# drift (12 local migration files unapplied to prod, including the
# chat-push notification trio + the AppliedJobsTab RLS fix).
#
# TRUST MODEL — REWRITTEN 2026-09-03, because the old one was describing a
# process this repo no longer runs.
#
# It used to read: "Branch protection on main should require both checks
# before merge." That was true when work reached main through PRs. This repo
# now commits DIRECTLY to main (CLAUDE.md, "Commit directly to `main` — no
# branch/PR ceremony needed"), so there is no merge, no required check, and
# nothing was ever consulted. db-smoke and migration-lint fired on the same
# push event as this workflow and RACED it: a red lint thirty seconds after
# `supabase db push` already changed prod is a report, not a gate.
#
# What actually gates the deploy now — all three are `needs:` of the deploy
# job, so a failure means db push never runs:
#   1. guard-migration-lint     — calls migration-lint.yml (RLS, CHECK
#                                 immutability, reserved schemas, GRANTs,
#                                 AFTER-trigger timing, destructive DDL).
#   2. guard-db-smoke           — calls db-smoke.yml: applies every migration
#                                 to a throwaway Supabase Postgres and
#                                 exercises the trigger fan-out + RLS.
#   3. guard-destructive-ddl    — scripts/check-destructive-ddl.mjs over the
#                                 pushed diff range.
# and then, inside the deploy job after linking, a PRE-FLIGHT that runs the
# destructive check against the EXACT set `supabase db push --dry-run` says
# it will apply. That last one has no diff-base fallback and no bypass.
#
# Why destructive DDL gets its own gate, above and beyond the lint: this
# project is on the Supabase free tier and has NO restorable backup. That is
# the owner's stated, accepted constraint, not a defect — but it means a
# `DROP TABLE` that reaches prod is permanent. The gate is the compensating
# control for the missing restore path, so it FAILS rather than warns, and
# its escape hatch is three lines of acknowledgement written into the
# migration where a reader sees them.
#
# REQUIRED REPO SECRETS (Settings → Secrets → Actions):
# - SUPABASE_ACCESS_TOKEN  Personal access token from Supabase Dashboard
#                          → Account → Access Tokens. Scope: project access.
# - SUPABASE_DB_PASSWORD   Project DB password (Dashboard → Settings →
#                          Database → Connection string → "Reset password"
#                          if unknown).
# - SUPABASE_PROJECT_REF   Project ref ID. For Helpr prod this is
#                          fncmgoasalhdgfwzhsqa.
#
# If any are missing the workflow FAILS LOUDLY (it used to skip, which is
# indistinguishable from passing — see the "Require deploy secrets" step).
# Add the secrets, then push any migration to trigger the first real deploy.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-deploy.yml"
      # The two gate workflows are listed here because their own `push:`
      # triggers were removed when they became `workflow_call` gates of this
      # one. Without these lines, editing db-smoke.yml or migration-lint.yml
      # on main would exercise neither of them — a guard whose last change
      # was never run is the shape this whole lane exists to stop.
      - ".github/workflows/db-smoke.yml"
      - ".github/workflows/migration-lint.yml"
      - "scripts/check-destructive-ddl.mjs"
  # Manual trigger so you can re-run the deploy without a new commit
  # (e.g., to apply a backlog after secrets are first configured).
  workflow_dispatch:

concurrency:
  # Serialize deploys — never let two pushes race against the same
  # schema_migrations table.
  group: db-deploy-prod
  cancel-in-progress: false

jobs:
  # ── GATES ───────────────────────────────────────────────────────────────
  # These three must pass before `deploy` starts. They are `uses:` /
  # `needs:` rather than separate workflows on the same trigger precisely
  # because separate workflows on the same trigger do not gate anything —
  # that was the defect.

  guard-migration-lint:
    name: Gate — migration lint
    uses: ./.github/workflows/migration-lint.yml
    permissions:
      contents: read

  guard-db-smoke:
    name: Gate — replay every migration + smoke
    uses: ./.github/workflows/db-smoke.yml
    permissions:
      contents: read

  guard-destructive-ddl:
    name: Gate — destructive DDL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The diff base is github.event.before, which can be many commits
          # back on a batched push. A shallow clone cannot reach it.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Scan the pushed range for destructive DDL
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] \
             && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE_SHA" HEAD -- 'supabase/migrations/*.sql' || true)
            if [ -z "$FILES" ]; then
              echo "No migration files added or modified in ${BEFORE_SHA}..HEAD."
              exit 0
            fi
            echo "Scanning:"; echo "$FILES"
            echo "$FILES" | xargs node scripts/check-destructive-ddl.mjs
          else
            # workflow_dispatch, or a force-push that orphaned the before-SHA.
            # Scanning the whole tree here would re-report ~46 statements from
            # history that shipped months ago and would block every manual
            # re-deploy — the classic way a gate gets switched off for good.
            # This case is covered EXACTLY by the pre-flight in the deploy job,
            # which reads the set `db push --dry-run` will actually apply. That
            # one has no fallback path.
            echo "::notice::No usable diff base ($EVENT_NAME). The authoritative destructive-DDL check for this run is the pending-set pre-flight in the deploy job."
          fi

  # ── DEPLOY ──────────────────────────────────────────────────────────────

  deploy:
    name: Push migrations to prod
    needs: [guard-migration-lint, guard-db-smoke, guard-destructive-ddl]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Optional GitHub Environment for required-reviewer gating. Still
    # commented out, and now deliberately so rather than by default: the
    # `needs:` gates above plus the pre-flight below are automated checks
    # that run on every push, where a human approval prompt at 2am is a
    # rubber stamp. Uncomment + create the "production-db" environment with
    # Lexi as required reviewer to add a manual approval on top.
    #
    # The line this replaced said "Default below = no gate (trust the PR
    # checks)" — there were no PR checks to trust; see the trust model at
    # the top of this file.
    # environment: production-db

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pre-flight BEFORE touching prod. A duplicate timestamp makes
      # `supabase db push` die on a schema_migrations PK conflict and blocks
      # every migration queued behind it, so catching it here turns a broken
      # prod pipeline into a red build with an actionable message.
      - name: Guard against duplicate migration timestamps
        run: ./scripts/check-migration-timestamps.sh

      # REQUIRED SECRETS ARE A HARD GATE. Changed 2026-08-31.
      #
      # WHAT THIS CATCHES: this workflow silently ceasing to deploy.
      #
      # This step used to emit ::warning:: and set skip=true, and every step
      # below was guarded by `if: skip != 'true'`. To the checks API, the
      # commit status and the merge box, a skipped job and a passed job are
      # the same colour — so the moment SUPABASE_ACCESS_TOKEN is rotated,
      # expires, or is renamed, migrations stop reaching prod FOREVER while
      # main stays fully green. Nothing anywhere would say so; the drift
      # detector was itself green-on-drift until the same day this changed.
      # That is the identical shape as the three prod incidents this repo has
      # already shipped: a detector whose result never reaches the exit code.
      #
      # The "so a fresh repo clone doesn't error on first run" rationale in
      # the header does not survive contact with the cost: a first run of a
      # fresh clone failing loudly with the list of secrets to add is a
      # BETTER outcome than a live repo deploying nothing in silence.
      #
      # Secrets are read through `env:` rather than interpolated into the
      # script body so no secret value can be parsed as shell.
      - name: Require deploy secrets
        id: precheck
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${SUPABASE_DB_PASSWORD:-}" ]  && MISSING="$MISSING SUPABASE_DB_PASSWORD"
          [ -z "${SUPABASE_PROJECT_REF:-}" ]  && MISSING="$MISSING SUPABASE_PROJECT_REF"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s):$MISSING"
            echo "::error::db-deploy CANNOT push migrations to prod without these. It is failing rather than skipping, because a skipped deploy reports as a passed deploy and would leave prod's schema silently stale behind main."
            echo "::error::Add them in Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "✓ All required deploy secrets are present."

      - name: Install Supabase CLI
        if: steps.precheck.outputs.skip != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Show pending migrations
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Dry-run-equivalent: list local migrations the CLI would push.
          # Useful for the audit log even when 0 are pending.
          echo "::group::Local migrations the CLI knows about"
          supabase migration list --local || true
          echo "::endgroup::"
          echo "::group::Remote migrations (current prod state)"
          supabase migration list --linked || true
          echo "::endgroup::"

      # ── THE LAST THING BETWEEN A DROP AND PRODUCTION ────────────────────
      #
      # Everything above this point reasons about a git diff. This step
      # reasons about the actual set of migrations `supabase db push` is
      # about to apply, read from the CLI itself after linking. It therefore
      # covers the cases a diff cannot: workflow_dispatch, a force-push that
      # orphaned the before-SHA, and a back-dated migration file that
      # --include-all will pick up even though this push did not add it.
      #
      # It FAILS CLOSED. If the dry-run output cannot be parsed into a
      # pending set, this step does not shrug and continue — it stops the
      # deploy and says so. "I could not tell what would be applied" must
      # never resolve to "apply it", which is the exact failure shape this
      # repo has now shipped three times (functions-deploy's tip-commit diff,
      # migration-lint's main-against-main diff, and the skip=true secrets
      # precheck that made a dead deploy look green).
      - name: PRE-FLIGHT — destructive DDL in the exact pending set
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -uo pipefail

          OUT=$(supabase db push --linked --include-all --dry-run --yes \
                  --password "${{ secrets.SUPABASE_DB_PASSWORD }}" 2>&1) || {
            echo "$OUT"
            echo "::error::'supabase db push --dry-run' failed. Refusing to deploy without knowing what would be applied."
            exit 1
          }
          echo "::group::db push --dry-run"
          echo "$OUT"
          echo "::endgroup::"

          # Every migration version is a 14-digit timestamp. Pull them out of
          # whatever prose the CLI wraps them in, so a cosmetic change to the
          # output format cannot silently empty the set.
          # tr splits on every non-digit, so each run of digits lands on its own
          # line and `grep -x` can demand EXACTLY 14 — no \b, which is a GNU
          # extension that silently matches nothing under BSD grep.
          VERSIONS=$(echo "$OUT" | tr -c '0-9' '\n' | grep -xE '[0-9]{14}' | sort -u || true)

          if [ -z "$VERSIONS" ]; then
            # Zero versions is only believable if the CLI also SAID nothing is
            # pending. Anything else means the parse failed.
            if echo "$OUT" | grep -qiE "up to date|no migrations|nothing to (push|apply)|0 migrations"; then
              echo "✅ Nothing pending — no migration will be applied, so nothing to scan."
              exit 0
            fi
            echo "::error::Could not extract a pending migration set from the dry-run output, and the CLI did not say the database is up to date."
            echo "::error::Refusing to run 'db push' against production while blind to what it would apply."
            echo "::error::If the CLI output format changed, update the matcher in this step — do NOT delete the check."
            exit 1
          fi

          echo "Pending migrations:"; echo "$VERSIONS"

          FILES=""
          MISSING=""
          for v in $VERSIONS; do
            f=$(ls supabase/migrations/${v}_*.sql 2>/dev/null | head -1 || true)
            if [ -z "$f" ]; then MISSING="$MISSING $v"; else FILES="$FILES $f"; fi
          done
          if [ -n "$MISSING" ]; then
            # A pending version with no local file means the CLI and this
            # checkout disagree about what exists. Do not guess.
            echo "::error::Pending migration version(s) with no matching local file:$MISSING"
            exit 1
          fi

          # shellcheck disable=SC2086
          node scripts/check-destructive-ddl.mjs $FILES

      - name: Push migrations
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # --include-all also pushes any migration whose timestamp is
          # OLDER than the latest in prod (handles the back-dated-file
          # case that the May-09 backlog had).
          supabase db push --linked --include-all --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Verify post-deploy state
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Re-list remote so the run log records the final state of
          # prod's schema_migrations after this push.
          echo "::group::Remote migrations after push"
          supabase migration list --linked
          echo "::endgroup::"

      - name: Notify on failure
        if: failure() && steps.precheck.outputs.skip != 'true' && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: db-deploy failed on main — ${{ github.sha }}. Check Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK" || true
