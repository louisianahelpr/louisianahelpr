name: A11y in WebKit (prod)

permissions:
  contents: read

# The UI audit evidence sweep against the REAL backend in real WebKit (iPhone 13)
# AND in Chromium, then a diff: what does WebKit report that Chromium does not?
# The frontend is THIS COMMIT built and served locally (.github/actions/local-
# preview), not the deployed site: every screen x variant on Vercel was a large
# share of the edge requests that paused the project (2026-09-14).
#
# Owner, 2026-09-12: no mock mode, and iPhone users get WKWebView. Until this
# file the only axe gate ran in Chromium against a mocked preview. Spec:
# e2e/a11y-prod/a11y-prod.spec.ts (same capture + gate as the mocked sweep,
# via e2e/happy-path/sweepCore.ts). Diff: scripts/audit/a11y-engine-diff.mjs.
#
# AXE TAG SET (Q181, docs/OPEN.md, 2026-09-23): sweepCore's axe scan runs
# AXE_TAGS (e2e/happy-path/axeTags.ts) — wcag2a/2aa/21a/21aa PLUS wcag22aa
# (WCAG 2.2 AA) and best-practice — against the two-way baseline in
# e2e/happy-path/knownAxeViolations.ts. A violation not on the baseline fails
# the sweep; a baseline entry not seen fails it too (the list only shrinks).
# If the baseline file (e2e/happy-path/axe-known-violations.json) does not
# exist, the sweep generates it from this run's findings and fails with
# "axe baseline missing" — see the "Surface a missing axe baseline" step below.
#
# The SWEEP signs the shared test accounts in and only looks (nothing is
# written), but a sign-in is a session the other suites' assertions can see, so
# the sweep holds the shared-account lock too (Q550): both engines run in ONE
# job that holds `prod-lifecycle-shared-accounts`, one after the other (a
# two-engine matrix under one lock would serialise itself, and GitHub's
# one-pending-job-per-group rule would cancel the queued engine). The `fixtures`
# job before it is the one writer (nightly-red #1794): it keeps the job-status
# fixtures the sweep renders alive - today the `accepted` job - through the
# app's own path, under the same lock. Both queue through `wait-accounts`
# (Q743; sharedAccountLockQueues.test.ts).
#
# It is a REQUIRED release check: scripts/release-gate.mjs keys on this
# workflow's name and on the "WebKit-only violations" job.

on:
  schedule:
    # Mon, Wed, Fri 09:17 UTC (prod load spread, 2026-09-14).
    - cron: "17 9 * * 1,3,5"
  workflow_dispatch:
    inputs:
      routes:
        description: "SWEEP_ROUTES: comma-separated App.tsx route patterns to narrow the sweep (blank = every screen)"
        required: false
        default: ""
      variants:
        description: "SWEEP_VARIANTS for a dispatch (comma list of sweepCore.ts ALL_VARIANTS tags, or all). Blank = today's weekday rotation"
        required: false
        default: ""

# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  # PROD LOAD (2026-09-14): prod-hitting crons are spread across 03:00-13:00 UTC,
  # >= 2h apart, and share the prod-load concurrency group; see
  # src/test/prodWorkflowSpacing.test.ts before moving this.
  #
  # A SCHEDULED run joins prod-load; a workflow_dispatch gets its OWN group
  # (the split e2e-journeys.yml documents: GitHub keeps one pending run per
  # group, so a dispatch in prod-load can be cancelled by an unrelated one).
  # The shared test accounts are serialised by the job-level lock the
  # `fixtures` and `sweep` jobs hold (Q326, Q550), not by this group, so the
  # run never takes prod-load.
  group: ${{ format('a11y-webkit-prod-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  preflight:
    needs: prod-load-turn
    name: What can run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      have_accounts: ${{ steps.check.outputs.have_accounts }}
    steps:
      - id: check
        env:
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
        run: |
          if [ -n "$POSTER_EMAIL" ] && [ -n "$POSTER_PASSWORD" ] && [ -n "$HELPER_EMAIL" ] && [ -n "$HELPER_PASSWORD" ]; then
            echo "have_accounts=true" >> "$GITHUB_OUTPUT"
          else
            # FAIL, never skip: a skipped sweep would satisfy nothing but would
            # also alarm nobody, and the release gate needs a red to block on.
            echo "::error title=Prod a11y sweep NOT run::PLAYWRIGHT_POSTER_EMAIL/_PASSWORD and PLAYWRIGHT_HELPER_EMAIL/_PASSWORD are not set."
            exit 1
          fi

  wait-accounts:
    # Q743: the job-level lock below is NOT a queue. GitHub keeps ONE pending job
    # per concurrency group and CANCELS it when a third arrives (press 36297157445,
    # e2e-journeys 36215839785 / 36215921402 / 36217255758). This lock-free job
    # waits its turn first and joins the group only when that bumps nobody
    # (scripts/e2e/wait-shared-accounts.mjs; src/test/sharedAccountLockQueues.test.ts).
    name: Wait for the shared accounts (queue)
    needs: preflight
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs; the longest single holder is prod-audit (180).
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until joining the shared-accounts lock bumps no waiting job
        run: node scripts/e2e/wait-shared-accounts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  fixtures:
    # The job-status fixtures the sweep renders and nothing else keeps alive
    # (nightly-red #1794, run 36148473443: no is_seed `accepted` job, an
    # unjustified skip on both engines). The ONE job here that writes to prod:
    # it reuses the accepted fixture, or mints one through the app's own path
    # (Stripe TEST checkout, apply, hire). It runs once, before both sweep
    # legs, because the legs run in parallel and must stay read-only. It
    # writes to the shared E2E accounts, so besides prod-load it holds their
    # one lock (Q326).
    name: Job-status fixtures
    needs: [preflight, wait-accounts]
    runs-on: ubuntu-latest
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    # A mint is bounded by the 22-minute early-access wait (fundedOpenJob.ts).
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: bash scripts/ci/playwright-install.sh chromium
      - name: Build and serve this commit locally (real backend, local frontend)
        # The mint only drives Stripe's hosted page today, but any relative
        # goto a fixture adds must land here, never on the deployed site.
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}
      - name: Ensure the job-status fixtures
        run: npx playwright test --project=job-status-fixtures --reporter=list,./e2e/reporters/skipReporter.ts
      - name: Backend request budget (Q104)
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label job-status-fixtures
      - name: Keep the fixture log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-status-fixtures
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  sweep:
    name: Sweep prod (chromium + webkit)
    # After the fixtures, whatever they did: a red fixtures job is its own
    # failure (notify below counts it), and the sweep's evidence of every
    # other screen is still worth having. wait-accounts must have succeeded:
    # `!cancelled()` alone would walk a timed-out waiter into the lock
    # (sharedAccountLockQueues.test.ts).
    needs: [preflight, wait-accounts, fixtures]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.wait-accounts.result == 'success' }}
    runs-on: ubuntu-latest
    # Holds the shared accounts for the whole sweep (Q550), so <= 60 min
    # (sharedAccountLockJobsAreShort.test.ts). Measured in run 36148473443: the
    # full sweep took 9.0 min (chromium) and 16.1 min (webkit); they run one
    # after the other here, so ~25 min of sweep plus the install and build.
    timeout-minutes: 60
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }}
      PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }}
      SWEEP_ROUTES: ${{ inputs.routes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        # Same reason as e2e-happy-path.yml: its bad index fails apt-get update.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: bash scripts/ci/playwright-install.sh chromium webkit
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

      - name: Pick this run's viewports and themes (Q71)
        # Q71: axe on every route at 375 AND 1440, light AND dark. Before this
        # step the sweep ran phone-light only (sweepCore.ts VARIANTS default),
        # so dark mode and the 1440 layout were never axe-scanned on prod.
        # Two variants per run keeps each leg ~20 min; the Mon+Wed pair covers
        # all four combinations every week, Fri repeats the phone pair.
        # Guard: src/test/a11yProdCoversBothThemesAndWidths.test.ts.
        env:
          PICKED: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          if [ -z "${PICKED:-}" ]; then
            case "$(date -u +%u)" in
              1) PICKED="phone-light,desktop-dark" ;;
              3) PICKED="phone-dark,desktop-light" ;;
              *) PICKED="phone-light,phone-dark" ;;
            esac
          fi
          echo "SWEEP_VARIANTS=$PICKED" >> "$GITHUB_ENV"
          echo "axe sweep variants this run: $PICKED" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the prod sweep (chromium)
        # The serial describe ignores --workers; kept on one line for
        # src/test/e2eSpecsReachableInCi.test.ts, which reads this file.
        # --output keeps each engine's test-results apart: Playwright empties
        # its output dir at the start of a run, and the two engines now share
        # one job.
        env:
          SWEEP_OUTPUT_DIR: ${{ github.workspace }}/a11y-prod-out/chromium
        run: npx playwright test --project=a11y-prod --output=test-results/chromium --reporter=list,./e2e/reporters/skipReporter.ts

      - name: Backend request budget, chromium (Q104)
        # Sums this engine's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label a11y-prod

      - name: Run the prod sweep (webkit)
        # After chromium whatever it did: a red chromium leg must not hide
        # what WebKit reports (the diff below needs both reports).
        if: ${{ !cancelled() }}
        env:
          SWEEP_OUTPUT_DIR: ${{ github.workspace }}/a11y-prod-out/webkit
        run: npx playwright test --project=a11y-prod-webkit --output=test-results/webkit --reporter=list,./e2e/reporters/skipReporter.ts

      - name: Backend request budget, webkit (Q104)
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label a11y-prod-webkit

      - name: Surface a missing axe baseline (Q181)
        # assertSweepGate (sweepCore.ts) writes this file and fails the sweep
        # above when e2e/happy-path/axe-known-violations.json does not exist -
        # first run against the wcag22aa+best-practice tag set, or the
        # baseline was deleted. That failure is buried in Playwright output;
        # this step puts it where a run's Summary tab and Actions annotations
        # actually show it, and names the artifact it is already inside (the
        # a11y-prod-<engine> uploads below cover the whole a11y-prod-out/<engine>
        # directory, this file included).
        if: always()
        run: |
          set -u
          for ENGINE in chromium webkit; do
            GEN="a11y-prod-out/$ENGINE/axe-baseline-generated.json"
            if [ -f "$GEN" ]; then
              COUNT=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).length)" "$GEN")
              echo "::error title=axe WCAG baseline missing ($ENGINE)::e2e/happy-path/axe-known-violations.json does not exist. $COUNT violation(s) generated at $GEN - download the a11y-prod-$ENGINE artifact, review each entry, then commit it as e2e/happy-path/axe-known-violations.json."
              {
                echo "## axe WCAG 2.2 AA baseline missing ($ENGINE)"
                echo "\`e2e/happy-path/axe-known-violations.json\` does not exist yet - generated **$COUNT** violation(s) at \`$GEN\`."
                echo ""
                echo "Download the \`a11y-prod-$ENGINE\` artifact from this run, review every entry in \`$GEN\` (this grandfathers real, measured debt - do not rubber-stamp it), then commit it as \`e2e/happy-path/axe-known-violations.json\` and register it in \`src/test/baselinesAreTwoWay.test.ts\`'s \`JSON_TWO_WAY\` (see \`e2e/happy-path/knownAxeViolations.ts\`'s header). This gate stays red until that file exists."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Keep the report and every screenshot (chromium)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-prod-chromium
          path: |
            a11y-prod-out/chromium/
            test-results/chromium/
          retention-days: 14
          if-no-files-found: error

      - name: Keep the report and every screenshot (webkit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-prod-webkit
          path: |
            a11y-prod-out/webkit/
            test-results/webkit/
          retention-days: 14
          if-no-files-found: error

  diff:
    # The name is what scripts/release-gate.mjs matches. Runs even when a
    # sweep leg is red: the diff over whatever both engines DID capture is
    # still the WebKit-only answer, and a red leg reds this job too.
    name: WebKit-only violations
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: a11y-prod-*
          path: reports
      - name: Diff WebKit against Chromium
        run: |
          set -euo pipefail
          C=reports/a11y-prod-chromium/a11y-prod-out/chromium/a11y-report.json
          W=reports/a11y-prod-webkit/a11y-prod-out/webkit/a11y-report.json
          set +e
          node scripts/audit/a11y-engine-diff.mjs "$C" "$W" --out webkit-only.json | tee diff.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo '## WebKit vs Chromium on prod'
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Sweep legs must both be green
        if: needs.sweep.result != 'success'
        run: |
          echo "::error::a sweep leg was ${{ needs.sweep.result }} — see the a11y-prod-* artifacts"
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-webkit-only
          path: |
            webkit-only.json
            diff.txt
          if-no-files-found: ignore
          retention-days: 14

  notify:
    name: Report nightly result
    needs: [fixtures, sweep, diff]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: a11y-webkit-prod
          status: ${{ needs.fixtures.result == 'success' && needs.sweep.result == 'success' && needs.diff.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
