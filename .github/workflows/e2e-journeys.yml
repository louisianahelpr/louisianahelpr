name: E2E user journeys

# Real-user journeys (e2e/journeys/) against THIS COMMIT served locally and the
# REAL backend: prod Supabase, the two shared E2E accounts, Stripe on its test key.
# Modeled on e2e-real-backend.yml's prod-lifecycle job: same secrets, same
# sweeper before and after, same shared-accounts concurrency group so the two
# workflows never drive the same accounts at once. Payment legs detect the
# Stripe mode from the Checkout Session id and SKIP with an ::warning:: on a
# live key, never charge and never pass silently.
#
# Real backend, LOCAL frontend (2026-09-14): each job builds this commit and
# serves it with `vite preview` (.github/actions/local-preview). Driving the
# deployed site cost ~110-215 Vercel edge requests per page load and helped
# pause the project on Hobby limits; src/test/noTestTrafficOnVercel.test.ts.

permissions:
  contents: read

on:
  schedule:
    # Tue, Fri 05:17 and Thu 09:17 UTC (worst case 187 min). Tue/Fri was 03:17,
    # under 01:17 slow-network's worst case (127). Q318 (2026-09-23): moved so no prod-load run is due while another's worst case (timeout x waves) still holds the group; src/test/prodWorkflowSpacing.test.ts rule 5.
    - cron: "17 5 * * 2,5"
    - cron: "17 9 * * 4"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Pin one scenario (SCENARIO=<id from a test title>)"
        type: string
        default: ""

# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  # PROD LOAD (2026-09-14): prod-hitting crons are spread across 03:00-13:00 UTC,
  # >= 2h apart, and share the prod-load concurrency group; see
  # src/test/prodWorkflowSpacing.test.ts before moving this.
  #
  # A SCHEDULED run joins prod-load — that is what keeps the nightly crons off
  # each other's backs. A workflow_dispatch gets its OWN group instead
  # (2026-09-21, issue #1595), the same split e2e-real-backend.yml already
  # makes, for the same reason it documents there:
  #
  #   `cancel-in-progress: false` does not mean "queue forever". GitHub keeps
  #   exactly ONE *pending* run per group, so a third run entering the group
  #   CANCELS the one already waiting.
  #
  # On 2026-09-21T04:54Z four prod-load workflows were dispatched inside four
  # minutes and cancelled each other in a chain: this workflow was cancelled at
  # 04:55:00 by nightly-webkit, which was cancelled at 04:55:31 by
  # a11y-webkit-prod, which was cancelled at 04:58:29 by press-every-control.
  # A run cancelled at the workflow level has NO jobs, so the `notify` job
  # never runs and the nightly-red issue is never updated either way — the red
  # simply ages. Issue #1595 sat open for 207 hours that way.
  #
  # Re-verifying a fix is exactly when this bites, because re-verifying means
  # dispatching. Prod is still protected: the crons keep the shared group, and
  # the two journey JOBS below hold `prod-lifecycle-shared-accounts`, which is
  # what actually serialises the shared E2E accounts against prod-audit and
  # e2e-real-backend.
  group: ${{ format('e2e-journeys-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  preflight:
    needs: prod-load-turn
    name: What can run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      have_accounts: ${{ steps.check.outputs.have_accounts }}
    steps:
      - id: check
        env:
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
        run: |
          if [ -n "$POSTER_EMAIL" ] && [ -n "$POSTER_PASSWORD" ] && [ -n "$HELPER_EMAIL" ] && [ -n "$HELPER_PASSWORD" ]; then
            echo "have_accounts=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_accounts=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Journeys NOT run::PLAYWRIGHT_POSTER_EMAIL/_PASSWORD and PLAYWRIGHT_HELPER_EMAIL/_PASSWORD are not set."
            echo "- **User journeys: NOT COVERED** — the shared E2E account secrets are missing." >> "$GITHUB_STEP_SUMMARY"
          fi

  wait-accounts:
    # Q743: the job-level lock below is NOT a queue. GitHub keeps ONE pending job
    # per concurrency group and CANCELS it when a third arrives (press 36297157445,
    # e2e-journeys 36215839785 / 36215921402 / 36217255758). This lock-free job
    # waits its turn first and joins the group only when that bumps nobody
    # (scripts/e2e/wait-shared-accounts.mjs; src/test/sharedAccountLockQueues.test.ts).
    name: Wait for the shared accounts (queue)
    needs: preflight
    if: needs.preflight.outputs.have_accounts == 'true'
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs; the longest single holder is prod-audit (180).
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until joining the shared-accounts lock bumps no waiting job
        run: node scripts/e2e/wait-shared-accounts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  journeys:
    name: Journeys (journeys)
    needs: [preflight, wait-accounts]
    if: needs.preflight.outputs.have_accounts == 'true'
    runs-on: ubuntu-latest
    # Locked jobs hold the shared accounts <= 60 min (sharedAccountLockJobsAreShort.test.ts).
    # Measured 2026-09-30: journeys max 30.3 min over 44 runs, journeys-webkit max
    # 24.3 min among completed runs.
    timeout-minutes: 60
    # Workflow-level group is prod-load now; this job-level lock keeps the
    # shared-account serialisation with e2e-real-backend's push-triggered
    # prod-lifecycle job, which holds the same group.
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      # trailing-icon's /complete-profile leg signs this seed account in
      # (optionalSession); without it that leg skipped UNJUSTIFIED (#1719).
      PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }}
      PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }}
      SCENARIO: ${{ inputs.scenario }}
      # J8 presses Log Out, which today signs the account out on every device
      # (docs/OPEN.md). Allowed here only: this job holds the shared-accounts
      # concurrency group, and each run mints fresh sessions by password.
      JOURNEY_GLOBAL_SIGNOUT_OK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: bash scripts/ci/playwright-install.sh chromium
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

      - name: Provide the service-role key to the journeys (throwaway accounts, Q226/Q253)
        # 04-admin-safety.spec.ts bans a THROWAWAY account and hires one for the
        # no-show journey, so it creates and deletes per-run @mailinator users
        # with the service role, as privacy-journey.yml does. Set AFTER the
        # build above, so it can never reach the bundle.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF || 'fncmgoasalhdgfwzhsqa' }}
        run: |
          set -euo pipefail
          KEY=$(npx --yes supabase@2 projects api-keys --project-ref "$PROJECT_REF" --reveal -o json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).find(x=>x.name==="service_role");if(!k){process.exit(3)}process.stdout.write(k.api_key)})')
          echo "::add-mask::$KEY"
          test -n "$KEY"
          # An env var, NOT a .env file: a .env in the checkout switches other
          # journeys (trailing-icon's incomplete-e2e mint) into local mode.
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Sweep anything a previous run stranded
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          SWEEP_PHASE: pre
          E2E_STRIPE_MODE: ${{ vars.E2E_STRIPE_MODE }}
          PLAYWRIGHT_LIFECYCLE_JOB_ID: ${{ secrets.PLAYWRIGHT_LIFECYCLE_JOB_ID }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::error::could not mint a poster token"; exit 1; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            bash scripts/e2e/sweep-both-seats.sh

      - name: Run the journeys
        run: npx playwright test --project=journeys --workers=1 --reporter=list,./e2e/reporters/skipReporter.ts

      - name: Backend request budget (Q104)
        # Sums this job's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        # A `scenario` dispatch runs one journey (SCENARIO, job env): its
        # per-test number is not the suite's and the pinned journey may meter
        # nothing, so only the load ceiling is judged (Q702).
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label journeys ${SCENARIO:+--ceiling-only --allow-empty}
      - name: Keep milestones, failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journeys-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Unwind this run's rows even on failure
        if: always()
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          SWEEP_PHASE: teardown
          E2E_STRIPE_MODE: ${{ vars.E2E_STRIPE_MODE }}
          PLAYWRIGHT_LIFECYCLE_JOB_ID: ${{ secrets.PLAYWRIGHT_LIFECYCLE_JOB_ID }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::error::could not mint a token for teardown (Q52: an unwind that did not run is not green)"; exit 1; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            bash scripts/e2e/sweep-both-seats.sh

  journeys-webkit:
    name: Journeys (journeys-webkit)
    # After chromium, never beside it: both drive the same two accounts.
    # wait-accounts too: `always()` would otherwise run this leg into the lock
    # after a waiter that timed out, jumping the queue.
    needs: [preflight, journeys, wait-accounts]
    if: always() && needs.wait-accounts.result == 'success' && needs.preflight.outputs.have_accounts == 'true'
    runs-on: ubuntu-latest
    # Locked jobs hold the shared accounts <= 60 min (sharedAccountLockJobsAreShort.test.ts).
    # Measured 2026-09-30: journeys max 30.3 min over 44 runs, journeys-webkit max
    # 24.3 min among completed runs.
    timeout-minutes: 60
    # Workflow-level group is prod-load now; this job-level lock keeps the
    # shared-account serialisation with e2e-real-backend's push-triggered
    # prod-lifecycle job, which holds the same group.
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      # Same as the journeys job: trailing-icon's incomplete-e2e leg (#1719).
      PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }}
      PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }}
      SCENARIO: ${{ inputs.scenario }}
      # J8 presses Log Out, which today signs the account out on every device
      # (docs/OPEN.md). Allowed here only: this job holds the shared-accounts
      # concurrency group, and each run mints fresh sessions by password.
      JOURNEY_GLOBAL_SIGNOUT_OK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      # chromium too: payCheckoutSession pays Stripe's hosted page in Chromium
      # (e2e/journeys/fixtures.ts). The app never shows Stripe in its WKWebView.
      - run: bash scripts/ci/playwright-install.sh webkit chromium
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

      - name: Provide the service-role key to the journeys (throwaway accounts, Q226/Q253)
        # 04-admin-safety.spec.ts bans a THROWAWAY account and hires one for the
        # no-show journey, so it creates and deletes per-run @mailinator users
        # with the service role, as privacy-journey.yml does. Set AFTER the
        # build above, so it can never reach the bundle.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF || 'fncmgoasalhdgfwzhsqa' }}
        run: |
          set -euo pipefail
          KEY=$(npx --yes supabase@2 projects api-keys --project-ref "$PROJECT_REF" --reveal -o json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).find(x=>x.name==="service_role");if(!k){process.exit(3)}process.stdout.write(k.api_key)})')
          echo "::add-mask::$KEY"
          test -n "$KEY"
          # An env var, NOT a .env file: a .env in the checkout switches other
          # journeys (trailing-icon's incomplete-e2e mint) into local mode.
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Sweep anything a previous run stranded
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          SWEEP_PHASE: pre
          E2E_STRIPE_MODE: ${{ vars.E2E_STRIPE_MODE }}
          PLAYWRIGHT_LIFECYCLE_JOB_ID: ${{ secrets.PLAYWRIGHT_LIFECYCLE_JOB_ID }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::error::could not mint a poster token"; exit 1; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            bash scripts/e2e/sweep-both-seats.sh

      - name: Run the journeys
        run: npx playwright test --project=journeys-webkit --workers=1 --reporter=list,./e2e/reporters/skipReporter.ts

      - name: Backend request budget (Q104)
        # Sums this job's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        # A `scenario` dispatch runs one journey (SCENARIO, job env): its
        # per-test number is not the suite's and the pinned journey may meter
        # nothing, so only the load ceiling is judged (Q702).
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label journeys-webkit ${SCENARIO:+--ceiling-only --allow-empty}
      - name: Keep milestones, failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journeys-webkit-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Unwind this run's rows even on failure
        if: always()
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          SWEEP_PHASE: teardown
          E2E_STRIPE_MODE: ${{ vars.E2E_STRIPE_MODE }}
          PLAYWRIGHT_LIFECYCLE_JOB_ID: ${{ secrets.PLAYWRIGHT_LIFECYCLE_JOB_ID }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::error::could not mint a token for teardown (Q52: an unwind that did not run is not green)"; exit 1; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            bash scripts/e2e/sweep-both-seats.sh

  # A red nightly used to land nowhere; this opens/updates ONE nightly-red issue
  # and closes it on the next green run (.github/actions/nightly-issue-sync).
  notify:
    name: Report nightly result
    needs: [preflight, journeys, journeys-webkit]
    # A FULL run reports, whoever started it (2026-09-21, issue #1595).
    #
    # This used to be `github.event_name == 'schedule'` alone, which made the
    # red unclearable by the one action that clears reds: you fix the journeys,
    # dispatch them to prove it, they go green — and the issue stays open,
    # because a dispatch was not allowed to say so. #1595 sat open 207 hours
    # over journeys whose four failures had all been fixed days earlier. The
    # next scheduled run is Tue/Thu/Fri, so the proof waited on the calendar.
    #
    # The gate that IS needed is the one race-runner.yml already makes: a
    # PINNED run must not report, because it did not run the suite. `scenario`
    # narrows this workflow to a single test (SCENARIO=<id>), so a dispatch
    # reports only when it is empty — a whole-suite run, exactly what the
    # schedule fires. Anything narrower stays silent rather than closing an
    # issue it has not earned.
    #
    # And only from main (2026-09-26, #1719). The issue is main's state: a
    # dispatch on a fix branch that goes green has proved the BRANCH, and
    # closing the issue from it announced a green main that was still red
    # until the branch merged; a red branch run added "Still red" to main's
    # issue for a tree main never ran. Scheduled runs are always on main.
    #
    # And not from a CANCELLED run (2026-09-26, Q703): run 36211786791 was
    # cancelled before any test and still commented "Still red" on #1719.
    # `!cancelled()` runs this job after a failure (like always()) but not when
    # the run itself was cancelled, which earned nothing either way. A journey
    # JOB cancelled by its own timeout does not cancel the run, so it still
    # reports as a failure below (a timeout is a real red).
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.scenario == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: e2e-journeys
          status: ${{ (needs.journeys.result == 'success' && needs.journeys-webkit.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
