name: DB Smoke

# Catches the class of bug that took job posting down for ~2 days:
# trigger functions referencing columns that no longer exist, plus the
# notifications.type CHECK regression that silently 500'd state changes.
#
# Boots a Supabase-flavored Postgres in the runner (image bundles pg_cron,
# pg_net, supabase_vault, pgmq, and the auth/storage schemas), applies
# every migration in repo order, then exercises the previously-broken
# `INSERT INTO public.jobs` trigger fan-out path. If `column p.role does
# not exist` (or anything similar) ever resurfaces, this workflow fails
# the PR before merge.
#
# Cost-conscious:
# - Only runs when supabase/migrations/** changes
# - Uses ubuntu-latest (cheapest)
# - Concurrency-cancels superseded runs
# - ~3-5 min run time

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-smoke.yml"
  workflow_dispatch:

concurrency:
  group: db-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Apply migrations + post-job trigger smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Supabase's own Postgres distribution: includes pg_cron, pg_net,
        # supabase_vault, pgmq, plpgsql_check, and the standard
        # auth/storage/realtime/extensions schemas with the expected roles
        # (authenticated, anon, service_role). This eliminates the 100+
        # extension/role/publication-related errors we'd hit on stock
        # postgres:16.
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: helpr_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U postgres > /dev/null 2>&1; then
              echo "✅ Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Postgres failed to become ready"
          exit 1

      - name: Belt-and-suspenders schema/role bootstrap
        # The supabase/postgres image already provides auth/storage schemas
        # and the standard roles, but a few rare migrations still expect
        # specific objects to pre-exist (e.g. publications). We make these
        # idempotent so the migrations can layer on top cleanly.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- supabase_realtime publication (some migrations ALTER it).
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname='supabase_realtime') THEN
              CREATE PUBLICATION supabase_realtime;
            END IF;
          END $$;

          -- Some early migrations INSERT INTO storage.buckets before
          -- storage extension is wired. Make sure it exists.
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL UNIQUE,
            owner uuid,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            public boolean DEFAULT false,
            avif_autodetection boolean DEFAULT false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );

          -- Reserved roles — the supabase/postgres image ships these, but
          -- be defensive for older image tags.
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END $$;
          SQL

      - name: Apply all migrations in order
        run: |
          set -e
          echo "Applying migrations from supabase/migrations/ in lexicographic order..."
          FAIL=0
          FIRST_FAIL=""
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$(basename $f)"
            if ! psql -v ON_ERROR_STOP=1 -f "$f"; then
              echo "::error file=$f::Migration failed"
              FAIL=1
              [ -z "$FIRST_FAIL" ] && FIRST_FAIL="$f"
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Migration(s) failed. First failure: $FIRST_FAIL"
            exit 1
          fi
          echo "✅ All migrations applied"

      - name: Smoke — post a job, expect triggers to fire cleanly
        # The actual P0: every INSERT INTO public.jobs invokes
        # notify_helpers_on_job_post() and notify_saved_searches_on_new_job(),
        # both of which used to throw `column p.role does not exist`. This
        # test creates a fake user, then inserts a job, and FAILS LOUDLY if
        # any trigger raises. Wrapped in a transaction + ROLLBACK to leave no
        # state.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO auth.users (id, email) VALUES (gen_random_uuid(), 'smoke@helpr.test');
          INSERT INTO public.profiles (user_id, full_name, approval_status)
            SELECT id, 'Smoke Tester', 'approved' FROM auth.users WHERE email='smoke@helpr.test';
          INSERT INTO public.jobs (
            title, description, category, budget, location, parish, status,
            customer_id, date_needed
          )
          SELECT
            '[CI smoke] post-job trigger check',
            'Auto-generated by db-smoke.yml — never persists.',
            'cleaning', 50, 'Test Address', 'Orleans', 'open',
            (SELECT id FROM auth.users WHERE email='smoke@helpr.test'),
            CURRENT_DATE + INTERVAL '7 days'
          ;
          ROLLBACK;
          SELECT '✅ post-job triggers ran cleanly — no column-does-not-exist errors';
          SQL

      - name: Smoke — notifications.type CHECK accepts every emitted type
        # The 2026-05-04 hidden P0: a trigger inserted notifications.type='work_status'
        # but the CHECK constraint only knew 7 types. Every accepted→in_progress
        # transition silently 500'd. This test inserts every type the codebase
        # actually emits and fails if any are rejected.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            t text;
            types text[] := ARRAY[
              'info', 'success', 'warning', 'job_update', 'application',
              'review', 'payment',
              'job_match', 'job_updates', 'work_status', 'transit_updates',
              'system_alert', 'new_offers', 'expired', 'financial_alerts',
              'verified'
            ];
            tester_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users (id, email)
              VALUES (tester_id, 'notif-smoke@helpr.test');

            FOREACH t IN ARRAY types LOOP
              BEGIN
                INSERT INTO public.notifications (user_id, type, title, message)
                VALUES (tester_id, t, 'smoke', 'smoke test row');
              EXCEPTION WHEN check_violation THEN
                RAISE EXCEPTION 'notifications.type=% rejected by CHECK constraint — keep notifications_type_check in sync with code', t;
              END;
            END LOOP;

            DELETE FROM public.notifications WHERE user_id = tester_id;
            DELETE FROM auth.users WHERE id = tester_id;
            RAISE NOTICE '✅ All % notification types accepted', array_length(types, 1);
          END $$;
          SQL

      - name: Sanity-check the previously-broken role functions
        # Belt-and-suspenders: directly invoke each function that contained a
        # `p.role` reference. They should all return without error after the
        # fix migration applied.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.get_approved_helpers(1);
          SELECT * FROM public.get_top_helpers_by_parish(NULL, 1);
          SELECT * FROM public.get_hero_parishes();
          SELECT * FROM public.get_helper_tiers(1);
          SELECT * FROM public.get_parish_activity(1);
          SELECT * FROM public.get_safe_profiles(ARRAY[]::uuid[]);
          SELECT '✅ all previously-broken role functions return without error';
          SQL

      - name: Static guard — no p.role = 'helper'-style hardcoded role strings
        # Belt-and-suspenders #2: even if the DB tests pass, fail the PR if
        # anyone reintroduces a string-literal role comparison anywhere in
        # the codebase. The fix is always: has_role(uid, 'role'::app_role).
        run: |
          set -e
          PAT="(profiles?|p)\\.role\\s*=\\s*'(helper|customer|admin|client|provider)'"
          MATCHES=$(grep -rEn -i \
            --include='*.sql' --include='*.ts' --include='*.tsx' \
            "$PAT" \
            supabase/ src/ 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Hardcoded role-string comparison found — use has_role(uid, 'role'::app_role) instead"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No hardcoded role-string comparisons found"
