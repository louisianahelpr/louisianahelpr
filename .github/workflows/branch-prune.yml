name: Branch prune

# delete_branch_on_merge only fires on a MERGED PR. Branches from PRs closed
# unmerged (superseded by a batch PR) and stray pushes piled up on origin.
# This runs the same cleanup for branches whose every patch is already on main
# (`git cherry` shows no `+`) and that no open PR uses. Anything with work not
# on main is UNLANDED: kept, and listed in the job summary for a human.
# STRANDED branches (work on neither main nor an open PR) get an auto-land PR
# with rebase auto-merge, opened with REFRESH_PR_TOKEN because PRs opened with
# GITHUB_TOKEN never trigger the required checks. An auto-land PR open over 6h
# turns this red.
# Script + decision function: scripts/prune-stale-branches.mjs
# Guard: src/test/pruneStaleBranches.test.ts
#
# The `stranded` job (docs/OPEN.md Q1146; owner 2026-10-03: "nothing should
# ever be left stranded", "nothing should ever be closed without merging")
# checks by CONTENT, not patch or subject: every origin branch no open PR
# carries, every PR closed without merging since 2026-10-03 (refs/pull/N/head,
# so a deleted branch still counts), and every PR open over 3 days. Anything
# not on main and not recorded in docs/audit/stranded-accepted.json turns this
# red. Script: scripts/stranded-work.mjs. Guard: src/test/strandedWork.test.ts.

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: branch-prune
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prune branches on main; auto-land stranded ones
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/prune-stale-branches.mjs --apply

  stranded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Nothing stranded on GitHub (branches, closed-unmerged PRs, stale PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/stranded-work.mjs --remote --check --no-fetch

  # A red scheduled run files/updates one nightly-red issue (closed on the next
  # green). Push runs are already reported by main-red-watch.
  notify:
    name: Report nightly result
    needs: [prune, stranded]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: branch-prune
          status: ${{ (needs.prune.result == 'success' && needs.stranded.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
