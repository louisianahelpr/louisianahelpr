name: iOS Beta (TestFlight)

permissions:
  contents: read

# DISABLED automatic cron — macos-15 runners are billed at the highest
# tier on GitHub-hosted runners; even with the cheap ubuntu `check`
# gatekeeper skipping no-op nights, days with merged commits burn ~$1.30
# of macOS time apiece. This was the primary driver of an unexpected
# ~$16 monthly bill on what is supposed to be a free-tier account.
# Same pattern that prompted capacitor-check.yml's disable.
#
# Manual run remains: Actions tab → "iOS Beta (TestFlight)" → "Run workflow".
# To re-enable nightly builds, uncomment the `schedule` block below.
on:
  workflow_dispatch:
    inputs:
      build_number_floor:
        description: "Optional: force build number to be at least this value (use to skip past a 'Redundant Binary Upload' error from App Store Connect)"
        required: false
        default: ""
  # schedule:
  #   # 08:00 UTC ≈ 03:00 America/Chicago — keeps TestFlight no more than a
  #   # day behind main; the `check` job no-ops when main hasn't changed.
  #   - cron: "0 8 * * *"

concurrency:
  group: ios-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap ubuntu gatekeeper. On a scheduled run it skips the macOS build
  # entirely when main has no new commits in the last day, so idle nights
  # cost no runner minutes. Manual dispatch always builds.
  check:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch — building unconditionally."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='25 hours ago' --oneline HEAD)" ]; then
            echo "main has new commits in the last 25h — nightly build will run."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "main unchanged in the last 25h — skipping nightly build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Build & upload to TestFlight
    needs: check
    if: needs.check.outputs.should_build == 'true'
    # macos-15 image ships with Xcode 26 (iOS 26 SDK), required by Apple
    # for all App Store / TestFlight uploads from April 28, 2026 onward.
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # Force GitHub Actions to use Node 24 for its internal JS-based actions
      # (checkout, setup-node, etc.) so they don't trip on the EOL Node 20 runtime.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ─── App Store Connect API key (already configured as repo secrets) ──────
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Accept either ASC_KEY_CONTENT (preferred) or ASC_KEY_BASE64 (legacy name).
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT || secrets.ASC_KEY_BASE64 }}
      DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}

      # ─── Existing Apple Distribution .p12 certificate import ────────────────
      # Export the already-created Distribution cert + private key as .p12,
      # base64 it, and store it in these GitHub secrets. This avoids creating
      # more Apple Distribution certificates in CI.
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      # Ephemeral keychain so we don't pollute the runner's default keychain.
      MATCH_KEYCHAIN_NAME: fastlane_tmp_keychain
      MATCH_KEYCHAIN_PASSWORD: ${{ github.run_id }}

      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      # Operator-supplied floor to bypass App Store Connect's "Redundant Binary
      # Upload" 409 when its API lags behind a previously-uploaded build.
      BUILD_NUMBER_FLOOR: ${{ inputs.build_number_floor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Ruby (for Fastlane + CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Select Xcode 26 (iOS 26 SDK)
        # Apple requires builds compiled with the iOS 26 SDK (Xcode 26+) for
        # all App Store Connect / TestFlight uploads starting April 28, 2026.
        # macos-15 runners ship with multiple Xcode installs — pick the highest
        # Xcode 26.x available. We export DEVELOPER_DIR to $GITHUB_ENV so it
        # persists across every subsequent step (including Fastlane/gym),
        # which resolves Xcode via DEVELOPER_DIR before falling back to the
        # runner default.
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "❌ No Xcode 26.x found on runner. Available:"
            ls -d /Applications/Xcode*.app 2>/dev/null
            echo ""
            echo "Apple requires Xcode 26+ for App Store uploads from April 28, 2026."
            echo "If Xcode 26 is missing from this image, update the runner label to one that includes it."
            exit 1
          fi
          echo "▶ Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Verify iOS 26 SDK before upload
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          XCODE_VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "▶ Active Xcode: $XCODE_VER"
          MAJOR=$(echo "$XCODE_VER" | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then
            echo "❌ Xcode $XCODE_VER is too old. This build would trigger App Store Connect warning 90725."
            exit 1
          fi
          if ! xcodebuild -showsdks | grep -E "iphoneos26|iOS 26"; then
            echo "❌ iOS 26 SDK is not available in the selected Xcode."
            exit 1
          fi
          echo "✓ Xcode $XCODE_VER with iOS 26 SDK is active"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web bundle
        # These MUST be present or the shipped app is dead on launch.
        #
        # `.env` is gitignored, so CI has no copy, and this step had no VITE_*
        # env block at all. `import.meta.env.VITE_SUPABASE_URL` therefore
        # resolved to undefined, `createClient(undefined, undefined)` threw at
        # MODULE SCOPE in src/integrations/supabase/client.ts, and because
        # App.tsx imports that eagerly the throw landed before
        # createRoot().render(<App/>). React never mounted, the native splash
        # auto-hid after 1.5s, and the app sat on index.html's #boot-loader —
        # the wrought-iron H — forever, with no error surfaced anywhere.
        #
        # Reproduced by building with .env moved aside: the bundle contained
        # ZERO occurrences of the Supabase URL and shipped the string
        # "supabaseUrl is required" instead. Every CI-built TestFlight build
        # was affected; locally-cut fastlane builds were fine because .env
        # exists on that machine, which is what made it look intermittent.
        #
        # These are the PUBLISHABLE/anon keys — public by design and already
        # present in every web bundle — not service-role secrets.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APPLE_MAPKIT_TOKEN: ${{ secrets.VITE_APPLE_MAPKIT_TOKEN }}
          # Bake the commit SHA in as the Sentry release tag so the runtime
          # `release` the shipped app reports matches the release the
          # "Upload iOS sourcemaps to Sentry" step below creates. Without
          # this the app reports the "1.0.0" fallback (src/lib/sentry.ts) and
          # the uploaded maps are attached to a release nothing references —
          # stack traces stay minified.
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is empty — the build would ship an app that cannot boot. Set the repo secret."; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is empty — the build would ship an app that cannot boot. Set the repo secret."; exit 1; }
          npm run build:ios

      - name: Verify the bundle can actually reach Supabase
        # Fail the BUILD rather than ship a bundle that dies at launch.
        #
        # Greps for the PROJECT REF, not "supabase.co" — the latter appears in
        # supabase-js's own code even when the env vars are missing, so it
        # passes on a broken bundle. Verified: a build with .env removed
        # contains ZERO occurrences of the ref, and a good build contains it in
        # client-*.js. The ref is public (it is in every web bundle and in the
        # app's network calls); it is not a secret.
        run: |
          if ! grep -rq "fncmgoasalhdgfwzhsqa" dist/assets/*.js; then
            echo "::error::Built bundle contains no Supabase URL — it would hang on the boot-loader. Check the VITE_* repo secrets."
            exit 1
          fi
          echo "✓ bundle carries the Supabase config"

      - name: Sync Fastlane metadata into Xcode
        run: bundle exec fastlane ios sync_xcode_metadata --verbose

      - name: Verify committed iOS Xcode project
        # The Xcode project is committed because it contains the existing
        # com.Helpr App Store identity and native capabilities.
        run: |
          test -d ios/App/App.xcodeproj || (echo "❌ Missing committed ios/App/App.xcodeproj" && exit 1)
          test -f ios/App/App/Info.plist || (echo "❌ Missing committed Info.plist" && exit 1)
          test -f ios/App/App/App.entitlements || (echo "❌ Missing committed App.entitlements" && exit 1)
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.Helpr;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "DEVELOPMENT_TEAM = P85MCK558V;" ios/App/App.xcodeproj/project.pbxproj
          echo "✓ Committed iOS project matches com.Helpr / P85MCK558V"

      - name: Sync Capacitor → iOS
        # Refreshes the web bundle in ios/App/App/public and runs pod install
        # to wire up native plugins.
        #
        # The rm is not belt-and-braces: `cap sync` copies INTO this directory
        # without pruning it, so any file a previous plain `npm run build` left
        # behind (notably the PWA service worker) survives the sync and ships
        # inside the .ipa. That is exactly what failed build 4827 — and a
        # service worker in the native shell pins users to stale cached HTML.
        run: |
          rm -rf ios/App/App/public
          npx cap sync ios

      - name: Strip sourcemaps from the native bundle
        # `cap sync` copies dist/ wholesale, so every chunk's .js.map lands in
        # the .ipa — 20.3 MB of maps against 5.2 MB of JS as of 2026-08-27,
        # i.e. ~20 MB added to every user's App Store download.
        #
        # Nothing reads them: vite.config.ts uses `sourcemap: "hidden"`, so no
        # `//# sourceMappingURL=` comment is emitted and no runtime ever looks
        # for a map beside a chunk. Sentry symbolicates from maps UPLOADED by
        # .github/workflows/sentry-release.yml, never from the device copy.
        #
        # dist/ keeps its maps — only ios/App/App/public/ is pruned — so the
        # upload step below still has the full set.
        run: npm run strip:ios-sourcemaps

      - name: Verify iOS bundle is fresh and offline-only
        run: node scripts/verify-ios-bundle.mjs

      - name: Upload iOS sourcemaps to Sentry
        # sentry-release.yml symbolicates the WEB build (`npm run build`). The
        # iOS build (`npm run build:ios`, VITE_CAPACITOR_BUILD=1) produces a
        # different entry chunk, so ~35 of its 386 chunks have hashes the web
        # upload never covered. Uploading the iOS maps here closes that gap.
        #
        # No-ops with a warning when the Sentry secrets are absent, so the
        # TestFlight build never fails on account of observability wiring.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::Sentry secrets not configured — skipping iOS sourcemap upload. Native crash reports will show minified frames. Add SENTRY_AUTH_TOKEN, SENTRY_ORG and SENTRY_PROJECT to repo secrets."
            exit 0
          fi
          npx @sentry/cli@2 releases new "$GITHUB_SHA"
          npx @sentry/cli@2 releases files "$GITHUB_SHA" \
            upload-sourcemaps ./dist/assets --url-prefix '~/assets'
          npx @sentry/cli@2 releases finalize "$GITHUB_SHA"

      - name: Archive iOS sourcemaps as a build artifact
        # Fallback symbolication path: even with Sentry unconfigured, the maps
        # for this exact build are retrievable for 30 days rather than lost.
        uses: actions/upload-artifact@v7
        with:
          name: ios-sourcemaps-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: dist/assets/*.map

      - name: Verify Fastlane workspace and required secrets
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          echo "Workspace: $(pwd)"
          test -d fastlane || (echo "::error::Missing fastlane/ directory at repo root" && exit 1)
          test -f fastlane/Fastfile || (echo "::error::Missing fastlane/Fastfile at repo root" && exit 1)
          echo "fastlane/ contents:"
          ls -la fastlane

          missing=()
          test -n "$ASC_KEY_ID" || missing+=("ASC_KEY_ID")
          test -n "$ASC_ISSUER_ID" || missing+=("ASC_ISSUER_ID")
          test -n "$ASC_KEY_CONTENT" || missing+=("ASC_KEY_CONTENT")
          test -n "$DEVELOPER_TEAM_ID" || missing+=("DEVELOPER_TEAM_ID")
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" || missing+=("IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run Fastlane beta lane
        id: fastlane_beta
        working-directory: ${{ github.workspace }}
        env:
          FASTLANE_VERBOSE: "1"
          # Surface full backtraces from Fastlane / Ruby on failure.
          FASTLANE_DISABLE_COLORS: "1"
        run: bundle exec fastlane ios beta --verbose

      - name: Dump Fastlane diagnostics on failure
        if: failure() && steps.fastlane_beta.conclusion == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::group::Fastlane lane context"
          echo "Repo:           ${GITHUB_REPOSITORY}"
          echo "Ref:            ${GITHUB_REF}"
          echo "SHA:            ${GITHUB_SHA}"
          echo "Run ID:         ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
          echo "Runner:         ${RUNNER_OS} ${RUNNER_ARCH}"
          echo "Working dir:    $(pwd)"
          echo "Xcode:          $(xcodebuild -version 2>&1 | tr '\n' ' ' || true)"
          echo "Ruby:           $(ruby -v || true)"
          echo "Bundler:        $(bundle -v || true)"
          echo "Fastlane:       $(bundle exec fastlane --version 2>&1 | tail -n 5 || true)"
          echo "CocoaPods:      $(pod --version || true)"
          echo "Node:           $(node -v || true)"
          echo "::endgroup::"

          echo "::group::fastlane/ tree"
          ls -la fastlane/ 2>/dev/null || echo "(no fastlane/ dir)"
          echo "::endgroup::"

          echo "::group::Fastlane lanes"
          bundle exec fastlane lanes 2>&1 || true
          echo "::endgroup::"

          echo "::group::Fastlane env (sanitized)"
          bundle exec fastlane env 2>&1 \
            | sed -E 's/(KEY|TOKEN|PASSWORD|SECRET|AUTHORIZATION)[^ ]*/\1=***REDACTED***/gi' \
            || true
          echo "::endgroup::"

          echo "::group::gym build log (tail)"
          GYM_LOG="$HOME/Library/Logs/gym"
          if [ -d "$GYM_LOG" ]; then
            LATEST=$(ls -t "$GYM_LOG"/*.log 2>/dev/null | head -n 1)
            if [ -n "$LATEST" ]; then
              echo "Showing last 400 lines of $LATEST"
              tail -n 400 "$LATEST"
            else
              echo "(no gym logs found in $GYM_LOG)"
            fi
          else
            echo "(no $GYM_LOG directory)"
          fi
          echo "::endgroup::"

          echo "::group::xcodebuild raw logs (tail)"
          XCODE_LOG_DIR="$HOME/Library/Developer/Xcode/DerivedData"
          if [ -d "$XCODE_LOG_DIR" ]; then
            find "$XCODE_LOG_DIR" -name '*.xcactivitylog' -type f 2>/dev/null \
              | head -n 3 \
              | while read -r f; do
                  echo "Activity log: $f"
                done
          else
            echo "(no DerivedData directory)"
          fi
          echo "::endgroup::"

      - name: Upload Fastlane & gym logs
        if: failure() && steps.fastlane_beta.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fastlane-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ~/Library/Logs/gym/**
            ~/Library/Logs/fastlane/**
            fastlane/report.xml
            build/**/*.log

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain fastlane_tmp_keychain 2>/dev/null || true
          rm -f ~/.ssh/id_ed25519 2>/dev/null || true
