# iOS TestFlight deploy — STUB
#
# This workflow is a starting point. To enable it you need to add the
# following GitHub secrets and uncomment the workflow body:
#
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_CONTENT   (base64 of the .p8 file)
#   MATCH_PASSWORD                       (if using fastlane match)
#   MATCH_GIT_URL                        (if using fastlane match)
#   KEYCHAIN_PASSWORD
#
# See fastlane/Fastfile for available lanes.

name: Deploy iOS to TestFlight

on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - "ios-v*"

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-14
    if: false # remove once secrets are configured

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install npm deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync ios

