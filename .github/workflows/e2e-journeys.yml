name: E2E user journeys

# Real-user journeys (e2e/journeys/) against the DEPLOYED app and the REAL
# backend: prod Supabase, the two shared E2E accounts, Stripe on its test key.
# Modeled on e2e-real-backend.yml's prod-lifecycle job: same secrets, same
# sweeper before and after, same shared-accounts concurrency group so the two
# workflows never drive the same accounts at once. Payment legs detect the
# Stripe mode from the Checkout Session id and SKIP with an ::warning:: on a
# live key, never charge and never pass silently.
#
# No app build: the journeys drive the DEPLOYED site (PLAYWRIGHT_BASE_URL), so
# they test exactly the bundle users get.

permissions:
  contents: read

on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Pin one scenario (SCENARIO=<id from a test title>)"
        type: string
        default: ""

concurrency:
  group: prod-lifecycle-shared-accounts
  cancel-in-progress: false

jobs:
  preflight:
    name: What can run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      have_accounts: ${{ steps.check.outputs.have_accounts }}
    steps:
      - id: check
        env:
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
        run: |
          if [ -n "$POSTER_EMAIL" ] && [ -n "$POSTER_PASSWORD" ] && [ -n "$HELPER_EMAIL" ] && [ -n "$HELPER_PASSWORD" ]; then
            echo "have_accounts=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_accounts=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Journeys NOT run::PLAYWRIGHT_POSTER_EMAIL/_PASSWORD and PLAYWRIGHT_HELPER_EMAIL/_PASSWORD are not set."
            echo "- **User journeys: NOT COVERED** — the shared E2E account secrets are missing." >> "$GITHUB_STEP_SUMMARY"
          fi

  journeys:
    name: Journeys (journeys)
    needs: preflight
    if: needs.preflight.outputs.have_accounts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://www.louisianahelpr.com' }}
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx playwright install --with-deps chromium

      - name: Sweep anything a previous run stranded
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::error::could not mint a poster token"; exit 1; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            node scripts/e2e/prod-lifecycle-sweeper.mjs

      - name: Run the journeys
        run: npx playwright test --project=journeys --workers=1 --reporter=list

      - name: Keep milestones, failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Unwind this run's rows even on failure
        if: always()
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::warning::could not mint a token for teardown"; exit 0; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            node scripts/e2e/prod-lifecycle-sweeper.mjs

  journeys-webkit:
    name: Journeys (journeys-webkit)
    # After chromium, never beside it: both drive the same two accounts.
    needs: [preflight, journeys]
    if: always() && needs.preflight.outputs.have_accounts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://www.louisianahelpr.com' }}
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx playwright install --with-deps webkit

      - name: Sweep anything a previous run stranded
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::error::could not mint a poster token"; exit 1; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            node scripts/e2e/prod-lifecycle-sweeper.mjs

      - name: Run the journeys
        run: npx playwright test --project=journeys-webkit --workers=1 --reporter=list

      - name: Keep milestones, failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-webkit-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Unwind this run's rows even on failure
        if: always()
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::warning::could not mint a token for teardown"; exit 0; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            node scripts/e2e/prod-lifecycle-sweeper.mjs

  # A red nightly used to land nowhere; this opens/updates ONE nightly-red issue
  # and closes it on the next green run (.github/actions/nightly-issue-sync).
  notify:
    name: Report nightly result
    needs: [preflight, journeys, journeys-webkit]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: e2e-journeys
          status: ${{ (needs.journeys.result == 'success' && needs.journeys-webkit.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
