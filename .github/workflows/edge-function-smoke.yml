name: Edge Function Smoke Test

permissions:
  contents: read

# Verifies that critical edge functions boot and respond after deploy.
# Catches Deno import errors, missing env vars, and runtime crashes that
# only surface when functions are actually invoked.
#
# Runs:
# - Weekly on schedule, Thu 11:17 UTC (catches secret expirations / Supabase
#   outages); was daily until the 2026-09-14 prod-load spread
# - NOT on push: functions-deploy.yml already covers the post-deploy check
# - Manually via workflow_dispatch
#
# Note: Reduced from hourly to daily to conserve GitHub Actions minutes.
# Real outages will be caught by Sentry / user reports much faster than CI.
#
# PROJECT REF: the URLs below must point at `fncmgoasalhdgfwzhsqa` — the
# Supabase project this app actually runs on, and the only project in the
# account. They used to point at `steigdwrpkosbiycshwz`, which no longer
# exists: the app migrated after 2026-04-26 and this workflow did not move
# with it.
#
# Nothing caught that for four months, because the automatic triggers below
# are disabled. The last real run was 2026-04-26, when the old project was
# still alive and the check genuinely passed — a manual-dispatch workflow
# pointed at a dead host looks identical to a healthy one until someone runs
# it. If the project ref changes again, this file has to move with it.
#
# The key below is the PUBLISHABLE (anon) key, safe to commit — it ships in
# the client bundle. The value it replaced was the OLD project's anon JWT,
# dead since the same migration.
#
# REMOVED 2026-08-27: a second step probed
# /functions/v1/get-stripe-public-key. No such function exists — there is no
# source for it under supabase/functions/ and nothing in src/ or the other
# functions calls it; the live URL returns 404. Because the assertion only
# tripped on >= 500, the 404 sailed through and the step printed
# "✅ Stripe public key endpoint healthy (HTTP 404)" on every run. It was
# deleted rather than repointed: there is no real endpoint it was meant to
# hit, so tightening the assertion would only have produced a check that
# fails forever. Any future probe added here must assert the exact status it
# expects (== 401, == 200), never merely "< 500" — a not-found endpoint
# passes that test.

on:
  # Runs weekly (was daily; prod-load spread 2026-09-14). This was switched off in April 2026 to stop "burning Actions
  # minutes" — but the repo is PUBLIC, where ubuntu runners are free and
  # unlimited, so the schedule was never costing anything. What its absence
  # did cost was ~114 consecutive days with nothing smoke-testing the edge
  # functions that carry the Stripe escrow paths. Re-enabled.
  #
  # The push-on-path trigger stays off on purpose: a functions deploy already
  # runs functions-deploy.yml, so it would only duplicate that.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - "supabase/functions/**"
  schedule:
    # Thu 11:17 UTC (prod load spread, 2026-09-14).
    - cron: "17 11 * * 4"
  workflow_dispatch:

concurrency:
  # PROD LOAD (2026-09-14): prod-hitting crons are spread across 03:00-13:00 UTC,
  # >= 2h apart, and share the prod-load concurrency group; see
  # src/test/prodWorkflowSpacing.test.ts before moving this.
  #
  # A SCHEDULED run joins prod-load; a workflow_dispatch gets its OWN group
  # (2026-09-21, issues #1595/#1626). `cancel-in-progress: false` does NOT mean
  # "queue forever" — GitHub keeps exactly ONE *pending* run per group, so a
  # third run entering it CANCELS the one already waiting. On 2026-09-21T04:54Z
  # four prod-load workflows dispatched inside four minutes cancelled each
  # other in a chain, and a workflow-level cancellation leaves a run with NO
  # jobs, so nothing reports it. See e2e-real-backend.yml, which has made this
  # split since the money loop lost a dispatch the same way.
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('edge-function-smoke-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Health-check edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for deploy to propagate
        # Edge functions deploy automatically but take a few seconds to be live.
        run: sleep 30

      - name: Hit health-check endpoint
        # health-check requires server-to-server auth via CRON_SECRET (Bearer token).
        #
        # A missing CRON_SECRET now FAILS. It used to `exit 0`, which meant an
        # unset, expired or rotated-away secret rendered as a green check that
        # had in fact probed nothing — the same "reports healthy without
        # looking" failure as the removed get-stripe-public-key step below.
        # The secret has been configured since 2026-08-19, so the skip branch is
        # only reachable if someone deletes it, which is exactly the event this
        # check should shout about rather than absorb.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_ANON_KEY: sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP
        run: |
          set -e
          URL="https://fncmgoasalhdgfwzhsqa.supabase.co/functions/v1/health-check"
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET repo secret not set — this workflow cannot probe anything."
            echo "    Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Pinging $URL"
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/response.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ health-check returned $HTTP_CODE — edge functions are unhealthy"
            exit 1
          fi
          echo "✅ Edge functions are responding"

  # A RED RUN HAS TO LAND SOMEWHERE. Added 2026-09-23 after edge-function-smoke — along
  # with 13 other scheduled workflows — was found failing with nobody told.
  # The drift detector had been red for THREE CONSECUTIVE DAYS (09-20, 09-21,
  # 09-22) and the nightly DB backup had not succeeded since 09-21; both are
  # invisible unless somebody opens the Actions tab, which is exactly the
  # thing the owner said nobody does.
  #
  # `nightly-issue-sync` opens/updates ONE `nightly-red` issue for this
  # workflow and closes it on the next green run, which is what makes the
  # "Nightly reds nobody read" gate able to see it at all.
  #
  # SCHEDULE AND MANUAL RUNS ONLY. A push/PR failure is already visible on the
  # commit and the PR; filing an issue for it would make the label noisy and
  # teach people to ignore it.
  notify:
    name: Report nightly result
    needs: [smoke]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: edge-function-smoke
          status: ${{ needs.smoke.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
