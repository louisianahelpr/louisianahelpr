name: Security Audit

permissions:
  contents: read
  security-events: write

# Scans dependencies for known CVEs. Apple's review process flags apps that
# ship with vulnerable libraries, so we want to catch these before submission.
#
# Runs:
# - Weekly on Mondays (catches newly-disclosed CVEs in existing deps)
# - NOT on PRs: weekly is enough for a scan gated on lockfile changes
# - Manually via workflow_dispatch

on:
  # Runs weekly. The "Dependabot already covers this" rationale that switched
  # it off was only half true: Dependabot alerts on PUBLISHED advisories for
  # declared deps, while this runs `npm audit` against the fully resolved
  # lockfile, so it catches transitive findings Dependabot does not open a PR
  # for. Free on a public repo either way.
  #
  # The PR-path trigger stays off to keep PR checks lean — weekly is enough
  # for a scan whose input only changes when the lockfile does.
  #
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "package.json"
  #     - "package-lock.json"
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (high + critical)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run npm audit (production deps only)
        # We only fail on CRITICAL vulnerabilities in PRODUCTION dependencies.
        # Rationale:
        #   - Dev dependencies (vite, vite-plugin-pwa, etc.) don't ship to users
        #     or to the App Store — their CVEs can't affect end users.
        #   - High-severity CVEs in transitive devDeps often require major
        #     version bumps that introduce breaking changes; we triage those
        #     manually rather than auto-failing CI.
        #   - Critical CVEs in production deps DO ship to users and must block.
        # The full report is still printed so we can review moderate/high
        # findings during the weekly run.
        run: |
          echo "::group::Full audit report (all severities, all deps)"
          npm audit --audit-level=low || true
          echo "::endgroup::"
          echo ""
          echo "::group::Production-only audit (moderate+ = fail; prod deps were 0 on 2026-09-23, Q17)"
          npm audit --omit=dev --audit-level=moderate
          echo "::endgroup::"

  # A RED RUN HAS TO LAND SOMEWHERE. Added 2026-09-23 after security-audit — along
  # with 13 other scheduled workflows — was found failing with nobody told.
  # The drift detector had been red for THREE CONSECUTIVE DAYS (09-20, 09-21,
  # 09-22) and the nightly DB backup had not succeeded since 09-21; both are
  # invisible unless somebody opens the Actions tab, which is exactly the
  # thing the owner said nobody does.
  #
  # `nightly-issue-sync` opens/updates ONE `nightly-red` issue for this
  # workflow and closes it on the next green run, which is what makes the
  # "Nightly reds nobody read" gate able to see it at all.
  #
  # SCHEDULE AND MANUAL RUNS ONLY. A push/PR failure is already visible on the
  # commit and the PR; filing an issue for it would make the label noisy and
  # teach people to ignore it.
  notify:
    name: Report nightly result
    needs: [npm-audit]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: security-audit
          status: ${{ needs.npm-audit.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
