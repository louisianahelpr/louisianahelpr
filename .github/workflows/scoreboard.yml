name: Scoreboard

# docs/SCOREBOARD.md + the "Everything open" block of docs/OPEN.md, re-measured
# (docs/OPEN.md Q58/Q59; owner 2026-09-23: "always keep a current ledger to
# show numbers ... what's passing / failing").
#
# scripts/scoreboard.mjs --write reads every workflow's last result on main,
# the test/spec counts from the suites' logs, the ops alert ledger and DB
# health (read-only SQL through the Management API), the open nightly-red
# issues and the remote branches, and measures each Q66 target (scripts/slo.mjs:
# uptime from uptime.yml runs, API 5xx rate from edge_logs, payment success,
# notification delivery and time to payout from prod tables). A row it cannot
# measure says UNKNOWN.
#
# LANDING (Q57): the `land` job rebuilds the two files on LATEST main with
# `scoreboard.mjs --live-from` (only the measured LIVE sections are carried;
# OPEN.md itself is main's, since lanes edit it all day) and lands them through
# .github/actions/refresh-pr: one bot branch, one PR, auto-merge on green.
# The job summary and artifact stay (the morning page reads the artifact).
#
# Daily at 19:17 UTC: the prod-load spacing rule (src/test/
# prodWorkflowSpacing.test.ts) wants >= 90 min from every other daily
# prod-hitting cron and 30 min from prod-errors' :47. The committed copy's age
# is enforced by scripts/check-staleness.mjs (72h), nightly.

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  group: ${{ format('scoreboard-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  measure:
    needs: prod-load-turn
    name: Re-measure the scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the remote-branch row runs git cherry against every branch
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Measure every signal (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/scoreboard.mjs --write
      # docs/OPEN.md is the ONE open-work list (owner, 2026-09-27): measure the
      # feeds it mirrors (open nightly-red issues, open ops_alert_ledger rows);
      # the land job files a queue item for any source without one.
      - name: Measure the OPEN.md feeds (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/open-sync-trackers.mjs --measure-only --out docs/audit/open-feeds.json
      - name: Publish as the job summary
        if: always()
        run: |
          if [ -f docs/SCOREBOARD.md ]; then cat docs/SCOREBOARD.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the regenerated files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scoreboard
          # test-results/slo/: the dated SLO record (Q66, scripts/slo.mjs).
          path: |
            docs/SCOREBOARD.md
            docs/OPEN.md
            docs/audit/open-feeds.json
            test-results/slo/
          retention-days: 90

  land:
    name: Land the re-measured scoreboard (Q57 refresh PR)
    needs: [measure]
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY write grant in this workflow (Q57): push the bot branch, open or
    # update its PR, and dispatch its checks (a github.token PR triggers none).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scoreboard
          path: ${{ runner.temp }}/measured
      - uses: ./.github/actions/refresh-pr
        with:
          id: scoreboard
          title: "chore(refresh): scoreboard + Everything-open block re-measured"
          paths: |
            docs/SCOREBOARD.md
            docs/OPEN.md
            docs/audit/open-feeds.json
          measured-dir: ${{ runner.temp }}/measured
          regenerate: node scripts/open-sync-trackers.mjs --from "$MEASURED/docs/audit/open-feeds.json" && node scripts/scoreboard.mjs --live-from "$MEASURED"
          github-token: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          check-workflows: ${{ vars.REFRESH_PR_CHECK_WORKFLOWS }}

  notify:
    name: Report result
    needs: [measure, land]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: scoreboard
          status: ${{ (needs.measure.result == 'success' && needs.land.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
