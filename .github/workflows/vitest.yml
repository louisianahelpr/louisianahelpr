name: Vitest

# Dedicated Vitest workflow whose `Vitest unit tests` job name is the
# distinct status-check ID used in main's branch-protection required-checks
# list. It runs `npx vitest run` on a Linux runner (ubuntu-latest, 1x
# billing) to close the gap noted in memory `vitest-not-in-ci`:
# unit tests were never executing in CI, so a green pipeline did NOT mean
# tests passed.
#
# The combined `test.yml` workflow already runs lint + typecheck + build +
# vitest in a single job, but it's a single status check that covers four
# concerns — splitting Vitest out into its own workflow gives it a
# dedicated, branch-protection-addressable check whose failure points
# cleanly at unit-test regressions instead of being lumped into the more
# general "Lint, type-check, build, test" line item.
#
# Linux runner choice is deliberate — memory `github-actions-macos-billing`
# documents how `macos-15` minutes burned ~$16/mo from a single rogue
# scheduled job. Vitest runs identically on Linux for our pure-JS test
# suite, so there is no reason to spend the 10x multiplier.

permissions:
  contents: read
  pull-requests: read

env:
  # JavaScript-based Actions on Node 24 ahead of the platform default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - ".github/dependabot.yml"
      - "LICENSE"
  # No paths-ignore on pull_request: `Vitest unit tests` is a required
  # branch-protection check, so skipping it on docs-only PRs would leave
  # the check "Expected" forever and deadlock auto-merge.
  pull_request:
    branches: [main]
  # The merge queue's own run. merge_group takes no paths filter, so it always
  # starts and the queue cannot wait on it forever. It never deploys.
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fast follow-up commit
# doesn't keep an outdated Vitest run burning minutes.
concurrency:
  # Finish runs on main instead of cancelling them. Direct-to-main pushes land
  # minutes apart, so cancel-in-progress left Test/Vitest/smoke almost always
  # 'cancelled' and a real failure could not show (2026-09-13). GitHub still
  # replaces an older QUEUED run with the newest one, so main never backs up.
  group: vitest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Guide fast lane (owner, 2026-11-20): a PR that changes only the guide lane
  # (scripts/ci/guide-only.mjs GUIDE_CONTENT: gift-guide content, guide-only
  # scripts and tests) skips the Vitest and Coverage shards and runs the
  # "Guide fast lane" job below instead. Any other PR, a push, the merge queue,
  # or a scope job that fails runs everything (the shards' `if` reads
  # != 'true', so an empty answer runs them). Guard: src/test/guideFastLane.test.ts.
  scope:
    name: Guide-only PR?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      guide_only: ${{ steps.guide.outputs.guide_only }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guide-only PR?
        id: guide
        if: github.event_name == 'pull_request'
        run: |
          node scripts/ci/guide-only.mjs > guide.json
          node -p 'const j=require("./guide.json"); j.guideOnly ? `guide-only PR: ${j.files.length} test file(s) read the changed files` : `${j.changed} changed file(s): the whole suite runs`'

  # 2026-10-04 (owner: "how can we get stuff to get on main faster"): the suite
  # runs in SIX parallel shards (was four; owner 2026-10-05 "how can we make this go
  # faster": the four took 2-5 min each, so six bring the slowest near 3 min), and the
  # `Vitest unit tests` job below, the branch-protection check name, only
  # reports whether every shard passed. A shard that fails, is cancelled or is
  # skipped fails the check: it never reads as green.
  vitest-shard:
    name: Vitest shard ${{ matrix.shard }}/6
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.guide_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      # Docs-only fast path (owner, 2026-10-06: "why are the ticks taking so
      # long"): a PR that changes only docs/ (OPEN.md ticks, generated counts)
      # runs just the tests that read those files (scripts/ci/docs-only-tests.mjs).
      # Anything else runs the whole suite. Guard: src/test/docsOnlyFastPath.test.ts.
      - name: Scope (docs-only PR?)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            CHANGED_FILES=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
            export CHANGED_FILES
            node scripts/ci/docs-only-tests.mjs > scope.json
          elif [ "$EVENT" = "merge_group" ]; then
            # A queue entry has no PR number, so its change is the event's base
            # against the checked-out commit (never the event's head_sha: CodeQL's
            # untrusted-checkout query flags that). A base it cannot read runs the
            # whole suite, never less.
            if [ -n "$MG_BASE" ] && git fetch --no-tags --depth=1 origin "$MG_BASE" && CHANGED_FILES=$(git diff --no-renames --name-only "$MG_BASE" "$GITHUB_SHA"); then
              export CHANGED_FILES
              node scripts/ci/docs-only-tests.mjs > scope.json
            else
              echo "::notice::merge group base not readable: the whole suite runs"
              echo '{"docsOnly":false,"files":[]}' > scope.json
            fi
          else
            # Only a pull request can take the fast path; a push runs everything.
            echo '{"docsOnly":false,"files":[]}' > scope.json
          fi
          echo "docs_only=$(node -p 'require("./scope.json").docsOnly')" >> "$GITHUB_OUTPUT"
          node -p 'const j=require("./scope.json"); j.docsOnly ? `docs-only PR: ${j.files.length} test file(s) read the changed docs` : "the whole suite runs"'

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so CI heals a stale lockfile
        # instead of failing the run if package-lock.json drifts — same
        # pattern as test.yml.
        if: ${{ steps.scope.outputs.docs_only != 'true' || matrix.shard == 1 }}
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run Vitest
        # `--reporter=default` keeps the GitHub Actions summary readable;
        # `--passWithNoTests` would mask "I deleted every test" bugs, so
        # we deliberately do NOT pass it.
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: npx vitest run --reporter=default --shard=${{ matrix.shard }}/6

      - name: Run the tests that read the changed docs
        if: ${{ steps.scope.outputs.docs_only == 'true' && matrix.shard == 1 }}
        run: |
          set -euo pipefail
          node -p 'require("./scope.json").files.join("\n")' | xargs npx vitest run --reporter=default

  # Typecheck, the production build (so a generator change that breaks the
  # generated data or the prerender is caught), every test that reads the
  # changed files (the picker follows imports two levels deep and always adds
  # the giftGuide*, goLinks* and giftWish* suites), and the sitemap drift check.
  # Lint, the inventories and the asset-weight check still run in test.yml's
  # required "Lint, type-check, build, test" job, which this lane never skips.
  guide-fast-lane:
    name: Guide fast lane
    needs: scope
    if: ${{ needs.scope.outputs.guide_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # Re-picks on this job's own checkout and fails closed if the PR is no
      # longer guide-only (the scope answer is never trusted blindly).
      - name: Pick the tests that read the changed files
        run: |
          set -euo pipefail
          node scripts/ci/guide-only.mjs > guide.json
          test "$(node -p 'require("./guide.json").guideOnly')" = "true"
          node -p 'require("./guide.json").files.join("\n")'

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Production build
        # The publishable Vite vars, as test.yml's build has them (require-build-env refuses a bundle without them).
        # Publishable/anon values only; they ship in the client bundle by design.
        env:
          VITE_SUPABASE_PROJECT_ID: "fncmgoasalhdgfwzhsqa"
          VITE_SUPABASE_URL: "https://fncmgoasalhdgfwzhsqa.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP"
        run: npm run build

      - name: Sitemap drift
        run: node scripts/generate-sitemap.mjs --check

      - name: Run the tests that read the changed files
        # No --passWithNoTests: an empty pick fails (the picker always adds the guide suites).
        run: |
          set -euo pipefail
          node -p 'require("./guide.json").files.join("\n")' | xargs npx vitest run --reporter=default

  vitest:
    name: Vitest unit tests
    needs: [scope, vitest-shard, guide-fast-lane]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A guide-only PR passes only when the fast lane passed; every other run
      # only when every shard passed. Failed, cancelled or skipped never reads green.
      - name: Every shard passed (or, guide-only, the fast lane passed)
        env:
          GUIDE_ONLY: ${{ needs.scope.outputs.guide_only }}
          SHARDS: ${{ needs.vitest-shard.result }}
          LANE: ${{ needs.guide-fast-lane.result }}
        run: |
          echo "guide_only: $GUIDE_ONLY shards: $SHARDS fast lane: $LANE"
          if [ "$GUIDE_ONLY" = "true" ]; then
            test "$LANE" = "success"
          else
            test "$SHARDS" = "success"
          fi

  coverage-shard:
    # Q184 (owner, 2026-09-27): a line-coverage floor for src/lib + src/hooks.
    # Its own jobs, in parallel, because v8 instrumentation slows the suite by
    # ~30% (measured on run 36349571652: 1106s vs 846s) and pushed two 20s
    # tests past their timeout. Test FAILURES are the Vitest shards' to report;
    # these jobs' verdict is the floor, so the run step may fail (continue-on-
    # error) but coverage is still written (reportOnFailure in vitest.config.ts)
    # and the floor step fails closed when the summary is missing.
    #
    # SHARDED 2026-10-29 (issue #3685). History: 35 min, then 45 (2026-10-15,
    # test step 1673-2050 s). The one unsharded job then outgrew 45: on main,
    # 9 of the 10 runs 40767328047..40826566218 were cancelled at 44.9-45.4 min
    # with every Vitest shard green; one finished (40809041129, test step
    # 37.0 min). Cancelled run 40826566218 had printed 17014 test dots of the
    # 21915 a finished run prints, so a whole run needs about 58 min on such a
    # runner. Four shards each write a blob report carrying their coverage; the
    # "Coverage floor" job below merges them (vitest --merge-reports) and runs
    # the floor on the WHOLE suite's coverage. A local trial merged two shards'
    # blobs to exactly the unsharded run's figure (132/12481 lines).
    #
    # SIX shards since 2026-11-22: with four, shard 1 alone outgrew the 30-min
    # limit while still printing results (27.7 min on main run 44964200555,
    # then cancelled at 30.0 on PR #4868's head and on main run 45015102967,
    # 11:02-11:32Z, last test output 11:30Z), and shards 2-4 took 21-28 min.
    # More shards, not a longer limit: the same suite in six slices, as the
    # Vitest shards have it.
    name: Coverage shard ${{ matrix.shard }}/6
    # Not in the merge queue: the floor is not a required check, and the PR before
    # it and the push after it both run it. The coverage shards (20-30 min each
    # with four, 2026-11-22) would be the largest part of every queue entry.
    # Not on a guide-only PR either: the guide lane is outside src/lib and
    # src/hooks code, the floor's scope.
    needs: scope
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.scope.outputs.guide_only != 'true' }}
    runs-on: ubuntu-latest
    # 30: a sixth of the suite under coverage (2026-11-22; a quarter outgrew it)
    # plus install, with headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      # Docs-only fast path (owner, 2026-10-06: "why are the ticks taking so
      # long"): a PR that changes only docs/ (OPEN.md ticks, generated counts)
      # skips the coverage run: a docs change cannot move code coverage.
      # Anything else runs the whole suite. Guard: src/test/docsOnlyFastPath.test.ts.
      - name: Scope (docs-only PR?)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            CHANGED_FILES=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
            export CHANGED_FILES
            node scripts/ci/docs-only-tests.mjs > scope.json
          else
            # Only a pull request can take the fast path; a push runs everything.
            echo '{"docsOnly":false,"files":[]}' > scope.json
          fi
          echo "docs_only=$(node -p 'require("./scope.json").docsOnly')" >> "$GITHUB_OUTPUT"
          node -p 'const j=require("./scope.json"); j.docsOnly ? `docs-only PR: ${j.files.length} test file(s) read the changed docs` : "the whole suite runs"'

      - name: Install dependencies
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run Vitest with coverage
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        id: shard_cov
        continue-on-error: true
        run: npx vitest run --reporter=dot --reporter=blob --outputFile.blob=coverage-blobs/blob-${{ matrix.shard }}-6.json --coverage --testTimeout=60000 --shard=${{ matrix.shard }}/6

      # Fails closed: a shard that wrote no blob (it crashed before reporting)
      # must never merge into a partial, lower coverage figure. The test
      # outcome is printed; its pass/fail verdict is the Vitest shards' job.
      - name: Blob written
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        env:
          TESTS_OUTCOME: ${{ steps.shard_cov.outcome }}
        run: |
          echo "coverage shard test run outcome: $TESTS_OUTCOME"
          test -s coverage-blobs/blob-${{ matrix.shard }}-6.json

      - name: Upload blob
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: coverage-blobs/blob-${{ matrix.shard }}-6.json
          retention-days: 3
          if-no-files-found: error

  coverage:
    # The check name stays "Coverage floor" (scripts/land-queue.mjs gates on
    # it). It merges the six coverage shards' blobs and floors the whole suite.
    name: Coverage floor
    needs: [scope, coverage-shard]
    if: ${{ always() && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      # Same scope as the shards: a docs-only PR ran no coverage, so there is
      # nothing to merge or floor. Guard: src/test/docsOnlyFastPath.test.ts.
      - name: Scope (docs-only PR?)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            CHANGED_FILES=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
            export CHANGED_FILES
            node scripts/ci/docs-only-tests.mjs > scope.json
          else
            echo '{"docsOnly":false,"files":[]}' > scope.json
          fi
          echo "docs_only=$(node -p 'require("./scope.json").docsOnly')" >> "$GITHUB_OUTPUT"

      # A coverage shard that failed, was cancelled or was skipped fails the
      # floor: its coverage is missing, so a merged figure would be partial.
      # A guide-only PR ran no coverage shards, so it passes here and every
      # later step skips (guide_only gates them like docs_only).
      - name: Every coverage shard finished
        env:
          COV_SHARDS: ${{ needs.coverage-shard.result }}
          GUIDE_ONLY: ${{ needs.scope.outputs.guide_only }}
        run: |
          echo "coverage shards: $COV_SHARDS guide_only: $GUIDE_ONLY"
          if [ "$GUIDE_ONLY" = "true" ]; then
            test "$COV_SHARDS" = "skipped"
          else
            test "$COV_SHARDS" = "success"
          fi

      - name: Install dependencies
        if: ${{ steps.scope.outputs.docs_only != 'true' && needs.scope.outputs.guide_only != 'true' }}
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Download blobs
        if: ${{ steps.scope.outputs.docs_only != 'true' && needs.scope.outputs.guide_only != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: coverage-blobs

      - name: All six blobs arrived
        if: ${{ steps.scope.outputs.docs_only != 'true' && needs.scope.outputs.guide_only != 'true' }}
        run: |
          ls -l coverage-blobs
          test "$(ls coverage-blobs/blob-*-6.json | wc -l)" -eq 6

      - name: Merge shard coverage
        if: ${{ steps.scope.outputs.docs_only != 'true' && needs.scope.outputs.guide_only != 'true' }}
        id: vitest_cov
        # The merge replays the shards' results, so a failed test makes it exit
        # non-zero; the coverage summary is still written and the floor reads it.
        continue-on-error: true
        run: npx vitest --merge-reports=coverage-blobs --reporter=dot --coverage

      - name: Coverage floor (Q184)
        if: ${{ steps.scope.outputs.docs_only != 'true' && needs.scope.outputs.guide_only != 'true' }}
        env:
          # Read back so a failed test run shows in this job's log; the tests'
          # pass/fail verdict belongs to the Vitest job above.
          TESTS_OUTCOME: ${{ steps.vitest_cov.outcome }}
        run: node scripts/check-coverage-floor.mjs
