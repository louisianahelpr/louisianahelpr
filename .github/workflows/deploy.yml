# =============================================================================
# Helpr — iOS Deploy Pipeline (TestFlight + App Store)
# =============================================================================
#
# ─── How to trigger ──────────────────────────────────────────────────────────
# 1. GitHub → Actions → "Deploy iOS (TestFlight / App Store)"
# 2. Click "Run workflow" and choose:
#       lane = beta     → TestFlight build (auto-bumps build number)
#       lane = release  → App Store submission (also bumps version if you set one)
#       version         → optional, e.g. "1.0.5". Required when lane = release
#                         AND you want to ship a new marketing version.
# 3. Click "Run workflow" again to start.
#
# Auto-trigger: pushing a git tag like `v1.0.5` runs the `release` lane
# automatically with that version number.
#
# ─── Required GitHub Secrets ────────────────────────────────────────────────
#   ASC_KEY_ID            App Store Connect API Key ID            e.g. B38QR4VAKC
#   ASC_ISSUER_ID         App Store Connect Issuer UUID           e.g. 55c4b380-...
#   ASC_KEY_BASE64        base64 of the .p8 file
#                         macOS:   base64 -i AuthKey_XXXX.p8 | pbcopy
#                         Linux:   base64 -w0 AuthKey_XXXX.p8
#   DEVELOPER_TEAM_ID     Apple Developer team ID                 e.g. P85MCK558V
#   FASTLANE_APPLE_ID     Apple ID email                          e.g. lexilombas05@gmail.com
#   FASTLANE_PASSWORD     App-specific password from appleid.apple.com
#   ASC_TEAM_ID           App Store Connect team ID (only if Apple ID is on multiple teams)
#   KEYCHAIN_PASSWORD     Any random string (used for the temp keychain on the runner)
#
# ─── Optional ────────────────────────────────────────────────────────────────
#   SLACK_WEBHOOK         Incoming webhook URL for build notifications
#
# ─── App identifiers ─────────────────────────────────────────────────────────
#   Bundle ID:   com.Helpr
#   App Name:    Helpr
#   SKU:         Helpr
#   Team ID:     P85MCK558V
#   Apple ID:    6754470134
#   Entity:      Helpr, LLC
# =============================================================================

name: Deploy iOS (TestFlight / App Store)

permissions:
  contents: read

env:
  # Force JavaScript-based GitHub Actions onto Node 24 ahead of the platform default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane to run"
        required: true
        default: "beta"
        type: choice
        options:
          - beta      # → TestFlight
          - release   # → App Store review
      version:
        description: "Marketing version (e.g. 1.0.5). Leave empty to keep current."
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"   # e.g. v1.0.5 → triggers `release` lane

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Stage 0: Preflight — verify all required Apple/Fastlane secrets exist.
  # Fails fast with a clear list of what's missing so we don't burn macOS
  # minutes on a build that can't possibly sign or upload.
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight — check required secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required secrets
        env:
          ASC_KEY_ID:        ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:     ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64:    ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_CONTENT:   ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          MISSING=()
          [ -z "$ASC_KEY_ID"         ] && MISSING+=("ASC_KEY_ID")
          [ -z "$ASC_ISSUER_ID"      ] && MISSING+=("ASC_ISSUER_ID")
          # Either ASC_KEY_BASE64 or ASC_KEY_CONTENT is acceptable.
          if [ -z "$ASC_KEY_BASE64" ] && [ -z "$ASC_KEY_CONTENT" ]; then
            MISSING+=("ASC_KEY_BASE64 (or ASC_KEY_CONTENT)")
          fi
          [ -z "$DEVELOPER_TEAM_ID"  ] && MISSING+=("DEVELOPER_TEAM_ID")
          [ -z "$FASTLANE_APPLE_ID"  ] && MISSING+=("FASTLANE_APPLE_ID")
          [ -z "$FASTLANE_PASSWORD"  ] && MISSING+=("FASTLANE_PASSWORD")
          [ -z "$KEYCHAIN_PASSWORD"  ] && MISSING+=("KEYCHAIN_PASSWORD")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required GitHub secrets for iOS deploy:"
            for s in "${MISSING[@]}"; do echo "   • $s"; done
            echo ""
            echo "Add them under: Settings → Secrets and variables → Actions"
            echo "See the header comment in .github/workflows/deploy.yml for"
            echo "details on where to obtain each value."
            exit 1
          fi
          echo "✅ All required secrets are present — proceeding to build."

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 1: Code quality gates (fail fast before burning macOS minutes)
  # ───────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint, Type-check, Build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: ESLint (advisory — does not block deploy)
        run: npm run lint || true
        continue-on-error: true

      # BLOCKING (owner, 2026-08-27). This step was named "TypeScript type
      # check" but ended in `|| true`, so it could not fail — an App Store
      # release could ship with type errors while this reported green. The
      # lint step above is at least labelled advisory; this one read as a gate
      # and was not one. It is already blocking on every push to main via
      # test.yml, so this should not newly break a release that was passing.
      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Production build (verifies no build errors)
        run: npm run build

      - name: Guard against console.log in built bundle
        run: |
          # Vite's esbuild `drop` removes our own console.* calls in production.
          # Some vendor chunks (supabase-js, jspdf, firebase) reference
          # `console.log` legitimately as a logger property or feature-detect,
          # so we exclude those known-safe vendor bundles from the check.
          OFFENDERS=$(grep -lE "console\.log" dist/assets/*.js 2>/dev/null \
            | grep -vE "/(supabase|jspdf|firebase|charts|motion|stripe)-" \
            | grep -vE "/index-[A-Za-z0-9_-]+\.js$" || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::warning::console.log statements found in production bundle:"
            echo "$OFFENDERS"
          else
            echo "✓ No stray console.log in application bundle (vendor refs ignored)"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 2: Build, sign, and upload via Fastlane
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build & upload via Fastlane
    needs: quality
    # Capacitor 8 requires Xcode 26+ for iOS builds.
    # Selecting an older toolchain can surface misleading Swift compile errors
    # like "value of type 'any CAPBridgeProtocol' has no member 'webView'"
    # from official plugins even when the JS package versions are correct.
    runs-on: macos-15
    timeout-minutes: 90

    env:
      ASC_KEY_ID:        ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:     ${{ secrets.ASC_ISSUER_ID }}
      DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      ASC_TEAM_ID:       ${{ secrets.ASC_TEAM_ID }}
      FASTLANE_HIDE_CHANGELOG:              "1"
      FASTLANE_SKIP_UPDATE_CHECK:           "1"
      FASTLANE_DISABLE_COLORS:              "1"
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
      LC_ALL: en_US.UTF-8
      LANG:   en_US.UTF-8

    steps:
      # ─── Resolve which lane + version we're running ────────────────────────
      - name: Resolve lane and version
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            LANE="release"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LANE="${{ github.event.inputs.lane }}"
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "lane=$LANE"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "▶ Lane: $LANE"
          echo "▶ Version override: ${VERSION:-<none, keeping current>}"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Verify signing inputs before build
        env:
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
        run: |
          if [ -z "$DEVELOPER_TEAM_ID" ]; then
            echo "❌ Missing GitHub secret: DEVELOPER_TEAM_ID"
            exit 1
          fi

          if ! grep -q "def configure_signing!" fastlane/Fastfile; then
            echo "❌ This checkout does not include the updated Fastlane signing helper"
            exit 1
          fi

          echo "✓ DEVELOPER_TEAM_ID secret is present"
          grep -nE "def configure_signing!|DEVELOPER_TEAM_ID env var is required for signing|configure_signing!" fastlane/Fastfile

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Ruby (with Bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select Xcode 26
        # macos-15 runners can include multiple Xcode installs. Pick the
        # highest Xcode 26.x available so Capacitor 8 uses its supported
        # toolchain instead of falling back to an older version.
        # We export DEVELOPER_DIR to $GITHUB_ENV so it persists across every
        # subsequent step (including Fastlane). `xcode-select -s` alone is not
        # enough — Fastlane/gym resolves Xcode via DEVELOPER_DIR first, and
        # without it the runner's default may be used and official Capacitor
        # plugins can fail with misleading bridge/webView Swift errors.
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "❌ No Xcode 26.x found on runner. Available:"
            ls -d /Applications/Xcode*.app 2>/dev/null
            echo ""
            echo "Capacitor 8 requires Xcode 26+."
            echo "If Xcode 26 is missing from this image, update the runner label to one that includes it."
            exit 1
          fi
          echo "▶ Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      # ─── Web + Capacitor build ─────────────────────────────────────────────
      - name: Install npm deps
        run: npm install --legacy-peer-deps

      - name: Check outdated Capacitor plugins (advisory)
        continue-on-error: true
        run: npm outdated "@capacitor/*" || true

      - name: Build web bundle
        run: npm run build:ios

      - name: Sync Fastlane metadata into Xcode
        run: bundle exec fastlane ios sync_xcode_metadata --verbose

      # The iOS Xcode project is committed because it contains the App Store
      # identity/capabilities for the existing com.Helpr record. Do not
      # regenerate it in CI or signing/capability settings can be lost.
      - name: Verify committed iOS Xcode project
        run: |
          test -d ios/App/App.xcodeproj || (echo "❌ Missing committed ios/App/App.xcodeproj" && exit 1)
          test -f ios/App/App/Info.plist || (echo "❌ Missing committed Info.plist" && exit 1)
          test -f ios/App/App/App.entitlements || (echo "❌ Missing committed App.entitlements" && exit 1)
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.Helpr;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "DEVELOPMENT_TEAM = P85MCK558V;" ios/App/App.xcodeproj/project.pbxproj
          grep -q 'INFOPLIST_KEY_CFBundleDisplayName = "'"$(cat fastlane/metadata/en-US/name.txt)"'";' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'INFOPLIST_KEY_LSApplicationCategoryType = "public.app-category.lifestyle";' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_NAME = "'"$(cat fastlane/metadata/en-US/name.txt)"'";' ios/App/App.xcodeproj/project.pbxproj
          grep -q "<key>LSApplicationCategoryType</key>" ios/App/App/Info.plist
          echo "✓ Committed iOS project matches Louisiana Helpr / com.Helpr / P85MCK558V"

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Verify iOS bundle is fresh and offline-only
        run: node scripts/verify-ios-bundle.mjs

      # Keep the template entitlement file and active target entitlement file in sync.
      - name: Install PrivacyInfo + entitlements into Xcode project
        run: |
          set -e
          cp ios/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          cp ios/App.entitlements      ios/App/App/App.entitlements
          echo "✓ PrivacyInfo.xcprivacy and App.entitlements copied"

      # Generate all 18 AppIcon sizes from the 1024 source. Idempotent.
      - name: Generate iOS app icons
        run: node scripts/generate-ios-icons.mjs

      - name: Prepare iOS dependencies
        working-directory: ios/App
        run: |
          set -e
          if [ -f "Podfile" ]; then
            echo "▶ Podfile found — installing CocoaPods dependencies"
            pod repo update
            pod install --repo-update
          elif [ -f "App.xcodeproj/project.pbxproj" ]; then
            echo "▶ No Podfile found — using Swift Package Manager dependencies"
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          else
            echo "❌ Neither Podfile nor App.xcodeproj found in ios/App. Listing contents:"
            ls -la
            exit 1
          fi

      # ─── Pre-submission validation ─────────────────────────────────────────
      - name: Validate iOS assets and config
        run: |
          set -e
          echo "▶ Checking required iOS files..."
          test -f ios/PrivacyInfo.xcprivacy        || (echo "❌ Missing PrivacyInfo.xcprivacy" && exit 1)
          test -d ios/App/App/Assets.xcassets/AppIcon.appiconset || (echo "❌ Missing AppIcon.appiconset" && exit 1)
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png \
            || test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png \
            || echo "::warning::1024×1024 marketing icon not found at expected path — verify in Xcode"

          echo "▶ Verifying bundle ID = com.Helpr"
          BUNDLE_ID=$(grep -E "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj | head -1 | sed 's/.*= //' | tr -d ' ;')
          echo "   Found: $BUNDLE_ID"
          if [[ "$BUNDLE_ID" != "com.Helpr" ]]; then
            echo "❌ Bundle ID mismatch — expected com.Helpr, got $BUNDLE_ID"
            exit 1
          fi
          APP_NAME="$(cat fastlane/metadata/en-US/name.txt)"
          grep -q 'INFOPLIST_KEY_CFBundleDisplayName = "'"$APP_NAME"'";' ios/App/App.xcodeproj/project.pbxproj \
            || (echo "❌ Xcode Display Name is not synced from fastlane metadata" && exit 1)
          grep -q 'INFOPLIST_KEY_LSApplicationCategoryType = "public.app-category.lifestyle";' ios/App/App.xcodeproj/project.pbxproj \
            || (echo "❌ Xcode App Category is not committed as Lifestyle" && exit 1)
          grep -q 'PRODUCT_NAME = "'"$APP_NAME"'";' ios/App/App.xcodeproj/project.pbxproj \
            || (echo "❌ Xcode Product Name is not synced from fastlane metadata" && exit 1)
          echo "✓ All pre-submission checks passed"

      # ─── App Store Connect API key ─────────────────────────────────────────
      # Materialize the base64-encoded .p8 into a real file before Fastlane runs.
      # This keeps null-byte / malformed-secret failures out of `app_store_connect_api_key`
      # and lets Fastlane consume a standard AuthKey_<KEY_ID>.p8 path.
      - name: Prepare App Store Connect API key file
        id: asc_key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_BASE64" ]; then
            echo "❌ ASC_KEY_BASE64 secret is empty or missing"
            exit 1
          fi
          if [ -z "$ASC_KEY_ID" ]; then
            echo "❌ ASC_KEY_ID secret is empty or missing"
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          export KEY_PATH

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["ASC_KEY_BASE64"].strip()
          key_path = Path(os.environ["KEY_PATH"])

          try:
              decoded = base64.b64decode("".join(raw.split()), validate=True)
          except Exception as exc:
              raise SystemExit(f"ASC_KEY_BASE64 is not valid base64: {exc}")

          if b"\x00" in decoded:
              raise SystemExit("ASC_KEY_BASE64 decoded to binary data with null bytes; re-copy the .p8 file as plain base64 text.")

          text = decoded.decode("utf-8").replace("\r\n", "\n").strip() + "\n"
          if "BEGIN PRIVATE KEY" not in text or "END PRIVATE KEY" not in text:
              raise SystemExit("ASC_KEY_BASE64 did not decode to a valid .p8 private key.")

          key_path.write_text(text, encoding="utf-8")
          PY

          openssl pkey -in "$KEY_PATH" -noout >/dev/null
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"
          echo "✓ ASC_KEY_PATH prepared at $KEY_PATH"

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      # ─── Version + build number bumping ────────────────────────────────────
      - name: Bump marketing version (release only, if requested)
        if: steps.resolve.outputs.lane == 'release' && steps.resolve.outputs.version != ''
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          echo "▶ Setting MARKETING_VERSION to $VERSION"
          cd ios/App
          xcrun agvtool new-marketing-version "$VERSION"

      # Build number is always auto-incremented inside the Fastfile.

      # ─── Generate changelog from recent commits ────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          mkdir -p fastlane/metadata/en-US
          {
            echo "Build ${{ github.run_number }} — $(date -u +%Y-%m-%d)"
            echo ""
            git log -n 20 --pretty=format:"• %s" --no-merges
          } > fastlane/changelog.txt
          # TestFlight "What to Test" notes
          cp fastlane/changelog.txt fastlane/metadata/review_information/notes.txt 2>/dev/null || true
          echo "path=fastlane/changelog.txt" >> "$GITHUB_OUTPUT"
          echo "▶ Changelog:"
          cat fastlane/changelog.txt

      # ─── Final Xcode sanity check ──────────────────────────────────────────
      # Capacitor 8 plugins need Xcode 26+. If something earlier
      # silently fell back to an older Xcode, fail loudly here with a clear
      # message instead of letting Fastlane surface confusing Swift errors
      # like "value of type 'any CAPBridgeProtocol' has no member 'webView'".
      - name: Verify Xcode 26 is active
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          XCODE_VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "▶ Active Xcode: $XCODE_VER"
          MAJOR=$(echo "$XCODE_VER" | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then
            echo "❌ Xcode $XCODE_VER is too old. Capacitor 8 requires Xcode 26+."
            echo "   The 'Select Xcode 26' step did not take effect."
            exit 1
          fi
          echo "✓ Xcode $XCODE_VER is compatible with Capacitor 8"

      # ─── Run the lane ──────────────────────────────────────────────────────
      - name: Run Fastlane (${{ steps.resolve.outputs.lane }})
        env:
          CHANGELOG_PATH: ${{ steps.changelog.outputs.path }}
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.asc_key.outputs.path }}
          # Provide the raw base64 too — the Fastfile prefers ASC_KEY_CONTENT
          # and falls back to ASC_KEY_BASE64 (the original secret name).
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT || secrets.ASC_KEY_BASE64 }}
          ASC_KEY: ""
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          # Required by Fastfile for cert import (avoids hitting Apple's
          # max-distribution-certificates limit by reusing an existing one).
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MATCH_KEYCHAIN_NAME: fastlane_tmp_keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: bundle exec fastlane ios ${{ steps.resolve.outputs.lane }}

      # ─── Artifacts + logs ──────────────────────────────────────────────────
      - name: Read final version + build number
        if: always()
        id: meta
        run: |
          # Best-effort version read. If Fastlane failed earlier, the Xcode
          # project may not exist or agvtool may print nothing — we fall back
          # to a safe single-line value so GitHub Actions output parser
          # doesn't choke. Never emit empty or multi-line strings here.
          VER="0.0.0"
          BLD="0"
          if [ -d ios/App ]; then
            cd ios/App
            VER=$(xcrun agvtool what-marketing-version -terse1 2>/dev/null | tr -d '[:space:]' || true)
            BLD=$(xcrun agvtool what-version -terse 2>/dev/null | tr -d '[:space:]' || true)
            [ -z "$VER" ] && VER="0.0.0"
            [ -z "$BLD" ] && BLD="0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build=$BLD"   >> "$GITHUB_OUTPUT"
          echo "▶ Shipped Helpr $VER ($BLD)"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helpr-${{ steps.resolve.outputs.lane }}-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.build }}
          path: |
            build/*.ipa
            build/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Fastlane logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fastlane-logs-${{ github.run_number }}
          path: ~/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7

      # ─── Notifications ─────────────────────────────────────────────────────
      - name: Notify Slack — success
        if: success() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ Helpr ${{ steps.resolve.outputs.lane }} succeeded — v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.build }})\nTestFlight: https://appstoreconnect.apple.com/apps/6754470134/testflight\"}" \
            "$SLACK_WEBHOOK" || true

      - name: Notify Slack — failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Helpr ${{ steps.resolve.outputs.lane }} failed — run ${{ github.run_number }}\nLogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK" || true

      # ─── Cleanup ───────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
