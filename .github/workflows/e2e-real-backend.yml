name: E2E real backend

permissions:
  contents: read

# The other side of the mock boundary.
#
# WHY THIS WORKFLOW EXISTS
# ------------------------
# Every Playwright spec the rest of CI runs talks to a mock. 28 of 36 specs
# install `page.route()` stubs, and `e2e-happy-path.yml` invokes
# `--project=happy-path`, whose entire testDir is mocked. A mock accepts any
# request and returns whatever the fixture says, so an entire class of defect is
# structurally invisible to it — and every launch blocker an external QA pass
# found in September 2026 sat on the far side of that boundary:
#
#   * guest browse returned HTTP 401 for months; a mock returns 200
#   * `rpc_withdraw_dispute` was dead for every caller; mocks run no triggers
#   * the password minimum is 12, not the 8 the client enforces; mocks run no GoTrue
#   * six fixtures used `payment_status: "paid"`, a value the CHECK constraint
#     has never admitted; a mock accepts any string
#
# The real-backend specs already existed — `e2e/auth.spec.ts`,
# `e2e/payment-lifecycle.spec.ts`, `e2e/two-role-lifecycle.spec.ts` — and had
# never run in CI, because the env vars they gate on were set by no workflow.
# They self-skip, so their absence looked like a pass.
#
# HOW THE THREE LEGS DIFFER, AND WHY
# ----------------------------------
#  1. anon-surface — needs NOTHING and is STRICTLY READ-ONLY. Asks the real
#     PostgREST what a signed-out visitor gets: guest surfaces respond and
#     browse is non-empty, no money/PII relation returns rows, signed-out pages
#     load. Runs on every push.
#  2. authenticated — needs a real account. Runs on a schedule and on demand,
#     NOT on every push: a check that is red for reasons unrelated to the diff
#     (a shared account's daily caps, a Supabase blip) trains people to ignore red.
#  3. two-role — needs two seeded sessions plus a job in a specific lifecycle
#     state that must be minted per run. Manual only.
#
# REAL BACKEND, LOCAL FRONTEND (2026-09-14). Every leg that loads pages builds
# this commit and serves it with `vite preview` (.github/actions/local-preview);
# none of them loads the deployed site. Vercel paused the project on Hobby
# limits with test traffic as the main load (one page load is ~110-215 edge
# requests). Supabase, Stripe test mode and the accounts are as real as before.
# Guarded by src/test/noTestTrafficOnVercel.test.ts.
#
# EVERY SKIPPED LEG IS ANNOUNCED. The `boundary-report` job always runs and
# writes a ::warning:: plus a step summary naming what did not execute and what
# is missing. A skipped lifecycle test that vanishes silently is how this gap
# stayed open; a skipped one that says so is a known gap.
#
# SECRETS THE OWNER MUST CREATE — see boundary-report for the live list.
#   PLAYWRIGHT_TEST_USER_EMAIL     a real account on the target site
#   PLAYWRIGHT_TEST_USER_PASSWORD  its password (>= 12 chars; GoTrue's real minimum)
#   PLAYWRIGHT_POSTER_SESSION      JSON supabase session — scripts/e2e/README.md
#   PLAYWRIGHT_HELPER_SESSION      JSON supabase session — scripts/e2e/README.md
#   PLAYWRIGHT_LIFECYCLE_JOB_ID    an ACCEPTED job between those two accounts
#   PLAYWRIGHT_ADMIN_EMAIL         an account holding the `admin` role — drives
#   PLAYWRIGHT_ADMIN_PASSWORD      `release-payout`, the only path that actually
#                                  sends the helper's transfer. Optional; the
#                                  money loop degrades loudly without it.
# This workflow creates no accounts and mints no tokens. It names what it needs
# and stops there.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mon, Wed, Fri, Sat 11:17 UTC. Sunday moved to Saturday: Sunday's morning is
    # prod-audit (01:17) then vacuity (07:17, worst case to 12:22). Q318 (2026-09-23): moved so no prod-load run is due while another's worst case (timeout x waves) still holds the group; src/test/prodWorkflowSpacing.test.ts rule 5.
    - cron: "17 11 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      run_two_role:
        description: "Run the two-role lifecycle spec (needs seeded sessions + job id)"
        type: boolean
        default: false

concurrency:
  # A push-triggered run shares one group per ref, so pushes queue behind each
  # other. A schedule or manual dispatch gets its OWN group (salted with the
  # run id) and therefore never shares a queue with anything.
  #
  # Why: with `cancel-in-progress: false` GitHub still keeps only ONE *pending*
  # run per group — a newer queued run cancels the older pending one. So a
  # `workflow_dispatch` of the money loop, queued behind an in-flight run, was
  # silently cancelled the moment anyone pushed to main. The dispatch never
  # ran, reported nothing, and looked like a flake. Deliberately re-verifying a
  # money fix is exactly when that happens, because a fix comes with a push.
  #
  # PROD LOAD (2026-09-14): a SCHEDULED run joins the shared prod-load group so
  # it never overlaps another prod-hitting cron (src/test/prodWorkflowSpacing.test.ts).
  # Push, PR and dispatch keep the groups above.
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('e2e-real-backend-{0}{1}', github.ref, github.event_name != 'push' && format('-{0}', github.run_id) || '') }}
  # NOT `true`, unlike every other workflow in this repo. Cancelling this one
  # mid-flight can orphan a FUNDED production job: the money loop's teardown
  # runs as an `if: always()` step, and a workflow-level cancellation kills the
  # runner without giving that step a chance. The orphan then sits in a state
  # that seven `is_seed`-blind crons will act on. Queueing costs a few minutes;
  # cancelling costs a stranded escrow row that nothing can clean up but the
  # next run's pre-sweep.
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Which legs can run at all. `secrets` is not available in a job-level
  # `if:`, so their presence is turned into an output here.
  # ---------------------------------------------------------------------
  preflight:
    name: What can run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      have_user_creds: ${{ steps.check.outputs.have_user_creds }}
      have_two_role: ${{ steps.check.outputs.have_two_role }}
      have_lifecycle: ${{ steps.check.outputs.have_lifecycle }}
    steps:
      - id: check
        env:
          # Only emptiness is ever observed; no value is echoed.
          USER_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_USER_PASSWORD }}
          POSTER_SESSION: ${{ secrets.PLAYWRIGHT_POSTER_SESSION }}
          HELPER_SESSION: ${{ secrets.PLAYWRIGHT_HELPER_SESSION }}
          LIFECYCLE_JOB_ID: ${{ secrets.PLAYWRIGHT_LIFECYCLE_JOB_ID }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$USER_EMAIL" ] && [ -n "$USER_PASSWORD" ]; then
            echo "have_user_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_user_creds=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$POSTER_SESSION" ] && [ -n "$HELPER_SESSION" ] && [ -n "$LIFECYCLE_JOB_ID" ]; then
            echo "have_two_role=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_two_role=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$POSTER_EMAIL" ] && [ -n "$POSTER_PASSWORD" ] && [ -n "$HELPER_EMAIL" ] && [ -n "$HELPER_PASSWORD" ]; then
            echo "have_lifecycle=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_lifecycle=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # Leg 1 — no credentials, runs everywhere. This is the one that would have
  # caught the guest-browse 401.
  # ---------------------------------------------------------------------
  anon-surface:
    name: Anon surface contract (real prod, read-only, no credentials)
    runs-on: ubuntu-latest
    # 15, not 5: the page leg now builds this commit instead of asking Vercel.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}
      - name: Ask production what a signed-out visitor gets (GET only)
        env:
          # Repository VARIABLES (not secrets) so a fork can retarget without
          # touching code. Unset falls back to PRODUCTION plus the publishable
          # key that already ships in the bundle — deliberately, so this leg can
          # never be silenced by an unset secret. The signed-out PAGES come from
          # this commit's local build, not the deployed site.
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          SITE_URL: http://127.0.0.1:4173
        run: node scripts/e2e/anon-surface-contract.mjs

      # The other half of "is the marketplace lit?" — how many days of it are
      # LEFT. The contract step above can only report a dark marketplace once
      # guests are already looking at nothing; on 2026-09-16 it did exactly
      # that, 86 minutes after a green run on the SAME commit, and the red then
      # sat for three days. This reads the listings' own expiry data and fails
      # BEFORE the last one ages out. `if: always()` so its diagnosis — the
      # day-by-day runway — is printed even when the contract step has already
      # failed, because that table is what names the cause.
      - name: Days of guest marketplace left (real prod, read-only, no credentials)
        if: always()
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
        run: node scripts/ci/guest-listing-horizon.mjs

  # ---------------------------------------------------------------------
  # Leg 2 — a real account against the deployed site.
  # ---------------------------------------------------------------------
  authenticated:
    name: Authenticated journeys (real account)
    needs: preflight
    # Deliberately NOT on push. See the header.
    if: >-
      needs.preflight.outputs.have_user_creds == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        # `playwright install --with-deps` runs `apt-get update`, which fails the
        # whole step (exit 100) whenever dl.google.com serves a bad index — seen
        # 2026-09-09 as "Hash Sum mismatch", red across four workflows on two
        # consecutive runs while the app code was fine. We install Chromium from
        # Playwright, so Google's repo is only ever a source of outages here.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}
      - name: auth + payment lifecycle
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_TEST_USER_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_USER_EMAIL }}
          PLAYWRIGHT_TEST_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_USER_PASSWORD }}
        # Kept on ONE line on purpose: src/test/e2eSpecsReachableInCi.test.ts
        # reads workflow files line by line to work out which specs CI runs,
        # and a `\` continuation would hide the spec names from it — the guard
        # would then report these two as unreachable, which is the exact wrong
        # answer in the exact place it matters.
        run: npx playwright test --project=chromium e2e/auth.spec.ts e2e/payment-lifecycle.spec.ts --reporter=list,./e2e/reporters/skipReporter.ts
      - name: Four chromium specs that ran nowhere until 2026-09-21
        # post-and-apply, smoke, a11y and visual-audit/responsive were in
        # e2eSpecsReachableInCi's NOT_RUN_IN_CI list, so the reachability guard
        # was green while none of them had ever executed. Two of the stated
        # reasons were false: "ui-sweep.yml covers the same ground" cannot be
        # true of a chromium spec, because ui-sweep runs --project=happy-path
        # and that project cannot collect these files at all.
        #
        # Running all five locally costs 2.6 minutes and produced four findings,
        # including a spec that had been red for a long time on a stale locator
        # ("Browse Local Jobs"; the button says "Browse Jobs") and a real layout
        # defect. They point at PLAYWRIGHT_BASE_URL, which this job has already
        # set to the local preview built from this commit.
        #
        # desktop-fill joined them 2026-09-21. It was held out because /browse
        # "filled 39% of 1440px" — which turned out to be the MEASUREMENT, not
        # the layout: the spec was reading a heading inside a card, while the
        # feed grid measured 1344px (93%). The route now declares its own
        # content container and the suite is 16/16.
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_TEST_USER_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_USER_EMAIL }}
          PLAYWRIGHT_TEST_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_USER_PASSWORD }}
        # ONE line, for the same reason as the step above: the reachability
        # guard reads workflow files line by line, and a `\` continuation would
        # hide these spec names from it.
        run: npx playwright test --project=chromium e2e/post-and-apply.spec.ts e2e/smoke.spec.ts e2e/a11y.spec.ts e2e/visual-audit/responsive.spec.ts e2e/visual-audit/desktop-fill.spec.ts --reporter=list,./e2e/reporters/skipReporter.ts
      - name: Backend request budget (Q104)
        # Sums this job's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label chromium
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-backend
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------
  # Leg 3 — two seeded sessions and a job in a specific lifecycle state.
  # ---------------------------------------------------------------------
  two-role:
    name: Two-role lifecycle (seeded sessions)
    needs: preflight
    if: >-
      needs.preflight.outputs.have_two_role == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_two_role
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        # `playwright install --with-deps` runs `apt-get update`, which fails the
        # whole step (exit 100) whenever dl.google.com serves a bad index — seen
        # 2026-09-09 as "Hash Sum mismatch", red across four workflows on two
        # consecutive runs while the app code was fine. We install Chromium from
        # Playwright, so Google's repo is only ever a source of outages here.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}
      - name: day-of confirm across two roles
        env:
          PLAYWRIGHT_TWO_ROLE: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_POSTER_SESSION: ${{ secrets.PLAYWRIGHT_POSTER_SESSION }}
          PLAYWRIGHT_HELPER_SESSION: ${{ secrets.PLAYWRIGHT_HELPER_SESSION }}
          PLAYWRIGHT_LIFECYCLE_JOB_ID: ${{ secrets.PLAYWRIGHT_LIFECYCLE_JOB_ID }}
        run: npx playwright test --project=chromium e2e/two-role-lifecycle.spec.ts --reporter=list,./e2e/reporters/skipReporter.ts
      - name: Backend request budget (Q104)
        # Sums this job's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label chromium

  # ---------------------------------------------------------------------
  # Leg 4 — the full money loop against PRODUCTION, on a Stripe test key.
  #
  # Nightly and on demand (owner, 2026-09-07 — it used to run on every push;
  # see the job's own `if:` for what changed). Production is already on a
  # test key (verified against the Stripe API: every prod-generated charge on
  # 5–6 Sep is livemode:false, including a Connect destination charge with a
  # transfer), so this moves no real money.
  #
  # THE CONCURRENCY BLOCK IS LOad-BEARING, and it is deliberately NOT the
  # workflow-level one. That one is keyed on `github.ref` with
  # `cancel-in-progress: true`, which is right for cheap read-only jobs and
  # exactly wrong here on both counts:
  #   * two branches would run concurrently and collide on the two shared
  #     accounts, so the group must be ref-INDEPENDENT;
  #   * cancelling mid-loop is how a funded job gets orphaned, so
  #     cancel-in-progress must be FALSE — later runs queue behind, they do
  #     not kill the one holding money.
  # ---------------------------------------------------------------------
  prod-lifecycle:
    name: Full money loop (production, Stripe test mode)
    needs: preflight
    # NIGHTLY AND ON DEMAND, not on push — the same gate `authenticated` above
    # already carries, for a second reason on top of its one.
    #
    # This loop consumes a real application against a real daily cap, and it
    # cannot post more than the poster's open-job limit allows. On 2026-09-07 it
    # ran often enough to exhaust the helper's 15-a-day allowance and then failed
    # every subsequent run with "You have reached the daily application limit" —
    # a red build reporting a product rule working correctly. That is the precise
    # failure mode this workflow's header warns about: "a check that is red for
    # reasons unrelated to the diff trains people to ignore red."
    #
    # Dropping the workflow's `push:` trigger would have done this too, and would
    # also have taken `anon-surface` off every push — the free, read-only,
    # credential-less leg that is deliberately allowed to fail the build and is
    # the one that would have caught the guest-browse 401. That leg is the reason
    # the trigger stays; this gate is how the money loop comes off it.
    if: >-
      needs.preflight.outputs.have_lifecycle == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Drop the Google Chrome apt source
        # `playwright install --with-deps` runs `apt-get update`, which fails the
        # whole step (exit 100) whenever dl.google.com serves a bad index — seen
        # 2026-09-09 as "Hash Sum mismatch", red across four workflows on two
        # consecutive runs while the app code was fine. We install Chromium from
        # Playwright, so Google's repo is only ever a source of outages here.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Build and serve this commit locally (real backend, local frontend)
        uses: ./.github/actions/local-preview
        with:
          supabase-url: ${{ vars.E2E_SUPABASE_URL || 'https://fncmgoasalhdgfwzhsqa.supabase.co' }}
          supabase-publishable-key: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

      # Teardown FIRST. The rows that matter are the ones a previous run failed
      # to clean up, and they are only safely removable when nothing is racing.
      - name: Sweep anything a previous run stranded
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          # Mint a short-lived poster token. The password never leaves this step
          # and is never echoed; only the token is exported, and only to the
          # sweeper. The sweeper deliberately does NOT take a service-role key —
          # a CI job holding service-role could delete anything in the database,
          # which is a far larger risk than the rows it tidies.
          # The mint reports the real HTTP status and retries transient failures;
          # see the header of the script for why the old inline form misled.
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::error::could not mint a poster token — the warnings above give the HTTP status and auth's reason"; exit 1; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            bash scripts/e2e/sweep-both-seats.sh

      - name: post → fund → apply → hire → complete → release → review
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          # The payout leg. Optional by design: without it the loop still runs
          # and announces that nothing proved money reached the helper.
          # An ACCOUNT holding the admin role, deliberately not CRON_SECRET —
          # that secret authorises 29 edge functions and records no actor, so
          # giving it to CI would be wider custody than the service-role key the
          # sweep step above already refuses. See the spec's step 6b.
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
        run: npx playwright test --project=chromium e2e/prod-lifecycle.spec.ts --reporter=list,./e2e/reporters/skipReporter.ts --trace=on
      - name: Backend request budget (Q104)
        # Sums this job's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label chromium

      # The whole point of this job is the legs a mock cannot cover, and when
      # one of them breaks the log says "waitForURL timed out" — which names the
      # wait, not the cause. Twice now the cause was something only visible ON
      # the page (a collapsed payment accordion; a Pay button that silently
      # refuses). Keep the trace so the next failure is diagnosed from what the
      # browser saw instead of from a guess.
      - name: Keep the trace and screenshots when the loop fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prod-lifecycle-trace
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn

      # Runs even when the loop failed — that is the case it exists for. A run
      # that died holding a funded job is the one the seven is_seed-blind crons
      # would otherwise act on.
      - name: Unwind this run's rows even on failure
        if: always()
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fncmgoasalhdgfwzhsqa.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP}"
          TOKEN=$(bash scripts/e2e/mint-poster-token.sh) || { echo "::error::could not mint a token for teardown (Q52: an unwind that did not run is not green) — rows may be stranded for the next run's pre-sweep"; exit 1; }
          SUPABASE_URL="$URL" SUPABASE_ANON_KEY="$KEY" POSTER_ACCESS_TOKEN="$TOKEN" \
            bash scripts/e2e/sweep-both-seats.sh

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod-lifecycle
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------
  # The loud part. Always runs, never fails the build, and states plainly
  # which real-backend surfaces went unchecked and what is missing.
  # ---------------------------------------------------------------------
  boundary-report:
    name: Uncovered real-backend surfaces
    needs: [preflight, anon-surface, authenticated, two-role, prod-lifecycle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Say what did not run
        env:
          ANON: ${{ needs.anon-surface.result }}
          AUTHED: ${{ needs.authenticated.result }}
          TWO_ROLE: ${{ needs.two-role.result }}
          LIFECYCLE: ${{ needs.prod-lifecycle.result }}
          HAVE_CREDS: ${{ needs.preflight.outputs.have_user_creds }}
          HAVE_TWO_ROLE: ${{ needs.preflight.outputs.have_two_role }}
          HAVE_LIFECYCLE: ${{ needs.preflight.outputs.have_lifecycle }}
        run: |
          set -euo pipefail
          {
            echo "## Real-backend E2E coverage"
            echo ""
            echo "| Leg | Result | Needs |"
            echo "| --- | --- | --- |"
            echo "| Anon surface contract | \`$ANON\` | nothing |"
            echo "| Authenticated journeys | \`$AUTHED\` | PLAYWRIGHT_TEST_USER_EMAIL + PLAYWRIGHT_TEST_USER_PASSWORD |"
            echo "| Two-role lifecycle | \`$TWO_ROLE\` | PLAYWRIGHT_POSTER_SESSION + PLAYWRIGHT_HELPER_SESSION + PLAYWRIGHT_LIFECYCLE_JOB_ID |"
            echo "| Full money loop (prod) | \`$LIFECYCLE\` | PLAYWRIGHT_POSTER_EMAIL/_PASSWORD + PLAYWRIGHT_HELPER_EMAIL/_PASSWORD |"
            echo "| ↳ payout (helper's transfer) | \`$LIFECYCLE\` | PLAYWRIGHT_ADMIN_EMAIL/_PASSWORD |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          UNCOVERED=0
          if [ "$HAVE_LIFECYCLE" != "true" ]; then
            echo "::warning title=Uncovered surface::The full money loop did NOT run — PLAYWRIGHT_POSTER_EMAIL/_PASSWORD and PLAYWRIGHT_HELPER_EMAIL/_PASSWORD are not set. Escrow funding, hire, complete, release and review are covered by MOCKS ONLY."
            echo "- **Full money loop: NOT COVERED.** Escrow funding, hire, complete, payout release and review are exercised only against \`page.route()\` mocks. Set \`PLAYWRIGHT_POSTER_EMAIL\`, \`PLAYWRIGHT_POSTER_PASSWORD\`, \`PLAYWRIGHT_HELPER_EMAIL\` and \`PLAYWRIGHT_HELPER_PASSWORD\` for the two dedicated accounts. Passwords must be >= 12 characters — GoTrue's real minimum, which the client does not enforce." >> "$GITHUB_STEP_SUMMARY"
            UNCOVERED=$((UNCOVERED+1))
          fi
          if [ "$HAVE_CREDS" != "true" ]; then
            echo "::warning title=Uncovered surface::Authenticated journeys did NOT run — PLAYWRIGHT_TEST_USER_EMAIL / PLAYWRIGHT_TEST_USER_PASSWORD are not set. Sign-in, escrow checkout and the post-payment landing are covered by MOCKS ONLY."
            echo "- **Authenticated journeys: NOT COVERED.** Sign-in, escrow checkout and the post-payment landing are exercised only against \`page.route()\` mocks. Set \`PLAYWRIGHT_TEST_USER_EMAIL\` and \`PLAYWRIGHT_TEST_USER_PASSWORD\` (password must be >= 12 characters — GoTrue's real minimum, which the client does not enforce)." >> "$GITHUB_STEP_SUMMARY"
            UNCOVERED=$((UNCOVERED+1))
          fi
          if [ "$HAVE_TWO_ROLE" != "true" ]; then
            echo "::warning title=Uncovered surface::Two-role lifecycle did NOT run — seeded sessions are not set. Accept, day-of confirm, complete and release are covered by MOCKS ONLY."
            echo "- **Two-role lifecycle: NOT COVERED.** Accept → day-of confirm → complete → release crosses two accounts and is exercised only against mocks. Mint sessions with \`scripts/e2e/mint-helper-login.sh\` (see \`scripts/e2e/README.md\`) and set the three \`PLAYWRIGHT_*\` secrets." >> "$GITHUB_STEP_SUMMARY"
            UNCOVERED=$((UNCOVERED+1))
          fi

          if [ "$UNCOVERED" -eq 0 ]; then
            echo "All real-backend legs are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "**$UNCOVERED real-backend surface(s) uncovered.** A green tick on this run does not mean these journeys work — it means nothing asked."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The anon leg is the one that needs no provisioning, so it is the one
          # that is allowed to fail the build.
          if [ "$ANON" != "success" ]; then
            echo "::error title=Anon surface contract failed::The signed-out marketplace does not answer the anon role correctly."
            exit 1
          fi

  # Owner-requested (2026-09-12): a red nightly used to land nowhere — nobody
  # watches this Actions tab. This opens/updates ONE `nightly-red` issue per
  # workflow and closes it on the next green run. Skipped on pull_request
  # events — a PR's own checks already surface a failure there; this is for
  # the schedule/dispatch/push-to-main runs nobody is watching.
  notify:
    name: Report nightly result
    needs: [preflight, anon-surface, authenticated, two-role, prod-lifecycle, boundary-report]
    # A PUSH MUST NOT REPORT ON A MONEY LOOP IT DID NOT RUN (2026-09-22).
    #
    # `prod-lifecycle` is deliberately off the push trigger (see its own gate
    # above), so on a push it is `skipped` — and `skipped` is not `failure`, so
    # `contains(needs.*.result, 'failure')` was false and this job reported
    # SUCCESS. nightly-issue-sync closes the nightly-red issue on a success.
    #
    # The effect: every scheduled run of the money loop since 2026-09-07 failed,
    # each one opened a nightly-red issue, and the next push to main — minutes
    # later, dozens a day — closed it again having run nothing. #1636 lived
    # 3m25s; #1634 lived 43 seconds. Twelve issues in the label's history are
    # that pattern. The money loop was red for fifteen days and the one
    # mechanism built to say so was erasing the evidence faster than anyone
    # could read it.
    #
    # So the gate is the one e2e-journeys.yml and prod-audit.yml already make,
    # in the form this workflow needs: report only when the leg being reported
    # on actually executed. `anon-surface` is unaffected — it runs on every push
    # and is deliberately allowed to FAIL THE BUILD, which is its signal; the
    # nightly-red issue exists for the scheduled runs nobody is watching.
    if: >-
      always() && github.event_name != 'pull_request'
      && needs.prod-lifecycle.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: e2e-real-backend
          # FAIL-CLOSED, like every other nightly-issue-sync caller in this repo.
          # `contains(needs.*.result, 'failure') && 'failure' || 'success'` reads
          # "success" from the ABSENCE of a failure, so a skipped or cancelled
          # leg reported green. Naming the legs and requiring each to be
          # explicitly `success` means a leg that did not run cannot close an
          # issue. `two-role` is deliberately absent: it is manual-only and is
          # `skipped` on every schedule, so requiring it would pin this red.
          # `authenticated` was ALSO absent until 2026-09-23 (Q52) although it
          # runs on every schedule (success on run 35629812383): a red
          # authenticated leg closed the nightly-red issue. Enforced by
          # src/test/workflowFalseGreenShapes.test.ts (every `needs` is in status).
          status: ${{ (needs.anon-surface.result == 'success' && needs.authenticated.result == 'success' && needs.prod-lifecycle.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
