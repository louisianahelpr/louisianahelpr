name: Bundle Size Check

permissions:
  contents: read

# Guards against JS bundle bloat that hurts mobile performance.
# Mobile Lighthouse score is heavily impacted by total JS shipped — this
# workflow fails PRs that push individual chunks over a defined budget.
#
# Runs:
# - On every push to main that could move the bundle
# - On every PR to main (catches regressions before merge)
# - Manually via workflow_dispatch
#
# WHY THIS FILE WAS RESURRECTED RATHER THAN DELETED (2026-08-31)
# --------------------------------------------------------------
# It had ONE run in its entire history (2026-04-26) and that run was skipped.
# Its `pull_request:` trigger had been commented out while the header kept
# claiming "Runs: On every PR to main" — a workflow that exists, is listed,
# reads as a gate, and has never gated anything.
#
# Kept, because nothing else in the repo enforces a JS budget: lighthouse.yml
# scores perf but does not cap bytes, and its own perf assertion has only just
# been made real. Deleting this would leave initial-load JS ungoverned
# entirely on a mobile-first app whose measured mobile perf is 0.63-0.79.
#
# NOTE THE `push:` TRIGGER — it is not redundant.
# CLAUDE.md says this repo commits STRAIGHT TO MAIN with no PR ceremony, so a
# pull_request-only trigger is dormant by construction. That is exactly how
# migration-lint.yml sat unrun from 2026-05 to 2026-08-20 while migrations
# shipped daily, and restoring only the PR trigger here would have rebuilt the
# same trap. The paths filter keeps the spend bounded to commits that can
# actually move the bundle; docs-only and migration-only commits cost nothing.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - ".github/workflows/bundle-size.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - ".github/workflows/bundle-size.yml"
  workflow_dispatch:

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Check production bundle sizes
    # Skip noisy Dependabot PRs — bundle changes from dep bumps are reviewed manually.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build production bundle
        # Literals, not secrets, on purpose: this workflow runs on
        # `pull_request`, and a PR from a fork gets no secrets — reading them
        # here would make the job fail for outside contributors. Nothing here
        # is confidential (the project ref is in every shipped bundle, and the
        # key is the same non-functional placeholder e2e-happy-path.yml,
        # a11y-axe.yml and ui-sweep.yml already use). Byte budgets don't care
        # about the value, only that vite.config.ts's boot-env guard is
        # satisfied so a size regression check can't be silently replaced by a
        # build failure.
        env:
          VITE_SUPABASE_PROJECT_ID: fncmgoasalhdgfwzhsqa
          VITE_SUPABASE_URL: https://fncmgoasalhdgfwzhsqa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_key_for_e2e_only
        run: npm run build

      - name: Check chunk sizes
        # Budgets only apply to chunks that ship on the INITIAL page load
        # (the entry chunk + its static imports parsed from index.html).
        # Lazy chunks (admin pages, jspdf, html2canvas, etc.) load on-demand
        # and don't impact landing-page perf, so we skip them.
        #
        # Tuned to current sizes with headroom — failures = real regressions.
        # Per-chunk cap is generous because we manually split vendors
        # (react-vendor, supabase, posthog, sentry) into their own chunks.
        run: |
          set -e
          MAX_CHUNK_KB=400       # any single chunk in the initial load graph
          MAX_INITIAL_KB=1500    # total JS parsed/executed on first paint
          FAIL=0

          # Extract chunks referenced by index.html (entry + modulepreload).
          # These are the only files the browser fetches before user interaction.
          INITIAL_CHUNKS=$(grep -oE 'assets/[^"]+\.js' dist/index.html | sort -u || true)

          # EMPTY-GREP GUARD. Added 2026-08-31.
          #
          # WHAT THIS CATCHES: this budget check measuring zero files and
          # calling it "within budget".
          #
          # If the grep matches nothing — Vite changes its asset directory or
          # emit naming, a plugin rewrites the script tags (this repo already
          # has THREE transformIndexHtml plugins in vite.config.ts rewriting
          # the head), the build silently produces no index.html, or the entry
          # moves to an import map — then the loop below never executes,
          # INITIAL_TOTAL stays 0, 0 is not greater than MAX_INITIAL_KB, and
          # the step prints "✅ Initial-load bundle within budget" having
          # weighed nothing at all. A budget that passes when it cannot find
          # the thing it is budgeting is not a budget.
          #
          # `set -e` alone does not save us: grep's exit 1 on no-match is
          # swallowed by the `|| true` this line needs anyway, and the
          # arithmetic below is perfectly happy with zero.
          if [ -z "$INITIAL_CHUNKS" ]; then
            echo "::error::Found no initial-load JS chunks in dist/index.html."
            echo "::error::This check measured NOTHING — it is failing rather than reporting 0 KB as 'within budget'."
            echo "::error::Either the build produced no index.html, or the asset reference format changed and the grep pattern ('assets/…\\.js') needs updating. Head of dist/index.html:"
            head -40 dist/index.html 2>&1 | sed 's/^/  /'
            exit 1
          fi

          echo "::group::Initial-load chunks (shipped on first paint)"
          INITIAL_TOTAL=0
          for rel in $INITIAL_CHUNKS; do
            f="dist/$rel"
            # Same class as the empty-grep guard above: `[ -f "$f" ] || continue`
            # used to skip a referenced-but-absent chunk in silence, so a build
            # whose index.html points at files that do not exist would weigh 0 KB
            # and pass. index.html referencing a missing chunk is a broken build.
            if [ ! -f "$f" ]; then
              echo "::error::dist/index.html references $rel but dist/$rel does not exist — broken build."
              FAIL=1
              continue
            fi
            SIZE_KB=$(( $(stat -c%s "$f") / 1024 ))
            INITIAL_TOTAL=$(( INITIAL_TOTAL + SIZE_KB ))
            printf "  %6s KB  %s\n" "$SIZE_KB" "$(basename "$f")"
            if [ "$SIZE_KB" -gt "$MAX_CHUNK_KB" ]; then
              echo "    ❌ exceeds ${MAX_CHUNK_KB} KB per-chunk budget"
              FAIL=1
            fi
          done
          echo "::endgroup::"

          echo ""
          echo "Initial-load JS: ${INITIAL_TOTAL} KB (budget: ${MAX_INITIAL_KB} KB)"
          if [ "$INITIAL_TOTAL" -gt "$MAX_INITIAL_KB" ]; then
            echo "❌ Initial-load JS exceeds budget — mobile LCP will suffer"
            FAIL=1
          fi

          # Informational: report total bundle size across all chunks (lazy + initial).
          # Not enforced — lazy chunks are good (they keep first paint fast).
          TOTAL_KB=$(( $(du -cb dist/assets/*.js | tail -1 | cut -f1) / 1024 ))
          echo "Total JS across all chunks (incl. lazy): ${TOTAL_KB} KB (informational)"

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "💡 To fix: lazy-load the offending chunk with React.lazy(),"
            echo "   split the route, or remove unused dependencies."
            exit 1
          fi
          echo "✅ Initial-load bundle within budget"
