          for t in test-results/press-queue-in/press-queue-leg-*.tar; do
            if [ -f "$t" ]; then tar -C test-results -xf "$t"; fi
          done
          echo "rows already claimed: $(find test-results/press-queue -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)"

      - name: Snapshot the shared accounts (leg 4, before its shards)
