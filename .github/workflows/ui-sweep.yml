name: UI sweep

permissions:
  contents: read

# The screen-level UI gate.
#
# WHAT THIS RUNS AND WHY ONLY THIS
# --------------------------------
# There are four sweeps over the shared route catalog in
# e2e/happy-path/auditRoutes.ts:
#
#   empty-state-sweep  — every collection returns [];  ASSERTS  (this gate)
#   visual-audit-sweep — seeded/populated screens;     ASSERTS  (weekly, Sun)
#   error-state-sweep  — queries 500 / hang;           ASSERTS  (weekly, Wed)
#   overlay-sweep      — dialogs/sheets/popovers;      ASSERTS  (weekly, Fri)
#
# OVERLAY SWEEP — why it is wired here, and why not dispatch-only
# ---------------------------------------------------------------
# `overlay-sweep.spec.ts` was referenced by NO workflow and NO npm script, and
# self-skips without RUN_OVERLAY_SWEEP. It had therefore never run in CI once.
# It is the only coverage anywhere of Radix overlays across the ~48
# authenticated routes — including the admin BAN, DELETE-USER, ESCROW-RELEASE
# and DISPUTE-RESOLUTION dialogs — asserting accessible name, viewport fit,
# focus trap, scroll lock, tap-target size, axe, and Escape-to-close. The
# route sweeps only ever see screens in their RESTING state, so every one of
# those checks was unmade: "0 contrast failures, 0 overflow, correct headings"
# was only ever a statement about flat pages.
#
# It gets a `schedule:` cron and not just a workflow_dispatch arm on purpose.
# A dispatch-only gate depends on somebody remembering to click it, which is
# indistinguishable from the gate not existing — it is how this spec stayed
# unrun since it was written, and how the seeded and error sweeps sat unrun
# until 2026-08-29. Weekly is cheap and it is automatic.
#
# Only the empty-state sweep runs on every push/PR, at ONE variant
# (phone-light), and that is a deliberate cost decision, not an oversight:
#
#   - The seeded sweep's describe is `mode: "serial"` (its aggregate gate test
#     has to see every screen's result, which only works inside one worker), so
#     it cannot be parallelised — ~166 screens x ~8s on a single worker is ~20
#     minutes of runner time per push. Far too expensive to put on every commit
#     for a repo whose owner already had a macOS cron disabled over ~$16/mo of
#     Actions spend. It instead runs automatically ONCE A WEEK via the
#     `schedule:` trigger below (2026-08-29) — the ~9 min cost is fine at
#     weekly cadence, and this closes the gap where the actual "does this
#     look right with real data" check depended on someone remembering to
#     click workflow_dispatch by hand.
#   - The error-state sweep is a NEW gate over a surface that has never been
#     gated and currently reports real findings — putting it on every push/PR
#     would just red main before those are triaged. It runs automatically
#     ONCE A WEEK instead (Wednesday 05:00 UTC, 2026-08-29), same as the
#     seeded sweep: weekly cadence is cheap enough to afford, and evidence
#     needs to exist somewhere other than "run it by hand" for anyone to ever
#     act on it.
#
# The full 4-variant matrix is still a `workflow_dispatch` click away (see
# the inputs below) for an ad-hoc deeper pass.
#
# COST — measured, not guessed
# ----------------------------
# ubuntu-latest, 1x billing multiplier (NOT macOS). Measured locally on an
# M-series Mac, 2026-08-17:
#
#   empty-state, phone-light, --workers=4   175 screens   2.4 min   (this gate)
#   seeded,      phone-light, serial        186 screens   9.0 min   (not gated)
#   error-state, phone-light, --workers=3   163 screens   2.8 min   (not gated)
#
# A GitHub ubuntu runner is slower than that laptop, so budget the sweep step
# at ~5-6 min, plus ~1 min npm install, ~30s Chromium download and ~1 min
# production build: call it ~9 minutes of billed time per run. Adding the
# seeded sweep would roughly triple that for coverage of the SAME routes in
# their populated state, which is why it is dispatch-only.
#
# The paths-filter step below reports green in seconds when nothing
# UI-relevant changed, so backend-only and docs-only commits cost ~nothing.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly seeded visual-audit-sweep (the ~186-screen, populated-data check
    # — the actual "does this look right" pass that was previously only run
    # by hand). Distinct time from every other Sunday UTC cron in this repo
    # (lighthouse 06:00, cloud Docs Drift 06:00, cloud iOS/Capacitor 06:30).
    - cron: "30 5 * * 0" # Sunday 05:30 UTC — resolves to 'seeded' below
    # Weekly error-state sweep (queries 500/hang across the route catalog).
    # A separate cron so `github.event.schedule` disambiguates which one
    # fired; picked Wednesday to spread runner load off Sunday.
    - cron: "0 5 * * 3" # Wednesday 05:00 UTC — resolves to 'error' below
    # Weekly overlay sweep (dialogs, sheets, popovers, dropdowns, alert
    # dialogs across the ~48 authenticated routes). Added 2026-08-31 — see
    # the OVERLAY SWEEP note below for why this is not dispatch-only.
    - cron: "0 5 * * 5" # Friday 05:00 UTC — resolves to 'overlay' below
  workflow_dispatch:
    inputs:
      sweeps:
        description: "Which sweeps to run"
        required: false
        default: empty
        type: choice
        options:
          - empty
          - seeded
          - error
          - overlay
          - empty+seeded
          - all
      variants:
        description: "Variant tags: phone-light | all | comma list (phone-dark,desktop-light,small-light)"
        required: false
        default: phone-light
        type: string

concurrency:
  # THE SCHEDULED LEGS GET THEIR OWN GROUP. Changed 2026-08-31.
  #
  # WHAT THIS CATCHES: the weekly sweeps being cancelled before they report.
  #
  # This used to be one group, `ui-sweep-${{ github.ref }}`, with
  # cancel-in-progress: true. `github.ref` is `refs/heads/main` for BOTH a push
  # to main and a cron — so the weekly seeded sweep (~20 min, serial, 186
  # screens) and the weekly error-state sweep shared a cancellation group with
  # every push to main, at a push cadence of roughly 5 minutes. The expensive
  # weekly runs — the only automatic coverage of the populated-data and
  # error-state surfaces, the exact gap the `schedule:` trigger was added on
  # 2026-08-29 to close — could be killed by the next commit and would report
  # a BLANK conclusion: not red, blocking nothing, notifying nobody. Sibling
  # a11y-axe.yml lost 12 of 24 runs to precisely this.
  #
  # Keying on `github.event_name` gives schedule, push, pull_request and
  # workflow_dispatch separate lanes, so a push can no longer cancel a cron.
  #
  # cancel-in-progress stays TRUE for push and pull_request: the empty-state
  # sweep is a whole-surface pass, so the newest run subsumes every older one
  # and superseding loses no coverage. It is FALSE for schedule and
  # workflow_dispatch, where there is no "newer attempt at the same thing" —
  # cancelling those just throws the run away.
  group: ui-sweep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  sweep:
    name: Screen sweep (phone-light, assertions on)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Same publishable Vite vars the other workflows bake in. The sweep mocks
      # every Supabase HTTP call via page.route(), so no real traffic is sent;
      # a value must still exist or supabase-js throws "supabaseUrl is required"
      # at import time and the React app never mounts.
      VITE_SUPABASE_PROJECT_ID: fncmgoasalhdgfwzhsqa
      VITE_SUPABASE_URL: https://fncmgoasalhdgfwzhsqa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_key_for_e2e_only

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Deliberately an IN-JOB filter rather than a top-level `paths:` trigger.
      # This job is meant to be a required status check, and GitHub counts a
      # required check that never ran as unsatisfied — a `paths:` filter would
      # leave backend-only PRs stuck on "Expected" forever. Same pattern as
      # .github/workflows/e2e-happy-path.yml; see the note there.
      - name: Detect UI-relevant changes
        id: filter
        # Skipped on workflow_dispatch AND schedule: neither has a base ref to
        # diff against, and both are by definition asking for the sweep to
        # run regardless of what changed. The `if:` on every later step falls
        # back to the event name for both cases.
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ui:
              - "src/**"
              - "public/**"
              - "index.html"
              - "vite.config.ts"
              - "tailwind.config.ts"
              - "package.json"
              - "package-lock.json"
              - "playwright.config.ts"
              - "e2e/happy-path/**"
              - ".github/workflows/ui-sweep.yml"

      # Workflow inputs are read through `env:` and never interpolated into the
      # shell, and `specs` is emitted from a fixed case arm rather than echoed
      # back from user text — so no dispatch input can reach the command line.
      - name: Resolve run scope
        id: scope
        env:
          # A scheduled run has no `inputs` at all. Two crons share the
          # `schedule` event, so `github.event.schedule` (the exact cron
          # string that fired) disambiguates which sweep to run — Sunday
          # 05:30 UTC -> seeded, Wednesday 05:00 UTC -> error. dispatch and
          # push/pull_request keep their existing defaults ('empty' unless a
          # dispatch input says otherwise).
          SWEEPS: ${{ github.event.inputs.sweeps || (github.event.schedule == '30 5 * * 0' && 'seeded') || (github.event.schedule == '0 5 * * 3' && 'error') || (github.event.schedule == '0 5 * * 5' && 'overlay') || 'empty' }}
          VARIANTS: ${{ github.event.inputs.variants || 'phone-light' }}
        run: |
          set -euo pipefail
          case "$SWEEPS" in
            empty)         specs="empty-state-sweep";  empty=1; seeded=""; errors=""; overlay="" ;;
            seeded)        specs="visual-audit-sweep";  empty=""; seeded=1; errors=""; overlay="" ;;
            error)         specs="error-state-sweep";   empty=""; seeded=""; errors=1; overlay="" ;;
            overlay)       specs="overlay-sweep";       empty=""; seeded=""; errors=""; overlay=1 ;;
            empty+seeded)  specs="empty-state-sweep visual-audit-sweep"; empty=1; seeded=1; errors=""; overlay="" ;;
            all)           specs="empty-state-sweep visual-audit-sweep error-state-sweep overlay-sweep"; empty=1; seeded=1; errors=1; overlay=1 ;;
            *)             echo "unknown sweeps value" >&2; exit 1 ;;
          esac
          {
            echo "specs=$specs"
            echo "run_empty=$empty"
            echo "run_seeded=$seeded"
            echo "run_error=$errors"
            echo "run_overlay=$overlay"
          } >> "$GITHUB_OUTPUT"
          # Variant tags are validated by the specs themselves (an unknown tag
          # throws "matched no variant tag"), so pass the raw value through as
          # an env var only — never onto a command line.
          printf 'variants<<EOF\n%s\nEOF\n' "$VARIANTS" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.filter.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.filter.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        # See test.yml — `install` not `ci`, so a drifting lockfile heals
        # instead of failing the run.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright Chromium browser
        if: steps.filter.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: npx playwright install --with-deps chromium

      - name: Run sweep
        if: steps.filter.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          # PLAYWRIGHT_WEB_SERVER=1 turns on the `npm run build && vite preview`
          # auto-start in playwright.config.ts. reuseExistingServer is false
          # under CI, so this always measures a fresh dist/ — the stale-preview
          # trap that has produced false findings locally cannot happen here.
          PLAYWRIGHT_WEB_SERVER: "1"
          RUN_EMPTY_SWEEP: ${{ steps.scope.outputs.run_empty }}
          RUN_VISUAL_SWEEP: ${{ steps.scope.outputs.run_seeded }}
          RUN_ERROR_SWEEP: ${{ steps.scope.outputs.run_error }}
          # e2e/happy-path/overlay-sweep.spec.ts self-skips its whole describe
          # without this, exactly like the other three sweeps.
          RUN_OVERLAY_SWEEP: ${{ steps.scope.outputs.run_overlay }}
          EMPTY_SWEEP_VARIANTS: ${{ steps.scope.outputs.variants }}
          SWEEP_VARIANTS: ${{ steps.scope.outputs.variants }}
          ERROR_SWEEP_VARIANTS: ${{ steps.scope.outputs.variants }}
          SPECS: ${{ steps.scope.outputs.specs }}
        # --workers=4 overrides playwright.config.ts's CI default of 2. The
        # standard ubuntu runner has 4 vCPUs and these tests are dominated by
        # page load + axe wait, not CPU, so 4 workers roughly halves the wall
        # clock — and therefore the billed minutes — at no reliability cost.
        # The seeded sweep's own describe is serial and ignores this.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 — SPECS is a fixed, space-separated list
          # of spec basenames produced by the case arm above, never user text.
          npx playwright test --project=happy-path --workers=4 $SPECS

      - name: Upload sweep evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-sweep-evidence
          # Per-screen JSON + screenshots of only the screens that failed
          # something — that pairing is what makes a red sweep triageable
          # without re-running it locally.
          path: |
            /tmp/ui-review-empty/
            /tmp/ui-review/
            /tmp/ui-review-error/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
