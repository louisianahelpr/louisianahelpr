name: Migration Timestamp Guard

permissions:
  contents: read

# Fails the PR if two migration files share the same numeric timestamp
# prefix. Direct response to PR #253, where two migrations both started
# with the same prefix — the second silently shadowed the first in
# Supabase's lexicographic migration order, so it never applied to prod.
#
# The Supabase CLI does NOT reject duplicate prefixes; it sorts by full
# filename and applies whichever sorts second, then records both rows in
# schema_migrations as "applied" (the version column is just the prefix,
# so the second one looks like a re-run of the first). Result: silent
# data loss — the SQL of the shadowed file never executes on prod.
#
# This guard is the cheapest possible check: a sort + uniq -d on the
# timestamp prefixes of every migration in the tree.

on:
  # BOTH triggers on purpose. This repo commits straight to main, so a
  # pull_request-only guard never runs on the path that actually ships — which
  # is exactly how the 20260826040000 collision reached prod on 2026-08-25.
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/check-migration-timestamps.sh"
      - ".github/workflows/migration-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/check-migration-timestamps.sh"
      - ".github/workflows/migration-guard.yml"
  workflow_dispatch:

concurrency:
  group: migration-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-timestamps:
    name: Check for duplicate migration timestamps
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for duplicate timestamp prefixes
        run: ./scripts/check-migration-timestamps.sh
