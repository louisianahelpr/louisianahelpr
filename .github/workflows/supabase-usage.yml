name: Supabase usage

# Owner-approved 2026-09-14. Weekly headroom check against the free-tier
# ceilings: 500 MB database, 1 GB storage. Warns at 70% by opening an issue
# labelled `supabase-usage` (and posting to Slack if the webhook exists), so
# the ceiling never arrives as a surprise.
#
# NOT SQL, on purpose: scripts/supabase-usage-check.mjs asks the Supabase
# MANAGEMENT API (api.supabase.com, SUPABASE_ACCESS_TOKEN) rather than the
# database. Prod is a t4g.nano that fell over on 2026-09-13 under workflow
# load; the control plane answers this without touching the instance at all.
# The headroom check alone is not prod-hitting, but since 2026-09-14 the same
# run also sweeps orphaned storage (Storage API + PostgREST reads, paced), so
# it genuinely belongs in the prod-load group at its otherwise-empty weekly
# slot, which src/test/prodWorkflowSpacing.test.ts enforces.
#
# MEASURED 2026-09-14 (run 34881959722): the public Management API returns 404
# for EVERY usage route — /v1/projects/{ref}/usage, /database/usage,
# /billing/usage, /v1/organizations/{slug}/usage. It answers project identity
# and health and nothing else. The script still probes them every week and
# prints what each one said, so that finding is re-tested rather than believed.
#
# The numbers therefore come from the project's own Prometheus endpoint
# (https://<ref>.supabase.co/customer/v1/privileged/metrics, basic auth
# `service_role:<key>`) — one scrape a week, still not SQL and still not a
# query against the database. That needs the OPTIONAL repo secret
# SUPABASE_SERVICE_ROLE_KEY; without it the report says UNMEASURED in as many
# words rather than reporting "ok" without having looked.
#
# Proven locally against prod 2026-09-14: database 73.4 MB of 500 MB (14.7%),
# /data volume 369.9 MB of 1.98 GB (18.7%); the warn path fires when the
# threshold is lowered under those readings. Bucket storage is the one metric
# NEITHER source carries — see the report footer.
#
# ALSO IN THIS RUN (docs/OPEN.md "Vercel usage alert", owner "finish up"
# 2026-09-14): the "Vercel usage headroom" step below asks Vercel's own
# billing/charges API (api.vercel.com, OPTIONAL repo secret VERCEL_TOKEN) how
# close the team is to five Pro plan limits, and pages #ops-alerts through
# the same SLACK_WEBHOOK_URL path at >=80%. scripts/lib/vercelUsage.mjs has
# the metric table and every source-URL citation. No VERCEL_TOKEN -> the step
# logs one skip line and stays green (OWNER ACTION printed in the log).

on:
  schedule:
    # Saturday 01:17 UTC — no prod-hitting daily slot runs before 03:17.
    - cron: "17 1 * * 6"
  workflow_dispatch:
    inputs:
      warn_at_percent:
        description: "Warn threshold (% of the free-tier limit)"
        required: false
        default: "70"

permissions:
  contents: read
  issues: write

concurrency:
  # PROD LOAD (2026-09-14): see src/test/prodWorkflowSpacing.test.ts.
  #
  # A SCHEDULED run joins prod-load; a workflow_dispatch gets its OWN group
  # (2026-09-21, issues #1595/#1626). `cancel-in-progress: false` does NOT mean
  # "queue forever" — GitHub keeps exactly ONE *pending* run per group, so a
  # third run entering it CANCELS the one already waiting. On 2026-09-21T04:54Z
  # four prod-load workflows dispatched inside four minutes cancelled each
  # other in a chain, and a workflow-level cancellation leaves a run with NO
  # jobs, so nothing reports it. See e2e-real-backend.yml, which has made this
  # split since the money loop lost a dispatch the same way.
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('supabase-usage-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  usage:
    name: Free-tier headroom
    runs-on: ubuntu-latest
    # A few minutes for the headroom check + the orphan sweep's own 25-minute
    # step timeout (two owner reads 10 min apart; it stops starting deletes at 20).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ask the Management API
        id: usage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # OPTIONAL. The only source of the actual numbers (see the header);
          # absent, every metric is reported UNMEASURED, never as ok.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WARN_AT_PERCENT: ${{ inputs.warn_at_percent || '70' }}
        run: node scripts/supabase-usage-check.mjs

      - name: Open, update or close the supabase-usage issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WARN: ${{ steps.usage.outputs.warn }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Same one-issue-per-condition shape as prod-errors.yml: the title is
          # the dedup key and the step that opens it closes it, so the open list
          # is the live state rather than a history.
          TITLE="supabase-usage: approaching a free-tier limit"
          gh label create supabase-usage --repo "$REPO" --color FBCA04 \
            --description "Prod is near a Supabase free-tier ceiling" --force >/dev/null
          EXISTING=$(gh issue list --repo "$REPO" --label supabase-usage --state open \
            --search "in:title \"${TITLE}\"" --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)

          BODY="$(cat supabase-usage-report.md)

          Run: ${RUN_URL}"

          if [ "$WARN" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
            else
              gh issue create --repo "$REPO" --title "$TITLE" --label supabase-usage --body "$BODY"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Back under the threshold: ${RUN_URL}"
            gh issue close "$EXISTING" --repo "$REPO"
          else
            echo "Under the threshold, nothing open."
          fi

      # Only on the warn path. A missing webhook fails loudly rather than
      # skipping: the owner must add SLACK_WEBHOOK_URL.
      - name: Tell Slack
        if: steps.usage.outputs.warn == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.usage.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::Prod is near a Supabase free-tier limit and there is no SLACK_WEBHOOK_URL repo secret. OWNER ACTION: add it (Settings -> Secrets and variables -> Actions). The supabase-usage issue was still opened."
            exit 1
          fi
          TEXT=":warning: Supabase free tier — ${SUMMARY}
          ${RUN_URL}"
          curl -sS --fail-with-body -X POST -H 'content-type: application/json' \
            --data "$(jq -nc --arg t "$TEXT" '{text:$t}')" "$SLACK_WEBHOOK_URL"

      # Weekly auto-delete of orphaned storage files (owner, 2026-09-14). Same
      # run, same prod-load slot: no new cron. Safety rules live in
      # scripts/storage-orphan-sweep.mjs (two owner reads 10 min apart, 7-day
      # age floor, identity docs need the owner gone from profiles AND
      # auth.users, and over 50 files or a bucket's orphans over 5 files AND over
      # 5% of it deletes nothing and
      # posts CRITICAL). It posts its own one-line Slack summary.
      - name: Storage orphan sweep
        id: sweep
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Storage orphan sweep needs the SUPABASE_SERVICE_ROLE_KEY repo secret; nothing was swept."
            exit 1
          fi
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::No SLACK_WEBHOOK_URL repo secret: the sweep summary goes to this log only."
          fi
          node scripts/storage-orphan-sweep.mjs --redact-log --budget-minutes 20 --log storage-orphan-sweep.log

      - name: Upload the sweep log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-orphan-sweep-log
          path: storage-orphan-sweep.log
          if-no-files-found: warn
          retention-days: 90

      # Vercel usage alert (docs/OPEN.md "Vercel usage alert", owner: "finish
      # up" 2026-09-14). Same run, same otherwise-empty prod-load slot: no
      # new cron. `if: ${{ !cancelled() }}` so a failure earlier in this job
      # (e.g. the Supabase "Tell Slack" step exiting 1 on a missing webhook)
      # never hides whether Vercel is close to a Pro limit.
      #
      # scripts/check-vercel-usage.mjs handles the no-secret case itself: it
      # prints ONE skip line and exits 0, so this step is always green when
      # VERCEL_TOKEN is absent rather than showing a silent GitHub "skipped"
      # badge with nothing in the log (the class slackAlertWorkflows.test.ts
      # guards against for the Slack secret). A 401/5xx fails this step
      # loudly (see the script header) and leaves `warn` unset, so the next
      # step below cannot fire on a broken token.
      - name: Vercel usage headroom
        id: vercel-usage
        if: ${{ !cancelled() }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WARN_AT_PERCENT: "80"
        run: node scripts/check-vercel-usage.mjs

      # Only on the warn path, exactly like the Supabase "Tell Slack" step
      # above: a missing webhook fails loudly rather than skipping.
      - name: Page Vercel usage to Slack
        if: steps.vercel-usage.outputs.warn == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.vercel-usage.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::Vercel usage is at or above the warn threshold of a Pro plan limit and there is no SLACK_WEBHOOK_URL repo secret. OWNER ACTION: add it (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          TEXT=":warning: Vercel Pro usage — ${SUMMARY}
          ${RUN_URL}"
          curl -sS --fail-with-body -X POST -H 'content-type: application/json' \
            --data "$(jq -nc --arg t "$TEXT" '{text:$t}')" "$SLACK_WEBHOOK_URL"

      - name: Summary
        if: always()
        env:
          # Through env, never ${{ }} inside run: the summary can carry server text.
          SWEEP_SUMMARY: ${{ steps.sweep.outputs.summary }}
        run: |
          cat supabase-usage-report.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Storage orphan sweep:** ${SWEEP_SUMMARY:-did not report}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat vercel-usage-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # A RED RUN HAS TO LAND SOMEWHERE. Added 2026-09-23 after supabase-usage — along
  # with 13 other scheduled workflows — was found failing with nobody told.
  # The drift detector had been red for THREE CONSECUTIVE DAYS (09-20, 09-21,
  # 09-22) and the nightly DB backup had not succeeded since 09-21; both are
  # invisible unless somebody opens the Actions tab, which is exactly the
  # thing the owner said nobody does.
  #
  # `nightly-issue-sync` opens/updates ONE `nightly-red` issue for this
  # workflow and closes it on the next green run, which is what makes the
  # "Nightly reds nobody read" gate able to see it at all.
  #
  # SCHEDULE AND MANUAL RUNS ONLY. A push/PR failure is already visible on the
  # commit and the PR; filing an issue for it would make the label noisy and
  # teach people to ignore it.
  notify:
    name: Report nightly result
    needs: [usage]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: supabase-usage
          status: ${{ needs.usage.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
