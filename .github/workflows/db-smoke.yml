name: DB Smoke

# Catches the class of bug that took job posting down for ~2 days:
# trigger functions referencing columns that no longer exist.
#
# Boots a fresh Postgres in the runner, applies every migration in repo
# order, then exercises the previously-broken `INSERT INTO public.jobs`
# trigger fan-out path. If `column p.role does not exist` (or anything
# similar) ever resurfaces, this workflow fails the PR before merge.
#
# Cost-conscious:
# - Only runs when supabase/migrations/** changes
# - Uses ubuntu-latest (cheapest)
# - Concurrency-cancels superseded runs
# - ~3 min run time

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-smoke.yml"
  workflow_dispatch:

concurrency:
  group: db-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Apply migrations + post-job trigger smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: helpr_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Bootstrap Supabase auth schema stubs
        # Real Supabase ships an `auth` schema with `auth.users`, an `auth.uid()`
        # function, etc. Migrations reference these. Without stubs, every
        # `REFERENCES auth.users(id)` and `auth.uid()` call in the migrations
        # would error before we even get to the trigger-function tests.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text UNIQUE,
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$
            SELECT COALESCE(current_setting('request.jwt.claim.role', true), 'anon')
          $$;
          CREATE OR REPLACE FUNCTION auth.email() RETURNS text LANGUAGE sql STABLE AS $$
            SELECT current_setting('request.jwt.claim.email', true)
          $$;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL

      - name: Apply all migrations in order
        run: |
          set -e
          echo "Applying migrations from supabase/migrations/ in lexicographic order..."
          FAIL=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$(basename $f)"
            if ! psql -v ON_ERROR_STOP=1 -f "$f"; then
              echo "::error file=$f::Migration failed"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::One or more migrations failed to apply"
            exit 1
          fi
          echo "✅ All migrations applied"

      - name: Smoke — post a job, expect triggers to fire cleanly
        # The actual P0: every INSERT INTO public.jobs invokes
        # notify_helpers_on_job_post() and notify_saved_searches_on_new_job(),
        # both of which used to throw `column p.role does not exist`. This
        # test creates a fake user, then inserts a job, and FAILS LOUDLY if
        # any trigger raises. Wrapped in a transaction + ROLLBACK to leave no
        # state.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO auth.users (id, email) VALUES (gen_random_uuid(), 'smoke@helpr.test');
          INSERT INTO public.profiles (user_id, full_name, approval_status)
            SELECT id, 'Smoke Tester', 'approved' FROM auth.users WHERE email='smoke@helpr.test';
          INSERT INTO public.jobs (
            title, description, category, budget, location, parish, status,
            customer_id, date_needed
          )
          SELECT
            '[CI smoke] post-job trigger check',
            'Auto-generated by db-smoke.yml — never persists.',
            'cleaning', 50, 'Test Address', 'Orleans', 'open',
            (SELECT id FROM auth.users WHERE email='smoke@helpr.test'),
            CURRENT_DATE + INTERVAL '7 days'
          ;
          ROLLBACK;
          SELECT '✅ post-job triggers ran cleanly — no column-does-not-exist errors';
          SQL

      - name: Sanity-check the previously-broken role functions
        # Belt-and-suspenders: directly invoke each function that contained a
        # `p.role` reference. They should all return without error after the
        # fix migration applied.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.get_approved_helpers(1);
          SELECT * FROM public.get_top_helpers_by_parish(NULL, 1);
          SELECT * FROM public.get_hero_parishes();
          SELECT * FROM public.get_helper_tiers(1);
          SELECT * FROM public.get_parish_activity(1);
          SELECT * FROM public.get_safe_profiles(ARRAY[]::uuid[]);
          SELECT '✅ all previously-broken role functions return without error';
          SQL
