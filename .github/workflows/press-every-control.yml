name: Press every control

permissions:
  contents: read

# EVERY control on EVERY route, pressed, with the outcome classified — against
# PRODUCTION (owner, 2026-09-12: "no mock mode ever").
#
# The owner (2026-09-12): "there is no way every button has been clicked to be
# sure not failing." scripts/audit/press-every-control.mjs is the answer: the
# route set is derived from src/App.tsx at run time, every control on every
# route (and inside every dialog a press opens) is pressed by DOM path, and the
# classifier fails on an error toast, error-screen copy (e2e/errorScreens.ts),
# a console error, a 4xx/5xx during the press, or no observable change.
#
# It runs on the real backend as the shared test accounts (poster, helper,
# admin, incomplete-profile) with the app built from this commit and served by
# `vite preview`. Safety is in scripts/audit/pressProdSafety.mjs:
#   - a mutating press (delete / pay / send / ban / cancel / submit …) only on a
#     record the read-only select proves is test-owned; otherwise SKIPPED with
#     the documented reason "not test-owned"
#   - admin actions only against seed test targets
#   - payment presses only while Stripe is in TEST mode (cs_test_ on a real
#     Checkout Session, as e2e/prod-lifecycle.spec.ts detects it)
#   - the run creates its own fixture job and cleans up everything it made;
#     the final job here sweeps again after every shard, even on failure
#
# FAILS on: any failed press, or any control that was neither pressed nor
# skipped for a DOCUMENTED reason (DOCUMENTED_SKIPS in the script). Coverage
# must be 100%. A persona whose account could not be signed in is reported as
# UNCOVERED with a ::warning:: (the admin and incomplete accounts land when
# their secrets do), never as a silent green.
#
# Sessions: the password grant with the PLAYWRIGHT_* secrets, as
# e2e/journeys/fixtures.ts does. An account without a password secret is
# minted through scripts/test-signin-link.mjs, which needs the service-role
# key: fetched at run time through the Supabase CLI (SUPABASE_ACCESS_TOKEN),
# masked, written to .env, never echoed — the same source as
# scripts/e2e/mint-helper-login.sh.
#
# Nightly + workflow_dispatch only. Not on push: it drives the shared prod
# accounts and shares their concurrency group with the money loop and the
# journeys, so two runs never press the same rows at once.

on:
  schedule:
    # Mon, Wed, Sat 03:17 UTC (prod load spread, 2026-09-14).
    - cron: "17 3 * * 1,3,6"
  workflow_dispatch:
    inputs:
      routes:
        description: "Comma-separated route list to narrow the run (blank = every route; a base path such as /jobs/:id selects every row derived from it)"
        required: false
        default: ""
      personas:
        description: "Comma-separated personas (anon,customer,helper,admin,incomplete)"
        required: false
        default: "anon,customer,helper,admin,incomplete"

concurrency:
  # Serialised against every other job that drives the shared prod test
  # accounts — two runs signed in as poster-e2e at once corrupt each other's
  # fixtures. `cancel-in-progress: false` is also what 34794e47b asked of every
  # workflow on main (a cancelled run reports "cancelled", never a failure, so
  # a real red hides); here it is load-bearing for a second reason: a cancelled
  # prod run leaves its fixture job and test rows behind.
  #
  # PROD LOAD (2026-09-14): prod-hitting crons are spread across 03:00-13:00 UTC,
  # >= 2h apart, and share the prod-load concurrency group; see
  # src/test/prodWorkflowSpacing.test.ts before moving this.
  #
  # THE EXCEPTION to the dispatch split, by name in
  # src/test/prodWorkflowSpacing.test.ts's DISPATCH_SHARES_GROUP (2026-09-22).
  # This workflow signs in as the shared prod test accounts and has no
  # job-level `prod-lifecycle-shared-accounts` lock, because its matrix would
  # be serialised against itself by one. prod-load IS its account lock. Giving
  # its dispatch a private group — as e2e-journeys and prod-audit now do, since
  # their JOBS hold that lock — would let a dispatched run drive poster-e2e
  # beside another suite already driving it, and two runs signed in as the same
  # account corrupt each other's fixtures. Losing a queued dispatch is
  # recoverable and loud; corrupted prod fixtures are neither.
  group: prod-load
  cancel-in-progress: false

env:
  VITE_SUPABASE_PROJECT_ID: fncmgoasalhdgfwzhsqa
  VITE_SUPABASE_URL: https://fncmgoasalhdgfwzhsqa.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

jobs:
  # Q272: ONE profile baseline per RUN, taken before any shard presses. Four
  # shards press the same shared accounts at once, so a per-shard baseline can
  # already hold another shard's press and its restore writes that press back
  # (run 35837735324, shard 2, 11:02Z: "restored senior_mode, available_until"
  # to the flipped value). Shards restore nothing (shardOwnsProfileRestore in
  # scripts/audit/pressProdSafety.mjs); the cleanup job restores from this file
  # after every shard. No baseline, no presses.
  snapshot:
    name: Snapshot the shared accounts' profiles (once per run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - uses: ./.github/actions/press-service-env
        with:
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Snapshot
        env:
          OUT: test-results/press-every-control-snapshot
          PROFILE_SNAPSHOT_OUT: profile-baseline/profile-snapshot.json
          PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }}
          PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }}
        run: node scripts/audit/press-every-control.mjs --snapshot-only
      - name: Shred the key
        if: always()
        run: rm -f .env
      - uses: actions/upload-artifact@v7
        with:
          name: press-every-control-profile-baseline
          path: profile-baseline/
          if-no-files-found: error
          # Test-account profile rows; needed only until this run's cleanup.
          retention-days: 1

  press:
    name: Press every control (shard ${{ matrix.shard }}/4, 375, prod)
    needs: [snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Drop the Google Chrome apt source
        # See e2e-happy-path.yml — dl.google.com's index breaks apt-get update.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Write .env (service-role key for session minting; never printed)
        uses: ./.github/actions/press-service-env
        with:
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Real backend, LOCAL frontend: the shared action every frontend suite
      # uses (src/test/noTestTrafficOnVercel.test.ts), same build as before.
      - name: Build and serve this commit locally (prod VITE_* env)
        uses: ./.github/actions/local-preview
        with:
          supabase-publishable-key: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Press every control
        env:
          BASE: http://127.0.0.1:4173
          WIDTH: "375"
          SHARD: ${{ matrix.shard }}/4
          RUN_ID: ${{ github.run_id }}-${{ matrix.shard }}
          ROUTES: ${{ github.event.inputs.routes }}
          PERSONAS: ${{ github.event.inputs.personas || 'anon,customer,helper,admin,incomplete' }}
          OUT: test-results/press-every-control
          # Q128: the sweep stops itself inside timeout-minutes (150) and
          # reports the rows it did not reach, instead of being cancelled
          # with no report (run 35837735324: three shards cancelled silently).
          TIME_BUDGET_MIN: "135"
          PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }}
          PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }}
        run: node scripts/audit/press-every-control.mjs

      - name: Backend request budget (Q104)
        # Sums this job's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label press-every-control
      - name: Coverage summary
        if: always()
        run: |
          if [ -f test-results/press-every-control/coverage.md ]; then
            { echo "## Shard ${{ matrix.shard }}"; head -80 test-results/press-every-control/coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report + screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: press-every-control-shard-${{ matrix.shard }}
          path: test-results/press-every-control/
          if-no-files-found: ignore
          retention-days: 14

  # Whatever a shard created and could not remove itself (a shard that timed
  # out mid-press, a runner that died) is swept here, after every shard, on
  # every outcome. Same RLS-scoped clean-up the script runs at its own end.
  cleanup:
    name: Clean up what the presses created
    needs: [snapshot, press]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      # The incomplete-profile account has no password secret: without this the
      # sweep could not mint it and failed every run (job 107152562721).
      - uses: ./.github/actions/press-service-env
        with:
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Fetch the run's ONE profile baseline (Q272)
        if: needs.snapshot.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: press-every-control-profile-baseline
          path: profile-baseline/
      - name: Sweep
        env:
          OUT: test-results/press-every-control-cleanup
          # Restore every shared account's profile from the baseline taken
          # before any shard pressed (Q272). Named whenever the snapshot job
          # succeeded, so a missing file is residue (red), never a skip.
          PROFILE_SNAPSHOT: ${{ needs.snapshot.result == 'success' && 'profile-baseline/profile-snapshot.json' || '' }}
          PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }}
          PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }}
          PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
        run: |
          # Everything created since this run started (three hours covers the
          # longest shard); the marker-titled fixture jobs regardless of age.
          CLEANUP_SINCE=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ) node scripts/audit/press-every-control.mjs

      # The poster's own teardown CANNOT remove a fixture job it had to cancel:
      # `cancelled` is terminal in enforce_job_status_transition (never a SOURCE
      # in the allowed matrix) and the DELETE policy requires `status = 'open'`.
      # 26 such rows had accumulated by 2026-09-19, one per shard per night.
      # This is the service-role pass that can remove them, scoped to the
      # "PRESS DO NOT ACCEPT" title marker + the shared test accounts +
      # is_seed=true, with a 50-row cap (scripts/e2e/prod-audit-sweeper.mjs).
      - name: Remove the cancelled fixture jobs, then check every proof-photo reference resolves
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            # exit 1, not 0 (Q52): this step also runs the proof-photo reference
            # CHECK; skipping it green meant the check silently never ran.
            echo "::error title=press residue NOT swept::no SUPABASE_ACCESS_TOKEN, so no service-role key; the cancelled fixture jobs stay on prod and the proof-photo check did not run."
            exit 1
          fi
          KEY=$(supabase projects api-keys --project-ref "$VITE_SUPABASE_PROJECT_ID" -o json 2>/dev/null \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error title=press residue NOT swept::the CLI listed no service_role key; the proof-photo check did not run."
            exit 1
          fi
          echo "::add-mask::$KEY"
          # Exit 1 = a real problem (over the cap, or a delete failed): red, loudly.
          SUPABASE_URL="$VITE_SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$KEY" \
            node scripts/e2e/prod-audit-sweeper.mjs
          # CLASS CHECK for the 400 POST /object/sign/proof-photos/… stream this
          # workflow's own run 35768341847 produced: a jobs row naming an object
          # storage does not have. READ-ONLY, and it belongs here because this is
          # the workflow that surfaces it — it presses the screens that sign those
          # paths. Exit 1 = a dangling reference; the nightly-red job below files
          # it. Same $KEY, same masked shell, shredded in the next step.
          SUPABASE_URL="$VITE_SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$KEY" \
            node scripts/proof-photo-reference-check.mjs
      - name: Shred the key
        if: always()
        run: rm -f .env

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: press-every-control-cleanup
          path: test-results/press-every-control-cleanup/
          if-no-files-found: ignore
          retention-days: 14

  # Owner-requested (2026-09-12): a red nightly used to land nowhere — nobody
  # watches this Actions tab. This opens/updates ONE `nightly-red` issue per
  # workflow and closes it on the next green run.
  notify:
    name: Report nightly result
    # cleanup is in `needs` and in `status` (Q52): it runs a CHECK
    # (proof-photo-reference-check.mjs), and a red cleanup used to close the
    # nightly-red issue as long as the presses themselves passed.
    needs: [snapshot, press, cleanup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: press-every-control
          status: ${{ (needs.snapshot.result == 'success' && needs.press.result == 'success' && needs.cleanup.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
