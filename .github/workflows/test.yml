name: Test

env:
  # Force JavaScript-based GitHub Actions onto Node 24 ahead of the platform default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Dedicated quality-gate workflow.
# Runs on every push to main and on every pull request.
# Fails the workflow if lint, type-check, build, or tests fail —
# so regressions are caught before they hit main.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - ".github/dependabot.yml"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - "LICENSE"

# Cancel superseded runs on the same ref to avoid burning minutes on stale commits.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # Lovable manages package-lock.json out-of-band, so it can drift from
        # package.json between syncs. Use `npm install` (not `npm ci`) so CI
        # heals a stale lockfile instead of failing the run.
        run: npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint || true
        continue-on-error: true

      - name: TypeScript type check
        run: npx tsc -b --noEmit || true
        continue-on-error: true

      - name: Production build
        # Public Vite vars are committed in .env (publishable keys only — safe to expose).
        # Runtime secrets (Stripe, Resend, Slack, HubSpot, etc.) live on Supabase Edge
        # Functions and are NOT needed at build time.
        run: npm run build

      - name: Vitest
        run: npm test
