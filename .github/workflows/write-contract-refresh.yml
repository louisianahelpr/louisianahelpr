name: Write contract snapshot refresh

# Nightly: re-pull the READ-ONLY prod schema facts that
# scripts/audit/write-contract.mjs checks every client write against, and FAIL
# if they drifted from the committed snapshot (or if any write now rejects).
# The vitest guard (src/test/writeContract.test.ts) runs offline against the
# committed JSON, so a stale snapshot would keep it green while prod changed
# underneath — this job is what stops that.
#
# Exit codes from the script: 0 clean, 1 a write prod would reject, 2 drift.
# Fix drift by running `node scripts/audit/write-contract.mjs --refresh`
# locally and committing the snapshot (the job uploads the new one too).

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: write-contract-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Require Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF missing. Failing rather than skipping: a skipped refresh looks like a clean one."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p supabase/.temp
          echo -n "$SUPABASE_PROJECT_REF" > supabase/.temp/project-ref

      - name: Refresh snapshot and check drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/audit/write-contract.mjs --refresh --check-drift

      - name: Upload refreshed snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: write-contract-snapshot
          path: scripts/audit/write-contract.snapshot.json
