name: Loading states refresh

# Re-measure every loading state on prod and re-prove the loading-state
# baseline against TODAY's UI (owner, 2026-09-23: "nothing at all should ever
# be stale ... set up routines so this can never happen").
#
# Before this, docs/audit/loading-states/measurements.json was refreshed only
# when someone remembered `npm run loading-states:measure` on a laptop: it was
# 3 days old after the skeletons changed, and baseline.json's "may only shrink"
# check ran on every push against that stale measurement — so an entry fixed
# by the skeleton work could sit in the baseline indefinitely.
#
# This job measures the committed commit's build against prod with the shared
# test accounts (the only intervention is holding data requests until the loading frame is measured; its one
# write is the /jobs/:id fixture job it creates, is_seed with parish null, and removes: owner, 2026-09-26, Q430;
# a run killed before that removal is swept by scripts/e2e/prod-audit-sweeper.mjs via the PRESS marker), then
# runs scripts/check-loading-state-shape.mjs on the FRESH measurement, which
# fails in both directions: a new breach, or a baseline entry that no longer
# breaches. The fresh measurement and screenshots are uploaded; a red run opens
# a nightly-red issue. scripts/check-staleness.mjs binds measurements.json's
# currency to this workflow's last scheduled success (WORKFLOW_BOUND).
#
# LANDING (Q57): when the fresh measurement re-proves the baseline, the `land`
# job copies measurements.json onto latest main and lands it through
# .github/actions/refresh-pr (one bot branch, one PR, auto-merge on green).
# Only measurements.json: the screenshots are re-taken every run and stay in
# the artifact, and baseline.json is a two-way ratchet a person lowers.

on:
  schedule:
    # 17:17 UTC daily: its worst case (80 min) ends before 19:17 scoreboard,
    # and 15:17 db-backup ends before it; :17 clears the hourly prod-errors
    # monitor at :47. Q318 (2026-09-23): moved so no prod-load run is due while another's worst case (timeout x waves) still holds the group; src/test/prodWorkflowSpacing.test.ts rule 5.
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A SCHEDULED run joins prod-load; a dispatch gets its own group (rule 4 of
  # src/test/prodWorkflowSpacing.test.ts). The job itself holds the shared
  # test-account lock, so a dispatch never drives poster-e2e beside another
  # suite.
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('loading-states-refresh-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  VITE_SUPABASE_PROJECT_ID: fncmgoasalhdgfwzhsqa
  VITE_SUPABASE_URL: https://fncmgoasalhdgfwzhsqa.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

jobs:
  measure:
    name: Measure every loading state (375, prod) and re-prove the baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Write .env (service-role key for session minting; never printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN missing — cannot mint the test sessions. Failing rather than skipping: a skipped measurement looks like a clean one."
            exit 1
          fi
          KEY=$(supabase projects api-keys --project-ref "$VITE_SUPABASE_PROJECT_ID" -o json 2>/dev/null \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error::the CLI listed no service_role key; cannot mint sessions"
            exit 1
          fi
          echo "::add-mask::$KEY"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$KEY" >> .env

      - name: Build and serve this commit locally (prod VITE_* env)
        uses: ./.github/actions/local-preview
        with:
          supabase-publishable-key: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Measure (writes docs/audit/loading-states/ in this checkout only)
        id: measure
        env:
          BASE: http://127.0.0.1:4173
          PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
          PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
          PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
          PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }}
          PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }}
        run: npm run loading-states:measure

      - name: Backend request budget (Q104)
        # Sums this job's metered backend requests (e2e/requestMeter.mjs) and
        # fails over e2e/request-budgets.json. Not on cancel: nothing to judge.
        if: ${{ !cancelled() }}
        run: node scripts/e2e/request-budget.mjs --label loading-states
      - name: Re-prove the baseline on the fresh measurement (both directions)
        # Judged whenever a measurement exists, whatever the budget step said:
        # both are verdicts on this run, and one must never hide the other.
        if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
        run: npm run check:loading-states

      - name: Print the measurement into the log (branch dispatches only)
        # A branch run's artifact is the only copy of its measurements.json,
        # and a session that cannot reach the artifact host (Azure blob
        # storage) cannot land a baseline change with the measurement it was
        # made exact to (#1773: src/test/loadingStateShape.test.ts reads the
        # committed pair). gzip + base64, 4000 characters a line between
        # markers, read back with scripts/audit/measurement-from-log.mjs.
        # Never on main: main lands it through the `land` job.
        if: ${{ !cancelled() && steps.measure.outcome == 'success' && github.ref != 'refs/heads/main' }}
        run: |
          echo "LSM-BEGIN $(sha256sum docs/audit/loading-states/measurements.json | cut -d' ' -f1)"
          gzip -9c docs/audit/loading-states/measurements.json | base64 -w 4000 | sed 's/^/LSM: /'
          echo "LSM-END"

      - name: Shred the key
        if: always()
        run: rm -f .env

      - name: Upload the fresh measurement + screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loading-states-${{ github.run_id }}
          path: docs/audit/loading-states/
          if-no-files-found: error
          retention-days: 14

  land:
    name: Land the fresh measurement (Q57 refresh PR)
    needs: [measure]
    # Main only. A dispatch on a branch measures THAT branch's build; landing
    # it would put a branch's measurement on main (refresh-pr rebuilds from
    # latest main and copies the file in). #1773: branch dispatches are how a
    # fix to this workflow is proven, so they must not land or sync issues.
    if: needs.measure.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY write grant in this workflow (Q57): push the bot branch, open or
    # update its PR, and dispatch its checks (a github.token PR triggers none).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: loading-states-${{ github.run_id }}
          path: ${{ runner.temp }}/measured/docs/audit/loading-states
      - uses: ./.github/actions/refresh-pr
        with:
          id: loading-states
          title: "chore(refresh): loading-state measurements re-measured on prod"
          paths: docs/audit/loading-states/measurements.json
          measured-dir: ${{ runner.temp }}/measured
          github-token: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          check-workflows: ${{ vars.REFRESH_PR_CHECK_WORKFLOWS }}

  notify:
    name: Report nightly result
    needs: [measure, land]
    # Main only, like `land`: the nightly-red issue is about main, and a branch
    # run (whose `land` is skipped) must neither open nor close it.
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: loading-states-refresh
          status: ${{ (needs.measure.result == 'success' && needs.land.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
