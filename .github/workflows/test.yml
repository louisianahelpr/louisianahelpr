name: Test

permissions:
  contents: read

env:
  # Force JavaScript-based GitHub Actions onto Node 24 ahead of the platform default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Publishable Vite vars for build + Vitest. These were previously sourced from a
  # committed .env; that file is now untracked (F-SEC-01), so the build/test steps
  # need them here. Publishable/anon keys only — safe to expose (they ship in the
  # client bundle by design; RLS is the real boundary). No runtime secrets here.
  VITE_SUPABASE_PROJECT_ID: "fncmgoasalhdgfwzhsqa"
  VITE_SUPABASE_URL: "https://fncmgoasalhdgfwzhsqa.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP"

# Dedicated quality-gate workflow.
# Runs on every push to main and on every pull request.
# Fails the workflow if lint, type-check, build, or tests fail —
# so regressions are caught before they hit main.

on:
  # Runs on ubuntu-latest (1x billing multiplier — cheap, unlike the
  # macOS ios-beta runners). Vitest was rotting silently because nothing
  # ran it in CI; this gates lint/type-check/build/test on every PR so
  # regressions are caught before they reach main. Docs-only changes are
  # skipped via paths-ignore to avoid wasting minutes.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - ".github/dependabot.yml"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - "LICENSE"
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid burning minutes on stale commits.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so CI heals a stale lockfile
        # instead of failing the run if package-lock.json drifts.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Migration version collision
        # A duplicate version silently breaks `supabase db push` for every
        # LATER migration too, and the pre-commit hook that also checks this
        # is skippable (--no-verify, or a bypassed hooksPath). Cheap to run
        # here so it cannot reach main.
        run: sh scripts/check-migration-versions.sh

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      # `tsc -b` above covers src/ ONLY — supabase/functions is Deno, with
      # https:// imports tsc cannot resolve, so it is excluded from tsconfig.
      # The tests that touch those files read them as TEXT. That leaves edge
      # functions with no syntax gate at all: a stray comment terminator inside
      # a JSDoc block passed lint, typecheck and 1825 tests, reached main, and
      # only appeared as "failed to create the graph" once Deno tried to bundle
      # it. Deno aborts the entire deploy on one such error.
      - name: Edge function syntax check
        run: npm run check:edge

      - name: Production build
        # Public Vite vars are committed in .env (publishable keys only — safe to expose).
        # Runtime secrets (Stripe, Resend, Slack, HubSpot, etc.) live on Supabase Edge
        # Functions and are NOT needed at build time.
        run: npm run build

      - name: Vitest
        run: npm test

      - name: Dead code (knip)
        # Fails on unused files / unused + unlisted dependencies. Unused *exports*
        # and types are reported as warnings (see rules in knip.json) — there is a
        # real backlog there that needs per-symbol verification, and failing on it
        # today would only invite blanket ignores.
        run: npm run deadcode

      - name: Dead edge functions
        # knip treats every supabase/functions/*/index.ts as an entry point, so it
        # cannot see a function nothing invokes. This checks the other direction.
        run: npm run deadcode:functions
