name: Quota and analytics monitors

# docs/OPEN.md Q63 + Q72, daily.
#
# quota     scripts/check-quota-usage.mjs: Supabase database size, connections
#           (against the LIVE max_connections), file storage and edge-function
#           invocations; Vercel deployments in 24h against the Pro plan's
#           daily cap (6000; Hobby's 100 until 2026-10-03, Q1152); Resend sends (month + day) from email_send_log;
#           Sentry accepted errors over 30 days. Every limit, its source and
#           its override live in scripts/lib/quotaMonitor.mjs. >= 80% of a
#           limit -> ops alert ledger warning (>= 100% -> error). A quota that
#           cannot be read -> ledger error AND a red run. Quotas with no API
#           (Supabase egress, Realtime messages) print a ::warning every run.
#
# analytics scripts/check-analytics-freshness.mjs: each key product event
#           (signup, job posted, applied, hired, paid, reviewed) against the
#           rows real users wrote for the same action. BROKEN (real actions,
#           zero events) -> ledger error; QUIET (nobody did it, pre-launch) is
#           reported and never alerts. An unreadable read -> red run.
#
# stripe-balance scripts/check-stripe-balance.mjs (Q3 / Q145): the Stripe TEST
#           platform balance (GET /v1/balance, STRIPE_TEST_SECRET_KEY, the key
#           e2e-real-backend.yml uses) against max($100, 1.5 x the payouts
#           due in the next 72h from public.jobs). Below it -> ledger error
#           that says how to top up in TEST mode (the 0077 card), BEFORE the
#           transfers fail as they did on 2026-09-22. An unreadable balance ->
#           ledger error AND a red run. Test mode only: a non-test key is refused.
#
# Both read prod through the Management API with read_only SQL (one statement
# each) plus one Management API logs query; nothing is written except ledger items.
# The alert path is the ops alert ledger (scripts/lib/opsAlertLedger.mjs), the
# same one prod-errors / supabase-usage use; its items carry verify-ref
# quota-monitor.yml, so `ops-alert-ledger.mjs sync` closes each only after a
# green run of THIS workflow that started after the last occurrence.

on:
  schedule:
    # 23:17 UTC daily: 120 min after expiry-monitor (21:17), 120 min before
    # supabase-usage (Sat 01:17), 30 min clear of the hourly :47 monitors
    # (src/test/prodWorkflowSpacing.test.ts).
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  # Scheduled runs share prod-load; a dispatch gets its own group
  # (src/test/prodWorkflowSpacing.test.ts rule 4).
  group: ${{ format('quota-monitor-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  quota:
    needs: prod-load-turn
    name: Quotas and limits (Q63)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Read every quota
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # Deployments are counted from Vercel, not GitHub: GitHub's list shared
          # the repo's GITHUB_TOKEN rate limit and went 403 (ledger f9b0a8a7).
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # A personal read token (org:read, project:read): the org token in
          # SENTRY_AUTH_TOKEN is release-upload only and gets 403 on usage stats.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_READ_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node scripts/check-quota-usage.mjs

  analytics:
    needs: prod-load-turn
    name: Analytics freshness (Q72)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Read each key event against real actions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-analytics-freshness.mjs

  stripe_balance:
    needs: prod-load-turn
    name: Stripe TEST balance vs payouts due (Q3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Read the available balance and the payouts due in 72h
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-stripe-balance.mjs

  db_pool_budget:
    needs: prod-load-turn
    # Q317: PostgREST + pooler + Auth pools + other backends + a pg_cron
    # reserve must fit in max_connections minus the superuser slots, or cron
    # jobs are refused under load (14 refusals, 2026-09-23 19:00Z).
    name: Postgres connection budget (Q317)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Add up the pools against the usable connections
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-db-pool-budget.mjs

  notify:
    name: Report nightly result
    needs: [quota, analytics, stripe_balance, db_pool_budget]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: quota-monitor
          status: ${{ (needs.quota.result == 'success' && needs.analytics.result == 'success' && needs.stripe_balance.result == 'success' && needs.db_pool_budget.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
