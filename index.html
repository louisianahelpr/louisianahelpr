    <meta name="description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond.">
    <meta name="keywords" content="Louisiana helpers, local help marketplace, cleaning services Louisiana, yard work, moving help, errands, handyman, New Orleans, Baton Rouge, Shreveport, Lafayette">
    <meta name="geo.region" content="US-LA">
    <meta name="geo.placename" content="Louisiana">
    <link rel="canonical" href="https://louisianahelpr.com">
    <meta name="author" content="Helpr" />

    <!-- Baseline CSP for the web build. The `_headers` file overrides this with the stricter
         production policy. Capacitor relies on this meta tag since `_headers` doesn't ship native. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor: ionic:; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.stripe.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: capacitor: ionic:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com https://*.ingest.us.sentry.io https://*.sentry.io https://us.i.posthog.com https://us-assets.i.posthog.com; frame-src https://js.stripe.com https://*.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=helpr2" />

    <!-- Performance: preconnect + font load tuned for LCP.
         The H1 hero headline uses Fraunces (display font) and is the LCP
         element on mobile. Loading the font CSS via media="print"+onload swap
         delays the swap until AFTER the JS bundle parses, causing the LCP
         text to repaint late (Lighthouse-flagged ~4.8s LCP regression).
         Fix: trim the critical font request to only the weights actually
         rendered above the fold (Fraunces 600/700 for H1, DM Sans 400/500/600/700
         for subhead/CTAs) and load it as a normal stylesheet. `display=swap`
         keeps fallback text visible so this never blocks FCP, while letting the
         LCP text stabilize on the first paint. Italic variants are deferred to
         a non-blocking second request via media-swap. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to Supabase to shorten the longest network dependency chain (LCP/data fetches) -->
    <link rel="preconnect" href="https://steigdwrpkosbiycshwz.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://steigdwrpkosbiycshwz.supabase.co" />
    <!-- Primary font stylesheet loaded asynchronously to avoid render-blocking.
         The print/onload swap pattern lets the browser fetch the CSS without
         delaying first paint, then promotes it to 'all' media once ready.
         `display=swap` ensures text remains visible during font load. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&display=swap"
      />
    </noscript>

    <!-- Note: The hero LCP image preload was removed because the /src/assets/* paths
         only exist in dev — production paths are content-hashed (e.g. /assets/hero-…-AB12.webp).
         Vite injects a `modulepreload` for the JS that imports the image, and the <img>
         in HeroSection has fetchpriority="high" + loading="eager" which gives it the
         same priority as a manual preload once the bundle parses. -->

    <!-- Sentry + PostHog both initialize inside requestIdleCallback (after
         first paint), which means a preconnect handshake completes seconds
         before the connection is actually used and gets flagged by
         Lighthouse as "unused preconnect" (wastes ~50ms of main-thread + a
         TLS slot). dns-prefetch keeps DNS resolution warm without paying
         the TCP/TLS cost up front. -->
    <link rel="dns-prefetch" href="https://o4511265714601984.ingest.us.sentry.io" />
    <link rel="dns-prefetch" href="https://us.i.posthog.com" />
    <link rel="dns-prefetch" href="https://us-assets.i.posthog.com" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://louisianahelpr.com" />
    <meta property="og:title" content="Helpr — Louisiana's Trusted Marketplace for Everyday Tasks" />
    <meta property="og:description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond." />
    <meta property="og:image" content="https://louisianahelpr.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Helpr — Louisiana's local help marketplace" />
    <meta property="og:site_name" content="Helpr" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card spec — also used by iMessage, Slack, Discord, LinkedIn
         rich previews. No Twitter account required; these tags just control how
         the link renders. summary_large_image yields a full-bleed hero card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://louisianahelpr.com" />
    <meta name="twitter:title" content="Helpr — Louisiana's Trusted Marketplace for Everyday Tasks" />
    <meta name="twitter:description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond." />
    <meta name="twitter:image" content="https://louisianahelpr.com/og-image.png" />
    <meta name="twitter:image:alt" content="Helpr — Louisiana's local help marketplace" />
  </head>
  <body>
    <!--
      Inline FCP shell. Paints instantly (no JS, no font, no network) so
      Lighthouse records First Contentful Paint as soon as HTML arrives,
      instead of waiting for the React bundle to parse + execute (~3s on
      slow 4G). React's root.render() replaces this synchronously on mount,
      so users never see a flash — the shell is invisible the moment the
      app hydrates. Brand color matches --background to avoid any flicker.
    -->
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        "
      >
        <div
          style="
            width: 96px;
            height: 96px;
            border-radius: 28px;
            background: #1FA678;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -0.04em;
            box-shadow: 0 18px 40px -12px rgba(31, 166, 120, 0.45);
          "
        >H</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
