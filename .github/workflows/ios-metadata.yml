name: iOS Metadata Sync (App Store Connect)

# Manual-only — pushes fastlane/metadata/ (App Store listing text, URLs,
# categories, review info, screenshots) to App Store Connect WITHOUT
# building the app or submitting for review.
#
# Run from the Actions tab → "iOS Metadata Sync (App Store Connect)" →
# "Run workflow". Cheap (Linux runner, no Xcode), safe to re-run.
on:
  workflow_dispatch: {}

concurrency:
  group: ios-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-metadata:
    name: Upload App Store metadata
    # Linux is fine — fastlane's `deliver` only talks to the App Store
    # Connect API. No Xcode, no signing, no macOS needed.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT || secrets.ASC_KEY_BASE64 }}
      DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}

      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare Fastlane metadata directory
        run: |
          set -e
          test -d fastlane/metadata || (echo "::error::fastlane/metadata directory missing" && exit 1)
          rm -rf fastlane/metadata/custom_product_pages fastlane/metadata/ppo_tests
          echo "Files that will be uploaded:"
          find fastlane/metadata -type f | sort

      - name: Verify required secrets
        run: |
          set -e
          missing=()
          test -n "$ASC_KEY_ID" || missing+=("ASC_KEY_ID")
          test -n "$ASC_ISSUER_ID" || missing+=("ASC_ISSUER_ID")
          test -n "$ASC_KEY_CONTENT" || missing+=("ASC_KEY_CONTENT")
          test -n "$DEVELOPER_TEAM_ID" || missing+=("DEVELOPER_TEAM_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run Fastlane metadata lane
        env:
          DELIVER_IGNORE_LANGUAGE_DIRECTORY_VALIDATION: "true"
        run: |
          set -e
          rm -rf fastlane/metadata/custom_product_pages fastlane/metadata/ppo_tests
          echo "Metadata directory after cleanup:"
          find fastlane/metadata -maxdepth 2 -type d | sort
          bundle exec fastlane ios metadata --verbose
