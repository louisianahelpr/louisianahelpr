name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc -b --noEmit
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        # Public Vite vars are committed in .env (publishable keys only).
        # Backend secrets live on Supabase Edge Functions and are not required here.
        run: npm run build
