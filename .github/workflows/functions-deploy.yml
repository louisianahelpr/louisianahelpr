name: Supabase Edge Functions Deploy

permissions:
  contents: read
  # Read this push's db-deploy run (the wait step before the RPC check).
  actions: read

# Auto-deploys edge functions when changes land on main. Same structural
# fix as db-deploy.yml — closes the manual handoff that lets prod's
# function code drift from the repo. The TODO had three "deploy
# stripe-webhook" reminders dating back to 2026-05-04 that nobody ever
# pulled the trigger on, exactly the symptom the migration backlog had.
#
# Smart targeting: only deploys the function(s) whose code actually
# changed in the push (or in the merged PR). Avoids burning Actions
# minutes redeploying all 48 functions on a one-line edit.
#
# REQUIRED REPO SECRETS (same as db-deploy.yml):
# - SUPABASE_ACCESS_TOKEN
# - SUPABASE_PROJECT_REF
#
# (No SUPABASE_DB_PASSWORD needed — function deploy doesn't talk to
# the database directly, it just uploads the function bundle.)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      # config.toml carries each function's `verify_jwt` gate, which is applied
      # at DEPLOY time — so a change here is a prod behaviour change with no
      # function-code change behind it. Without this path, editing it did
      # nothing: the fix sat in the repo and prod kept the old gate. That is
      # exactly how health-check stayed 401 after being "fixed".
      - "supabase/config.toml"
      - ".github/workflows/functions-deploy.yml"
  workflow_dispatch:
    inputs:
      function_name:
        description: "Optional: deploy just one function by name (leave blank to auto-detect changed)"
        required: false
        default: ""

concurrency:
  # Serialize so two pushes don't race the deploy of the same function.
  group: functions-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy changed edge functions
    runs-on: ubuntu-latest
    # 60, not 15: the db-deploy wait below can take up to 45 minutes when
    # that run is queued behind another (its concurrency group serializes).
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: a push can carry MANY commits, and the diff has to
          # span the whole pushed range, not just the tip. fetch-depth: 2 only
          # reaches HEAD~1 — see the DIFF_BASE comment below for what that cost.
          fetch-depth: 0

      # REQUIRED SECRETS ARE A HARD GATE. Changed 2026-08-31.
      #
      # WHAT THIS CATCHES: edge-function deploys silently stopping forever.
      #
      # This step used to emit ::warning:: and set skip=true, with every later
      # step guarded by `if: skip != 'true'`. A skipped job and a passed job
      # are the same colour to the checks API, the commit status and the merge
      # box — so rotating, expiring or renaming SUPABASE_ACCESS_TOKEN would
      # stop every edge-function deploy permanently while main stayed fully
      # green and nothing anywhere said so. Prod's function code would drift
      # from the repo exactly the way it did before this workflow existed
      # (three "deploy stripe-webhook" TODOs nobody ever pulled the trigger
      # on), only now with a green check claiming otherwise.
      #
      # Same failure shape as the DIFF_BASE bug below and the vercel.json
      # schema break: a green pipeline over a stale prod.
      #
      # sentry-release.yml is the model for a LEGITIMATE skip — Sentry release
      # tagging is genuinely optional, so it warns and no-ops visibly. These
      # two secrets are not optional: without them this workflow's entire
      # purpose is unachievable, so it fails.
      #
      # Secrets are read through `env:` rather than interpolated into the
      # script body so no secret value can be parsed as shell.
      - name: Require deploy secrets
        id: precheck
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${SUPABASE_PROJECT_REF:-}" ]  && MISSING="$MISSING SUPABASE_PROJECT_REF"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s):$MISSING"
            echo "::error::functions-deploy CANNOT deploy edge functions without these. It is failing rather than skipping, because a skipped deploy reports as a passed deploy and would leave prod running stale function code behind main indefinitely."
            echo "::error::Add them in Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "✓ All required deploy secrets are present."

      - name: Determine functions to deploy
        id: targets
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -eo pipefail

          MANUAL_INPUT="${{ github.event.inputs.function_name }}"

          # DIFF BASE — this is the whole ballgame.
          #
          # This step used to diff HEAD~1..HEAD, i.e. only the TIP commit of
          # the push. A push carrying five commits was inspected as if it
          # carried one. On 2026-08-31 a push of five commits (572f2a73,
          # eb5d1222, 190d9c32, 8aed07ef, 1a7ac776) landed the entire
          # react-email rewrite — all 17 templates, the official Resend SDK,
          # and the H-mark header — in 190d9c32. The tip commit was the E2E
          # port fix, which touches no edge function, so run 33401206418
          # printed "No function code changes detected", reported SUCCESS, and
          # deployed NOTHING. Prod kept sending the old hand-built emails for
          # hours while every check on main was green. Same failure shape as
          # the vercel.json schema break: a green pipeline over a stale prod.
          #
          # github.event.before is the commit main pointed at before this
          # push, so before..HEAD covers every commit actually pushed.
          #
          # Two cases where it is unusable: an all-zeros SHA (branch created,
          # or the ref was force-pushed/reset) and a SHA no longer reachable
          # after a force-push. Both mean "we cannot know what changed", and
          # the only safe answer to that is deploy-all — never "nothing".
          BEFORE_SHA="${{ github.event.before }}"
          DIFF_BASE=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            DIFF_BASE="$BEFORE_SHA"
            echo "Diffing the full pushed range: ${BEFORE_SHA}..HEAD"
          elif [ -n "$MANUAL_INPUT" ]; then
            # workflow_dispatch has no before-SHA and does not need one.
            DIFF_BASE="HEAD~1"
          else
            echo "::warning::No usable before-SHA (new branch, force-push, or unreachable commit) — deploying ALL functions rather than risk deploying none."
            FORCE_DEPLOY_ALL=1
          fi

          if [ -n "$MANUAL_INPUT" ]; then
            # workflow_dispatch path with a specific function requested
            if [ ! -d "supabase/functions/$MANUAL_INPUT" ]; then
              echo "::error::supabase/functions/$MANUAL_INPUT does not exist"
              exit 1
            fi
            FUNCTIONS="$MANUAL_INPUT"
            echo "Manual deploy: $FUNCTIONS"
          else
            # Auto-detect: which function dirs had file changes in this push?
            # No `|| true` (Q52): a failed diff must not read as "nothing changed".
            CHANGED=$(git diff --name-only "$DIFF_BASE" HEAD -- 'supabase/functions/*')
            # Extract the function name (the dir immediately under supabase/functions/)
            # Skip _shared — it's a library, not a deployable function.
            FUNCTIONS=$(echo "$CHANGED" \
              | grep -E '^supabase/functions/[^/]+/' \
              | awk -F/ '{print $3}' \
              | grep -v '^_shared$' \
              | sort -u \
              | tr '\n' ' ' || true)
            if [ -z "$FUNCTIONS" ]; then
              echo "No function code changes detected (or only _shared changed)."
            else
              echo "Auto-detected changed functions: $FUNCTIONS"
            fi
          fi

          # If _shared changed, that's a library; we redeploy ALL functions
          # since any of them could depend on it. Detected via a separate
          # diff check (the grep above filtered _shared out of the function
          # list, so check the raw CHANGED for _shared touches).
          #
          # config.toml or this workflow file changing is treated the same
          # way: config.toml carries per-function deploy-time settings
          # (verify_jwt etc.) that aren't tied to any single function dir,
          # and a workflow-file edit means we can't trust the auto-detect
          # logic that just ran. Deploy-all is the safe fallback for both —
          # otherwise a config.toml-only commit finds zero changed function
          # files, sets skip_deploy=true, and reports success while
          # deploying nothing (prod's function config silently goes stale).
          if [ -n "$MANUAL_INPUT" ]; then
            echo "Skipping _shared/config.toml/workflow check — manual single-function deploy."
          elif [ "${FORCE_DEPLOY_ALL:-0}" = "1" ]; then
            # No usable diff base — we genuinely do not know what changed, so
            # the only answer that cannot silently leave prod stale is all.
            echo "::warning::Unknown diff range — deploying ALL functions."
            FUNCTIONS=$(ls supabase/functions/ | grep -v '^_shared$' | tr '\n' ' ' || true)
          else
            CONFIG_OR_WORKFLOW_CHANGED=$(git diff --name-only "$DIFF_BASE" HEAD -- 'supabase/config.toml' '.github/workflows/functions-deploy.yml')
            if echo "$CHANGED" | grep -qE '^supabase/functions/_shared/'; then
              echo "::warning::_shared changed — promoting to deploy-all to avoid leaving stale callers."
              FUNCTIONS=$(ls supabase/functions/ | grep -v '^_shared$' | tr '\n' ' ' || true)
            elif [ -n "$CONFIG_OR_WORKFLOW_CHANGED" ]; then
              echo "::warning::supabase/config.toml or the workflow file changed — promoting to deploy-all so deploy-time settings (e.g. verify_jwt) actually apply."
              FUNCTIONS=$(ls supabase/functions/ | grep -v '^_shared$' | tr '\n' ' ' || true)
            fi
          fi

          if [ -z "$FUNCTIONS" ]; then
            echo "No function changes, config.toml changes, or workflow changes detected. Nothing to deploy."
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "skip_deploy=false" >> $GITHUB_OUTPUT

      - name: Install Supabase CLI
        if: steps.precheck.outputs.skip != 'true' && steps.targets.outputs.skip_deploy != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        if: steps.precheck.outputs.skip != 'true' && steps.targets.outputs.skip_deploy != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # WAIT FOR THIS PUSH'S DB DEPLOY FIRST. Added 2026-09-26 (issue #1819).
      #
      # The RPC check below used to be the only wait, and it waited 300 s on
      # the assumption that the migration lands "about a minute later". It is
      # applied by db-deploy.yml, a separate workflow on the same push with
      # three gate jobs and a serialized concurrency group: for #1812's merge
      # (9f2021865) it ran 03:43:36-03:52:13Z, 8.6 minutes, and one on
      # 2026-09-26 01:03Z took 20. So run 36215687560 gave up at 03:49:02Z
      # ("public.export_my_data does not exist on prod"), three minutes before
      # db-deploy created it, and uploaded NO function at all: export-my-data
      # stayed 404 on prod, "Download My Data" failed for every user, and the
      # _shared change (a deploy-all) never shipped either.
      #
      # This step removes the race rather than lengthening a guess: it waits
      # for the db-deploy run of this exact commit to finish, whatever its
      # conclusion, then lets the RPC check below give the verdict. No such
      # run within 90 s means this push touched no db-deploy path, and the
      # check below still fails closed on a missing RPC.
      - name: Wait for this commit's db-deploy run to finish
        if: steps.precheck.outputs.skip != 'true' && steps.targets.outputs.skip_deploy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          while :; do
            ELAPSED=$(( $(date +%s) - START ))
            # Newest db-deploy run for this exact commit: "<id> <status> <conclusion>".
            RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/db-deploy.yml/runs?head_sha=${SHA}&per_page=10" \
              --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "" else "\(.id) \(.status) \(.conclusion // "none")" end')
            if [ -z "$RUN" ]; then
              if [ "$ELAPSED" -ge 90 ]; then
                echo "No db-deploy run for ${SHA} after ${ELAPSED}s: this push changed no migration. The RPC check below still gives the verdict."
                break
              fi
            else
              read -r ID STATUS CONCLUSION <<< "$RUN"
              if [ "$STATUS" = "completed" ]; then
                echo "db-deploy run ${ID} for ${SHA} finished (${CONCLUSION}) after ${ELAPSED}s of waiting."
                if [ "$CONCLUSION" != "success" ]; then
                  echo "::warning::db-deploy run ${ID} concluded ${CONCLUSION}; the RPC check below decides whether any function can ship."
                fi
                break
              fi
              if [ "$ELAPSED" -ge 2700 ]; then
                echo "::error::db-deploy run ${ID} for ${SHA} is still ${STATUS} after 45 minutes. Not deploying functions ahead of their migrations; re-run this workflow once it finishes."
                exit 1
              fi
              echo "Waiting for db-deploy run ${ID} (${STATUS}) for ${SHA}..."
            fi
            sleep 20
          done

      # A FUNCTION MUST NOT SHIP AHEAD OF AN RPC IT CALLS. Added 2026-09-23 (Q159).
      #
      # send-notification-email asks notification_crosses_seed_boundary()
      # before every mail and fails CLOSED when it cannot (it used to SEND on
      # PGRST202). Either way, a caller live before its function is a prod
      # defect: mail about seed jobs to real people, or no mail at all. This
      # reads every `.rpc("<name>"` in supabase/functions against prod's
      # pg_proc and fails the deploy, before anything is uploaded, while one is
      # missing. --wait: the migration that adds the RPC usually lands in the
      # same push; the step above waited for db-deploy.yml to apply it, and a
      # missing name is still re-read for up to 5 minutes (schema cache lag).
      - name: Verify every RPC an edge function calls exists on prod
        if: steps.precheck.outputs.skip != 'true' && steps.targets.outputs.skip_deploy != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-edge-rpcs-live.mjs --wait 300

      # The BEFORE half of the landed-check below. Taken after the CLI is
      # installed and before anything is uploaded, so the comparison is against
      # what prod was actually serving when this run started.
      - name: Snapshot deployed bundles (before)
        if: steps.precheck.outputs.skip != 'true' && steps.targets.outputs.skip_deploy != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions" \
            -o functions-before.json
          node -e 'const d=require("./functions-before.json");console.log("Recorded "+((Array.isArray(d)?d:d.functions||[]).length)+" function(s).")'

      - name: Deploy each function
        if: steps.precheck.outputs.skip != 'true' && steps.targets.outputs.skip_deploy != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eo pipefail
          FAIL=0
          # The CLI's output is EVIDENCE, not just log noise: the verify step
          # below reads back out of it which functions were actually UPLOADED
          # and which the CLI deduped ("No change found in Function: x"), and
          # only asserts on the former. `tee -a` keeps both the live log and the
          # file; `2>&1` because the CLI writes those lines to stderr, and losing
          # them would make a correctly-deduped function look unaccounted for.
          : > functions-deploy.log
          for fn in ${{ steps.targets.outputs.functions }}; do
            echo ""
            echo "::group::Deploying $fn"
            # BR-024: stamp THIS function's build hash into _shared/buildStamp.ts
            # right before the CLI bundles it; the "serves HEAD's build" step
            # below reads it back from the running function.
            node scripts/edge-build-stamp.mjs write "$fn"
            # --no-verify-jwt is set per-function in supabase/config.toml
            # so we don't need to pass it here. The CLI reads config.toml.
            if supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" 2>&1 | tee -a functions-deploy.log; then
              echo "✓ $fn deployed"
            else
              echo "::error::$fn deploy FAILED"
              FAIL=1
            fi
            echo "::endgroup::"
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "::error::One or more function deploys failed. See per-function logs above."
            exit 1
          fi

      # THE DEPLOY IS NOT DONE UNTIL PROD SAYS SO. Added 2026-09-22.
      #
      # WHAT THIS CATCHES: the CLI reporting a successful deploy that the
      # platform silently discarded.
      #
      # Everything above this step tests the CLIENT. `supabase functions deploy`
      # exiting 0 means an upload was accepted; it does not mean the function
      # changed. On 2026-09-22 run 35756822730 printed "Deploying Function: …"
      # and then "Deployed Functions on project ***: …" for all 73 functions and
      # concluded success, while EIGHT of those uploads never landed:
      # create-pro-checkout kept serving its 2026-09-07 build and claim-gift-card
      # its 2026-09-13 one — the latter missing the gift-card funding gate that
      # had landed that morning, so a refunded gift card stayed claimable in
      # production. A second run (35757178581) re-uploaded create-pro-checkout,
      # reported success again, and was discarded again. Nothing went red; the
      # pipe between main and prod was simply open at one end.
      #
      # Same family as the DIFF_BASE bug and the missing-secrets skip above, and
      # as the vercel.json schema break: a green pipeline over a stale prod. The
      # answer each time is the same shape — assert the OUTCOME, not the step.
      #
      # `always()` so it also reports when the deploy loop failed: which
      # functions did and did not land is exactly what the next person needs.
      # It must never be `continue-on-error` — that would re-create the defect
      # it exists to close (src/test/functionsDeployLanded.test.ts asserts this).
      - name: Verify every deploy actually landed
        if: always() && steps.precheck.outputs.skip != 'true' && steps.targets.outputs.skip_deploy != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          # RETRY, THEN FAIL. Measured loss rate on 2026-09-22 was 8 of 64
          # uploads in one run and 3 of 58 in the next, and the set differed
          # both times — it is intermittent, not a property of any particular
          # function. A check that went red on every drop would leave main red
          # most days, and a gate people learn to ignore is a gate that is off.
          # So: re-deploy exactly what did not land, up to twice, and fail only
          # if the platform still will not take it. The run stays green only
          # when prod genuinely matches what was pushed.
          snapshot() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions" \
              -o "$1"
          }

          MAX_RETRIES=2
          ATTEMPT=0
          BASE=functions-before.json
          LOG=functions-deploy.log
          TARGETS="${{ steps.targets.outputs.functions }}"

          while :; do
            snapshot functions-after.json
            if node scripts/verify-functions-deployed.mjs \
                 --before "$BASE" --after functions-after.json \
                 --log "$LOG" --targets "$TARGETS" --lost-file lost.txt; then
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -gt "$MAX_RETRIES" ]; then
              echo "::error::Still not landed after $MAX_RETRIES retries. Prod is running stale code for the function(s) named above — do not treat this run as deployed."
              exit 1
            fi

            RETRY="$(tr '\n' ' ' < lost.txt)"
            if [ -z "${RETRY// /}" ]; then
              echo "::error::The verifier failed but named nothing to retry. Failing rather than looping."
              exit 1
            fi

            echo "::warning::Deploy attempt $ATTEMPT did not land for:$RETRY — redeploying just those."
            # This snapshot is the new baseline: the retry must move the hash
            # from what prod holds NOW, not from what it held before the run.
            cp functions-after.json "$BASE"
            LOG="functions-deploy-retry-$ATTEMPT.log"
            : > "$LOG"
            for fn in $RETRY; do
              node scripts/edge-build-stamp.mjs write "$fn"
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a "$LOG"
            done
            TARGETS="$RETRY"
          done

      # EVERY FUNCTION SERVES HEAD'S BUILD. Added 2026-09-25 (BR-024).
      #
      # The step above can prove a lost deploy only where ezbr_sha256 is
      # stable. About forty functions have it re-stamped by the platform with
      # no deploy (health-check 1305 -> 1307 in nine minutes, 2026-09-22), so a
      # lost upload there can pass it. This step asks each RUNNING function
      # instead: _shared/buildStamp.ts answers an OPTIONS probe with the stamp
      # the loop above wrote into its bundle, and
      # scripts/check-edge-build-stamps.mjs compares that with the stamp HEAD
      # computes, for EVERY directory under supabase/functions (not only this
      # run's targets, so a function an earlier run failed to land is caught).
      # Mismatches are redeployed up to twice; then the run fails.
      # src/test/edgeBuildStamp.test.ts keeps this step always(), never
      # continue-on-error, and every function behind the wrapper.
      - name: Verify every function serves HEAD's build
        if: always() && steps.precheck.outputs.skip != 'true' && steps.targets.outputs.skip_deploy != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # A RE-RUN OF AN OLD RUN checks out that run's old SHA. Every function
          # changed since then would "mismatch", and redeploying them would roll
          # prod back to old code. So the redeploy loop runs only when this
          # checkout is main's current tip; otherwise the check covers just this
          # run's own targets and never redeploys.
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::This run's commit is not main's tip (a re-run of an older run?). Checking only its targets, redeploying nothing."
            node scripts/check-edge-build-stamps.mjs --wait-seconds 120 --functions "${{ steps.targets.outputs.functions }}"
            exit $?
          fi
          MAX_RETRIES=2
          ATTEMPT=0
          while :; do
            if node scripts/check-edge-build-stamps.mjs --wait-seconds 120 --mismatch-file stale.txt; then
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -gt "$MAX_RETRIES" ]; then
              echo "::error::Still serving another build after $MAX_RETRIES redeploys. Prod is running code that is not HEAD's for the function(s) named above — do not treat this run as deployed."
              exit 1
            fi
            STALE="$(tr '\n' ' ' < stale.txt)"
            if [ -z "${STALE// /}" ]; then
              echo "::error::The stamp check failed but named no function to redeploy. Failing rather than looping."
              exit 1
            fi
            echo "::warning::Attempt $ATTEMPT: not serving HEAD's build:$STALE — redeploying just those."
            for fn in $STALE; do
              node scripts/edge-build-stamp.mjs write "$fn"
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            done
          done

      - name: Notify on failure
        # Never gate this step on the secret: a missing SLACK_WEBHOOK_URL must
        # show as a warning on the run, not as a silently skipped step.
        # (src/test/slackAlertWorkflows.test.ts)
        if: failure() && steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Ops alert ledger (docs/OPEN.md Q1): the Slack post scrolls away; the
          # ledger item stays open until this workflow's own re-run is green.
          # Recorded FIRST so a missing webhook cannot skip it; never fails the step.
          node scripts/ops-alert-ledger.mjs record --source-kind workflow --source "functions-deploy" \
            --title "functions-deploy failed on main" --severity critical --verify-ref "functions-deploy.yml" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning title=Deploy-failure alert NOT sent::functions-deploy failed, but the GitHub secret SLACK_WEBHOOK_URL is not set, so nobody was notified. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          curl -sS --fail -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: functions-deploy failed on main — ${{ github.sha }}. Check Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" \
            || echo "::warning title=Deploy-failure alert NOT delivered::Slack rejected the webhook post. Check that SLACK_WEBHOOK_URL is still a valid incoming webhook."
