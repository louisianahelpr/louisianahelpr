name: E2E happy-path smoke

permissions:
  contents: read

# Three critical-path Playwright smoke tests covering customer-posts-job,
# helper-browses-and-applies, customer-sees-application. Run against the
# local Vite preview build with Supabase calls mocked via route() — no
# network dependency on the real Supabase project.
#
# Scope:
# - Runs on every PR (it's a required branch-protection check, so a
#   `paths:` filter would deadlock auto-merge on backend-only PRs —
#   GitHub leaves the check "Expected" forever). Instead, an in-job
#   paths-filter step skips the expensive Playwright work and reports
#   green in seconds when no UI-relevant file changed.
# - Concurrency-locked to one run per ref.
# - Uploads HTML report + screenshots on failure for fast triage.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-happy-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  happy-path:
    name: Playwright happy-path smoke (mocked Supabase, mobile viewport)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: deliberately NOT excluding dependabot[bot]. This job is a REQUIRED
    # status check on main, and GitHub counts a required check that is skipped
    # as unsatisfied — so excluding Dependabot here made every dependency PR
    # permanently unmergeable. Three sat open for weeks looking "green": every
    # check that ran had passed, but the ones gating the merge never ran.
    # A dependency bump is also exactly when an E2E smoke test earns its keep.

    env:
      # Bake the same Supabase env vars the production build uses so the
      # `import.meta.env.VITE_SUPABASE_URL` literal in the bundle still
      # resolves to a real-looking URL. Playwright's route() intercepts
      # everything hitting that origin, so no real traffic is sent.
      VITE_SUPABASE_PROJECT_ID: fncmgoasalhdgfwzhsqa
      VITE_SUPABASE_URL: https://fncmgoasalhdgfwzhsqa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_key_for_e2e_only

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect UI-relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ui:
              - "src/**"
              - "public/**"
              - "index.html"
              - "vite.config.ts"
              - "tailwind.config.ts"
              - "package.json"
              - "package-lock.json"
              - "playwright.config.ts"
              - "e2e/happy-path/**"
              - ".github/workflows/e2e-happy-path.yml"

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        # See test.yml — use `install` not `ci` to tolerate lockfile drift.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright Chromium browser
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run happy-path smoke tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        # PLAYWRIGHT_WEB_SERVER=1 turns on the auto-start of
        # `npm run build && npx vite preview` (see playwright.config.ts).
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npm run test:e2e:happy

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-happy-path
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-happy-path
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
