name: CI

env:
  # Force JavaScript-based GitHub Actions onto Node 24 ahead of the platform default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint || true
        continue-on-error: true

      - name: Type check
        run: npx tsc -b --noEmit || true
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        # Public Vite vars are committed in .env (publishable keys only).
        # Backend secrets live on Supabase Edge Functions and are not required here.
        run: npm run build
