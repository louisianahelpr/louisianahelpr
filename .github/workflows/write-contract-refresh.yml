name: Write contract snapshot refresh

# Weekly (Saturdays, see the cron): re-pull the READ-ONLY prod schema facts that
# scripts/audit/write-contract.mjs checks every client write against, and FAIL
# if they drifted from the committed snapshot (or if any write now rejects).
# The vitest guard (src/test/writeContract.test.ts) runs offline against the
# committed JSON, so a stale snapshot would keep it green while prod changed
# underneath — this job is what stops that.
#
# Exit codes from the script: 0 clean, 1 a write prod would reject, 2 drift.
# A reject fails the job. DRIFT alone is landed (Q57): the `land` job puts the
# refreshed snapshot on latest main through .github/actions/refresh-pr (one bot
# branch, one PR, auto-merge once the required checks — which run
# src/test/writeContract.test.ts on the new snapshot — pass).

on:
  schedule:
    # Sat 09:17 UTC, after 03:17 press (worst case 320 min); e2e-real-backend
    # took Sat 11:17. Q318 (2026-09-23): moved so no prod-load run is due while another's worst case (timeout x waves) still holds the group; src/test/prodWorkflowSpacing.test.ts rule 5.
    - cron: "17 9 * * 6"
  workflow_dispatch:

permissions:
  contents: read

# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  # PROD LOAD (2026-09-14): prod-hitting crons are spread across 03:00-13:00 UTC,
  # >= 2h apart, and share the prod-load concurrency group; see
  # src/test/prodWorkflowSpacing.test.ts before moving this.
  #
  # A SCHEDULED run joins prod-load; a workflow_dispatch gets its OWN group
  # (2026-09-21, issues #1595/#1626). `cancel-in-progress: false` does NOT mean
  # "queue forever" — GitHub keeps exactly ONE *pending* run per group, so a
  # third run entering it CANCELS the one already waiting. On 2026-09-21T04:54Z
  # four prod-load workflows dispatched inside four minutes cancelled each
  # other in a chain, and a workflow-level cancellation leaves a run with NO
  # jobs, so nothing reports it. See e2e-real-backend.yml, which has made this
  # split since the money loop lost a dispatch the same way.
  group: ${{ format('write-contract-refresh-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  refresh:
    needs: prod-load-turn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_REF missing. Failing rather than skipping: a skipped refresh looks like a clean one."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # npm install, not npm ci, matching test.yml: ci refuses a lockfile that is
      # slightly behind package.json, and failed this job on 2026-09-13.
      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      # A real `supabase link`, same as db-drift-detect.yml / db-backup.yml.
      # This step used to only write supabase/.temp/project-ref, so the CLI had
      # no pooler URL and `db query --linked` dialled the direct DB host over
      # IPv6, which GitHub runners do not have: every run from 2026-09-13 died
      # on "IPv6 is not supported on your current network". Linking with the DB
      # password records the IPv4 pooler connection the query then uses.
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Refresh snapshot and check drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          rc=0
          node scripts/audit/write-contract.mjs --refresh --check-drift || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::notice::Prod schema facts drifted from the committed snapshot; the land job opens the refresh PR."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Upload refreshed snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: write-contract-snapshot
          path: scripts/audit/write-contract.snapshot.json

  # A RED RUN HAS TO LAND SOMEWHERE. Added 2026-09-23 after write-contract-refresh — along
  # with 13 other scheduled workflows — was found failing with nobody told.
  # The drift detector had been red for THREE CONSECUTIVE DAYS (09-20, 09-21,
  # 09-22) and the nightly DB backup had not succeeded since 09-21; both are
  # invisible unless somebody opens the Actions tab, which is exactly the
  # thing the owner said nobody does.
  #
  # `nightly-issue-sync` opens/updates ONE `nightly-red` issue for this
  # workflow and closes it on the next green run, which is what makes the
  # "Nightly reds nobody read" gate able to see it at all.
  #
  # SCHEDULE AND MANUAL RUNS ONLY. A push/PR failure is already visible on the
  # commit and the PR; filing an issue for it would make the label noisy and
  # teach people to ignore it.
  land:
    name: Land the refreshed snapshot (Q57 refresh PR)
    needs: [refresh]
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY write grant in this workflow (Q57): push the bot branch, open or
    # update its PR, and dispatch its checks (a github.token PR triggers none).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: write-contract-snapshot
          path: ${{ runner.temp }}/measured/scripts/audit
      - uses: ./.github/actions/refresh-pr
        with:
          id: write-contract
          title: "chore(refresh): write-contract snapshot re-pulled from prod"
          paths: scripts/audit/write-contract.snapshot.json
          measured-dir: ${{ runner.temp }}/measured
          github-token: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          check-workflows: ${{ vars.REFRESH_PR_CHECK_WORKFLOWS }}

  notify:
    name: Report nightly result
    needs: [refresh, land]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: write-contract-refresh
          status: ${{ (needs.refresh.result == 'success' && needs.land.result == 'success') && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
