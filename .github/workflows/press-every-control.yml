name: Press every control

permissions:
  contents: read

# EVERY control on EVERY route, pressed, with the outcome classified — against
# PRODUCTION (owner, 2026-09-12: "no mock mode ever").
#
# The owner (2026-09-12): "there is no way every button has been clicked to be
# sure not failing." scripts/audit/press-every-control.mjs is the answer: the
# route set is derived from src/App.tsx at run time, every control on every
# route (and inside every dialog a press opens) is pressed by DOM path, and the
# classifier fails on an error toast, error-screen copy (e2e/errorScreens.ts),
# a console error, a 4xx/5xx during the press, or no observable change.
#
# It runs on the real backend as the shared test accounts (poster, helper,
# admin, incomplete-profile) with the app built from this commit and served by
# `vite preview`. Safety is in scripts/audit/pressProdSafety.mjs:
#   - a mutating press (delete / pay / send / ban / cancel / submit …) only on a
#     record the read-only select proves is test-owned; otherwise SKIPPED with
#     the documented reason "not test-owned"
#   - admin actions only against seed test targets
#   - payment presses only while Stripe is in TEST mode (cs_test_ on a real
#     Checkout Session, as e2e/prod-lifecycle.spec.ts detects it)
#   - the run creates its own fixture job and cleans up everything it made;
#     every leg restores and sweeps again after its own shards, even on failure
#
# FAILS on: any failed press, or any control that was neither pressed nor
# skipped for a DOCUMENTED reason (DOCUMENTED_SKIPS in the script). Coverage
# must be 100%. A persona whose account could not be signed in is reported as
# UNCOVERED with a ::warning:: (the admin and incomplete accounts land when
# their secrets do), never as a silent green.
#
# Sessions: the password grant with the PLAYWRIGHT_* secrets, as
# e2e/journeys/fixtures.ts does. An account without a password secret is
# minted through scripts/test-signin-link.mjs, which needs the service-role
# key: fetched at run time through the Supabase CLI (SUPABASE_ACCESS_TOKEN),
# masked, written to .env, never echoed — the same source as
# scripts/e2e/mint-helper-login.sh.
#
# Nightly + workflow_dispatch only. Not on push: it drives the shared prod
# accounts and holds their job-level lock (prod-lifecycle-shared-accounts) with
# the money loop and the journeys, so two runs never press the same rows at once.

on:
  schedule:
    # Mon, Wed, Sat 03:17 UTC (prod load spread, 2026-09-14).
    - cron: "17 3 * * 1,3,6"
  workflow_dispatch:
    inputs:
      routes:
        description: "Comma-separated route list to narrow the run (blank = every route; a base path such as /jobs/:id selects every row derived from it)"
        required: false
        default: ""
      personas:
        description: "Comma-separated personas (anon,customer,helper,admin,incomplete)"
        required: false
        default: "anon,customer,helper,admin,incomplete"

# Q1161: no group is shared any more. A scheduled run is ordered by the
# `prod-load-turn` job below (a FIFO queue); this group is per run, so GitHub
# has nothing to cancel.
concurrency:
  # WORKFLOW level: prod load only. A SCHEDULED run joins prod-load (spaced
  # against every other prod cron, src/test/prodWorkflowSpacing.test.ts); a
  # workflow_dispatch gets its own group (rule 4: GitHub keeps ONE pending run
  # per group, so a dispatch parked in prod-load was cancelled by the next
  # suite to queue there, e.g. run 36215841191 at 03:46Z on 2026-09-26).
  #
  # The ACCOUNT lock is each press leg's job-level
  # `prod-lifecycle-shared-accounts` group below, the one every job that drives
  # the shared test accounts holds (docs/OPEN.md Q326;
  # src/test/sharedAccountJobsHoldOneLock.test.ts). Until 2026-09-26 this
  # workflow held only prod-load, so a DISPATCHED e2e-journeys run (own
  # workflow group, job holding the account lock) pressed the same accounts at
  # the same time as a press run. `cancel-in-progress: false` everywhere: a
  # cancelled prod run leaves its fixture job and test rows behind.
  group: ${{ format('press-every-control-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  VITE_SUPABASE_PROJECT_ID: fncmgoasalhdgfwzhsqa
  VITE_SUPABASE_URL: https://fncmgoasalhdgfwzhsqa.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY || 'sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP' }}

jobs:
  # Q1161 (2026-10-04): THE PROD-LOAD QUEUE. A scheduled run waits here until no
  # OLDER scheduled prod-load run is still in flight, then every other job runs
  # (they all `needs:` this one). Replaces the shared workflow-level
  # `prod-load` group: GitHub keeps one pending run per group and cancelled the
  # third arrival, and crons arrive 127-501 min late, so they bunch.
  # scripts/ci/wait-prod-load.mjs; src/test/prodLoadQueue.test.ts.
  prod-load-turn:
    name: Wait for the prod-load queue (first in, first served)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci/wait-prod-load.mjs
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until no older scheduled prod-load run is in flight
        run: node scripts/ci/wait-prod-load.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  wait-1:
    needs: prod-load-turn
    # Q743: the job-level lock on each leg is NOT a queue. GitHub keeps ONE pending job
    # per concurrency group and CANCELS it when a third arrives (press 36297157445,
    # e2e-journeys 36215839785 / 36215921402 / 36217255758). This lock-free job
    # waits its turn first and joins the group only when that bumps nobody
    # (scripts/e2e/wait-shared-accounts.mjs; src/test/sharedAccountLockQueues.test.ts).
    name: Wait for the shared accounts (queue, leg 1)
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs; the longest single holder is prod-audit (180).
    timeout-minutes: 350 # waiter, leg 1
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until joining the shared-accounts lock bumps no waiting job
        run: node scripts/e2e/wait-shared-accounts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  press-1:
    name: Press every control (leg 1 of 6, shards 1 and 2, 375, prod)
    needs: [wait-1]
    if: ${{ !cancelled() && needs.wait-1.result == 'success' }}
    runs-on: ubuntu-latest
    # One LEG of the run (2026-10-01): the run is 6 legs of two shards, each
    # its own job holding the account lock for under an hour
    # (src/test/sharedAccountLockJobsAreShort.test.ts). The single 330-minute
    # press job (Q326) parked every other prod suite behind it for ~4.5 h (run
    # 36697559350). Each leg takes its OWN snapshot before its shards and
    # restores + sweeps after them (Q272/Q325), because other suites may use
    # the accounts between legs. Two shards side by side is the Q317 load
    # ceiling (scripts/audit/press-wave.sh). Each shard stops itself at
    # TIME_BUDGET_MIN (Q128); set-up measured ~1.5 min and a 135-min wave
    # overran its budget by ~1 min (run 36697559350), so 45 plus restore and
    # residue fits inside 57. 12 shards x 45 = the old 4 x 135.
    # The shards claim rows from ONE queue across the legs (#1582): each leg
    # hands the rows claimed so far to the next as the press-queue-leg-N artifact.
    timeout-minutes: 57 # press leg 1
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    env:
      BASE: http://127.0.0.1:4173
      WIDTH: "375"
      ROUTES: ${{ github.event.inputs.routes }}
      PERSONAS: ${{ github.event.inputs.personas || 'anon,customer,helper,admin,incomplete' }}
      RUN_BASE: ${{ github.run_id }}
      # This leg's "before" of every shared account (Q272/Q325): taken before
      # its first shard; the only thing its restore reads.
      SNAPSHOT_IN: test-results/press-snapshot-leg-1.json
      # Q128: each shard stops itself inside the wave and reports (or hands on)
      # the rows it did not reach, instead of being cancelled with no report.
      TIME_BUDGET_MIN: "45" # leg 1
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      # The restore signs in as every persona the presses used, so the job
      # carries every persona's credentials (src/test/pressCleanupPersonas.test.ts).
      PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }} # swept persona, leg 1
      PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }} # swept persona, leg 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Drop the Google Chrome apt source
        # See e2e-happy-path.yml — dl.google.com's index breaks apt-get update.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright Chromium browser
        run: bash scripts/ci/playwright-install.sh chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - name: Write .env (service-role key for session minting; never printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            # exit 1, not 0 (Q52): personas that cannot be minted go UNCOVERED,
            # and a run that did not press them is not a green run.
            echo "::error title=No SUPABASE_ACCESS_TOKEN::accounts without a PLAYWRIGHT_*_PASSWORD secret cannot be minted and would be UNCOVERED"
            exit 1
          fi
          KEY=$(supabase projects api-keys --project-ref "$VITE_SUPABASE_PROJECT_ID" -o json 2>/dev/null \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error title=service_role key not returned::the CLI listed no service_role key; magic-link minting is off, so personas would be UNCOVERED"
            exit 1
          fi
          echo "::add-mask::$KEY"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$KEY" >> .env
          echo ".env written ($(wc -l < .env) lines)"

      # Real backend, LOCAL frontend: the shared action every frontend suite
      # uses (src/test/noTestTrafficOnVercel.test.ts), same build as before.
      - name: Build and serve this commit locally (prod VITE_* env)
        uses: ./.github/actions/local-preview
        with:
          supabase-publishable-key: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Snapshot the shared accounts (leg 1, before its shards)
        id: snapshot
        # Records the clean-up window's start too: everything created after
        # this moment is this leg's own, whichever shard made it.
        run: |
          set -euo pipefail
          mkdir -p test-results
          echo "PRESS_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV" # leg 1
          SNAPSHOT_OUT="$SNAPSHOT_IN" node scripts/audit/press-every-control.mjs

      - name: Press every control (leg 1, shards 1 and 2)
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        # #1582: shards claim rows from one queue; an earlier leg hands the rows
        # it could not reach to the next leg instead of reporting them.
        env:
          PRESS_LAST_WAVE: "0"
        run: bash scripts/audit/press-wave.sh 1 2

      # Whatever a shard created and could not remove itself (a shard that
      # stopped mid-press) is swept here, on every outcome, and THIS is the
      # leg's restore (Q272): profiles and the weekly availability grid go back
      # to the leg's snapshot (Q325). Same RLS-scoped clean-up the script runs
      # at each shard's end.
      - name: Restore the shared accounts and sweep what leg 1 created
        id: restore
        if: always()
        env:
          OUT: test-results/press-every-control-cleanup/leg-1
        run: |
          set -euo pipefail
          if [ ! -f "$SNAPSHOT_IN" ]; then
            echo "::error title=press restore::no leg snapshot ($SNAPSHOT_IN); nothing to restore from"
            exit 1
          fi
          mkdir -p "$OUT"
          # The snapshot step wrote PRESS_STARTED_AT before any shard began.
          # If it never ran there is no snapshot either, and the line above failed.
          echo "leg 1: CLEANUP_SINCE=$PRESS_STARTED_AT"
          CLEANUP_SINCE="$PRESS_STARTED_AT" node scripts/audit/press-every-control.mjs

      # The poster's own teardown CANNOT remove a fixture job it had to cancel:
      # `cancelled` is terminal in enforce_job_status_transition (never a SOURCE
      # in the allowed matrix) and the DELETE policy requires `status = 'open'`.
      # 26 such rows had accumulated by 2026-09-19, one per shard per night.
      # This is the service-role pass that can remove them, scoped to the
      # "PRESS DO NOT ACCEPT" title marker + the shared test accounts +
      # is_seed=true, with a 50-row cap (scripts/e2e/prod-audit-sweeper.mjs).
      - name: Remove the cancelled fixture jobs, then check every proof-photo reference resolves
        id: residue
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            # exit 1, not 0 (Q52): this step also runs the proof-photo reference
            # CHECK; skipping it green meant the check silently never ran.
            echo "::error title=press residue NOT swept::no SUPABASE_ACCESS_TOKEN, so no service-role key; the cancelled fixture jobs stay on prod and the proof-photo check did not run."
            exit 1
          fi
          KEY=$(supabase projects api-keys --project-ref "$VITE_SUPABASE_PROJECT_ID" -o json 2>/dev/null \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error title=press residue NOT swept::the CLI listed no service_role key; the proof-photo check did not run."
            exit 1
          fi
          echo "::add-mask::$KEY"
          # Exit 1 = a real problem (over the cap, or a delete failed): red, loudly.
          SUPABASE_URL="$VITE_SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$KEY" \
            node scripts/e2e/prod-audit-sweeper.mjs
          # CLASS CHECK for the 400 POST /object/sign/proof-photos/… stream this
          # workflow's own run 35768341847 produced: a jobs row naming an object
          # storage does not have. READ-ONLY, and it belongs here because this is
          # the workflow that surfaces it — it presses the screens that sign those
          # paths. Exit 1 = a dangling reference; the nightly-red job below files
          # it. Same $KEY, same masked shell, shredded in the next step.
          # --repair-seed-before (#1582, Q389(a)): clears the residue of the
          # teardown bug a8d75d3b3 fixed, on is_seed jobs made before that fix
          # ONLY; a real job, or a seed job made since, still fails here.
          SUPABASE_URL="$VITE_SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$KEY" \
            node scripts/proof-photo-reference-check.mjs --repair-seed-before 2026-09-25T05:42:00Z # leg 1

      - name: Shred the key
        if: always()
        run: rm -f .env

      # upload-artifact drops empty directories and a claimed row IS an empty
      # directory (claimRow's mkdir), so the queue travels as a tar.
      - name: Pack the row queue for the next leg (leg 1)
        if: always()
        run: |
          mkdir -p test-results/press-queue
          tar -C test-results -cf test-results/press-queue-leg-1.tar press-queue
      - name: Upload the row queue (leg 1)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: press-queue-leg-1
          path: test-results/press-queue-leg-1.tar
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload coverage reports, screenshots, snapshot, clean-up log and request meter (leg 1)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: press-every-control-leg-1
          path: |
            test-results/press-every-control/
            test-results/press-every-control-cleanup/
            test-results/press-snapshot-leg-1.json
            request-budget/
          if-no-files-found: ignore
          retention-days: 14

  wait-2:
    # Queues for leg 2 only after leg 1 has let go of the lock, so other
    # prod suites can take it between legs (YIELDS_BETWEEN_LEGS in
    # scripts/e2e/wait-shared-accounts.mjs). Runs whatever leg 1's result:
    # a red leg must not leave these shards unpressed.
    name: Wait for the shared accounts (queue, leg 2)
    needs: [press-1]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Up to GitHub's 360-minute job limit: the queue ahead may hold several runs; the longest single holder is prod-audit (180).
    timeout-minutes: 350 # waiter, leg 2
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/e2e/wait-shared-accounts.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until joining the shared-accounts lock bumps no waiting job
        run: node scripts/e2e/wait-shared-accounts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  press-2:
    name: Press every control (leg 2 of 6, shards 3 and 4, 375, prod)
    needs: [wait-2]
    if: ${{ !cancelled() && needs.wait-2.result == 'success' }}
    runs-on: ubuntu-latest
    # Same shape as press-1 (see there): own snapshot, two shards, own restore.
    timeout-minutes: 57 # press leg 2
    concurrency:
      group: prod-lifecycle-shared-accounts
      cancel-in-progress: false
    env:
      BASE: http://127.0.0.1:4173
      WIDTH: "375"
      ROUTES: ${{ github.event.inputs.routes }}
      PERSONAS: ${{ github.event.inputs.personas || 'anon,customer,helper,admin,incomplete' }}
      RUN_BASE: ${{ github.run_id }}
      # This leg's "before" of every shared account (Q272/Q325): taken before
      # its first shard; the only thing its restore reads.
      SNAPSHOT_IN: test-results/press-snapshot-leg-2.json
      # Q128: each shard stops itself inside the wave and reports (or hands on)
      # the rows it did not reach, instead of being cancelled with no report.
      TIME_BUDGET_MIN: "45" # leg 2
      PLAYWRIGHT_POSTER_EMAIL: ${{ secrets.PLAYWRIGHT_POSTER_EMAIL }}
      PLAYWRIGHT_POSTER_PASSWORD: ${{ secrets.PLAYWRIGHT_POSTER_PASSWORD }}
      PLAYWRIGHT_HELPER_EMAIL: ${{ secrets.PLAYWRIGHT_HELPER_EMAIL }}
      PLAYWRIGHT_HELPER_PASSWORD: ${{ secrets.PLAYWRIGHT_HELPER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      # The restore signs in as every persona the presses used, so the job
      # carries every persona's credentials (src/test/pressCleanupPersonas.test.ts).
      PLAYWRIGHT_INCOMPLETE_EMAIL: ${{ secrets.PLAYWRIGHT_INCOMPLETE_EMAIL }} # swept persona, leg 2
      PLAYWRIGHT_INCOMPLETE_PASSWORD: ${{ secrets.PLAYWRIGHT_INCOMPLETE_PASSWORD }} # swept persona, leg 2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Drop the Google Chrome apt source
        # See e2e-happy-path.yml — dl.google.com's index breaks apt-get update.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright Chromium browser
        run: bash scripts/ci/playwright-install.sh chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - name: Write .env (service-role key for session minting; never printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            # exit 1, not 0 (Q52): personas that cannot be minted go UNCOVERED,
            # and a run that did not press them is not a green run.
            echo "::error title=No SUPABASE_ACCESS_TOKEN::accounts without a PLAYWRIGHT_*_PASSWORD secret cannot be minted and would be UNCOVERED"
            exit 1
          fi
          KEY=$(supabase projects api-keys --project-ref "$VITE_SUPABASE_PROJECT_ID" -o json 2>/dev/null \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error title=service_role key not returned::the CLI listed no service_role key; magic-link minting is off, so personas would be UNCOVERED"
            exit 1
          fi
          echo "::add-mask::$KEY"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$KEY" >> .env
          echo ".env written ($(wc -l < .env) lines)"

      # Real backend, LOCAL frontend: the shared action every frontend suite
      # uses (src/test/noTestTrafficOnVercel.test.ts), same build as before.
      - name: Build and serve this commit locally (prod VITE_* env)
        uses: ./.github/actions/local-preview
        with:
          supabase-publishable-key: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # #1582: the rows earlier legs claimed, so these shards take the rest.
      # Missing (an earlier leg died before uploading) = those rows are pressed
      # again, never skipped.
      - name: Fetch the row queue the earlier legs claimed (leg 2)
        id: queue_in
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: press-queue-leg-*
          merge-multiple: true
          path: test-results/press-queue-in
      - name: Unpack the row queue (leg 2)
        env:
          QUEUE_IN: ${{ steps.queue_in.outcome }}
        run: |
          set -euo pipefail
          if [ "$QUEUE_IN" != "success" ]; then echo "::warning::leg 2: no row queue from the earlier legs ($QUEUE_IN); their rows are pressed again"; fi
          mkdir -p test-results
          for t in test-results/press-queue-in/press-queue-leg-*.tar; do
            if [ -f "$t" ]; then tar -C test-results -xf "$t"; fi
          done
