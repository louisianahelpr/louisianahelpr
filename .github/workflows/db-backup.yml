# Nightly logical backup of the production database.
#
# WHY THIS EXISTS. It was written when the project was on the free tier (no
# platform backups). Measured 2026-09-23: the org reports plan "pro" and
# `supabase backups list` shows 7 days of daily PHYSICAL backups, pitr_enabled
# false. Those are restored from the dashboard (never exercised here); this
# workflow is the only copy this repo controls, kept 14 days (repo artifact
# retention cap, measured 2026-09-23; the platform keeps 7), and
# the one that can be loaded into any Postgres (a new project, a laptop).
# A dropped table, a bad migration or an account problem must never be able
# to take every profile, job and escrow record with it.
#
# PROVEN RESTORABLE weekly by db-restore-drill.yml (docs/OPEN.md Q45), which
# restores the newest artifact into a throwaway stack and compares it with
# prod. Runbook: docs/runbooks/restore-from-backup.md.
#
# TWO THINGS THIS FILE TAKES SERIOUSLY, because a backup job that "works" is
# the easiest thing in the world to ship and the hardest to notice failing:
#
#   1. IT MUST NOT SILENTLY PRODUCE AN EMPTY FILE. The classic failure is a
#      dump that exits 0 having written nothing (wrong ref, auth accepted but
#      no permission, a CLI change), and a green checkmark every night for
#      months until the day you need it. Every dump below is size-checked AND
#      content-checked against tables that must exist, and the job fails loudly
#      if either looks wrong. A red backup job is recoverable; a green empty
#      one is not.
#
#   2. IT MUST NOT LEAK PII. The data dump contains real names, emails, phone
#      numbers, street addresses and Stripe customer/account ids. GitHub
#      artifacts are readable by anyone with repo read access and are NOT an
#      appropriate resting place for that in the clear. So the archive is
#      encrypted with GPG symmetric AES-256 before it ever leaves the runner,
#      and the job HARD-FAILS if BACKUP_PASSPHRASE is unset rather than
#      falling back to an unencrypted upload. Refusing to back up is a smaller
#      problem than quietly publishing the user table.
#
# REQUIRED SECRETS
#   SUPABASE_ACCESS_TOKEN   } already set — db-deploy.yml uses the same three
#   SUPABASE_DB_PASSWORD    }
#   SUPABASE_PROJECT_REF    }
#   BACKUP_PASSPHRASE         NEW. Any long random string. Store it somewhere
#                             that is NOT this repo and NOT only GitHub — if
#                             you lose it the backups are unreadable, and if
#                             you lose GitHub you need it elsewhere anyway.
#
# TO RESTORE: follow docs/runbooks/restore-from-backup.md. Do NOT just psql the
# three files in: the drill measured (2026-09-23) that a plain load comes back
# with 306 of 306 public functions anon-executable (prod: 17), no cron
# schedules and no ensure_rls trigger, and schema.sql (public only) carries
# no storage policies.
# scripts/db-restore-drill.sh is the runbook as code; it is what the weekly
# drill runs, so it is the procedure that is known to work.
#
# NOT IN THIS BACKUP (measured 2026-09-23; details in the runbook): storage
# FILES (152 objects, ~10 MB, incl. ID documents and dispute proof photos; the
# object ROWS restore and point at nothing), vault secret values (4), the
# edge-function secrets, the migration ledger, and anything held only by
# Stripe or Resend.

name: DB backup (nightly)

on:
  schedule:
    # Daily 07:17 UTC ≈ 02:17 America/Chicago — its own 2h prod-load slot
    # (prod load spread, 2026-09-14), so a long dump cannot contend with a sweep.
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  # PROD LOAD (2026-09-14): prod-hitting crons are spread across 03:00-13:00 UTC,
  # >= 2h apart, and share the prod-load concurrency group; see
  # src/test/prodWorkflowSpacing.test.ts before moving this.
  #
  # A SCHEDULED run joins prod-load; a workflow_dispatch gets its OWN group
  # (2026-09-21, issues #1595/#1626). `cancel-in-progress: false` does NOT mean
  # "queue forever" — GitHub keeps exactly ONE *pending* run per group, so a
  # third run entering it CANCELS the one already waiting. On 2026-09-21T04:54Z
  # four prod-load workflows dispatched inside four minutes cancelled each
  # other in a chain, and a workflow-level cancellation leaves a run with NO
  # jobs, so nothing reports it. See e2e-real-backend.yml, which has made this
  # split since the money loop lost a dispatch the same way.
  group: ${{ github.event_name == 'schedule' && 'prod-load' || format('db-backup-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail fast on missing secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${SUPABASE_DB_PASSWORD:-}" ]  && MISSING="$MISSING SUPABASE_DB_PASSWORD"
          [ -z "${SUPABASE_PROJECT_REF:-}" ]  && MISSING="$MISSING SUPABASE_PROJECT_REF"
          # Deliberately fatal, not a warning. See header point 2.
          [ -z "${BACKUP_PASSPHRASE:-}" ]     && MISSING="$MISSING BACKUP_PASSPHRASE"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s):$MISSING"
            echo "BACKUP_PASSPHRASE is required — this job will NOT upload an"
            echo "unencrypted dump of real user data as a fallback."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link to prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Dump roles, schema and data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Three separate dumps, because a restore needs them applied in this
          # order and a single --data-only file cannot recreate the schema.
          # Retried: the 2026-09-22 run died on a transient pooler error
          # ("EAUTHQUERY ... auth_query secret check timed out") and the next
          # good backup was 36 h after the previous one. Three attempts, a
          # minute apart; the third failure still fails the job.
          dump() {
            local i
            for i in 1 2 3; do
              if supabase db dump --linked "$@"; then return 0; fi
              echo "::warning::supabase db dump $* failed (attempt $i of 3)"
              [ "$i" -lt 3 ] && sleep 60
            done
            return 1
          }
          dump --role-only -f out/roles.sql
          dump             -f out/schema.sql
          dump --data-only -f out/data.sql
          ls -l out/

      - name: Export the pg_cron schedules and storage policies
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # The restore drill (db-restore-drill.yml, 2026-09-23) measured that
          # `supabase db dump --data-only` carries NO cron.job rows: a restore
          # came back with 0 of prod's 55 schedules (auto-release-payment,
          # process-scheduled-payouts, money-reconciliation, the email queue
          # among them), all silently never running again. So the schedules are
          # exported here as replayable cron.schedule() calls plus the active
          # flag. Commands reference vault secrets BY NAME; no secret value is
          # in this file.
          Q="select coalesce(string_agg(format('SELECT cron.schedule(%L, %L, %L);', jobname, schedule, command) || case when active then '' else format(E'\nSELECT cron.alter_job(jobid, active := false) FROM cron.job WHERE jobname = %L;', jobname) end, E'\n' order by jobname), '') as sql, count(*) as n from cron.job"
          RES=$(curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data "$(jq -n --arg q "$Q" '{query: $q}')")
          N=$(printf '%s' "$RES" | jq -r '.[0].n')
          printf '%s' "$RES" | jq -r '.[0].sql' > out/cron.sql
          GOT=$( { grep -c '^SELECT cron.schedule(' out/cron.sql || [ $? -eq 1 ]; } )
          echo "cron.job rows: $N; schedule statements written: $GOT"
          # 55 at the time of writing (2026-09-23). The floor catches an empty
          # or failed read; the equality catches a partial one.
          if [ "$N" -lt 20 ] || [ "$GOT" -ne "$N" ]; then
            echo "::error::cron export incomplete ($GOT of $N statements; expected at least 20)"
            exit 1
          fi

          # Storage RLS policies, same reason: schema.sql is `public` only, so
          # the policies guarding the private buckets (user-documents,
          # proof-photos, message-attachments ...) are in no dump — 36 on prod on
          # 2026-09-23. A restored project would serve none of those files.
          PQ="select coalesce(string_agg(format('CREATE POLICY %I ON %I.%I AS %s FOR %s TO %s%s%s;', policyname, schemaname, tablename, permissive, cmd, (select string_agg(quote_ident(r), ', ') from unnest(roles) r), coalesce(' USING (' || qual || ')', ''), coalesce(' WITH CHECK (' || with_check || ')', '')), E'\n' order by tablename, policyname), '') as sql, count(*) as n from pg_policies where schemaname = 'storage'"
          RES=$(curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data "$(jq -n --arg q "$PQ" '{query: $q}')")
          N=$(printf '%s' "$RES" | jq -r '.[0].n')
          printf '%s' "$RES" | jq -r '.[0].sql' > out/storage-policies.sql
          GOT=$( { grep -c '^CREATE POLICY ' out/storage-policies.sql || [ $? -eq 1 ]; } )
          echo "storage policies: $N; statements written: $GOT"
          if [ "$N" -lt 10 ] || [ "$GOT" -ne "$N" ]; then
            echo "::error::storage policy export incomplete ($GOT of $N statements; expected at least 10)"
            exit 1
          fi

      - name: Verify the dump is real
        run: |
          set -euo pipefail
          FAIL=0
          # Size floors. Chosen well below the current real sizes so ordinary
          # growth never trips them, but far above the ~0-200 byte file a
          # failed-but-exit-0 dump produces.
          check_size() {
            local f="$1" min="$2" actual
            actual=$(wc -c < "$f")
            if [ "$actual" -lt "$min" ]; then
              echo "::error::$f is $actual bytes, expected at least $min — treating as a FAILED dump, not a small one"
              FAIL=1
            else
              echo "ok  $f  ${actual} bytes"
            fi
          }
          check_size out/schema.sql 50000
          # 4.26 MB at the time of writing. A floor of 500 KB is far below
          # any plausible real dump and far above a broken one.
          check_size out/data.sql   500000
          check_size out/roles.sql  100

          # Content checks. Size alone can be satisfied by an error page or a
          # schema dump with zero tables, so assert the things a usable restore
          # actually needs. These are the load-bearing tables: losing any one
          # of them loses the marketplace.
          for t in profiles jobs applications messages notifications user_violations; do
            if ! grep -q "public\.$t" out/schema.sql; then
              echo "::error::schema.sql has no definition for public.$t — dump is incomplete"
              FAIL=1
            fi
          done
          # Data proof. Measured, not assumed — it took three wrong guesses to
          # pin down the actual format, so here it is written down:
          # `supabase db dump --data-only` emits ONE multi-row statement per
          # table,
          #   INSERT INTO "public"."profiles" (...) VALUES (...),(...),(...);
          # not COPY blocks, and not one statement per row. So a statement
          # count is a count of TABLES, and the only honest row-level signals
          # are per-table presence and total byte weight. Both are used below;
          # neither is a proxy for the other.
          #
          # This still catches the failure the job exists for. A dump of an
          # empty database emits no INSERT for a table with no rows, so an
          # emptied `profiles` fails the per-table check, and a broadly empty
          # database fails the size floor.
          #
          # auth.users is in the list deliberately. It lives outside `public`
          # and is easy to assume Supabase keeps for you — it does not, on this
          # plan. Restoring `public.profiles` without it would give back every
          # row of user data with nothing able to log in and claim it.
          echo "--- row counts ---"
          for t in '"auth"."users"' '"public"."profiles"' '"public"."jobs"' '"public"."applications"' '"public"."messages"'; do
            N=$(grep -cF "INSERT INTO ${t} " out/data.sql || true)
            printf '%-28s %s statement(s) — multi-row, see note above\n' "$t" "$N"
            if [ "$N" -lt 1 ]; then
              echo "::error::data.sql has no rows for ${t} — dump is structurally valid but empty where it matters"
              FAIL=1
            fi
          done
          # Tables carrying data (one statement each — see above). 62 at the
          # time of writing; 30 leaves room to drop features without nagging.
          TABLES=$(grep -cE "^INSERT INTO " out/data.sql || true)
          echo "tables with data: $TABLES"
          if [ "$TABLES" -lt 30 ]; then
            echo "::error::only $TABLES tables carry data — expected ~60"
            FAIL=1
          fi
          exit $FAIL

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          tar czf "backup-$STAMP.tar.gz" -C out roles.sql schema.sql data.sql cron.sql storage-policies.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" \
              -o "backup-$STAMP.tar.gz.gpg" "backup-$STAMP.tar.gz"
          # Remove the plaintext BEFORE the upload step can ever see it.
          rm -f "backup-$STAMP.tar.gz"
          rm -rf out
          ls -l "backup-$STAMP.tar.gz.gpg"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Prove the encrypted archive round-trips
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # An encrypted file nobody has ever decrypted is not a backup, it is a
          # hope. Decrypt it here, every night, and assert the contents survive.
          gpg --batch --yes --decrypt --passphrase "$BACKUP_PASSPHRASE" \
              -o roundtrip.tar.gz "backup-$STAMP.tar.gz.gpg"
          tar tzf roundtrip.tar.gz | sort > listing.txt
          cat listing.txt
          grep -qx "data.sql"   listing.txt
          grep -qx "roles.sql"  listing.txt
          grep -qx "schema.sql" listing.txt
          grep -qx "cron.sql"   listing.txt
          grep -qx "storage-policies.sql" listing.txt
          rm -f roundtrip.tar.gz listing.txt

      - uses: actions/upload-artifact@v5
        with:
          name: db-backup-${{ env.STAMP }}
          path: backup-${{ env.STAMP }}.tar.gz.gpg
          # Asks for 90 days, but the REPO setting caps it: measured 2026-09-23,
          # `gh api repos/:o/:r/actions/permissions/artifact-and-log-retention`
          # -> {"days":14,"maximum_allowed_days":90}, and the upload logs
          # "Using 14 instead". Backups are therefore kept 14 DAYS. Raising the
          # repo setting to 90 lengthens every workflow's artifacts and logs,
          # which may exceed the free artifact-storage quota: an owner decision
          # (docs/OPEN.md MORNING QUESTIONS).
          retention-days: 90
          if-no-files-found: error

  # A RED RUN HAS TO LAND SOMEWHERE. Added 2026-09-23 after db-backup — along
  # with 13 other scheduled workflows — was found failing with nobody told.
  # The drift detector had been red for THREE CONSECUTIVE DAYS (09-20, 09-21,
  # 09-22) and the nightly DB backup had not succeeded since 09-21; both are
  # invisible unless somebody opens the Actions tab, which is exactly the
  # thing the owner said nobody does.
  #
  # `nightly-issue-sync` opens/updates ONE `nightly-red` issue for this
  # workflow and closes it on the next green run, which is what makes the
  # "Nightly reds nobody read" gate able to see it at all.
  #
  # SCHEDULE AND MANUAL RUNS ONLY. A push/PR failure is already visible on the
  # commit and the PR; filing an issue for it would make the label noisy and
  # teach people to ignore it.
  notify:
    name: Report nightly result
    needs: [backup]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue-sync
        with:
          workflow-name: db-backup
          status: ${{ needs.backup.result == 'success' && 'success' || 'failure' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
