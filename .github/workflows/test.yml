name: Test

permissions:
  contents: read

env:
  # Force JavaScript-based GitHub Actions onto Node 24 ahead of the platform default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Publishable Vite vars for build + Vitest. These were previously sourced from a
  # committed .env; that file is now untracked (F-SEC-01), so the build/test steps
  # need them here. Publishable/anon keys only — safe to expose (they ship in the
  # client bundle by design; RLS is the real boundary). No runtime secrets here.
  VITE_SUPABASE_PROJECT_ID: "fncmgoasalhdgfwzhsqa"
  VITE_SUPABASE_URL: "https://fncmgoasalhdgfwzhsqa.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_iYs06Xj5G6Q_ezqzrSncTw_J1EiENRP"

# Dedicated quality-gate workflow.
# Runs on every push to main and on every pull request.
# Fails the workflow if lint, type-check, build, or tests fail —
# so regressions are caught before they hit main.

on:
  # Runs on ubuntu-latest (1x billing multiplier — cheap, unlike the
  # macOS ios-beta runners). Vitest was rotting silently because nothing
  # ran it in CI; this gates lint/type-check/build/test on every PR so
  # regressions are caught before they reach main. Docs-only changes are
  # skipped via paths-ignore to avoid wasting minutes.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - ".github/dependabot.yml"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - "LICENSE"
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid burning minutes on stale commits.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Where `deno check` caches the remote type declarations it downloads for
      # the edge-function type check. Pinned so actions/cache below has a
      # deterministic path to save and restore.
      #
      # Set here via $GITHUB_ENV rather than in a job-level `env:` block: the
      # `runner` context is NOT available at job level (only `github`, `inputs`,
      # `matrix`, `needs`, `secrets`, `strategy`, `vars`), so `${{ runner.temp }}`
      # there is a workflow-file validation error. GitHub then rejects the whole
      # file before creating a single job — the run fails in 0s with no steps and
      # no annotation, which looks identical to a workflow that is merely absent.
      # That is exactly what happened: this gate ran NOTHING from 2026-09-01
      # (ad315368) until it was caught on 2026-09-02. $RUNNER_TEMP is the plain
      # environment variable and is always available inside `run:`.
      - name: Pin the Deno cache directory
        run: echo "DENO_DIR=$RUNNER_TEMP/deno_cache" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # Edge functions are Deno, not Node — `tsc` cannot resolve their `npm:`
      # and `https://` imports, so type-checking them needs the real runtime.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      # `deno check` fetches remote type declarations (stripe, supabase-js,
      # deno.land/std) on a cold run. Cache them so the common case is offline
      # and one flaky esm.sh response cannot redden an unrelated PR.
      # Kept OUTSIDE the workspace on purpose: a cache directory inside it would
      # be walked by `eslint .`, knip and the production build.
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deno_cache
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts', 'supabase/functions/**/*.tsx', 'scripts/edge-typecheck.deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so CI heals a stale lockfile
        # instead of failing the run if package-lock.json drifts.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Migration version collision
        # A duplicate version silently breaks `supabase db push` for every
        # LATER migration too, and the pre-commit hook that also checks this
        # is skippable (--no-verify, or a bypassed hooksPath). Cheap to run
        # here so it cannot reach main.
        run: sh scripts/check-migration-versions.sh

      - name: vercel.json schema shape
        # Same argument as the migration check above: the pre-commit hook is
        # skippable, and this failure is UNUSUALLY expensive to let through.
        # Vercel validates vercel.json on its own side before the build, so an
        # invalid file gives a fully green Actions tab, no build log, and a
        # production deploy that never ran while prod serves the old bundle.
        # It has done exactly that three times. Offline, milliseconds.
        run: node scripts/check-vercel-config.mjs

      - name: CLAUDE.md claims are still true
        # CLAUDE.md is a mirror of reality with no freshness guard — the same
        # shape as types.ts, and it drifted the same way. Two of its statements
        # were stale on 2026-09-02, both stated as settled fact in the file every
        # agent reads first: that push was broken (fixed), and that three named
        # review agents existed (they did not, so the guard silently never ran).
        # Checks the mechanical claims only — paths, line numbers, npm scripts,
        # agent names, the project ref. Prose is not checkable and it says so.
        run: npm run check:claude-md

      - name: No internal link points at a deleted route
        # Deleting a route is the easy half. When seven routes became Profile
        # tabs on 2026-09-02, the leftovers were not in the pages — they were in
        # a Stripe success_url (a 404 at the end of a COMPLETED purchase), two
        # notification link fields, and a screenshot script that would have
        # captured the 404 page under names that read like real screens. None of
        # that is visible from the route table and none of it breaks a build.
        run: npm run check:dead-links

      - name: Every product surface has a domain owner
        # The audit coverage table maps surface CLASSES to lanes ("?tab=
        # variants -> route-walker"), which is true and answers the wrong
        # question: it certifies all 23 tabs get WALKED while nothing asks who
        # checks what the earnings tab COMPUTES. Class owned, instances
        # orphaned. Measured when this was written: the six post-a-job entry
        # paths and ?tab=saved_helpers were named by ZERO lane, and
        # /payment-success -- the Stripe checkout return -- was not in the money
        # lane's scope. Adding a route or a post-job entry option now fails the
        # build until someone owns it.
        run: npm run check:surface-owners

      - name: Agent references resolve
        # Instructions that name a non-existent agent fail SILENTLY — the spawn
        # happens inside an agent's context, so the run continues and the guard
        # the instruction protects simply never runs. Two separate cases shipped
        # on 2026-09-02: three review agents that had been deleted, and an
        # `lh-orchestrator` address that never existed. Neither surfaced as an
        # error anywhere.
        run: npm run check:agent-refs

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      # `tsc -b` above still covers src/ ONLY — supabase/functions is Deno, with
      # `npm:` and https:// imports tsc cannot resolve, so it stays out of
      # tsconfig. The tests that touch those files read them as TEXT.
      #
      # That used to leave 65+ money-handling edge functions with no type gate at
      # all, which is how three call sites came to read
      # `subscription.current_period_end` — removed from Stripe's Subscription
      # object in API version 2025-03-31.basil, against a client pinned to
      # 2025-08-27.basil. `new Date(undefined * 1000).toISOString()` throws
      # RangeError, the webhook dispatcher rolled back the idempotency row and
      # returned 500, and every recurring membership charge took the money and
      # granted nothing. The step below rejects exactly that.
      #
      # Coverage is by glob: every .ts/.tsx under supabase/functions, so a new
      # edge function is checked the moment it exists. Nobody has to add it to a
      # list. (scripts/typecheck-edge.mjs)
      - name: Edge function type check
        run: npm run typecheck:edge

      # Kept as well as the type check, not instead of it. It is network-free
      # and sub-second, so it still gives a verdict if a registry is down and
      # the type check cannot resolve its remote declarations — and a parse
      # error is the one class that makes Deno abort the WHOLE deploy with
      # "failed to create the graph", so it is worth gating twice.
      - name: Edge function syntax check
        run: npm run check:edge

      - name: Production build
        # Public Vite vars are committed in .env (publishable keys only — safe to expose).
        # Runtime secrets (Stripe, Resend, Slack, HubSpot, etc.) live on Supabase Edge
        # Functions and are NOT needed at build time.
        run: npm run build

      - name: Vitest
        run: npm test

      - name: Dead code (knip)
        # Fails on unused files / unused + unlisted dependencies. Unused *exports*
        # and types are reported as warnings (see rules in knip.json) — there is a
        # real backlog there that needs per-symbol verification, and failing on it
        # today would only invite blanket ignores.
        #
        # knip.json ignores `cordova-plugin-purchase`, and the reason is not
        # laziness: src/lib/iap.ts talks to the `window.CdvPurchase` GLOBAL that
        # Capacitor's Cordova bridge injects into the iOS WebView at runtime, and
        # never imports the package — importing it would drag a native-only
        # dependency into the web bundle for no benefit. knip cannot see a runtime
        # global, so it reads the package as unused and fails the build. This step
        # was red for ~13h after the plugin was installed for exactly that reason.
        run: npm run deadcode

      - name: Dead edge functions
        # knip treats every supabase/functions/*/index.ts as an entry point, so it
        # cannot see a function nothing invokes. This checks the other direction.
        run: npm run deadcode:functions
