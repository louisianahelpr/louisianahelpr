    <!-- Capacitor-only CSP. file:// loads can't receive HTTP headers, so
         the iOS/Android bundle relies on this meta tag. The web build
         strips this entire tag at build time (see `html-strip-meta-csp`
         plugin in vite.config.ts) because Vercel injects a separate,
         less-restrictive CSP header from vercel.json — and when both are
         present the browser INTERSECTS them per W3C CSP spec, silently
         blocking PostHog, OpenAI, Stripe checkout iframes, etc. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor: ionic:; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.stripe.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: capacitor: ionic:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com https://*.ingest.us.sentry.io https://*.sentry.io https://us.i.posthog.com https://us-assets.i.posthog.com; frame-src https://js.stripe.com https://*.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=helpr2" />

    <!-- Performance: preconnect + font load tuned for LCP.
         The H1 hero headline uses Bodoni Moda (display font) and is the LCP
         element on desktop. The previous media="print"+onload="this.media='all'"
         swap delayed the font CSS request until AFTER the JS bundle parsed,
         causing the LCP H1 to repaint late and tanking the desktop Real
         Experience Score (74 / "Needs Improvement"). Fix: load the font CSS
         as a normal blocking stylesheet. `display=swap` (in the URL) keeps
         fallback text visible immediately so FCP isn't blocked, while letting
         the LCP text settle into Bodoni Moda as soon as the woff2 lands —
         which now starts in parallel with the preload below instead of
         waiting on the JS parse.

         This fix was originally landed in PR #222 then accidentally reverted
         by PR #223 (which carried a stale index.html block on its branch).
         Do NOT reintroduce the print/onload pattern — see guardrail below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to Supabase to shorten the longest network dependency chain (LCP/data fetches) -->
    <link rel="preconnect" href="https://fncmgoasalhdgfwzhsqa.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://fncmgoasalhdgfwzhsqa.supabase.co" />
    <!-- Preload + stylesheet for the editorial font stack. The preload kicks
         off the CSS fetch at highest priority; the stylesheet link below
         consumes that response without re-fetching. `display=swap` in the
         URL keeps fallback text visible so the blocking stylesheet does not
         delay FCP. Do NOT reintroduce media="print"+onload swap here — it
         delays the font request behind JS-parse and regresses LCP. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,700;0,900;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@500;600;700&family=Beth+Ellen&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,700;0,900;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@500;600;700&family=Beth+Ellen&display=swap"
    />

    <!-- Hero image preloads intentionally removed 2026-05-19.
         The hero used to render a photographic <img> (hero-courtyard-*.webp),
         but the editorial brand polish (4ba790a0) replaced it with the
         CSS-only PhoneCluster mockup + the Bodoni Moda H1, which is now the
         LCP element. The preload + srcset still pointed at the retired image,
         which made the browser fetch 100–430 KB of never-rendered bytes at
         `fetchpriority="high"` on every desktop visit, starving the Bodoni
         Moda webfont and the main JS bundle of bandwidth and connection slots.
         Same story for the `/src/assets/helpr-icon-96.png` preload — that
         filename isn't imported anywhere in src/, so Vite couldn't rewrite it
         to a hashed asset; the Navbar's actual logo (HelprMark → helpr-logo-96.webp)
         renders fine via its module import.
         Net effect of removal: one fewer high-priority fetch on the critical
         path and the LCP text element (Fraunces/Bodoni H1) gets the bandwidth
         it actually needs. If a photographic hero returns, restore a single
         preload that matches the rendered <img>'s exact src/srcset/sizes. -->
    <!-- Sentry + PostHog both initialize inside requestIdleCallback (after
         first paint), which means a preconnect handshake completes seconds
         before the connection is actually used and gets flagged by
         Lighthouse as "unused preconnect" (wastes ~50ms of main-thread + a
         TLS slot). dns-prefetch keeps DNS resolution warm without paying
         the TCP/TLS cost up front. -->
    <link rel="dns-prefetch" href="https://o4511265714601984.ingest.us.sentry.io" />
    <link rel="dns-prefetch" href="https://us.i.posthog.com" />
    <link rel="dns-prefetch" href="https://us-assets.i.posthog.com" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.louisianahelpr.com" />
    <meta property="og:title" content="Helpr — Louisiana's Trusted Marketplace for Everyday Tasks" />
    <meta property="og:description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond." />
    <meta property="og:image" content="https://www.louisianahelpr.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Helpr — Louisiana's local help marketplace" />
    <meta property="og:site_name" content="Helpr" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card spec — also used by iMessage, Slack, Discord, LinkedIn
         rich previews. No Twitter account required; these tags just control how
         the link renders. summary_large_image yields a full-bleed hero card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.louisianahelpr.com" />
    <meta name="twitter:title" content="Helpr — Louisiana's Trusted Marketplace for Everyday Tasks" />
    <meta name="twitter:description" content="Helpr connects you with trusted neighbors across Louisiana for cleaning, errands, moving, yard work, and more. Serving New Orleans, Baton Rouge, Shreveport &amp; beyond." />
    <meta name="twitter:image" content="https://www.louisianahelpr.com/og-image.png" />
    <meta name="twitter:image:alt" content="Helpr — Louisiana's local help marketplace" />

    <!-- Site-wide structured data, served statically so non-JS crawlers
         (Bing, social/link-preview bots, LLM crawlers) see Helpr's
         LocalBusiness + Organization entities without executing the SPA.
         Page-specific schema (WebApplication / FAQ / Breadcrumb) is still
         injected client-side by the landing page. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://www.louisianahelpr.com/#business",
      "name": "Helpr",
      "description": "Louisiana's trusted marketplace connecting neighbors for cleaning, yard work, moving, errands, handyman services, and more.",
      "url": "https://www.louisianahelpr.com",
      "logo": "https://www.louisianahelpr.com/pwa-512x512-v2.png",
      "image": "https://www.louisianahelpr.com/pwa-512x512-v2.png",
      "priceRange": "$$",
      "areaServed": [
        { "@type": "State", "name": "Louisiana", "sameAs": "https://en.wikipedia.org/wiki/Louisiana" },
        { "@type": "City", "name": "New Orleans", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Baton Rouge", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Shreveport", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Lafayette", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Lake Charles", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Kenner", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Bossier City", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Monroe", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Alexandria", "containedInPlace": { "@type": "State", "name": "Louisiana" } },
        { "@type": "City", "name": "Houma", "containedInPlace": { "@type": "State", "name": "Louisiana" } }
      ],
      "geo": { "@type": "GeoCoordinates", "latitude": 30.9843, "longitude": -91.9623 },
      "address": { "@type": "PostalAddress", "addressRegion": "LA", "addressCountry": "US" },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.louisianahelpr.com/#organization",
      "name": "Helpr",
      "legalName": "Helpr LLC",
      "url": "https://www.louisianahelpr.com",
      "logo": "https://www.louisianahelpr.com/pwa-512x512-v2.png",
      "description": "Louisiana's trusted marketplace connecting neighbors for cleaning, yard work, moving, errands, handyman services, and more.",
      "email": "admin@louisianahelpr.com",
      "foundingDate": "2026",
      "areaServed": { "@type": "State", "name": "Louisiana" },
      "address": { "@type": "PostalAddress", "addressRegion": "LA", "addressCountry": "US" },
      "sameAs": ["https://www.facebook.com/louisianahelpr"]
    }
    </script>
  </head>
  <body>
    <!--
      Inline FCP shell — solid brand-color background only. Previously rendered
      a 580×580 splash <img> which became Lighthouse's LCP element (the LCP
      timer doesn't reset when React replaces the splash, so the score waited
      on the splash to paint). With just the background color, the hero image
      preloaded above wins LCP as intended.
    -->
    <div id="root" style="background:hsl(158 45% 98%);min-height:100vh;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
