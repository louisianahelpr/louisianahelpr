name: CodeQL Security Scan

permissions:
  contents: read

# GitHub's free static analysis for JavaScript/TypeScript.
# Catches XSS, injection vulnerabilities, hardcoded secrets, and other
# security issues that could put user data at risk OR get flagged by
# App Store reviewers.
#
# SUPERSEDED — this workflow is MANUAL-ONLY and that is deliberate.
#
# GitHub's *default* CodeQL setup is enabled on this repo and already scans
# actions / javascript / javascript-typescript / typescript on its own
# schedule. Running this file automatically as well would double every scan
# for identical findings, so its triggers stay off.
#
# Verify the default setup is still on before deleting this file:
#   gh api repos/:owner/:repo/code-scanning/default-setup
# If that ever reports "not-configured", uncomment the blocks below — this
# file is the fallback, and it is the ONLY thing standing between the repo
# and having no static analysis at all.
#
# Runs:
# - Manually via workflow_dispatch (only)

on:
  # Intentionally manual-only — see the SUPERSEDED note above. The original
  # reason given here ("was burning Actions minutes") does not hold: this is
  # a public repo, where ubuntu runners are free and unlimited. The reason it
  # stays off is redundancy with GitHub's default CodeQL setup, not cost.
  #
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "supabase/functions/**"
  #     - "package.json"
  #     - "package-lock.json"
  # schedule:
  #   - cron: "0 7 * * 3" # Wednesday 07:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    # Skip Dependabot PRs — CodeQL on dep bumps rarely surfaces real issues.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-and-quality is more thorough than security-extended;
          # tune down to "security-extended" if it gets noisy.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true # Code Scanning requires GitHub Advanced Security on private repos
        with:
          category: "/language:javascript-typescript"
          upload: failure-only
