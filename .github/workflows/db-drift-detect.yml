name: Supabase DB Drift Detector

# Nightly check for migration drift between the repo and prod.
# If a local migration file isn't reflected in prod's schema_migrations
# (or vice versa), opens/updates a GitHub issue with the diff AND FAILS THE
# RUN, so it can't sit silently for weeks like the May-09 backlog did.
#
# Three distinct outcomes, three distinct exit codes — keep them distinct:
#   green   prod and repo agree.
#   red     drift found (final step) OR the check itself is broken (the two
#           `exit 1`s in "Compute drift"). Both are red, and both print an
#           ::error:: that says which one it is.
# There is deliberately no fourth "found drift but passed" state; that WAS
# this file's behaviour for 18 straight nightly runs. See the final step.
#
# Runs nightly at 06:00 UTC (01:00 CT) — quiet hour, after the daily
# digest cron (5am UTC) so it sees a representative state.
#
# REQUIRED REPO SECRETS (same as db-deploy.yml):
# - SUPABASE_ACCESS_TOKEN
# - SUPABASE_DB_PASSWORD
# - SUPABASE_PROJECT_REF

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: db-drift-detect
  cancel-in-progress: true

jobs:
  detect:
    name: Diff local vs prod migration history
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # REQUIRED SECRETS ARE A HARD GATE. Changed 2026-08-31.
      #
      # WHAT THIS CATCHES: the drift detector silently ceasing to detect.
      #
      # This step used to emit ::warning:: and set skip=true, with every later
      # step guarded by `if: skip != 'true'`. A skipped nightly run and a
      # clean nightly run are the same colour — so a rotated or expired
      # SUPABASE_ACCESS_TOKEN would turn this into a permanently-green cron
      # that checks nothing, while CLAUDE.md's "zero migration drift is the
      # standing requirement" keeps pointing at it as the proof. An alarm that
      # reports OK when it is not wired up is worse than no alarm — this file
      # already learned that lesson once with the backtick-parse bug below.
      #
      # Secrets are read through `env:` rather than interpolated into the
      # script body so no secret value can be parsed as shell.
      - name: Require Supabase secrets
        id: precheck
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${SUPABASE_DB_PASSWORD:-}" ]  && MISSING="$MISSING SUPABASE_DB_PASSWORD"
          [ -z "${SUPABASE_PROJECT_REF:-}" ]  && MISSING="$MISSING SUPABASE_PROJECT_REF"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s):$MISSING"
            echo "::error::The drift check CANNOT read prod's migration ledger without these. It is failing rather than skipping, because a skipped drift check reports as a clean drift check — and a green run here is read as proof that prod matches the repo."
            echo "::error::Add them in Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "✓ All required secrets are present."

      - name: Install Supabase CLI
        if: steps.precheck.outputs.skip != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Compute drift
        id: drift
        if: steps.precheck.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -eo pipefail

          # Local — extract the 14-char timestamp prefix from each
          # migration file. Strips the slug + .sql.
          ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -n1 basename \
            | sed -E 's/^([0-9]{14}).*/\1/' \
            | grep -E '^[0-9]{14}$' \
            | sort -u > /tmp/local.txt || touch /tmp/local.txt

          # Remote — `migration list --linked` outputs a table with the
          # remote (prod) version column. Parse the version IDs.
          # This USED to be `... 2>/dev/null | awk ... || touch /tmp/remote.txt`,
          # which made "could not reach prod" and "prod has zero migrations"
          # produce the identical empty file. Every failure therefore rendered
          # as "100% of local migrations are unapplied" and opened a red issue
          # claiming total drift — it fired nightly while prod was in fact
          # perfectly in sync (399/399 verified against the live ledger on
          # 2026-08-14). An alarm that cannot tell "broken" from "on fire" is
          # worse than no alarm.
          LOCAL_COUNT=$(wc -l < /tmp/local.txt | tr -d ' ')
          if ! supabase migration list --linked > /tmp/remote-raw.txt 2>/tmp/remote-err.txt; then
            echo "::error::supabase migration list --linked FAILED - cannot compute drift."
            sed 's/^/  /' /tmp/remote-err.txt || true
            exit 1
          fi

          # Parse the REMOTE column, splitting on the table's "|" separators.
          #
          # Two bugs lived here. The CLI renders versions wrapped in backticks:
          #
          #     Local            | Remote           | Time (UTC)
          #     `20260311000404` | `20260311000404` | `2026-03-11 00:04:04`
          #
          # (1) The old awk matched $1 against /^[0-9]{14}$/, but with backticks
          #     the field is `20260311000404`, which never matches — so it
          #     parsed ZERO remote versions and every local migration looked
          #     unapplied. That is the 399-drift false alarm.
          # (2) $1 is the LOCAL column. Even with the backticks stripped it was
          #     comparing local against local, which is always identical — so a
          #     "working" version of this check could never report drift at all.
          #     It was broken in both directions at once.
          #
          # Field 2 is Remote. An empty Remote cell means the migration is in
          # the repo but NOT applied to prod, which is exactly the drift we want
          # to catch — it simply fails the 14-digit test and is left out of
          # remote.txt, so `comm` reports it.
          awk -F'|' 'NR>2 { gsub(/[` \t]/, "", $2); if ($2 ~ /^[0-9]{14}$/) print $2 }' \
            /tmp/remote-raw.txt | sort -u > /tmp/remote.txt

          REMOTE_COUNT=$(wc -l < /tmp/remote.txt | tr -d ' ')

          # Sanity gate. A live prod that serves the running app always has a
          # populated ledger, so "zero remote versions parsed" means the read
          # or the PARSE broke - most likely the CLI (pinned to `latest`, so it
          # updates underneath us) changed its table format and the awk stopped
          # matching. Either way that is a broken check, not drift.
          if [ "$REMOTE_COUNT" -eq 0 ] && [ "$LOCAL_COUNT" -gt 0 ]; then
            echo "::error::Parsed 0 remote migrations but $LOCAL_COUNT exist locally."
            echo "::error::This is a broken drift check, NOT drift. Raw CLI output:"
            head -20 /tmp/remote-raw.txt | sed 's/^/  /'
            exit 1
          fi

          # Drift sets
          comm -23 /tmp/local.txt /tmp/remote.txt > /tmp/missing-from-prod.txt
          comm -13 /tmp/local.txt /tmp/remote.txt > /tmp/missing-from-repo.txt

          MISSING_PROD_COUNT=$(wc -l < /tmp/missing-from-prod.txt | tr -d ' ')
          MISSING_REPO_COUNT=$(wc -l < /tmp/missing-from-repo.txt | tr -d ' ')

          echo "missing_prod=$MISSING_PROD_COUNT" >> $GITHUB_OUTPUT
          echo "missing_repo=$MISSING_REPO_COUNT" >> $GITHUB_OUTPUT

          {
            echo "## Migration drift report — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "**$MISSING_PROD_COUNT** migration(s) in repo but NOT applied to prod:"
            echo ""
            if [ -s /tmp/missing-from-prod.txt ]; then
              while read -r ts; do
                FILE=$(ls supabase/migrations/${ts}*.sql 2>/dev/null | head -1)
                echo "- \`$ts\` — \`$(basename "$FILE" 2>/dev/null || echo unknown)\`"
              done < /tmp/missing-from-prod.txt
            else
              echo "_(none)_"
            fi
            echo ""
            echo "**$MISSING_REPO_COUNT** migration(s) in prod but NOT in repo:"
            echo ""
            if [ -s /tmp/missing-from-repo.txt ]; then
              while read -r ts; do
                echo "- \`$ts\` — applied directly via Studio? Backfill the SQL into the repo."
              done < /tmp/missing-from-repo.txt
            else
              echo "_(none)_"
            fi
            echo ""
            echo "---"
            echo ""
            echo "**Action items:**"
            echo "- If a repo file is missing from prod and is intentional, push it via the \`db-deploy.yml\` workflow (or merge any new commit touching \`supabase/migrations/\` to retrigger)."
            echo "- If prod has a migration not in the repo, recover the SQL via Studio → SQL Editor history and commit it so future fresh-DB rebuilds match prod."
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > /tmp/issue-body.md

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/issue-body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Open / update drift issue
        if: |
          steps.precheck.outputs.skip != 'true' &&
          (steps.drift.outputs.missing_prod != '0' || steps.drift.outputs.missing_repo != '0')
        uses: actions/github-script@v9
        with:
          script: |
            const body = ${{ toJSON(steps.drift.outputs.body) }};
            const title = `🔴 Migration drift: ${{ steps.drift.outputs.missing_prod }} unapplied / ${{ steps.drift.outputs.missing_repo }} unrecorded`;

            // Find existing open drift issue (label "migration-drift") to update
            // instead of spamming a new one each night.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "migration-drift",
              per_page: 5,
            });

            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                title,
                body,
              });
              console.log(`Updated existing drift issue #${existing[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["migration-drift"],
              });
              console.log(`Opened drift issue #${created.number}`);
            }

      - name: Close drift issue when clean
        if: |
          steps.precheck.outputs.skip != 'true' &&
          steps.drift.outputs.missing_prod == '0' &&
          steps.drift.outputs.missing_repo == '0'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "migration-drift",
              per_page: 5,
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Drift cleared as of ${new Date().toISOString()}. Auto-closing — will reopen if drift returns.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
              console.log(`Closed drift issue #${issue.number}`);
            }

      # ─────────────────────────────────────────────────────────────────────
      # THE EXIT CODE. Added 2026-08-31.
      #
      # WHAT THIS CATCHES: this workflow finding drift and reporting SUCCESS.
      #
      # Until this step existed, the only two `exit 1`s in the whole file were
      # for a BROKEN check (the CLI read failed, or 0 remote versions parsed)
      # — never for drift actually being found. `missing_prod` / `missing_repo`
      # went to $GITHUB_OUTPUT and were consumed by exactly one thing: the
      # issue-opening step above. An issue is a notification, not a gate: it
      # does not colour the run, does not appear on any commit status, and is
      # trivially missed. 18 consecutive nightly runs reported green, and a
      # green run is indistinguishable from "prod matches the repo" — which is
      # the precise claim CLAUDE.md's "zero migration drift is the standing
      # requirement" depends on this workflow to prove.
      #
      # Placed LAST on purpose: both the open-issue and close-issue steps run
      # to completion before this fails the run, so the issue still gets filed
      # with the full diff. `if: always()` is deliberately NOT used — the two
      # `exit 1`s in "Compute drift" mean a BROKEN check, which must stay
      # distinguishable from FOUND drift; a broken check has already failed
      # the job and this step is correctly skipped.
      - name: Fail the run when drift was found
        if: steps.precheck.outputs.skip != 'true'
        env:
          MISSING_PROD: ${{ steps.drift.outputs.missing_prod }}
          MISSING_REPO: ${{ steps.drift.outputs.missing_repo }}
        run: |
          set -euo pipefail
          if [ "${MISSING_PROD:-0}" != "0" ] || [ "${MISSING_REPO:-0}" != "0" ]; then
            echo "::error::Migration drift detected — ${MISSING_PROD} migration(s) in the repo are NOT applied to prod, ${MISSING_REPO} in prod are NOT in the repo."
            echo "::error::See the migration-drift issue this run just opened/updated for the exact version list."
            echo "::error::Repo-not-in-prod: re-run db-deploy.yml. Prod-not-in-repo: recover the SQL from Studio history and commit it."
            exit 1
          fi
          echo "✅ Zero drift — every local migration version is present in prod's ledger and vice versa."
