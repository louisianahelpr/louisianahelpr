name: CI

env:
  # Force JavaScript-based GitHub Actions onto Node 24 ahead of the platform default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # Lovable manages package-lock.json out-of-band, so it can drift from
        # package.json between syncs. Use `npm install` (not `npm ci`) so CI
        # heals a stale lockfile instead of failing the run.
        # Note: GitHub re-runs keep the original commit SHA, so workflow fixes
        # only take effect on fresh runs from newer commits.
        run: npm install --no-audit --no-fund

      - name: Lint
        # Lint now passes cleanly (0 errors, ~720 warnings tracked as tech debt).
        # No more `|| true` mask — real regressions will fail CI.
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Public Vite vars are committed in .env (publishable keys only).
        # Backend secrets live on Supabase Edge Functions and are not required here.
        run: npm run build
